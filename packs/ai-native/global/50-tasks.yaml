# Tasks of the AI Native pack (12-task.md): the storming session, the human confirmation, the derivation.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: event-storm}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    level: {type: {kind: value, schema: {enum: [big-picture, process, design]}}}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}, required: false}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    contexts: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}}
  executorRef: {kind: Executor, name: storming-agent}
  action:
    instructions: |
      Run the event storming phase named by the `level` input for the product the Prd describes, following the DSL and
      the phase prompt in your context. Start from `previous` (this phase's last round) when bound, else from `base`
      (the phase before), else from the Prd alone: keep every id and order that still holds, add what the phase adds,
      and fix what `feedback` found (each finding names a node, an edge or a context). Publish the whole model as `model` with `meta.level` equal to `level`, and
      answer `contexts` with the ids of `contexts[]` in order. Ask nothing: an unknown is a hotspot.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: storming-dsl}}
      - {kind: prompt, ref: {kind: Prompt, name: storming-big-picture}}
      - {kind: prompt, ref: {kind: Prompt, name: storming-process}}
      - {kind: prompt, ref: {kind: Prompt, name: storming-design}}
      - {kind: artifact, input: prd}
      - {kind: artifact, input: base}
      - {kind: artifact, input: previous}
    parameters: {effort: high}
  timeout: 30m
  sideEffects: none
---
# The human gate of a phase: open the model in `persimmon ui`, then approve or reject here with findings.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: confirm-storming}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: |
      Confirm this phase of the event storming. Open the model in the editor: run `persimmon ui` in this project and
      open the EventStorming artifact named below at its latest revision. Approve when the phase gate holds; reject
      with one finding per node, edge or context that must change, naming its id.
    context:
      - {kind: artifact, input: model}
  timeout: 72h
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: derive-domain}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    contextId: {type: {kind: value, schema: {type: string, minLength: 1}}}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    context: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
  executorRef: {kind: Executor, name: storming-agent}
  action:
    instructions: |
      Derive the BoundedContext, the Glossary and the DomainModel of the storming context whose id is `contextId`,
      from the design-level model and the Prd, following the derivation rules in your context. Cite the storming
      context id in `glossary.context` and `domainModel.context` (the engine names the BoundedContext artifact it
      publishes for you); `source` is the model's artifact id. Invent nothing; leave empty what the model does not say.
      With `previous` and `feedback` bound, the consistency check refused the last derivation: every finding names
      a label that differs from the model; fix those and change nothing else.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: derive-domain-rules}}
      - {kind: artifact, input: model}
      - {kind: artifact, input: prd}
      - {kind: artifact, input: previous}
    parameters: {effort: high}
  timeout: 30m
  sideEffects: none
---
# The Spec of one capability (27-spec-process.md): stories, requirements and acceptance scenarios that cite the kinds beside them.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: write-spec}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    capabilityId: {type: {kind: value, schema: {type: string, pattern: "^CAP-[0-9]+$"}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
  executorRef: {kind: Executor, name: spec-agent}
  action:
    instructions: |
      Write the Spec of the Prd capability whose id is `capabilityId`, following the Spec rules in your context.
      `prd`, `architecture` and `domainModel` in the Spec are the artifact ids of the inputs with those names.
      Every command, event and read model label is the DomainModel's; every rule id is in `rules`; every quality
      scenario id is in `architecture`. With `previous` and `feedback` bound, fix what the findings name and
      change nothing else.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: spec-rules}}
      - {kind: artifact, input: prd}
      - {kind: artifact, input: architecture}
      - {kind: artifact, input: domainModel}
      - {kind: artifact, input: glossary}
      - {kind: artifact, input: rules}
      - {kind: artifact, input: previous}
    parameters: {effort: high}
  timeout: 30m
  sideEffects: none
---
# The Prd of one product from a brief (28-prd-process.md); the rules it cites are written beside it.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: draft-prd}
spec:
  inputs:
    brief: {type: {kind: value, schema: {type: string, minLength: 1}}}
    contextId: {type: {kind: value, schema: {type: string, minLength: 1}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, required: false}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
  executorRef: {kind: Executor, name: prd-agent}
  action:
    instructions: |
      Write the Prd from `brief` for the context `contextId`, following the Prd rules in your context, and the
      BusinessRules artifact of that context with every rule the Prd cites: the input `rules` revised when bound,
      a new artifact otherwise. With `previous` and `feedback` bound, fix what the findings name and change
      nothing else; answer both artifacts whole.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: prd-rules}}
      - {kind: artifact, input: rules}
      - {kind: artifact, input: glossary}
      - {kind: artifact, input: previous}
    parameters: {effort: high}
  timeout: 30m
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: confirm-prd}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: |
      Confirm the Prd and the rules it cites. Judge scope, users, goals and whether the capabilities are the right
      cut; the Validator has already checked ids and citations. Approve, or reject with one finding per G-n,
      CAP-n, SC-n, Q-n or BR-n that must change, naming the id in the finding's code.
    context:
      - {kind: artifact, input: prd}
      - {kind: artifact, input: rules}
  timeout: 72h
  sideEffects: none
