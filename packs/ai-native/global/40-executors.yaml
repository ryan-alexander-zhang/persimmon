# Executors (13-executor.md). Global; a Namespace overrides one by name to bind its own credentials or pick a model.
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: storming-agent}
spec:
  type: agent
  adapter: claude-code/v1
  configuration:
    model: claude-opus-5
    sandbox: workspace-write
  security:
    networkAccess: allowlist
    allowedHosts: [api.anthropic.com]
---
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: local-reviewer}
spec:
  type: human
  adapter: cli-human/v1
  configuration: {}
