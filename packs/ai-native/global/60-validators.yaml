# Validators of the AI Native pack (14-gate.md). eventstorming-grammar runs the grammar over a model (24-eventstorming.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: eventstorming-grammar}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    level: {type: {kind: value, schema: {type: string, enum: [big-picture, process, design]}}, required: false}
  evaluator:
    type: adapter
    adapter: eventstorming/v1
    configuration: {}
  timeout: 1m
---
# The human confirmation of a storming phase, as a Validator over the confirm-storming Task.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: storming-confirmed}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
  evaluator:
    type: task
    taskRef: {kind: Task, name: confirm-storming}
    resultOutput: result
  timeout: 72h
---
# A DomainModel agrees with the design-level model it was derived from (26-domain-discovery.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: domain-consistency}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    context: {type: {kind: value, schema: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40}}}
  evaluator:
    type: adapter
    adapter: eventstorming/v1
    configuration: {}
  timeout: 1m
---
# spec-consistency: sdd/v1 checks a Spec against the artifacts it cites (27-spec-process.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: spec-consistency}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
---
# prd-consistency: sdd/v1 checks a Prd against the BusinessRules it cites (28-prd-process.md); prd-confirmed is the human.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: prd-consistency}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
---
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: prd-confirmed}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
  evaluator:
    type: task
    taskRef: {kind: Task, name: confirm-prd}
    resultOutput: result
  timeout: 72h
---
# design-consistency: sdd/v1 checks a Design's index against the Architecture, DomainModel and rules (29-design-process.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: design-consistency}
spec:
  inputs:
    design: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
---
# plan-consistency: sdd/v1 checks a Plan's coverage of its Spec and its elements against the Designs (30-plan-process.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: plan-consistency}
spec:
  inputs:
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
