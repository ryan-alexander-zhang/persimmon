# Gates (14-gate.md). A storming phase passes when the grammar is clean at the phase's level and a human confirmed it.
apiVersion: persimmon.ai/v1
kind: Gate
metadata: {name: storming-gate}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    level: {type: {kind: value, schema: {type: string, enum: [big-picture, process, design]}}}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false, description: "the last round's verdict, for the owner"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
  validators:
    - name: grammar
      ref: {kind: Validator, name: eventstorming-grammar}
      inputs:
        model: {fromInput: model}
        level: {fromInput: level}
        prd: {fromInput: prd}
    - name: confirmed
      ref: {kind: Validator, name: storming-confirmed}
      after: [grammar]   # the human confirms only what the check passed (14-gate.md)
      inputs:
        model: {fromInput: model}
        feedback: {fromInput: feedback, onMissing: omit}   # the last round's verdict, so the owner checks it was fixed first (23-pack-sdlc.md)
  policy: {strategy: all}
  timeout: 72h
---
# A derived context passes when its DomainModel and its BoundedContext agree with the model.
apiVersion: persimmon.ai/v1
kind: Gate
metadata: {name: derived-gate}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    contextId: {type: {kind: value, schema: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40}}}
    boundedContext: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
  validators:
    - name: consistency
      ref: {kind: Validator, name: domain-consistency}
      inputs:
        model: {fromInput: model}
        domainModel: {fromInput: domainModel}
        context: {fromInput: contextId}
        boundedContext: {fromInput: boundedContext}
        prd: {fromInput: prd}
  policy: {strategy: all}
  timeout: 5m
---
apiVersion: persimmon.ai/v1
kind: Gate
metadata: {name: spec-gate}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    context: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}}
    capabilityId: {type: {kind: value, schema: {type: string, pattern: "^CAP-[0-9]+$"}}}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, required: false, description: "the context's, for the auditor"}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}, required: false, description: "the last round's Spec; round one has none"}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}, required: false, description: "the Spec this one revises"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false, description: "the last round's verdict"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
  validators:
    - name: consistency
      ref: {kind: Validator, name: spec-consistency}
      inputs:
        spec: {fromInput: spec}
        prd: {fromInput: prd}
        domainModel: {fromInput: domainModel}
        architecture: {fromInput: architecture}
        rules: {fromInput: rules}
        context: {fromInput: context}
        capabilityId: {fromInput: capabilityId}
        base: {fromInput: base, onMissing: omit}
    - name: audit
      ref: {kind: Validator, name: spec-audited}
      after: [consistency]   # no agent call on a Spec the check refuses (23-pack-sdlc.md)
      inputs:
        spec: {fromInput: spec}
        prd: {fromInput: prd}
        rules: {fromInput: rules}
        domainModel: {fromInput: domainModel}
        architecture: {fromInput: architecture}
        glossary: {fromInput: glossary, onMissing: omit}
        previous: {fromInput: previous, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
  policy: {strategy: all}
  timeout: 35m   # the check, then the auditor's 30m
---
apiVersion: persimmon.ai/v1
kind: Gate
metadata: {name: prd-gate}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    previousRules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false, description: "the last round's rules (28-prd-process.md); round one has none"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false, description: "the last round's verdict: the findings that may change a rule"}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}, required: false, description: "the last round's Prd; round one has none"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
  validators:
    - name: consistency
      ref: {kind: Validator, name: prd-consistency}
      inputs:
        prd: {fromInput: prd}
        rules: {fromInput: rules}
        previousRules: {fromInput: previousRules, onMissing: omit}
        previous: {fromInput: previous, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
    - name: audit
      ref: {kind: Validator, name: prd-audited}
      after: [consistency]   # no agent call on a draft the check refuses (23-pack-sdlc.md)
      inputs:
        prd: {fromInput: prd}
        rules: {fromInput: rules}
        previous: {fromInput: previous, onMissing: omit}
        previousRules: {fromInput: previousRules, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
    - name: confirmed
      ref: {kind: Validator, name: prd-confirmed}
      after: [consistency, audit]   # the human confirms only what the check and the auditor passed (14-gate.md)
      inputs:
        prd: {fromInput: prd}
        rules: {fromInput: rules}
        audit: {fromValidator: audit}   # the auditor's warnings in the human's form
        feedback: {fromInput: feedback, onMissing: omit}   # the last round's verdict, so the owner checks it was fixed first (23-pack-sdlc.md)
  policy: {strategy: all}
  timeout: 72h
---
