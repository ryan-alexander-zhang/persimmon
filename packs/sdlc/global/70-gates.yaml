# An Architecture passes when its citations hold and a human confirmed the block cut and the strategy.
apiVersion: persimmon.ai/v1
kind: Gate
metadata: {name: architecture-gate}
spec:
  inputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    contexts: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}}
    domainModels: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    glossaries: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}, required: false, description: "the last round's Architecture; round one has none"}
    previousAdrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false, description: "the last round's Adrs"}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}, required: false, description: "the Architecture the draft extends, when a later Rewrite pack Slice does"}
    baseAdrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false, description: "the Adrs that Architecture applies"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false, description: "the last round's verdict"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
  validators:
    - name: consistency
      ref: {kind: Validator, name: architecture-consistency}
      inputs:
        architecture: {fromInput: architecture}
        prd: {fromInput: prd}
        rules: {fromInput: rules}
        contexts: {fromInput: contexts}
        domainModels: {fromInput: domainModels}
        glossaries: {fromInput: glossaries}
        adrs: {fromInput: adrs}
    - name: audit
      ref: {kind: Validator, name: architecture-audited}
      after: [consistency]   # no agent call on a draft the check refuses (23-pack-sdlc.md)
      inputs:
        architecture: {fromInput: architecture}
        adrs: {fromInput: adrs}
        prd: {fromInput: prd}
        rules: {fromInput: rules}
        previous: {fromInput: previous, onMissing: omit}
        previousAdrs: {fromInput: previousAdrs, onMissing: omit}
        base: {fromInput: base, onMissing: omit}
        baseAdrs: {fromInput: baseAdrs, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
    - name: confirmed
      ref: {kind: Validator, name: architecture-confirmed}
      after: [consistency, audit]   # the human confirms only what the check and the auditor passed (14-gate.md)
      inputs:
        architecture: {fromInput: architecture}
        adrs: {fromInput: adrs}
        audit: {fromValidator: audit}   # the auditor's warnings in the human's form
        feedback: {fromInput: feedback, onMissing: omit}   # the last round's verdict, so the owner checks it was fixed first (23-pack-sdlc.md)
  policy: {strategy: all}
  timeout: 72h
---
# design-system-gate: the linter and the human, both (32-ui-design-process.md).
apiVersion: persimmon.ai/v1
kind: Gate
metadata: {name: design-system-gate}
spec:
  inputs:
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false, description: "the last round's verdict, for the owner"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
  validators:
    - name: lint
      ref: {kind: Validator, name: design-system-lint}
      inputs:
        designSystem: {fromInput: designSystem}
    - name: confirmed
      ref: {kind: Validator, name: design-system-confirmed}
      after: [lint]   # the human confirms only what the check passed (14-gate.md)
      inputs:
        designSystem: {fromInput: designSystem}
        feedback: {fromInput: feedback, onMissing: omit}   # the last round's verdict, so the owner checks it was fixed first (23-pack-sdlc.md)
  policy: {strategy: all}
  timeout: 72h
---
# build-gate: the evidence of one built Plan task and the auditor's verdict on it (35-build-process.md); a human review of the diff is the project's, before it commits.
apiVersion: persimmon.ai/v1
kind: Gate
metadata: {name: build-gate}
spec:
  inputs:
    record: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}}
    testOutcome: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}}
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}, required: false, description: "the last round's record; round one has none"}
    previousOutcome: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the last round's tests; round one has none"}
    taskId: {type: {kind: value, schema: {type: string, pattern: "^T-[0-9]+$"}}}
    audit: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}, description: "the auditor's verdict on the record"}
    baseline: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the tests before the build; build-one run alone has none"}
    levelOutcomes: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the other test levels' outcomes this round (36-test-levels.md)"}
    levelBaselines: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the other test levels' outcomes before the build"}
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the Spec's test cases (39-test-process.md)"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
  validators:
    - name: evidence
      ref: {kind: Validator, name: acceptance-evidence}
      inputs:
        record: {fromInput: record}
        testOutcome: {fromInput: testOutcome}
        plan: {fromInput: plan}
        spec: {fromInput: spec}
        previous: {fromInput: previous, onMissing: omit}
        previousOutcome: {fromInput: previousOutcome, onMissing: omit}
        taskId: {fromInput: taskId}
        baseline: {fromInput: baseline, onMissing: omit}
        levelOutcomes: {fromInput: levelOutcomes, onMissing: omit}
        levelBaselines: {fromInput: levelBaselines, onMissing: omit}
        testDesign: {fromInput: testDesign, onMissing: omit}
    - name: audit
      ref: {kind: Validator, name: acceptance-audited}
      inputs:
        audit: {fromInput: audit}
  policy: {strategy: all}
  timeout: 5m
---
# The plan tier's Gate (36-test-levels.md): build-all's last task built, every test level in full against its baseline; under a
# TestDesign, the TestReport's verdict too (39-test-process.md).
apiVersion: persimmon.ai/v1
kind: Gate
metadata: {name: regression-gate}
spec:
  inputs:
    final: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}}
    baseline: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}}
    levelOutcomes: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false}
    levelBaselines: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false}
    report: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestReport}}, required: false, description: "the TestReport, when the Plan's tests were designed"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
  validators:
    - name: regression
      ref: {kind: Validator, name: plan-regression}
      inputs:
        final: {fromInput: final}
        baseline: {fromInput: baseline}
        levelOutcomes: {fromInput: levelOutcomes, onMissing: omit}
        levelBaselines: {fromInput: levelBaselines, onMissing: omit}
    - name: verdict
      ref: {kind: Validator, name: report-verdict}
      inputs:
        report: {fromInput: report, onMissing: omit}
  policy: {strategy: all}
  timeout: 5m
---
# harness-gate: a TestHarness passes when every level it names ran once and its seed test is green, and a human confirmed it
# and answered its open questions (39-test-process.md).
apiVersion: persimmon.ai/v1
kind: Gate
metadata: {name: harness-gate}
spec:
  inputs:
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}}
    seed: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}}
    levelOutcomes: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false, description: "the last round's harness; round one has none"}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: false, description: "the Designs setup-tests was given"}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false, description: "the harness this one replaces"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false, description: "the last round's verdict, for the owner"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
  validators:
    - name: evidence
      ref: {kind: Validator, name: harness-evidence}
      inputs:
        harness: {fromInput: harness}
        previous: {fromInput: previous, onMissing: omit}
        seed: {fromInput: seed}
        levelOutcomes: {fromInput: levelOutcomes}
        architecture: {fromInput: architecture}
        designs: {fromInput: designs, onMissing: omit}
        base: {fromInput: base, onMissing: omit}
    - name: confirmed
      ref: {kind: Validator, name: harness-confirmed}
      after: [evidence]   # the human confirms only a harness whose seed tests pass (14-gate.md)
      inputs:
        harness: {fromInput: harness}
        architecture: {fromInput: architecture}
        feedback: {fromInput: feedback, onMissing: omit}   # the last round's verdict, so the owner checks it was fixed first (23-pack-sdlc.md)
  policy: {strategy: all}
  timeout: 72h
---
# test-design-gate: a TestDesign passes when its citations and coverage hold, the auditor finds no case unfit, and a human
# confirmed the cases before any code exists (39-test-process.md).
apiVersion: persimmon.ai/v1
kind: Gate
metadata: {name: test-design-gate}
spec:
  inputs:
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the TestDesign this one replaces"}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the last round's TestDesign; round one has none"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false, description: "the last round's verdict"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
  validators:
    - name: consistency
      ref: {kind: Validator, name: test-design-consistency}
      inputs:
        testDesign: {fromInput: testDesign}
        plan: {fromInput: plan}
        designs: {fromInput: designs}
        base: {fromInput: base, onMissing: omit}
        previous: {fromInput: previous, onMissing: omit}
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
        rules: {fromInput: rules}
        harness: {fromInput: harness}
    - name: audit
      ref: {kind: Validator, name: test-design-audited}
      after: [consistency]   # no agent call on a draft the check refuses (23-pack-sdlc.md)
      inputs:
        testDesign: {fromInput: testDesign}
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
        designs: {fromInput: designs}
        rules: {fromInput: rules}
        harness: {fromInput: harness}
        previous: {fromInput: previous, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
    - name: confirmed
      ref: {kind: Validator, name: test-design-confirmed}
      after: [consistency, audit]   # the human confirms only what the check and the auditor passed (14-gate.md)
      inputs:
        testDesign: {fromInput: testDesign}
        spec: {fromInput: spec}
        audit: {fromValidator: audit}   # the auditor's warnings in the human's form
        feedback: {fromInput: feedback, onMissing: omit}   # the last round's verdict, so the owner checks it was fixed first (23-pack-sdlc.md)
  policy: {strategy: all}
  timeout: 72h
