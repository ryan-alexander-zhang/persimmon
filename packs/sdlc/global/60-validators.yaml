# Validators (14-gate.md). The adapter Validator prd-security-scan needs threat-model/v1 and is not in the local pack.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: prd-structure}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ProductRequirement}}}
    minRequirements: {type: {kind: value, schema: {type: integer}}}
  evaluator:
    type: cel
    expression: |
      {
        "passed": artifacts.prd.content.requirements.size() >= inputs.minRequirements
                  && artifacts.prd.content.requirements.all(r, r.statement != ""),
        "findings": artifacts.prd.content.requirements.size() < inputs.minRequirements
                  ? [{"severity": "error", "code": "too_few", "message": "fewer than minRequirements"}] : [],
        "evidence": [inputs.prd]
      }
  timeout: 1m
---
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: prd-human-review}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ProductRequirement}}}
  evaluator:
    type: task
    taskRef: {kind: Task, name: approve-prd}
    resultOutput: result
  timeout: 48h
