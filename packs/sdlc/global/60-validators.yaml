# Validators of the SDLC pack (14-gate.md). eventstorming-grammar runs the grammar over a model (24-eventstorming.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: eventstorming-grammar}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    level: {type: {kind: value, schema: {type: string, enum: [big-picture, process, design]}}, required: false}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}, required: false, description: "the Prd stormed: the contexts name its subdomains (34-subdomains.md)"}
  evaluator:
    type: adapter
    adapter: eventstorming/v1
    configuration: {}
  timeout: 1m
---
# The human confirmation of a storming phase, as a Validator over the confirm-storming Task.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: storming-confirmed}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
  evaluator:
    type: task
    taskRef: {kind: Task, name: confirm-storming}
    resultOutput: result
  timeout: 72h
---
# A DomainModel agrees with the design-level model it was derived from (26-domain-discovery.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: domain-consistency}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    context: {type: {kind: value, schema: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40}}}
    boundedContext: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}, required: false, description: "the derived BoundedContext: its subdomain, capabilities and relationships against the storming (34-subdomains.md)"}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}, required: false, description: "with boundedContext: the capabilities of its subdomain"}
  evaluator:
    type: adapter
    adapter: eventstorming/v1
    configuration: {}
  timeout: 1m
---
# spec-consistency: sdd/v1 checks a Spec against the artifacts it cites (27-spec-process.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: spec-consistency}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    context: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}, required: false, description: "the BoundedContext that lists the capability; its DomainModel is the one bound (34-subdomains.md)"}
    capabilityId: {type: {kind: value, schema: {type: string, pattern: "^CAP-[0-9]+$"}}, required: false, description: "the capability the Spec was written for; its `capability` must be it"}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
---
# prd-consistency: sdd/v1 checks a Prd against the BusinessRules it cites (28-prd-process.md); prd-confirmed is the human.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: prd-consistency}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    previousRules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false, description: "with feedback: a rule changed or dropped since, unnamed by any finding, is rule-drift"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
---
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: prd-confirmed}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
  evaluator:
    type: task
    taskRef: {kind: Task, name: confirm-prd}
    resultOutput: result
  timeout: 72h
---
# design-consistency: sdd/v1 checks a Design's index against the Architecture, DomainModel and rules, and its document's
# fields against the Glossary (29-design-process.md); a ui Design's against the API Designs bound on `designs` instead of
# the DomainModel (32-ui-design-process.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: design-consistency}
spec:
  inputs:
    design: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}, required: false, description: "what the elements realise; not for a ui Design"}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, required: false, description: "what the document's field names are held to; not for a ui Design; unbound, the fields are unchecked"}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}, required: false, description: "for a ui Design: the DesignSystem it must cite"}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: false, description: "for a ui Design: the API Designs whose operations its elements realise"}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
---
apiVersion: persimmon.ai/v1
kind: Validator
# Every name a DomainModel owns has a Design element realising it, or is reported `unrealised`, a warning (`unrealised-internal`,
# an info, for a command a policy invokes or an event an external system emits): a report over
# the Designs that name the model (29-design-process.md), which the `design-coverage` step queries.
metadata: {name: domain-coverage}
spec:
  inputs:
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, description: "every Design; the ones naming the model are read"}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
---
# plan-consistency: sdd/v1 checks a Plan's coverage of its Spec and its elements against the Designs (30-plan-process.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: plan-consistency}
spec:
  inputs:
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
---
# architecture-consistency: sdd/v1 checks an Architecture against the Prd, the contexts, models, glossaries, rules and Adrs (31-architecture-process.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: architecture-consistency}
spec:
  inputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    contexts: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}}
    domainModels: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    glossaries: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
---
# The human confirmation of an Architecture, as a Validator over the confirm-architecture Task.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: architecture-confirmed}
spec:
  inputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}}
  evaluator:
    type: task
    taskRef: {kind: Task, name: confirm-architecture}
    resultOutput: result
  timeout: 72h
---
# design-system-lint: designmd/v1 runs the official DESIGN.md linter; its warnings are defects here (32-ui-design-process.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: design-system-lint}
spec:
  inputs:
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}}
  evaluator:
    type: adapter
    adapter: designmd/v1
    configuration: {failOnWarning: true}
  timeout: 1m
---
# The human confirmation of a DesignSystem, as a Validator over the confirm-design-system Task.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: design-system-confirmed}
spec:
  inputs:
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}}
  evaluator:
    type: task
    taskRef: {kind: Task, name: confirm-design-system}
    resultOutput: result
  timeout: 72h
---
# acceptance-evidence: sdd/v1 checks an AcceptanceRecord against the TestOutcome of its round, the Plan task and the Spec
# (35-build-process.md): the record is the builder's claim, the outcome the evidence.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: acceptance-evidence}
spec:
  inputs:
    record: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}}
    testOutcome: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}}
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}, required: false, description: "the last round's record"}
    previousOutcome: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the last round's tests: a test the last record named that ran then and runs no more is test-dropped"}
    taskId: {type: {kind: value, schema: {type: string, pattern: "^T-[0-9]+$"}}, required: false, description: "the task built; the record's `task` must be it"}
    baseline: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the tests before the build: a case red there and red still is tolerated"}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
---
# acceptance-audited: the auditor's verdict (Task audit-acceptance in build-work, 35-build-process.md) as the round's; passed is
# recomputed from the findings, so an answer saying passed beside an error cannot pass.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: acceptance-audited}
spec:
  inputs:
    audit: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  evaluator:
    type: cel
    expression: |
      {"passed": inputs.audit.findings.all(f, f.severity != "error"), "findings": inputs.audit.findings, "evidence": []}
  timeout: 1m
---
# spec-audited: the auditor's judgement of a Spec's meaning (23-pack-sdlc.md), after spec-consistency in spec-gate.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: spec-audited}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
  evaluator:
    type: task
    taskRef: {kind: Task, name: audit-spec}
    resultOutput: audit
  timeout: 30m
---
# prd-audited: the auditor's judgement of a Prd's meaning (23-pack-sdlc.md), after the check in prd-gate.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: prd-audited}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
  evaluator:
    type: task
    taskRef: {kind: Task, name: audit-prd}
    resultOutput: audit
  timeout: 30m
