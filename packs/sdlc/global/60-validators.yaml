    taskRef: {kind: Task, name: confirm-design-system}
    resultOutput: result
  timeout: 72h
---
# acceptance-evidence: sdd/v1 checks an AcceptanceRecord against the TestOutcome of its round, the Plan task and the Spec
# (35-build-process.md): the record is the builder's claim, the outcome the evidence.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: acceptance-evidence}
spec:
  inputs:
    record: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}}
    testOutcome: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}}
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}, required: false, description: "the last round's record"}
    previousOutcome: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the last round's tests: a test the last record named that ran then and runs no more is test-dropped"}
    taskId: {type: {kind: value, schema: {type: string, pattern: "^T-[0-9]+$"}}, required: false, description: "the task built; the record's `task` must be it"}
    baseline: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the tests before the build: a case red there and red still is tolerated"}
    levelOutcomes: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the other test levels' outcomes this round, paired by level (36-test-levels.md)"}
    levelBaselines: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the other test levels' outcomes before the build"}
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the Spec's test cases: the task's cases are read by the ids the tests carry, not record rows (39-test-process.md)"}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
---
# plan-regression: every test level after build-all's last task against its baseline (36-test-levels.md); no record, so a red
# case the baseline did not have red is a regression some task left, which the developer investigates as an Issue.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: plan-regression}
spec:
  inputs:
    final: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, description: "the unit tests after the last task"}
    baseline: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, description: "the unit tests before build-all"}
    levelOutcomes: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the other test levels after the last task"}
    levelBaselines: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the other test levels before build-all"}
  evaluator:
    type: adapter
    adapter: sdd/v1
    configuration: {}
  timeout: 1m
---
# acceptance-audited: the auditor's verdict (Task audit-acceptance in build-work, 35-build-process.md) as the round's; passed is
# recomputed from the findings, so an answer saying passed beside an error cannot pass.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: acceptance-audited}
spec:
  inputs:
    audit: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  evaluator:
    type: cel
    expression: |
      {"passed": inputs.audit.findings.all(f, f.severity != "error"), "findings": inputs.audit.findings, "evidence": []}
  timeout: 1m
---
# spec-audited: the auditor's judgement of a Spec's meaning (23-pack-sdlc.md), after spec-consistency in spec-gate.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: spec-audited}
