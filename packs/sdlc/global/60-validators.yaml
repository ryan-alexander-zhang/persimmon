---
# design-system-lint: designmd/v1 runs the official DESIGN.md linter; its warnings are defects here (32-ui-design-process.md).
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: design-system-lint}
spec:
  inputs:
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}}
