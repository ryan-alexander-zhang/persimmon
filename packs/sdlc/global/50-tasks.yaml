# The Tester writes the api tests of one Plan task's cases (39-test-process.md), before the code is built: red until the builder makes them pass; each test's title carries its case's id.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: write-api-tests}
spec:
  inputs:
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    taskId: {type: {kind: value, schema: {type: string, pattern: "^T-[0-9]+$"}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, description: "the Designs the Plan lists: the operations and screens the steps name"}
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}}
    cases: {type: {kind: value, schema: {type: object}}, description: "the round's case ids by level: write those of level api"}
    repository: {type: {kind: externalResource, provider: git, type: repository}, description: "the project's code, where the tests are written"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false, description: "the last round's verdict"}
  outputs:
    written: {type: {kind: value, schema: {type: object, required: [files, cases], additionalProperties: false, properties: {files: {type: array, items: {type: string, minLength: 1}}, cases: {type: array, items: {type: string, pattern: "^CAP-[0-9]+/TC-[0-9]+$"}}, notWritten: {type: array, items: {type: string, minLength: 1}}}}}}
  executorRef: {kind: Executor, name: tester}
  action:
    instructions: |
      Write the tests of the api cases in `cases`, of the Plan task whose id is `taskId`, in the directory the
      `repository` input names, following the test-writing rules in your context and the TestHarness's api level.
      The code is not built yet: each test is red, and stays so.
      With `feedback` bound, fix the findings that name one of your cases and change nothing else.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: test-writing-rules}}
      - {kind: artifact, input: testDesign}
      - {kind: artifact, input: harness}
      - {kind: artifact, input: plan}
      - {kind: artifact, input: spec}
      - {kind: artifact, input: designs}
    workspace: {input: repository}
  timeout: 72h   # a human's: the developer's agent writes them in its own session
  retryPolicy: # a transient API refusal gets another attempt
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: nonIdempotent   # it writes the repository
---
# The Tester writes the e2e tests of one Plan task's cases (39-test-process.md), after the code is built: against the running app; each test's title carries its case's id.
