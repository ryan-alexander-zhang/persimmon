# Tasks (12-task.md).
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: research}
spec:
  inputs:
    repository: {type: {kind: externalResource, provider: git, type: repository}}
  outputs:
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ResearchReport}}}
  executorRef: {kind: Executor, name: claude-agent}
  action:
    instructions: "Research the problem space of the repository. Publish a ResearchReport with titled findings."
    context:
      - {kind: file, input: repository, path: README.md}
  timeout: 20m
  retryPolicy:
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 30s, max: 5m, jitter: none}
    retryOn: [timeout, rate_limit, transient_network]
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: write-prd}
spec:
  inputs:
    research: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ResearchReport}}}
    repository: {type: {kind: externalResource, provider: git, type: repository}, required: false}
    maxRequirements: {type: {kind: value, schema: {type: integer, minimum: 1}}, required: false, default: {kind: value, value: 12}}
  outputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ProductRequirement}}}
  executorRef: {kind: Executor, name: claude-agent}
  action:
    instructions: "Write the PRD. Preserve entity ids. Respect the maxRequirements input."
    context:
      - {kind: file, input: repository, path: AGENTS.md}
      - {kind: artifact, input: research}
      - {kind: prompt, ref: {kind: Prompt, name: write-prd-template}}
    parameters: {effort: high}
  timeout: 30m
  retryPolicy:
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 30s, max: 5m, jitter: full}
    retryOn: [timeout, rate_limit, transient_network]
    abortOn: [permission_denied, invalid_input, schema_violation]
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: approve-prd}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ProductRequirement}}}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: "Approve or reject this PRD. List blocking findings."
    context:
      - {kind: artifact, input: prd}
  timeout: 48h
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: security-review}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ProductRequirement}}}
  outputs:
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ReviewReport}}}
  executorRef: {kind: Executor, name: claude-agent}
  action:
    instructions: "Review the PRD for security and privacy risks. Publish a ReviewReport with a verdict."
    context:
      - {kind: artifact, input: prd}
  timeout: 2h
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: product-review}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ProductRequirement}}}
  outputs:
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ReviewReport}}}
  executorRef: {kind: Executor, name: claude-agent}
  action:
    instructions: "Review the PRD for product fit and completeness. Publish a ReviewReport with a verdict."
    context:
      - {kind: artifact, input: prd}
  timeout: 2h
  sideEffects: none
