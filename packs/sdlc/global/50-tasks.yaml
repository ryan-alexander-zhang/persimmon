# Tasks of the SDLC pack (12-task.md): the storming session, the human confirmation, the derivation.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: event-storm}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    level: {type: {kind: value, schema: {type: string, enum: [big-picture, process, design]}}}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}, required: false}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}, id: {expression: "inputs.prd.id + '-storming'"}}
    contexts: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40}}}}
  executorRef: {kind: Executor, name: storming-agent}
  action:
    instructions: |
      Run the event storming phase named by the `level` input for the product the Prd describes, following the DSL and
      the phase prompt in your context. Start from `previous` (this phase's last round) when bound, else from `base`
      (the phase before), else from the Prd alone: keep every id and order that still holds, add what the phase adds,
      and fix what `feedback` found (each finding names a node, an edge or a context). Publish the whole model as `model` with `meta.level` equal to `level`, and
      answer `contexts` with the ids of `contexts[]` in order. Ask nothing: an unknown is a hotspot. The BusinessRules
      in your context are the rules the Prd cites by `BR-n`: a limit, a window or a permission a rule states is a
      constraint or a policy parameter, never a hotspot.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: storming-dsl}}
      - {kind: prompt, ref: {kind: Prompt, name: storming-big-picture}}
      - {kind: prompt, ref: {kind: Prompt, name: storming-process}}
      - {kind: prompt, ref: {kind: Prompt, name: storming-design}}
      - {kind: artifact, input: prd}
      - {kind: artifact, input: rules}
      - {kind: artifact, input: base}
      - {kind: artifact, input: previous}
    parameters: {effort: high}
  timeout: 30m
  retryPolicy: # a transient API refusal (19-adapter-roles.md) gets another attempt within the step deadline; a dead login is permission_denied and never retried
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: none
---
# The human gate of a phase: read the model in Progress, `persimmon ui` (37-progress.md), approve or reject with findings there or here.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: confirm-storming}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: |
      Confirm this phase of the event storming. Run `persimmon ui` in this project: Progress shows the model, and
      "Open the board" opens it in the editor. Approve when the phase gate holds; reject with one finding per node,
      edge or context that must change, naming its id.
    context:
      - {kind: artifact, input: model}
  timeout: 72h
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: derive-domain}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    contextId: {type: {kind: value, schema: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40}}}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}, required: false}
    previousContext: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}, required: false, description: "the BoundedContext the last round answered; the loop carries it (21-composition.md)"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    context: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}, id: {expression: "inputs.contextId"}}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, id: {expression: "inputs.contextId + '-glossary'"}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}, id: {expression: "inputs.contextId + '-model'"}}
  executorRef: {kind: Executor, name: storming-agent}
  action:
    instructions: |
      Derive the BoundedContext, the Glossary and the DomainModel of the storming context whose id is `contextId`,
      from the design-level model, the Prd and its rules, following the derivation rules in your context. Cite the storming
      context id in `glossary.context` and `domainModel.context` (the engine names the BoundedContext artifact it
      publishes for you); `source` is the model's artifact id. Invent nothing; leave empty what the model does not say.
      With `previous` and `feedback` bound, the consistency check refused the last derivation: every finding names
      a DomainModel label that differs from the model, or a BoundedContext subdomain, classification, capability or
      relationship that differs from the storming and the Prd; fix those and change nothing else: start from
      `previous` and `previousContext`, the last round's DomainModel and BoundedContext.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: derive-domain-rules}}
      - {kind: artifact, input: model}
      - {kind: artifact, input: prd}
      - {kind: artifact, input: rules}
      - {kind: artifact, input: previous}
      - {kind: artifact, input: previousContext}
    parameters: {effort: high}
  timeout: 30m
  retryPolicy: # a transient API refusal (19-adapter-roles.md) gets another attempt within the step deadline; a dead login is permission_denied and never retried
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: none
---
# The Spec of one capability (27-spec-process.md): stories, requirements and acceptance scenarios that cite the kinds beside them.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: write-spec}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    capabilityId: {type: {kind: value, schema: {type: string, pattern: "^CAP-[0-9]+$"}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    context: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}, id: {expression: "inputs.prd.id + '-' + inputs.capabilityId.lowerAscii()"}}
  executorRef: {kind: Executor, name: spec-agent}
  action:
    instructions: |
      Write the Spec of the Prd capability whose id is `capabilityId`, following the Spec rules in your context.
      `prd`, `architecture`, `domainModel` and `businessRules` in the Spec are the artifact ids of the inputs with those
      names (`businessRules` is the input `rules`: the artifact every `BR-n` you cite belongs to).
      The capability is one `context` lists, and the DomainModel is that context's; `capability` is always
      `capabilityId`: a finding that the context does not list it is the caller's to fix, so answer it with a `Q-n`.
      Every command, event and read model label is the DomainModel's; every rule id is in `rules`; every quality
      scenario id is in `architecture`. With `previous` and `feedback` bound, fix what the findings name and
      change nothing else.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: spec-rules}}
      - {kind: artifact, input: prd}
      - {kind: artifact, input: architecture}
      - {kind: artifact, input: domainModel}
      - {kind: artifact, input: glossary}
      - {kind: artifact, input: rules}
      - {kind: artifact, input: context}
      - {kind: artifact, input: previous}
    parameters: {effort: high}
  timeout: 30m
  retryPolicy: # a transient API refusal (19-adapter-roles.md) gets another attempt within the step deadline; a dead login is permission_denied and never retried
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: none
---
# The Prd of one product from a brief (28-prd-process.md); the rules it cites are written beside it.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: draft-prd}
spec:
  inputs:
    brief: {type: {kind: value, schema: {type: string, minLength: 1}}}
    productId: {type: {kind: value, schema: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40}}, description: "the id stem of the Prd and the rules"}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, required: false}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}, required: false}
    previousRules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false, description: "the rules the last round answered; the loop carries them (21-composition.md)"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}, id: {expression: "inputs.productId + '-prd'"}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, id: {expression: "inputs.productId + '-rules'"}}
  executorRef: {kind: Executor, name: prd-agent}
  action:
    instructions: |
      Write the Prd from `brief`, with the subdomains the brief describes, following the Prd rules in your
      context, and the product's one BusinessRules artifact with every rule the Prd cites: the input `rules` revised when bound,
      a new artifact otherwise. The Prd's `businessRules` is `<productId>-rules`, the id the rules you answer are published under. With `previous` and `feedback` bound, fix what the findings name and change
      nothing else; answer both artifacts whole. The rules you answer start as a verbatim copy of the rules you were
      given (`previousRules` when bound, the last round's answer; else `rules`): every `BR-n` keeps its id, statement and
      rationale; a finding that names a `BR-n` changes that rule; a new policy takes the next number. Never renumber,
      reorder or reword a rule unasked: the gate refuses a rule that changed without a finding naming it.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: prd-rules}}
      - {kind: artifact, input: rules}
      - {kind: artifact, input: previousRules}
      - {kind: artifact, input: glossary}
      - {kind: artifact, input: previous}
    parameters: {effort: high}
  timeout: 30m
  retryPolicy: # a transient API refusal (19-adapter-roles.md) gets another attempt within the step deadline; a dead login is permission_denied and never retried
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: confirm-prd}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    audit: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}, required: false, description: "the auditor's verdict, passed, read before the human (23-pack-sdlc.md)"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: |
      Confirm the Prd and the rules it cites. Judge scope, users, goals and whether the capabilities are the right
      cut; the Validator checks ids and citations beside you. Approve, or reject with one finding per G-n,
      CAP-n, SC-n, Q-n or BR-n that must change, naming the id in the finding's message. A finding that changes the
      answer of a Q-n whose answer became a rule names that BR-n too, so the rule may change with it.
      `audit`, when bound, is the auditor's verdict on this draft: it passed, and each warning is a doubt for you to judge,
      not a defect already decided.
    context:
      - {kind: artifact, input: prd}
      - {kind: artifact, input: rules}
  timeout: 72h
  sideEffects: none
---
# One Design of one block (29-design-process.md): the contract whole, indexed against the DomainModel; a ui Design
# against the block's API Designs, no DomainModel or Glossary bound (32-ui-design-process.md).
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: design-asset}
spec:
  inputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    blockId: {type: {kind: value, schema: {type: string, pattern: "^BB-[0-9]+$"}}}
    type: {type: {kind: value, schema: {type: string, enum: [http-api, async-api, data-schema, ui]}}}
    interface: {type: {kind: value, schema: {type: string, minLength: 1}}, required: false}
    qualifier: {type: {kind: value, schema: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40}}, required: false, description: "tells two Designs of one block and type apart in the id (a block with two APIs, or realising two contexts): the interface or the context, as a label (29-design-process.md)"}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}, required: {expression: "inputs.type != 'ui'"}, description: "what the elements realise; a ui Design realises operations of `designs` instead"}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, required: {expression: "inputs.type != 'ui'"}, description: "the names the document uses; not for a ui Design"}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}, required: {expression: "inputs.type == 'ui'"}, description: "for a ui Design: the product's DesignSystem (32-ui-design-process.md)"}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: {expression: "inputs.type == 'ui'"}, description: "for a ui Design: the http-api Designs of the interfaces the block requires; its elements realise their operations"}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    design: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, id: {expression: "inputs.architecture.id + '-' + inputs.blockId.lowerAscii() + (has(inputs.qualifier) ? '-' + inputs.qualifier : '') + '-' + inputs.type"}}
  executorRef: {kind: Executor, name: design-agent}
  action:
    instructions: |
      Write the Design of `type` for the building block `blockId` of the Architecture, following the Design rules in
      your context. `architecture`, `domainModel` and `businessRules` in the Design are the artifact ids of the inputs
      `architecture`, `domainModel` and `rules`; `block` is `blockId`; for an API, `interface` is the input `interface` when bound, else the block's first provided
      interface. Every element realises a label the DomainModel names; every rule id is in `rules`. For a `ui` Design,
      `designSystem` is the artifact id of the DesignSystem in your context, there is no `domainModel`, and every
      element realises an operation of the Designs in your context.
      With `previous` and `feedback` bound, fix what the error findings name and change nothing else; a warning
      (a `dialect` word the block's store lacks) is advice you may take without changing anything else.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: design-rules}}
      - {kind: artifact, input: architecture}
      - {kind: artifact, input: domainModel}
      - {kind: artifact, input: glossary}
      - {kind: artifact, input: rules}
      - {kind: artifact, input: designSystem}
      - {kind: artifact, input: designs}
      - {kind: artifact, input: previous}
    parameters: {effort: high}
  timeout: 30m
  retryPolicy: # a transient API refusal (19-adapter-roles.md) gets another attempt within the step deadline; a dead login is permission_denied and never retried
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: write-plan}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, description: "every Design of the blocks the Spec touches"}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}, required: false, description: "which aggregate handles each of the Spec's commands"}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}, id: {expression: "inputs.spec.id + '-plan'"}}
  executorRef: {kind: Executor, name: plan-agent}
  action:
    instructions: |
      Write the Plan of the Spec, following the Plan rules in your context. `spec` and `architecture` in the Plan
      are the artifact ids of the inputs with those names; `designs` lists the artifact ids of the Designs in your
      context that some task realises an element of. Every task sits on one block, covers requirements and is
      verified by scenarios of the Spec, and depends on earlier tasks only.
      With `previous` and `feedback` bound, fix what the findings name and change nothing else.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: plan-rules}}
      - {kind: artifact, input: spec}
      - {kind: artifact, input: architecture}
      - {kind: artifact, input: designs}
      - {kind: artifact, input: domainModel}
      - {kind: artifact, input: previous}
    parameters: {effort: high}
  timeout: 30m
  retryPolicy: # a transient API refusal (19-adapter-roles.md) gets another attempt within the step deadline; a dead login is permission_denied and never retried
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: none
---
# The Architecture of one product (31-architecture-process.md): the arc42 baseline over every context, and the Adrs it applies.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: write-architecture}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    contexts: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}, description: "every BoundedContext of the product; each lists the Prd capabilities it handles"}
    domainModels: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    glossaries: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}, required: false}
    previousAdrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false, description: "the Adrs the last round answered; the loop carries them (21-composition.md)"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}, id: {expression: "inputs.prd.id + '-architecture'"}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, id: {expression: "inputs.prd.id + '-adr'"}}
  executorRef: {kind: Executor, name: architecture-agent}
  action:
    instructions: |
      Write the Architecture of the product the Prd describes and the Adrs behind its strategy, following the
      Architecture rules in your context. `introduction.prd` is the Prd's artifact id, `businessRules` the input `rules`'s; `domainModels` and `glossaries`
      list the artifact ids of every DomainModel and Glossary in your context; `buildingBlocks[].contexts` cite the
      BoundedContexts by artifact id. `adrs` is one Adr per strategy decision, in order; `decisions` lists their ids,
      `<prd>-adr-1`, `<prd>-adr-2`, ... With `previous` and `feedback` bound, fix what the findings name and change
      nothing else; answer the whole Architecture and every Adr again. Each Adr you answer starts as a verbatim copy of
      the one in `previousAdrs` with its id: a finding that names the Adr, or the `S-n` it backs, changes it; a strategy
      the findings drop keeps its slot as a `superseded` Adr; a new strategy takes the next number. Never reword an Adr
      unasked.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: architecture-rules}}
      - {kind: artifact, input: prd}
      - {kind: artifact, input: rules}
      - {kind: artifact, input: contexts}
      - {kind: artifact, input: domainModels}
      - {kind: artifact, input: glossaries}
      - {kind: artifact, input: previous}
      - {kind: artifact, input: previousAdrs}
    parameters: {effort: high}
  timeout: 30m
  retryPolicy: # a transient API refusal (19-adapter-roles.md) gets another attempt within the step deadline; a dead login is permission_denied and never retried
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: confirm-architecture}
spec:
  inputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}}
    audit: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}, required: false, description: "the auditor's verdict, passed, read before the human (23-pack-sdlc.md)"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: |
      Confirm the Architecture and the Adrs it applies. Judge the block cut, the strategy and its Adrs, the quality
      goals and their order, and the constraints; the Validator checks ids and citations beside you. Approve, or
      reject with one finding per BB-n, S-n, QG-n, C-n, QS-n or Adr id that must change, naming the id in the
      finding's message.
      `audit`, when bound, is the auditor's verdict on this draft: it passed, and each warning is a doubt for you to judge,
      not a defect already decided.
    context:
      - {kind: artifact, input: architecture}
      - {kind: artifact, input: adrs}
  timeout: 72h
  sideEffects: none
---
# The UI design process (32-ui-design-process.md): the DesignSystem once per product, confirmed by a human.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: write-design-system}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}, id: {expression: "inputs.prd.id + '-design-system'"}}
  executorRef: {kind: Executor, name: design-system-agent}
  action:
    instructions: |
      Write the DesignSystem of the product the Prd describes, following the DesignSystem rules in your context:
      `document.content` is the whole DESIGN.md, front matter and the eight sections in order; `prd` is the Prd's
      artifact id. With `previous` and `feedback` bound, fix what the findings name and change nothing else; answer
      the whole file again.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: design-system-rules}}
      - {kind: artifact, input: prd}
      - {kind: artifact, input: architecture}
      - {kind: artifact, input: previous}
    parameters: {effort: high}
  timeout: 30m
  retryPolicy: # a transient API refusal (19-adapter-roles.md) gets another attempt within the step deadline; a dead login is permission_denied and never retried
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: confirm-design-system}
spec:
  inputs:
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: |
      Confirm the DesignSystem. Judge the look and feel, the palette, the type, the components and the Do's and
      Don'ts for the product and the people who look at it; the linter checks the format, the token references and
      the contrast beside you. Approve, or reject with one finding per section or token path that must change,
      naming it in the finding's message.
    context:
      - {kind: artifact, input: designSystem}
  timeout: 72h
  sideEffects: none
---
# The project's tests before build-all builds any task (35-build-process.md): the cases red here are not the build's to fix.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: run-baseline}
spec:
  inputs:
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    repository: {type: {kind: externalResource, provider: git, type: repository}, description: "the project's code, before the build"}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false, description: "the project's test tools: when bound, the levels and their commands are its (39-test-process.md)"}
  outputs:
    baseline: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, id: {expression: "inputs.plan.id + '-baseline'"}}
  executorRef: {kind: Executor, name: test-runner}
  action:
    instructions: Run the project's tests in the repository and answer what their JUnit XML says.
    workspace: {input: repository}
  timeout: 2h   # as run-tests'
  sideEffects: idempotent
---
# The project's own tests after a build round (35-build-process.md): the evidence the AcceptanceRecord is checked against.
# `record` is an input so the TestOutcome's provenance pins the record it followed; `baseline` gives the Change set its base
# commit and the red that is not new (36-test-levels.md).
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: run-tests}
spec:
  inputs:
    record: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}}
    repository: {type: {kind: externalResource, provider: git, type: repository}, description: "the project's code, where the build round wrote"}
    baseline: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the unit tests before build-all; run alone, none: every test runs"}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false, description: "the project's test tools: when bound, the levels and their commands are its (39-test-process.md)"}
    cases: {type: {kind: value, schema: {type: object}}, required: false, description: "the round's case ids by level, under a TestDesign (39-test-process.md): the tests each level must run"}
  outputs:
    testOutcome: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, id: {expression: "inputs.record.id + '-tests'"}}
  executorRef: {kind: Executor, name: test-runner}
  action:
    instructions: Run the project's tests in the repository and answer what their JUnit XML says.
    workspace: {input: repository}
  timeout: 2h   # a ceiling: a project's override of test-runner cannot change it, and a run ends when its tests end
  sideEffects: idempotent
---
# The project's other test levels (36-test-levels.md), one TestOutcome per level level-runner configures, none when it has none.
# A record is a round, each level selecting by the Change set and held after a new red, the unit one's too; no record nor
# baselines, the baselines before build-all; baselines and no record, the plan tier after the last task, every level in full.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: run-levels}
spec:
  inputs:
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    repository: {type: {kind: externalResource, provider: git, type: repository}, description: "the project's code"}
    record: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}, required: false, description: "the round's record: the tests it names run"}
    testOutcome: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the round's unit tests: a new red there holds every level"}
    baselines: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "each level's tests before build-all"}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false, description: "the project's test tools: when bound, the levels and their commands are its (39-test-process.md)"}
    cases: {type: {kind: value, schema: {type: object}}, required: false, description: "the round's case ids by level, under a TestDesign (39-test-process.md): the tests each level must run"}
  outputs:
    outcomes: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, id: {expression: "has(inputs.record) ? inputs.record.id + '-levels' : inputs.plan.id + (has(inputs.baselines) ? '-final-levels' : '-baseline-levels')"}}
  executorRef: {kind: Executor, name: level-runner}
  action:
    instructions: Run each test level of the project in the repository and answer what its JUnit XML says.
    workspace: {input: repository}
  timeout: 4h   # integration, api and e2e one after the other
  sideEffects: idempotent
---
# The plan tier's unit tests, after build-all's last task (36-test-levels.md): every one when affected narrows the rounds, none
# otherwise, since the last round ran them all over the same tree.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: run-final}
spec:
  inputs:
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    repository: {type: {kind: externalResource, provider: git, type: repository}, description: "the project's code, every task built"}
    baseline: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, description: "the unit tests before build-all"}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false, description: "the project's test tools: when bound, the levels and their commands are its (39-test-process.md)"}
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "a TestReport follows: unit runs in full, so every case has a result over the last tree"}
  outputs:
    final: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, id: {expression: "inputs.plan.id + '-final'"}}
  executorRef: {kind: Executor, name: test-runner}
  action:
    instructions: Run the project's tests in the repository and answer what their JUnit XML says.
    workspace: {input: repository}
  timeout: 2h   # as run-tests'
  sideEffects: idempotent
---
# A Design's meaning, judged after design-consistency passed (23-pack-sdlc.md), as design-gate's Validator design-audited;
