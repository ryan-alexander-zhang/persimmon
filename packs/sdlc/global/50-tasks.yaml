# The owner decides a storming phase's open hotspots inside the round, before its Gate (23-pack-sdlc.md): the unknowns the
# storming parked are settled before the grammar check and the confirm read the model.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: decide-storming}
spec:
  inputs:
    draft: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}, description: "this round's model, with the hotspots open"}
    open: {type: {kind: value, schema: {type: array, items: {type: string, minLength: 1}}}, description: "the hotspot ids to decide"}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
  outputs:
    decisions: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: object, required: [id, resolution], additionalProperties: false, properties: {id: {type: string, minLength: 1, description: "a hotspot node id"}, resolution: {type: string, minLength: 1}}}}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: |
      Decide every hotspot `open` names in the EventStorming `draft`, as the product's owner, following the owner's rules
      in your context: a `question` gets its answer, a `conflict` which side holds, a `risk` whether the product accepts
      it or what guards it. Answer `decisions` with one entry per id in `open` and no other: its `resolution`.
