# The owner decides a Prd draft's open questions inside the round, before its Gate (23-pack-sdlc.md): the brief's unknowns
# are settled before the auditor and the confirm read the Prd.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: decide-prd}
spec:
  inputs:
    draft: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}, description: "this round's Prd, with the questions open"}
    open: {type: {kind: value, schema: {type: array, items: {type: string, pattern: "^Q-[0-9]+$"}}}, description: "the ids to decide"}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, required: false}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, description: "the rules the draft cites"}
    brief: {type: {kind: value, schema: {type: string, minLength: 1}}, description: "the developer's brief, the only source the Prd had"}
  outputs:
    decisions: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: object, required: [id, resolution], additionalProperties: false, properties: {id: {type: string, pattern: "^Q-[0-9]+$"}, resolution: {type: string, minLength: 1}, upstream: {type: string, minLength: 1, description: "the upstream artifact the answer changes, <artifact id> or <artifact id> Q-n"}}}}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: |
      Decide every question `open` names in the Prd `draft`, as the product's owner, following the owner's rules in your
      context; `brief` is what the developer gave. Answer `decisions` with one entry per id in `open` and no other: its
      `resolution`; a decision that becomes a policy names it so the writer adds the rule.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: owner-decisions}}
      - {kind: artifact, input: draft}
      - {kind: artifact, input: glossary}
      - {kind: artifact, input: rules}
  timeout: 72h
  sideEffects: none
