    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}, description: "the quality scenarios proven at build"}
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}}
    final: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, description: "the unit tests after the last task"}
    finals: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the other test levels after the last task"}
    records: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}, description: "the Plan's built tasks: the defects they report"}
    evaluation: {type: {kind: value, schema: {type: object, required: [summary, residualRisks], additionalProperties: false, properties: {summary: {type: string, minLength: 1}, residualRisks: {type: array, items: {type: string, minLength: 1}}}}}}
  outputs:
    report: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestReport}}, id: {expression: "inputs.plan.id + '-test-report'"}}
  executorRef: {kind: Executor, name: test-reporter}
  action:
    instructions: Compute the TestReport of the Plan from the TestDesign and the plan tier's outcomes.
  timeout: 5m
  sideEffects: idempotent
