    taskId: {type: {kind: value, schema: {type: string, pattern: "^T-[0-9]+$"}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false, description: "the last round's verdict: the Tester writes again only for a case a finding names"}
  outputs:
    cases: {type: {kind: value, schema: {type: object}}}
  executorRef: {kind: Executor, name: case-selector}
