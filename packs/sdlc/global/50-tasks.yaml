    decisions: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: object, required: [id, resolution], additionalProperties: false, properties: {id: {type: string, pattern: "^Q-[0-9]+$"}, resolution: {type: string, minLength: 1}, upstream: {type: string, minLength: 1, description: "the upstream artifact the answer changes, <artifact id> or <artifact id> Q-n"}}}}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: |
      Decide every question `open` names in the Spec `draft`, as the product's owner, following the owner's rules in
