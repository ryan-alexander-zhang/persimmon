# Whether each test a record names proves its scenario (35-build-process.md): the auditor reads the repository, so a Task in
# build-work and not a Validator's, whose inputs exclude it (14-gate.md). The Gate's acceptance-audited reads the answer.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: audit-acceptance}
spec:
  inputs:
    record: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}}
    testOutcome: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}}
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    taskId: {type: {kind: value, schema: {type: string, pattern: "^T-[0-9]+$"}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    repository: {type: {kind: externalResource, provider: git, type: repository}, description: "the project's code, read only"}
    levelOutcomes: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the other test levels' outcomes this round (36-test-levels.md)"}
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the Spec's test cases: the record has no rows, the cases are judged (39-test-process.md)"}
    cases: {type: {kind: value, schema: {type: object}}, required: false, description: "the round's case ids by level, under a TestDesign (39-test-process.md): the tests each level must run"}
  outputs:
    audit: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: auditor}
  action:
    instructions: |
      Audit the record of the Plan task whose id is `taskId`, built in the directory the `repository` input names,
      following the audit rules in your context: for each scenario row, whether its named tests prove the scenario;
      with `cases` bound, for each case of the task, whether the tests carrying its id prove it.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: audit-rules}}
      - {kind: artifact, input: record}
      - {kind: artifact, input: testOutcome}
      - {kind: artifact, input: plan}
      - {kind: artifact, input: spec}
      - {kind: artifact, input: architecture}
      - {kind: artifact, input: levelOutcomes}
      - {kind: artifact, input: testDesign}
    workspace: {input: repository}
  timeout: 1h
  retryPolicy: # a transient API refusal gets another attempt
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: none
---
# One Plan task built (35-build-process.md): the code and tests in the repository, and the AcceptanceRecord naming the test
# that proves each AC-n and QS-n. The builder is the developer by default; the Executor is the switch to an agent.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: implement}
spec:
  inputs:
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    taskId: {type: {kind: value, schema: {type: string, pattern: "^T-[0-9]+$"}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false, description: "the Adrs the Architecture applies"}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, description: "the Designs the Plan lists"}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    repository: {type: {kind: externalResource, provider: git, type: repository}, description: "the project's code, where the task is built"}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}, required: false}
    previousOutcome: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "what the tests did last round"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
    baseline: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the tests before build-all: a case red there is not this task's"}
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the Spec's test cases (39-test-process.md)"}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false, description: "the project's test tools: when bound, the levels and their commands are its (39-test-process.md)"}
    cases: {type: {kind: value, schema: {type: object}}, required: false, description: "the round's case ids by level, under a TestDesign (39-test-process.md): the tests each level must run"}
    written: {type: {kind: value, schema: {type: object, required: [files, cases], additionalProperties: false, properties: {files: {type: array, items: {type: string, minLength: 1}}, cases: {type: array, items: {type: string, pattern: "^CAP-[0-9]+/TC-[0-9]+$"}}, notWritten: {type: array, items: {type: string, minLength: 1}}}}}, required: false, description: "the api tests the Tester wrote this round, before the code: never edited by the builder"}
    decisions: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: object, required: [id, resolution], additionalProperties: false, properties: {id: {type: string, pattern: "^Q-[0-9]+$"}, resolution: {type: string, minLength: 1}, upstream: {type: string, minLength: 1, description: "the upstream artifact the answer changes, <artifact id> or <artifact id> Q-n"}}}}}, required: false, description: "the owner's answers to this round's open questions, recorded in this round (23-pack-sdlc.md)"}
  outputs:
    record: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}, id: {expression: "inputs.plan.id + '-' + inputs.taskId.lowerAscii()"}}
    open: {type: {kind: value, schema: {type: array, items: {type: string, pattern: "^Q-[0-9]+$"}}}, description: "the ids of the record's questions without a resolution; empty when none"}
  executorRef: {kind: Executor, name: builder}
  action:
    instructions: |
      Build the Plan task whose id is `taskId` in the directory the `repository` input names, where the tests then
      run, following the build rules in your context; then answer with its AcceptanceRecord. `plan` and `spec` in the
      record are the artifact ids of the inputs with those names; `task` is `taskId`. With `previous`,
      `previousOutcome` and `feedback` bound, fix what the findings name, and with it what restated or rested on it, and change nothing else.
      `open` lists the ids of every `Q-n` the record leaves without a `resolution`. With `decisions` bound, `previous` is this
      round's record: record each decision as its `Q-n`'s `resolution` (and `upstream` when it names one), build what the answer implies, and change nothing
      else; `open` is then what still has none.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: build-rules}}
      - {kind: artifact, input: plan}
      - {kind: artifact, input: spec}
      - {kind: artifact, input: architecture}
      - {kind: artifact, input: adrs}
      - {kind: artifact, input: designs}
      - {kind: artifact, input: glossary}
      - {kind: artifact, input: rules}
      - {kind: artifact, input: previous}
      - {kind: artifact, input: previousOutcome}
      - {kind: artifact, input: baseline}
      - {kind: artifact, input: testDesign}
      - {kind: artifact, input: harness}
    workspace: {input: repository}
    parameters: {effort: high}
  timeout: 72h   # a human's: the developer builds it in their own session
  retryPolicy: # for an agent override: a transient API refusal gets another attempt; unknown_result is never retried under nonIdempotent
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: nonIdempotent   # it writes the repository
---
# The Tester sets up the project's tests once and records them (39-test-process.md): a tool per test level, a seed test each.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: write-harness}
spec:
  inputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false, description: "the Adrs the Architecture applies: a tool one names is the level's"}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: false, description: "the product's Designs: an http-api one needs an api level, a ui one an e2e level"}
    repository: {type: {kind: externalResource, provider: git, type: repository}, description: "the project's code, where the tests are set up"}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false, description: "the harness before this run: its levels are kept"}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false, description: "the downstream answers this run applies to base"}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
    decisions: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: object, required: [id, resolution], additionalProperties: false, properties: {id: {type: string, pattern: "^Q-[0-9]+$"}, resolution: {type: string, minLength: 1}, upstream: {type: string, minLength: 1, description: "the upstream artifact the answer changes, <artifact id> or <artifact id> Q-n"}}}}}, required: false, description: "the owner's answers to this draft's open questions, recorded in this round (23-pack-sdlc.md)"}
  outputs:
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, id: {expression: "inputs.architecture.id + '-harness'"}}
    open: {type: {kind: value, schema: {type: array, items: {type: string, pattern: "^Q-[0-9]+$"}}}, description: "the ids of the questions this draft leaves without a resolution; empty when none"}
  executorRef: {kind: Executor, name: tester}
  action:
    instructions: |
      Set up the project's tests in the directory the `repository` input names, following the harness rules in your
      context, and answer with the TestHarness that records them. `architecture` in it is the artifact id of the input
      with that name. With `previous` and `feedback` bound, fix what the findings name, and with it what restated or rested on it, and change nothing else.
      `open` lists the ids of every `Q-n` the TestHarness leaves without a `resolution`. With `decisions` bound, `previous` is this
      round's draft: record each decision as its `Q-n`'s `resolution` (and `upstream` when it names one), apply what the
      answer implies and change nothing else; `open` is then what still has none.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: harness-rules}}
      - {kind: artifact, input: architecture}
      - {kind: artifact, input: adrs}
      - {kind: artifact, input: designs}
      - {kind: artifact, input: base}
      - {kind: artifact, input: previous}
    workspace: {input: repository}
  timeout: 72h   # a human's: the developer's agent sets it up in its own session
  retryPolicy: # a transient API refusal gets another attempt
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: nonIdempotent   # it writes the repository
---
# A harness's unit level run once, every test, to find its seed test (39-test-process.md).
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: run-seed}
spec:
  inputs:
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}}
    repository: {type: {kind: externalResource, provider: git, type: repository}, description: "the project's code"}
  outputs:
    seed: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, id: {expression: "inputs.harness.id + '-seed'"}}
  executorRef: {kind: Executor, name: test-runner}
  action:
    instructions: Run the unit tests the TestHarness names in the repository and answer what their JUnit XML says.
    workspace: {input: repository}
  timeout: 2h
  sideEffects: idempotent
---
# A harness's other levels run once, every test, to find each seed test (39-test-process.md).
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: run-seed-levels}
spec:
  inputs:
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}}
    repository: {type: {kind: externalResource, provider: git, type: repository}, description: "the project's code"}
  outputs:
    outcomes: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, id: {expression: "inputs.harness.id + '-seed-levels'"}}
  executorRef: {kind: Executor, name: level-runner}
  action:
    instructions: Run each test level the TestHarness names in the repository and answer what its JUnit XML says.
    workspace: {input: repository}
  timeout: 4h
  sideEffects: idempotent
---
# The test cases of one Spec, designed before it is built (39-test-process.md); read only, as the Plan is written.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: design-tests}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}, description: "the Spec's Plan: the task each case is built in, and what the tasks before it build"}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the Spec's TestDesign before this run: start from it and keep its ids"}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, description: "the product's Designs: the operations and screens a case's steps name"}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
    decisions: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: object, required: [id, resolution], additionalProperties: false, properties: {id: {type: string, pattern: "^Q-[0-9]+$"}, resolution: {type: string, minLength: 1}, upstream: {type: string, minLength: 1, description: "the upstream artifact the answer changes, <artifact id> or <artifact id> Q-n"}}}}}, required: false, description: "the owner's answers to this draft's open questions, recorded in this round (23-pack-sdlc.md)"}
  outputs:
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, id: {expression: "inputs.spec.id + '-tests'"}}
    open: {type: {kind: value, schema: {type: array, items: {type: string, pattern: "^Q-[0-9]+$"}}}, description: "the ids of the questions this draft leaves without a resolution; empty when none"}
  executorRef: {kind: Executor, name: test-design-agent}
  action:
    instructions: |
      Design the test cases of the Spec, following the test design rules in your context. `spec` and `harness` in the
      TestDesign are the artifact ids of the inputs with those names. With `previous` and `feedback` bound, fix what
      the findings name and change nothing else.
      `open` lists the ids of every `Q-n` the TestDesign leaves without a `resolution`. With `decisions` bound, `previous` is this
      round's draft: record each decision as its `Q-n`'s `resolution` (and `upstream` when it names one), apply what the
      answer implies and change nothing else; `open` is then what still has none.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: test-design-rules}}
      - {kind: artifact, input: spec}
      - {kind: artifact, input: plan}
      - {kind: artifact, input: architecture}
      - {kind: artifact, input: designs}
      - {kind: artifact, input: glossary}
      - {kind: artifact, input: rules}
      - {kind: artifact, input: harness}
      - {kind: artifact, input: base}
      - {kind: artifact, input: previous}
    parameters: {effort: high}
  timeout: 30m
  retryPolicy: # a transient API refusal gets another attempt
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: none
---
# A TestDesign's meaning, judged after test-design-consistency passed and before the human (39-test-process.md).
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: audit-test-design}
spec:
  inputs:
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the last round's, beside the draft; round one has none"}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the TestDesign this draft applies answers to; what it settled stands"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false, description: "the last round's verdict; round one has none"}
  outputs:
    audit: {type: {kind: value, schema: {allOf: [{$ref: "persimmon.ai/v1#/ValidationResult"}, {if: {required: [findings], properties: {findings: {contains: {required: [severity], properties: {severity: {const: error}}}}}}, then: {properties: {passed: {const: false}}}, else: {properties: {passed: {const: true}}}}]}}}
  executorRef: {kind: Executor, name: auditor}
  action:
    instructions: |
      Audit the TestDesign `testDesign` following the draft audit rules in your context, their part for a TestDesign.
      With `base` bound, the draft applies answers to it: judge what changed against `base`, never what it already settled.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: draft-audit-rules}}
      - {kind: artifact, input: testDesign}
      - {kind: artifact, input: spec}
      - {kind: artifact, input: architecture}
      - {kind: artifact, input: designs}
      - {kind: artifact, input: rules}
      - {kind: artifact, input: harness}
      - {kind: artifact, input: previous}
      - {kind: artifact, input: base}
  timeout: 30m
  retryPolicy: # a transient API refusal gets another attempt
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: none
---
# The human's confirmation of a TestHarness once its seed tests pass (39-test-process.md): the tools, and the answer to each
# open question.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: confirm-harness}
spec:
  inputs:
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false, description: "the last round's verdict; round one has none (23-pack-sdlc.md)"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: |
      Confirm the project's test setup. Judge whether each level's tool is the one the Architecture names, and whether
      its commands and conventions are how this project should write and run that level's tests; every seed test
      passed beside you. Approve, or reject with one finding per level that must change, naming it in the message.
      Each open Q-n is yours to answer: reject with a finding naming it and giving the answer, which the next round
      records as its resolution.
      Judge as the owner's rules in your context say; `feedback`, when bound, is the last round's verdict: check its
      findings were fixed first.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: owner-review}}
      - {kind: artifact, input: harness}
      - {kind: artifact, input: architecture}
  timeout: 72h
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: confirm-test-design}
spec:
  inputs:
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    audit: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}, required: false, description: "the auditor's verdict, passed, read before the human (23-pack-sdlc.md)"}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false, description: "the last round's verdict; round one has none (23-pack-sdlc.md)"}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: |
      Confirm the test cases of the Spec before any of it is built. Judge whether each case tests what its scenario
      accepts, at the level a person or a client meets it, with a priority its failure deserves; the check covers every
      scenario beside you. Approve, or reject with one finding per TC-n that must change, naming it in the message.
      Each open Q-n is yours to answer: reject with a finding naming it and giving the answer, which the next round
      records as its resolution.
      `audit`, when bound, is the auditor's verdict on this draft: it passed, and each warning is a doubt for you to judge,
      not a defect already decided.
      Judge as the owner's rules in your context say; `feedback`, when bound, is the last round's verdict: check its
      findings were fixed first.
    context:
      - {kind: prompt, ref: {kind: Prompt, name: owner-review}}
      - {kind: artifact, input: testDesign}
      - {kind: artifact, input: spec}
  timeout: 72h
  sideEffects: none
