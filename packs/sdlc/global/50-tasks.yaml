# What the plan tier's tests leave unproven, in words (39-test-process.md): the auditor reads; testdesign/v1 counts.
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: evaluate-tests}
spec:
  inputs:
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}}
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    final: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, description: "the unit tests after the last task"}
    finals: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the other test levels after the last task"}
    records: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}, description: "the Plan's built tasks"}
  outputs:
    evaluation: {type: {kind: value, schema: {type: object, required: [summary, residualRisks], additionalProperties: false, properties: {summary: {type: string, minLength: 1}, residualRisks: {type: array, items: {type: string, minLength: 1}}}}}}
  executorRef: {kind: Executor, name: auditor}
  action:
    instructions: |
      Evaluate what the Plan's tests prove, as the completion evaluation of a test report: `summary`, a few sentences in
      the TestDesign's words on what ran and what it shows; `residualRisks`, one line each for what is left unproven: a
      manual case, a case no test carries or whose level did not run, a flaky test, a defect a record reports. Count
      nothing: the report counts. Read only.
    context:
      - {kind: artifact, input: testDesign}
      - {kind: artifact, input: plan}
      - {kind: artifact, input: final}
      - {kind: artifact, input: finals}
      - {kind: artifact, input: records}
  timeout: 30m
  retryPolicy: # a transient API refusal gets another attempt
    maxAttempts: 3
    backoff: {strategy: exponential, initial: 1m, max: 5m, jitter: none}
  sideEffects: none
---
# The TestReport of a built Plan (39-test-process.md), computed: each case's result, coverage, the verdict and its rule.
