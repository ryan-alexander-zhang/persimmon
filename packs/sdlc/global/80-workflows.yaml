# One round of a storming phase (23-pack-sdlc.md): the storming drafts the model; a model with open hotspots goes to the
# owner, decide-storming, and the storming records the decisions in the same round; a model with none goes to the Gate.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: storming-draft}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    level: {type: {kind: value, schema: {type: string, enum: [big-picture, process, design]}}}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}, required: false}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    inventory: {type: {kind: value, schema: {type: object}}, required: false}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false}
  outputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    contexts: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40}}}}
  outputBindings:
    model: {first: [{fromStep: {stepRef: record, output: model}}, {fromStep: {stepRef: write, output: model}}]}   # whichever path ran
    contexts: {first: [{fromStep: {stepRef: record, output: contexts}}, {fromStep: {stepRef: write, output: contexts}}]}
  entry: [write]
  steps:
    - id: write
      uses: {kind: Task, name: event-storm}
      inputs:
        prd: {fromInput: prd}
        level: {fromInput: level}
        base: {fromInput: base, onMissing: omit}
        rules: {fromInput: rules, onMissing: omit}
        inventory: {fromInput: inventory, onMissing: omit}
        previous: {fromInput: previous, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
        changes: {fromInput: changes, onMissing: omit}
      timeout: 30m
    - id: decide
      uses: {kind: Task, name: decide-storming}
      inputs:
        draft: {fromStep: {stepRef: write, output: model}}
        open: {fromStep: {stepRef: write, output: open}}
        prd: {fromInput: prd}
        rules: {fromInput: rules, onMissing: omit}
      timeout: 72h
    - id: record
      uses: {kind: Task, name: event-storm}
      inputs:
        prd: {fromInput: prd}
        level: {fromInput: level}
        rules: {fromInput: rules, onMissing: omit}
        inventory: {fromInput: inventory, onMissing: omit}
        previous: {fromStep: {stepRef: write, output: model}}
        decisions: {fromStep: {stepRef: decide, output: decisions}}
      timeout: 30m
  transitions:
    - id: after-write
      from: [{stepRef: write, outcomes: [Succeeded]}]
      to: [{stepRef: decide, when: "steps.write.outputs.open.size() > 0"}, {terminal: Succeeded}]
      dispatch: first
    - id: after-decide
      from: [{stepRef: decide, outcomes: [Succeeded]}]
      to: [{stepRef: record}]
    - id: after-record
      from: [{stepRef: record, outcomes: [Succeeded]}]
      to: [{terminal: Succeeded}]
  timeout: 73h
---
# The domain discovery process (26-domain-discovery.md): three storming phases, each a ReviewLoop until its gate passes,
# then one derivation per context. Composition kinds expand to Workflows and Gates at run start (21-composition.md).
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: storm-big-picture}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    inventory: {type: {kind: value, schema: {type: object}}, required: false}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}, required: false}
  produce:
    uses: {kind: Workflow, name: storming-draft}
    inputs:
      prd: {fromInput: prd}
      rules: {fromInput: rules}
      inventory: {fromInput: inventory}
      base: {fromInput: base}
      level: {literal: big-picture}
    timeout: 73h   # the owner may be a human (23-pack-sdlc.md decide step)
  review:
    uses: {kind: Gate, name: storming-gate}
    inputs:
      model: {fromStep: {stepRef: produce, output: model}}
      level: {literal: big-picture}
      prd: {fromInput: prd}
      feedback: {fromInput: feedback}
    timeout: 72h
  subject: model
  previous: previous
  feedback: feedback
  maxRounds: 3
  timeout: 240h
---
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: storm-process}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    inventory: {type: {kind: value, schema: {type: object}}, required: false}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
  produce:
    uses: {kind: Workflow, name: storming-draft}
    inputs:
      prd: {fromInput: prd}
      rules: {fromInput: rules}
      inventory: {fromInput: inventory}
      base: {fromInput: base}
      level: {literal: process}
    timeout: 73h   # the owner may be a human (23-pack-sdlc.md decide step)
  review:
    uses: {kind: Gate, name: storming-gate}
    inputs:
      model: {fromStep: {stepRef: produce, output: model}}
      level: {literal: process}
      prd: {fromInput: prd}
      feedback: {fromInput: feedback}
    timeout: 72h
  subject: model
  previous: previous
  feedback: feedback
  maxRounds: 3
  timeout: 240h
---
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: storm-design}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    inventory: {type: {kind: value, schema: {type: object}}, required: false}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}, description: "the process-level model; with changes bound, the design-level model as it stands (38-autopilot.md)"}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false, description: "the downstream answers this run applies to base"}
  produce:
    uses: {kind: Workflow, name: storming-draft}
    inputs:
      prd: {fromInput: prd}
      rules: {fromInput: rules}
      inventory: {fromInput: inventory}
      base: {fromInput: base}
      changes: {fromInput: changes}
      level: {literal: design}
    timeout: 73h   # the owner may be a human (23-pack-sdlc.md decide step)
  review:
    uses: {kind: Gate, name: storming-gate}
    inputs:
      model: {fromStep: {stepRef: produce, output: model}}
      level: {literal: design}
      prd: {fromInput: prd}
      feedback: {fromInput: feedback}
      base: {fromInput: base}
    timeout: 72h
  subject: model
  previous: previous
  feedback: feedback
  maxRounds: 3
  timeout: 240h
---
# One context: derive, check against the model, feed the findings back; two rounds.
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: derive-one}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    contextId: {type: {kind: value, schema: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40}}}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}, required: false, description: "the context's last DomainModel, when this run applies downstream answers (38-autopilot.md)"}
    baseGlossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, required: false}
    baseContext: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}, required: false}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false, description: "the downstream answers this run applies to base, baseGlossary and baseContext"}
  produce:
    uses: {kind: Task, name: derive-domain}
    inputs:
      model: {fromInput: model}
      prd: {fromInput: prd}
      rules: {fromInput: rules}
      contextId: {fromInput: contextId}
      base: {fromInput: base}
      baseGlossary: {fromInput: baseGlossary}
      baseContext: {fromInput: baseContext}
      changes: {fromInput: changes}
    timeout: 30m
  review:
    uses: {kind: Gate, name: derived-gate}
    inputs:
      model: {fromInput: model}
      domainModel: {fromStep: {stepRef: produce, output: domainModel}}
      contextId: {fromInput: contextId}
      boundedContext: {fromStep: {stepRef: produce, output: context}}
      glossary: {fromStep: {stepRef: produce, output: glossary}}
      prd: {fromInput: prd}
    timeout: 5m
  subject: domainModel
  previous: previous
  feedback: feedback
  carry: {context: previousContext} # the BoundedContext comes back beside the DomainModel: round two fixes it instead of rebuilding it
  maxRounds: 2
  timeout: 90m
---
# Every context of the model: a repeat over the ids the design phase answered (11-workflow.md, state in expressions).
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: derive-all}
spec:
  inputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    contexts: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40}}}}
  outputs:
    derived: {type: {kind: value, schema: {type: integer}}}
  outputBindings:
    derived: {expression: "steps.each.iterations"}
  entry: [each]
  steps:
    - id: each
      uses: {kind: ReviewLoop, name: derive-one}
      inputs:
        model: {fromInput: model}
        prd: {fromInput: prd}
        rules: {fromInput: rules, onMissing: omit}
        contextId: {expression: "inputs.contexts[state.index - 1]"}
      timeout: 30h   # a ceiling for the whole repeat: twenty contexts at derive-one's 90m
      memo: {when: "outputs.passed"}   # unchanged inputs, a passed loop: done already (11-workflow.md)
      repeat:
        state:
          index: {type: {kind: value, schema: {type: integer, minimum: 1}}}
        initial:
          index: {literal: 1}
        next:
          index: {expression: "state.index + 1"}
        until: "iteration.index >= inputs.contexts.size()"
        maxIterations: 20
        parallel: 4   # the contexts are independent; one rejected does not stop the others (11-workflow.md)
  transitions:
    - id: done
      from: [{stepRef: each, outcomes: [Succeeded, Failed]}]
      to:
        - {terminal: Succeeded, when: 'steps.each.phase == "Succeeded" && steps.each.results.all(r, r.passed)'}
        - {terminal: Failed, reason: derivation_inconsistent, when: 'steps.each.phase == "Succeeded"'} # a Gate rejected some loop's last round; steps.each.results says which
        - {terminal: Failed, reason: step_failed} # the iteration died before its Gate ran; steps.each.error names the cause
      dispatch: first
  timeout: 30h
---
# Prd and its rules in, a design-level model and one derived context per storming context out.
apiVersion: persimmon.ai/v1
kind: Pipeline
metadata: {name: domain-discovery}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    inventory: {type: {kind: value, schema: {type: object}}, required: false, description: "a Rewrite pack SourceInventory's content (40-pack-rewrite.md)"}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}, required: false, description: "the product's last model, when a later Rewrite pack Slice storms on top of it"}
  outputs:
    model: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: EventStorming}}}
    derived: {type: {kind: value, schema: {type: integer}}}
  outputBindings:
    model: {fromStep: {stepRef: design, output: model}}
    derived: {fromStep: {stepRef: derive, output: derived}}
  phases:
    - id: big-picture
      uses: {kind: ReviewLoop, name: storm-big-picture}
      memo: {when: "outputs.passed"}   # a run started again reuses a phase that passed (11-workflow.md)
      inputs: {prd: {fromInput: prd}, rules: {fromInput: rules, onMissing: omit}, inventory: {fromInput: inventory, onMissing: omit}, base: {fromInput: base, onMissing: omit}}
      timeout: 240h
    - id: process
      uses: {kind: ReviewLoop, name: storm-process}
      memo: {when: "outputs.passed"}   # a run started again reuses a phase that passed (11-workflow.md)
      inputs:
        prd: {fromInput: prd}
        rules: {fromInput: rules, onMissing: omit}
        inventory: {fromInput: inventory, onMissing: omit}
        base: {fromStep: {stepRef: big-picture, output: model}}
      timeout: 240h
    - id: design
      uses: {kind: ReviewLoop, name: storm-design}
      memo: {when: "outputs.passed"}   # a run started again reuses a phase that passed (11-workflow.md)
      inputs:
        prd: {fromInput: prd}
        rules: {fromInput: rules, onMissing: omit}
        inventory: {fromInput: inventory, onMissing: omit}
        base: {fromStep: {stepRef: process, output: model}}
      timeout: 240h
    - id: derive
      uses: {kind: Workflow, name: derive-all}
      memo: {}   # a run started again reuses a derivation that succeeded
      inputs:
        model: {fromStep: {stepRef: design, output: model}}
        prd: {fromInput: prd}
        rules: {fromInput: rules, onMissing: omit}
        contexts: {fromStep: {stepRef: design, output: contexts}}
      timeout: 12h
  timeout: 800h
---
# One round's Spec (23-pack-sdlc.md): the writer drafts; a draft with open questions goes to the owner, decide-spec,
# and the writer records the decisions in the same round; a draft with none goes straight to the Gate.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: spec-draft}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    capabilityId: {type: {kind: value, schema: {type: string, pattern: "^CAP-[0-9]+$"}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    context: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}, required: false}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false}
  outputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
  outputBindings:
    spec: {first: [{fromStep: {stepRef: fix, output: spec}}, {fromStep: {stepRef: record, output: spec}}, {fromStep: {stepRef: write, output: spec}}]}   # whichever path ran
  entry: [write]
  steps:
    - id: write
      uses: {kind: Task, name: write-spec}
      inputs:
        prd: {fromInput: prd}
        capabilityId: {fromInput: capabilityId}
        architecture: {fromInput: architecture}
        domainModel: {fromInput: domainModel}
        glossary: {fromInput: glossary}
        rules: {fromInput: rules}
        context: {fromInput: context}
        previous: {fromInput: previous, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
        base: {fromInput: base, onMissing: omit}
        changes: {fromInput: changes, onMissing: omit}
      timeout: 30m
    - id: decide
      uses: {kind: Task, name: decide-spec}
      inputs:
        draft: {fromStep: {stepRef: write, output: spec}}
        open: {fromStep: {stepRef: write, output: open}}
        prd: {fromInput: prd}
        rules: {fromInput: rules}
        glossary: {fromInput: glossary}
      timeout: 72h
    - id: record
      uses: {kind: Task, name: write-spec}
      inputs:
        prd: {fromInput: prd}
        capabilityId: {fromInput: capabilityId}
        architecture: {fromInput: architecture}
        domainModel: {fromInput: domainModel}
        glossary: {fromInput: glossary}
        rules: {fromInput: rules}
        context: {fromInput: context}
        previous: {fromStep: {stepRef: write, output: spec}}
        decisions: {fromStep: {stepRef: decide, output: decisions}}
      timeout: 30m
    - id: check
      uses: {kind: Gate, name: spec-check}
      inputs:
        previous: {fromInput: previous, onMissing: omit}
        spec: {first: [{fromStep: {stepRef: record, output: spec}}, {fromStep: {stepRef: write, output: spec}}]}
        prd: {fromInput: prd}
        domainModel: {fromInput: domainModel}
        architecture: {fromInput: architecture}
        rules: {fromInput: rules}
        context: {fromInput: context, onMissing: omit}
        capabilityId: {fromInput: capabilityId, onMissing: omit}
        base: {fromInput: base, onMissing: omit}
      timeout: 5m
    - id: fix
      uses: {kind: Task, name: write-spec}
      inputs:
        prd: {fromInput: prd}
        capabilityId: {fromInput: capabilityId}
        architecture: {fromInput: architecture}
        domainModel: {fromInput: domainModel}
        glossary: {fromInput: glossary}
        rules: {fromInput: rules}
        context: {fromInput: context}
        previous: {first: [{fromStep: {stepRef: record, output: spec}}, {fromStep: {stepRef: write, output: spec}}]}
        feedback: {fromStep: {stepRef: check, output: result}}
        base: {fromInput: base, onMissing: omit}
        changes: {fromInput: changes, onMissing: omit}
      timeout: 30m
  transitions:
    - id: after-write
      from: [{stepRef: write, outcomes: [Succeeded]}]
      to: [{stepRef: decide, when: "steps.write.outputs.open.size() > 0"}, {stepRef: check}]
      dispatch: first
    - id: after-decide
      from: [{stepRef: decide, outcomes: [Succeeded]}]
      to: [{stepRef: record}]
    - id: after-record
      from: [{stepRef: record, outcomes: [Succeeded]}]
      to: [{stepRef: check}]
    - id: after-check   # the last draft written is checked; one the check refuses goes back to the writer once, with the findings, so the Gate never spends a round on it
      from: [{stepRef: check, outcomes: [Succeeded]}]
      to: [{stepRef: fix, when: "!steps.check.outputs.result.passed"}, {terminal: Succeeded}]
      dispatch: first
    - id: after-fix
      from: [{stepRef: fix, outcomes: [Succeeded]}]
      to: [{terminal: Succeeded}]
  timeout: 73h
---
# The Spec process (27-spec-process.md): one ReviewLoop per capability, repeated over the ids the caller lists.
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: spec-one}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    capabilityId: {type: {kind: value, schema: {type: string, pattern: "^CAP-[0-9]+$"}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    context: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}, description: "the BoundedContext that lists the capabilities; its DomainModel and Glossary are the ones bound"}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}, required: false, description: "the Spec this run revises; bound with changes"}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false, description: "the downstream answers this revision applies, each <artifact id> Q-n: <resolution>"}
  produce:
    uses: {kind: Workflow, name: spec-draft}
    inputs:
      prd: {fromInput: prd}
      capabilityId: {fromInput: capabilityId}
      architecture: {fromInput: architecture}
      domainModel: {fromInput: domainModel}
      glossary: {fromInput: glossary}
      rules: {fromInput: rules}
      context: {fromInput: context}
      base: {fromInput: base}
      changes: {fromInput: changes}
    timeout: 73h   # the owner may be a human (23-pack-sdlc.md decide step)
  review:
    uses: {kind: Gate, name: spec-gate}
    inputs:
      spec: {fromStep: {stepRef: produce, output: spec}}
      capabilityId: {fromInput: capabilityId}
      prd: {fromInput: prd}
      domainModel: {fromInput: domainModel}
      architecture: {fromInput: architecture}
      rules: {fromInput: rules}
      context: {fromInput: context}
      glossary: {fromInput: glossary}
      base: {fromInput: base, onMissing: omit}
      previous: {fromInput: previous}
      feedback: {fromInput: feedback}
    timeout: 35m
  subject: spec
  previous: previous
  feedback: feedback
  maxRounds: 2
  timeout: 240h   # the owner at the decide step may be a human (23-pack-sdlc.md)
---
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: spec-all}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    capabilities: {type: {kind: value, schema: {type: array, minItems: 1, maxItems: 40, items: {type: object, required: [id, context], additionalProperties: false, properties: {id: {type: string, pattern: "^CAP-[0-9]+$"}, context: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40, description: "the bounded context that lists the capability: its BoundedContext, <context>-model and <context>-glossary are bound (26-domain-discovery.md)"}}}}}, description: "one entry per capability, with its bounded context, so one run covers every context"}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
  outputs:
    written: {type: {kind: value, schema: {type: integer}}}
  outputBindings:
    written: {expression: "steps.each.iterations"}
  entry: [each]
  steps:
    - id: each
      uses: {kind: ReviewLoop, name: spec-one}
      inputs:
        prd: {fromInput: prd}
        capabilityId: {expression: "state.cap.id"}
        architecture: {fromInput: architecture}
        domainModel: {fromArtifact: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}, id: "state.cap.context + '-model'"}}   # the context's, as derive-domain names them
        glossary: {fromArtifact: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}, id: "state.cap.context + '-glossary'"}}
        rules: {fromInput: rules}
        context: {fromArtifact: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}, id: "state.cap.context"}}
      timeout: 9600h   # a ceiling for the whole repeat: forty loops at a loop's full 240h (a repeat timeout bounds the whole loop, 11-workflow.md)
      memo: {when: "outputs.passed"}   # unchanged inputs, a passed loop: done already (11-workflow.md)
      repeat:
        state:
          index: {type: {kind: value, schema: {type: integer, minimum: 1}}}
          cap: {type: {kind: value, schema: {type: object, required: [id, context], additionalProperties: false, properties: {id: {type: string, pattern: "^CAP-[0-9]+$"}, context: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40, description: "the bounded context that lists the capability: its BoundedContext, <context>-model and <context>-glossary are bound (26-domain-discovery.md)"}}}}}
        initial:
          index: {literal: 1}
          cap: {expression: "inputs.capabilities[0]"}
        next:
          index: {expression: "state.index + 1"}
          cap: {expression: "inputs.capabilities[state.index]"}
        until: "iteration.index >= inputs.capabilities.size()"
        maxIterations: 40
        parallel: 4   # the loops are independent; one rejected does not stop the others (11-workflow.md)
  transitions:
    - id: done
      from: [{stepRef: each, outcomes: [Succeeded, Failed]}]
      to:
        - {terminal: Succeeded, when: 'steps.each.phase == "Succeeded" && steps.each.results.all(r, r.passed)'}
        - {terminal: Failed, reason: spec_inconsistent, when: 'steps.each.phase == "Succeeded"'} # a Gate rejected some loop's last round; steps.each.results says which
        - {terminal: Failed, reason: step_failed} # the iteration died before its Gate ran; steps.each.error names the cause
      dispatch: first
  timeout: 9614h
---
# One round's Prd and rules (23-pack-sdlc.md): the writer drafts; a draft with open questions goes to the owner, decide-prd, and
# the writer records the decisions in the same round, the rules kept as the loop keeps them; a draft with none goes to the Gate.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: prd-draft}
spec:
  inputs:
    brief: {type: {kind: value, schema: {type: string, minLength: 1}}}
    productId: {type: {kind: value, schema: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 20}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, required: false}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}, required: false}
    previousRules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}, required: false}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false}
  outputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
  outputBindings:
    prd: {first: [{fromStep: {stepRef: record, output: prd}}, {fromStep: {stepRef: write, output: prd}}]}   # whichever path ran
    rules: {first: [{fromStep: {stepRef: record, output: rules}}, {fromStep: {stepRef: write, output: rules}}]}
  entry: [write]
  steps:
    - id: write
      uses: {kind: Task, name: draft-prd}
      inputs:
        brief: {fromInput: brief}
        productId: {fromInput: productId}
        rules: {fromInput: rules, onMissing: omit}
        glossary: {fromInput: glossary, onMissing: omit}
        previous: {fromInput: previous, onMissing: omit}
        previousRules: {fromInput: previousRules, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
        base: {fromInput: base, onMissing: omit}
        changes: {fromInput: changes, onMissing: omit}
      timeout: 30m
    - id: decide
      uses: {kind: Task, name: decide-prd}
      inputs:
        draft: {fromStep: {stepRef: write, output: prd}}
        open: {fromStep: {stepRef: write, output: open}}
        glossary: {fromInput: glossary, onMissing: omit}
        rules: {fromStep: {stepRef: write, output: rules}}
        brief: {fromInput: brief}
      timeout: 72h
    - id: record
      uses: {kind: Task, name: draft-prd}
      inputs:
        brief: {fromInput: brief}
        productId: {fromInput: productId}
        glossary: {fromInput: glossary, onMissing: omit}
        previous: {fromStep: {stepRef: write, output: prd}}
        previousRules: {fromStep: {stepRef: write, output: rules}}
        decisions: {fromStep: {stepRef: decide, output: decisions}}
      timeout: 30m
  transitions:
    - id: after-write
      from: [{stepRef: write, outcomes: [Succeeded]}]
      to: [{stepRef: decide, when: "steps.write.outputs.open.size() > 0"}, {terminal: Succeeded}]
      dispatch: first
    - id: after-decide
      from: [{stepRef: decide, outcomes: [Succeeded]}]
      to: [{stepRef: record}]
    - id: after-record
      from: [{stepRef: record, outcomes: [Succeeded]}]
      to: [{terminal: Succeeded}]
  timeout: 73h
---
# The Prd process (28-prd-process.md): write, check, confirm at the terminal, up to three rounds.
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: author-prd}
spec:
  inputs:
    brief: {type: {kind: value, schema: {type: string, minLength: 1}}}
    productId: {type: {kind: value, schema: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 20}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}, required: false}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, required: false}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}, required: false, description: "the Prd as it stands, when this run applies downstream answers; rules is then its BusinessRules (38-autopilot.md)"}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false, description: "the downstream answers this run applies to base and rules"}
  produce:
    uses: {kind: Workflow, name: prd-draft}
    inputs:
      brief: {fromInput: brief}
      productId: {fromInput: productId}
      rules: {fromInput: rules}
      glossary: {fromInput: glossary}
      base: {fromInput: base}
      changes: {fromInput: changes}
    timeout: 73h   # the owner may be a human (23-pack-sdlc.md decide step)
  review:
    uses: {kind: Gate, name: prd-gate}
    inputs:
      prd: {fromStep: {stepRef: produce, output: prd}}
      rules: {fromStep: {stepRef: produce, output: rules}}
      previousRules: {fromInput: previousRules} # the last round's rules, so the gate refuses a rule changed unasked; absent in round one
      feedback: {fromInput: feedback}
      previous: {fromInput: previous}
      base: {fromInput: base}
    timeout: 72h
  subject: prd
  previous: previous
  feedback: feedback
  carry: {rules: previousRules} # the rules come back beside the Prd: round two revises them instead of rewriting them from the Prd
  maxRounds: 4   # a Prd from a brief alone settles the most questions, and each answer can move a rule (28-prd-process.md)
  timeout: 240h
---
# One round's Design (23-pack-sdlc.md): the writer drafts; a draft with open questions goes to the owner, decide-design,
# and the writer records the decisions in the same round; a draft with none goes straight to the Gate.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: design-draft}
spec:
  inputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    blockId: {type: {kind: value, schema: {type: string, pattern: "^BB-[0-9]+$"}}}
    type: {type: {kind: value, schema: {type: string, enum: [http-api, async-api, data-schema, ui]}}}
    interface: {type: {kind: value, schema: {type: string}}, required: false, description: "which provided interface; empty or unbound: the one provided interface the type describes"}
    qualifier: {type: {kind: value, schema: {type: string, pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$", maxLength: 7}}, required: false, description: "empty or unbound: none; else tells two Designs of one block and type apart in the id (a block with two APIs, or realising two contexts): the interface or the context, as a label (29-design-process.md)"}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}, required: {expression: "inputs.type != 'ui'"}, description: "what the elements realise; a ui Design realises operations of `designs` instead"}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, required: {expression: "inputs.type != 'ui'"}, description: "the names the document uses; not for a ui Design"}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false, description: "the Adrs the Architecture applies, so the writer names in `decisions` the ones that concern the block"}
    specs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}, required: false, description: "the Specs of the capabilities the block serves: read by the writer and the auditor, never cited"}
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}, required: {expression: "inputs.type == 'ui'"}, description: "for a ui Design: the product's DesignSystem (32-ui-design-process.md)"}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: {expression: "inputs.type == 'ui'"}, description: "for a ui Design: the http-api Designs of the interfaces the block requires; its elements realise their operations"}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: false, description: "the Design this run revises"}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false, description: "the downstream answers this run applies to base"}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    design: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
  outputBindings:
    design: {first: [{fromStep: {stepRef: fix, output: design}}, {fromStep: {stepRef: record, output: design}}, {fromStep: {stepRef: write, output: design}}]}   # whichever path ran
  entry: [write]
  steps:
    - id: write
      uses: {kind: Task, name: design-asset}
      inputs:
        architecture: {fromInput: architecture}
        blockId: {fromInput: blockId}
        type: {fromInput: type}
        interface: {fromInput: interface, onMissing: omit}
        qualifier: {fromInput: qualifier, onMissing: omit}
        domainModel: {fromInput: domainModel, onMissing: omit}
        glossary: {fromInput: glossary, onMissing: omit}
        rules: {fromInput: rules}
        adrs: {fromInput: adrs, onMissing: omit}
        specs: {fromInput: specs, onMissing: omit}
        designSystem: {fromInput: designSystem, onMissing: omit}
        designs: {fromInput: designs, onMissing: omit}
        base: {fromInput: base, onMissing: omit}
        changes: {fromInput: changes, onMissing: omit}
        previous: {fromInput: previous, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
      timeout: 30m
    - id: decide
      uses: {kind: Task, name: decide-design}
      inputs:
        draft: {fromStep: {stepRef: write, output: design}}
        open: {fromStep: {stepRef: write, output: open}}
        domainModel: {fromInput: domainModel, onMissing: omit}
        glossary: {fromInput: glossary, onMissing: omit}
        designs: {fromInput: designs, onMissing: omit}
        architecture: {fromInput: architecture}
        rules: {fromInput: rules}
      timeout: 72h
    - id: record
      uses: {kind: Task, name: design-asset}
      inputs:
        architecture: {fromInput: architecture}
        blockId: {fromInput: blockId}
        type: {fromInput: type}
        interface: {fromInput: interface, onMissing: omit}
        qualifier: {fromInput: qualifier, onMissing: omit}
        domainModel: {fromInput: domainModel, onMissing: omit}
        glossary: {fromInput: glossary, onMissing: omit}
        rules: {fromInput: rules}
        adrs: {fromInput: adrs, onMissing: omit}
        specs: {fromInput: specs, onMissing: omit}
        designSystem: {fromInput: designSystem, onMissing: omit}
        designs: {fromInput: designs, onMissing: omit}
        previous: {fromStep: {stepRef: write, output: design}}
        decisions: {fromStep: {stepRef: decide, output: decisions}}
      timeout: 30m
    - id: check
      uses: {kind: Gate, name: design-check}
      inputs:
        previous: {fromInput: previous, onMissing: omit}
        base: {fromInput: base, onMissing: omit}
        design: {first: [{fromStep: {stepRef: record, output: design}}, {fromStep: {stepRef: write, output: design}}]}
        architecture: {fromInput: architecture}
        domainModel: {fromInput: domainModel, onMissing: omit}
        glossary: {fromInput: glossary, onMissing: omit}
        rules: {fromInput: rules}
        designSystem: {fromInput: designSystem, onMissing: omit}
        designs: {fromInput: designs, onMissing: omit}
      timeout: 5m
    - id: fix
      uses: {kind: Task, name: design-asset}
      inputs:
        architecture: {fromInput: architecture}
        blockId: {fromInput: blockId}
        type: {fromInput: type}
        interface: {fromInput: interface, onMissing: omit}
        qualifier: {fromInput: qualifier, onMissing: omit}
        domainModel: {fromInput: domainModel, onMissing: omit}
        glossary: {fromInput: glossary, onMissing: omit}
        rules: {fromInput: rules}
        adrs: {fromInput: adrs, onMissing: omit}
        specs: {fromInput: specs, onMissing: omit}
        designSystem: {fromInput: designSystem, onMissing: omit}
        designs: {fromInput: designs, onMissing: omit}
        previous: {first: [{fromStep: {stepRef: record, output: design}}, {fromStep: {stepRef: write, output: design}}]}
        feedback: {fromStep: {stepRef: check, output: result}}
        base: {fromInput: base, onMissing: omit}
        changes: {fromInput: changes, onMissing: omit}
      timeout: 30m
  transitions:
    - id: after-write
      from: [{stepRef: write, outcomes: [Succeeded]}]
      to: [{stepRef: decide, when: "steps.write.outputs.open.size() > 0"}, {stepRef: check}]
      dispatch: first
    - id: after-decide
      from: [{stepRef: decide, outcomes: [Succeeded]}]
      to: [{stepRef: record}]
    - id: after-record
      from: [{stepRef: record, outcomes: [Succeeded]}]
      to: [{stepRef: check}]
    - id: after-check   # the last draft written is checked; one the check refuses goes back to the writer once, with the findings, so the Gate never spends a round on it
      from: [{stepRef: check, outcomes: [Succeeded]}]
      to: [{stepRef: fix, when: "!steps.check.outputs.result.passed"}, {terminal: Succeeded}]
      dispatch: first
    - id: after-fix
      from: [{stepRef: fix, outcomes: [Succeeded]}]
      to: [{terminal: Succeeded}]
  timeout: 73h
---
# The Design process (29-design-process.md): one ReviewLoop per block for one type, repeated over the blocks listed.
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: design-one}
spec:
  inputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    blockId: {type: {kind: value, schema: {type: string, pattern: "^BB-[0-9]+$"}}}
    type: {type: {kind: value, schema: {type: string, enum: [http-api, async-api, data-schema, ui]}}}
    interface: {type: {kind: value, schema: {type: string}}, required: false, description: "empty or unbound: the one provided interface the type describes"}
    qualifier: {type: {kind: value, schema: {type: string, pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$", maxLength: 7}}, required: false, description: "empty or unbound: none"}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}, required: {expression: "inputs.type != 'ui'"}}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, required: {expression: "inputs.type != 'ui'"}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false, description: "the Adrs the Architecture applies, so the writer names in `decisions` the ones that concern the block"}
    specs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}, required: false, description: "the Specs of the capabilities the block serves: read by the writer and the auditor, never cited"}
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}, required: {expression: "inputs.type == 'ui'"}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: {expression: "inputs.type == 'ui'"}}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: false, description: "the Design this run revises; bound with changes"}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false, description: "the downstream answers this revision applies, each <artifact id> Q-n: <resolution>"}
  produce:
    uses: {kind: Workflow, name: design-draft}
    inputs:
      architecture: {fromInput: architecture}
      blockId: {fromInput: blockId}
      type: {fromInput: type}
      interface: {fromInput: interface}
      qualifier: {fromInput: qualifier}
      domainModel: {fromInput: domainModel}
      glossary: {fromInput: glossary}
      rules: {fromInput: rules}
      adrs: {fromInput: adrs, onMissing: omit}
      specs: {fromInput: specs, onMissing: omit}
      designSystem: {fromInput: designSystem}
      designs: {fromInput: designs}
      base: {fromInput: base}
      changes: {fromInput: changes}
    timeout: 73h   # the owner may be a human (23-pack-sdlc.md decide step)
  review:
    uses: {kind: Gate, name: design-gate}
    inputs:
      design: {fromStep: {stepRef: produce, output: design}}
      architecture: {fromInput: architecture}
      domainModel: {fromInput: domainModel}
      glossary: {fromInput: glossary}
      rules: {fromInput: rules}
      designSystem: {fromInput: designSystem}
      designs: {fromInput: designs}
      specs: {fromInput: specs, onMissing: omit}
      previous: {fromInput: previous}
      feedback: {fromInput: feedback}
      base: {fromInput: base}
    timeout: 35m
  subject: design
  previous: previous
  feedback: feedback
  maxRounds: 2
  timeout: 240h   # the owner at the decide step may be a human (23-pack-sdlc.md)
---
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: design-all}
spec:
  inputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    blocks: {type: {kind: value, schema: {type: array, minItems: 1, maxItems: 40, items: {type: object, required: [block, type], additionalProperties: false, properties: {block: {type: string, pattern: "^BB-[0-9]+$"}, type: {type: string, enum: [http-api, async-api, data-schema, ui]}, interface: {type: string, minLength: 1, description: "which provided interface, for a block with several"}, qualifier: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 7, description: "a label in the Design id when a block gets two Designs of one type; short: the id <architecture>-<block>-<qualifier>-<type> is at most 63 characters"}, context: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40, description: "the bounded context whose DomainModel and Glossary the Design realises, <context>-model and <context>-glossary; every type but ui"}}}}}, description: "one entry per Design: the block, the type, its interface and qualifier when it has several of one type, and its context for every type but ui"}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false, description: "the Adrs the Architecture applies, so the writer names in `decisions` the ones that concern the block"}
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}, required: {expression: "inputs.blocks.exists(b, b.type == 'ui')"}, description: "with a ui entry"}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: {expression: "inputs.blocks.exists(b, b.type == 'ui')"}, description: "with a ui entry: the http-api Designs its screens call"}
  outputs:
    written: {type: {kind: value, schema: {type: integer}}}
  outputBindings:
    written: {expression: "steps.each.iterations"}
  entry: [each]
  steps:
    - id: each
      uses: {kind: ReviewLoop, name: design-one}
      inputs:
        architecture: {fromInput: architecture}
        blockId: {expression: "state.block.block"}
        type: {expression: "state.block.type"}
        interface: {expression: "has(state.block.interface) ? state.block.interface : ''"}   # empty: the one provided interface the type describes (design-asset)
        qualifier: {expression: "has(state.block.qualifier) ? state.block.qualifier : ''"}
        domainModel: {fromArtifact: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}, id: "has(state.block.context) ? state.block.context + '-model' : ''"}, onMissing: omit}   # the context's, as derive-domain names it (26-domain-discovery.md)
        glossary: {fromArtifact: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}, id: "has(state.block.context) ? state.block.context + '-glossary' : ''"}, onMissing: omit}
        rules: {fromInput: rules}
        adrs: {fromInput: adrs, onMissing: omit}
        specs: {fromQuery: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}, where: "has(state.block.context) && has(content.domainModel) && content.domainModel == state.block.context + '-model'"}}   # the Specs of the context the block realises: every Then they observe on the block must have an element (29-design-process.md)
        designSystem: {fromInput: designSystem, onMissing: omit}
        designs: {fromInput: designs, onMissing: omit}
      timeout: 9600h   # a ceiling for the whole repeat: forty loops at a loop's full 240h (a repeat timeout bounds the whole loop, 11-workflow.md)
      memo: {when: "outputs.passed"}   # unchanged inputs, a passed loop: done already (11-workflow.md)
      repeat:
        state:
          index: {type: {kind: value, schema: {type: integer, minimum: 1}}}
          block: {type: {kind: value, schema: {type: object, required: [block, type], additionalProperties: false, properties: {block: {type: string, pattern: "^BB-[0-9]+$"}, type: {type: string, enum: [http-api, async-api, data-schema, ui]}, interface: {type: string, minLength: 1, description: "which provided interface, for a block with several"}, qualifier: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 7, description: "a label in the Design id when a block gets two Designs of one type; short: the id <architecture>-<block>-<qualifier>-<type> is at most 63 characters"}, context: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40, description: "the bounded context whose DomainModel and Glossary the Design realises, <context>-model and <context>-glossary; every type but ui"}}}}}
        initial:
          index: {literal: 1}
          block: {expression: "inputs.blocks[0]"}
        next:
          index: {expression: "state.index + 1"}
          block: {expression: "inputs.blocks[state.index]"}
        until: "iteration.index >= inputs.blocks.size()"
        maxIterations: 40
        parallel: 4   # the loops are independent; one rejected does not stop the others (11-workflow.md)
  transitions:
    - id: done
      from: [{stepRef: each, outcomes: [Succeeded, Failed]}]
      to:
        - {terminal: Succeeded, when: 'steps.each.phase == "Succeeded" && steps.each.results.all(r, r.passed)'}
        - {terminal: Failed, reason: design_inconsistent, when: 'steps.each.phase == "Succeeded"'} # a Gate rejected some loop's last round; steps.each.results says which
        - {terminal: Failed, reason: step_failed} # the iteration died before its Gate ran; steps.each.error names the cause
      dispatch: first
  timeout: 9614h
---
# The coverage report (29-design-process.md): one Gate, no Task. `persimmon run design-coverage --input domainModel=<ref>
# --follow`, once per DomainModel; the step queries the Designs naming the model (10-ports.md `fromQuery`), and the tree
# shows every `unrealised` name as a warning on a pass, an internal one as an info. No Design yet: an empty list, everything unrealised.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: design-coverage}
spec:
  inputs:
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
  outputs:
    passed: {type: {kind: value, schema: {type: boolean}}}
  outputBindings:
    passed: {expression: "steps.coverage.outputs.result.passed"}
  entry: [coverage]
  steps:
    - id: coverage
      uses: {kind: Gate, name: coverage-gate}
      inputs:
        domainModel: {fromInput: domainModel}
        designs: {fromQuery: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}, where: "has(content.domainModel) && content.domainModel == inputs.domainModel.id"}}
      timeout: 5m
  transitions:
    - id: done
      from: [{stepRef: coverage, outcomes: [Succeeded, Failed]}]
      to:
        - {terminal: Succeeded, when: 'steps.coverage.phase == "Succeeded"'}
        - {terminal: Failed, reason: gate_error}
      dispatch: first
  timeout: 1h
---
# Every level-1 block of an Architecture that provides an interface has a Design (29-design-process.md): a report before
# plan-all, so a block left out of design-all's blocks is named here and not by a Plan's open question.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: block-coverage}
spec:
  inputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
  outputs:
    passed: {type: {kind: value, schema: {type: boolean}}}
  outputBindings:
    passed: {expression: "steps.coverage.outputs.result.passed"}
  entry: [coverage]
  steps:
    - id: coverage
      uses: {kind: Gate, name: block-gate}
      inputs:
        architecture: {fromInput: architecture}
        designs: {fromQuery: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}, where: "has(content.architecture) && content.architecture == inputs.architecture.id"}}
      timeout: 5m
  transitions:
    - id: done
      from: [{stepRef: coverage, outcomes: [Succeeded, Failed]}]
      to:
        - {terminal: Succeeded, when: 'steps.coverage.phase == "Succeeded"'}
        - {terminal: Failed, reason: gate_error}
      dispatch: first
  timeout: 1h
---
# One stored Design through design-gate again (29-design-process.md): after the Glossary or the rules moved on (`get Design
# --behind` says which), or a hand-edited Design. `persimmon run design-check --input design=<ref> --input architecture=<ref>
# --input rules=<ref> --input domainModel=<ref> --input glossary=<ref> --follow`; a ui Design binds designSystem=<ref> and
# designs=kind:Design instead of domainModel and glossary. Output `passed`; the tree lists every finding.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: design-check}
spec:
  inputs:
    design: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}, required: false, description: "every type but ui"}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}, required: false, description: "every type but ui; unbound, the field names go unchecked"}
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}, required: false, description: "a ui Design"}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: false, description: "a ui Design: kind:Design at run"}
  outputs:
    passed: {type: {kind: value, schema: {type: boolean}}}
  outputBindings:
    passed: {expression: "steps.check.outputs.result.passed"}
  entry: [check]
  steps:
    - id: check
      uses: {kind: Gate, name: design-gate}
      inputs:
        design: {fromInput: design}
        architecture: {fromInput: architecture}
        rules: {fromInput: rules}
        domainModel: {fromInput: domainModel, onMissing: omit}
        glossary: {fromInput: glossary, onMissing: omit}
        designSystem: {fromInput: designSystem, onMissing: omit}
        designs: {fromInput: designs, onMissing: omit}
      timeout: 35m
  transitions:
    - id: done
      from: [{stepRef: check, outcomes: [Succeeded, Failed]}]
      to:
        - {terminal: Succeeded, when: 'steps.check.phase == "Succeeded"'}
        - {terminal: Failed, reason: gate_error}
      dispatch: first
  timeout: 1h
---
# One round's Plan (23-pack-sdlc.md): the writer drafts; a draft with open questions goes to the owner, decide-plan,
# and the writer records the decisions in the same round; a draft with none goes straight to the Gate.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: plan-draft}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, description: "every Design of the blocks the Spec touches"}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}, required: false, description: "which aggregate handles each of the Spec's commands"}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}, required: false, description: "the Spec's Plan before this run: start from it and keep its task ids"}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false, description: "the downstream answers this run applies to base"}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
  outputBindings:
    plan: {first: [{fromStep: {stepRef: fix, output: plan}}, {fromStep: {stepRef: record, output: plan}}, {fromStep: {stepRef: write, output: plan}}]}   # whichever path ran
  entry: [write]
  steps:
    - id: write
      uses: {kind: Task, name: write-plan}
      inputs:
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
        designs: {fromInput: designs}
        domainModel: {fromInput: domainModel, onMissing: omit}
        base: {fromInput: base, onMissing: omit}
        changes: {fromInput: changes, onMissing: omit}
        previous: {fromInput: previous, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
      timeout: 30m
    - id: decide
      uses: {kind: Task, name: decide-plan}
      inputs:
        draft: {fromStep: {stepRef: write, output: plan}}
        open: {fromStep: {stepRef: write, output: open}}
        designs: {fromInput: designs, onMissing: omit}
        domainModel: {fromInput: domainModel, onMissing: omit}
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
      timeout: 72h
    - id: record
      uses: {kind: Task, name: write-plan}
      inputs:
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
        designs: {fromInput: designs}
        domainModel: {fromInput: domainModel, onMissing: omit}
        previous: {fromStep: {stepRef: write, output: plan}}
        decisions: {fromStep: {stepRef: decide, output: decisions}}
      timeout: 30m
    - id: check
      uses: {kind: Gate, name: plan-check}
      inputs:
        previous: {fromInput: previous, onMissing: omit}
        plan: {first: [{fromStep: {stepRef: record, output: plan}}, {fromStep: {stepRef: write, output: plan}}]}
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
        designs: {fromInput: designs}
        domainModel: {fromInput: domainModel, onMissing: omit}
        base: {fromInput: base, onMissing: omit}
      timeout: 5m
    - id: fix
      uses: {kind: Task, name: write-plan}
      inputs:
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
        designs: {fromInput: designs}
        domainModel: {fromInput: domainModel, onMissing: omit}
        previous: {first: [{fromStep: {stepRef: record, output: plan}}, {fromStep: {stepRef: write, output: plan}}]}
        feedback: {fromStep: {stepRef: check, output: result}}
        base: {fromInput: base, onMissing: omit}
        changes: {fromInput: changes, onMissing: omit}
      timeout: 30m
  transitions:
    - id: after-write
      from: [{stepRef: write, outcomes: [Succeeded]}]
      to: [{stepRef: decide, when: "steps.write.outputs.open.size() > 0"}, {stepRef: check}]
      dispatch: first
    - id: after-decide
      from: [{stepRef: decide, outcomes: [Succeeded]}]
      to: [{stepRef: record}]
    - id: after-record
      from: [{stepRef: record, outcomes: [Succeeded]}]
      to: [{stepRef: check}]
    - id: after-check   # the last draft written is checked; one the check refuses goes back to the writer once, with the findings, so the Gate never spends a round on it
      from: [{stepRef: check, outcomes: [Succeeded]}]
      to: [{stepRef: fix, when: "!steps.check.outputs.result.passed"}, {terminal: Succeeded}]
      dispatch: first
    - id: after-fix
      from: [{stepRef: fix, outcomes: [Succeeded]}]
      to: [{terminal: Succeeded}]
  timeout: 73h
---
# plan-one: the Plan of one Spec against the Designs the caller lists (30-plan-process.md). Run per Spec by ref:
#   persimmon run plan-one --input 'spec={kind: artifact, ref: {...}}' --input designs=@designs.yaml ...
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: plan-one}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
    domainModel: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}, required: false, description: "which aggregate handles each of the Spec's commands"}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}, required: false, description: "the Spec's Plan before this run, whose task ids the tasks keep"}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false, description: "the downstream answers this run applies to base, each <artifact id> Q-n: <resolution>"}
  produce:
    uses: {kind: Workflow, name: plan-draft}
    inputs:
      spec: {fromInput: spec}
      architecture: {fromInput: architecture}
      designs: {fromInput: designs}
      domainModel: {fromInput: domainModel, onMissing: omit}
      base: {fromInput: base, onMissing: omit}
      changes: {fromInput: changes, onMissing: omit}
    timeout: 73h   # the owner may be a human (23-pack-sdlc.md decide step)
  review:
    uses: {kind: Gate, name: plan-gate}
    inputs:
      plan: {fromStep: {stepRef: produce, output: plan}}
      spec: {fromInput: spec}
      architecture: {fromInput: architecture}
      designs: {fromInput: designs}
      domainModel: {fromInput: domainModel, onMissing: omit}
      base: {fromInput: base, onMissing: omit}
      previous: {fromInput: previous}
    timeout: 5m
  subject: plan
  previous: previous
  feedback: feedback
  maxRounds: 2
  timeout: 240h   # the owner at the decide step may be a human (23-pack-sdlc.md)
---
# plan-all: the Plan of every capability's Spec (30-plan-process.md). The Spec of CAP-n is bound by its chosen id,
# <prd>-cap-n, at its latest revision; the Designs are the product's, listed once by the caller.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: plan-all}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    capabilities: {type: {kind: value, schema: {type: array, minItems: 1, maxItems: 40, items: {type: object, required: [id, context], additionalProperties: false, properties: {id: {type: string, pattern: "^CAP-[0-9]+$"}, context: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40, description: "the bounded context that lists the capability: its BoundedContext, <context>-model and <context>-glossary are bound (26-domain-discovery.md)"}}}}}, description: "one entry per capability, with its bounded context, so one run covers every context"}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
  outputs:
    written: {type: {kind: value, schema: {type: integer}}}
  outputBindings:
    written: {expression: "steps.each.iterations"}
  entry: [each]
  steps:
    - id: each
      uses: {kind: ReviewLoop, name: plan-one}
      inputs:
        spec: {fromArtifact: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}, id: "inputs.prd.id + '-' + state.cap.id.lowerAscii()"}}
        architecture: {fromInput: architecture}
        designs: {fromInput: designs}
        domainModel: {fromArtifact: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}, id: "state.cap.context + '-model'"}, onMissing: omit}   # the context's, as derive-domain names it
        base: {fromArtifact: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}, id: "inputs.prd.id + '-' + state.cap.id.lowerAscii() + '-plan'"}, onMissing: omit}
      timeout: 9600h   # a ceiling for the whole repeat: forty loops at a loop's full 240h (a repeat timeout bounds the whole loop, 11-workflow.md)
      memo: {ignore: [base], when: "outputs.passed"}   # unchanged inputs, a passed loop: done already (11-workflow.md)
      repeat:
        state:
          index: {type: {kind: value, schema: {type: integer, minimum: 1}}}
          cap: {type: {kind: value, schema: {type: object, required: [id, context], additionalProperties: false, properties: {id: {type: string, pattern: "^CAP-[0-9]+$"}, context: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40, description: "the bounded context that lists the capability: its BoundedContext, <context>-model and <context>-glossary are bound (26-domain-discovery.md)"}}}}}
        initial:
          index: {literal: 1}
          cap: {expression: "inputs.capabilities[0]"}
        next:
          index: {expression: "state.index + 1"}
          cap: {expression: "inputs.capabilities[state.index]"}
        until: "iteration.index >= inputs.capabilities.size()"
        maxIterations: 40
        parallel: 4   # the loops are independent; one rejected does not stop the others (11-workflow.md)
  transitions:
    - id: done
      from: [{stepRef: each, outcomes: [Succeeded, Failed]}]
      to:
        - {terminal: Succeeded, when: 'steps.each.phase == "Succeeded" && steps.each.results.all(r, r.passed)'}
        - {terminal: Failed, reason: plan_inconsistent, when: 'steps.each.phase == "Succeeded"'} # a Gate rejected some loop's last round; steps.each.results says which
        - {terminal: Failed, reason: step_failed} # the iteration died before its Gate ran; steps.each.error names the cause
      dispatch: first
  timeout: 9614h
---
# The Architecture process (31-architecture-process.md): write the baseline and its Adrs, check, confirm at the terminal, up to three rounds.
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: architect}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    contexts: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BoundedContext}}}
    domainModels: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DomainModel}}}
    glossaries: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}, required: false, description: "the product's last Architecture, when a later Rewrite pack Slice extends it"}
    baseAdrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false, description: "the downstream answers this run applies to base"}
  produce:
    uses: {kind: Task, name: write-architecture}
    inputs:
      prd: {fromInput: prd}
      rules: {fromInput: rules}
      contexts: {fromInput: contexts}
      domainModels: {fromInput: domainModels}
      glossaries: {fromInput: glossaries}
      base: {fromInput: base}
      baseAdrs: {fromInput: baseAdrs}
      changes: {fromInput: changes}
    timeout: 30m
  review:
    uses: {kind: Gate, name: architecture-gate}
    inputs:
      architecture: {fromStep: {stepRef: produce, output: architecture}}
      adrs: {fromStep: {stepRef: produce, output: adrs}}
      prd: {fromInput: prd}
      rules: {fromInput: rules}
      contexts: {fromInput: contexts}
      domainModels: {fromInput: domainModels}
      glossaries: {fromInput: glossaries}
      previous: {fromInput: previous}
      previousAdrs: {fromInput: previousAdrs}
      base: {fromInput: base}
      baseAdrs: {fromInput: baseAdrs}
      feedback: {fromInput: feedback}
    timeout: 72h
  subject: architecture
  previous: previous
  feedback: feedback
  carry: {adrs: previousAdrs} # the Adrs come back beside the Architecture: round two revises them instead of regenerating them blind
  maxRounds: 3
  timeout: 240h
---
# One round's DesignSystem (23-pack-sdlc.md): the writer drafts; a draft with open questions goes to the owner,
# decide-design-system, and the writer records the decisions in the same round; a draft with none goes to the Gate.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: design-system-draft}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}, required: false}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false}
  outputs:
    designSystem: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}}
  outputBindings:
    designSystem: {first: [{fromStep: {stepRef: record, output: designSystem}}, {fromStep: {stepRef: write, output: designSystem}}]}   # whichever path ran
  entry: [write]
  steps:
    - id: write
      uses: {kind: Task, name: write-design-system}
      inputs:
        prd: {fromInput: prd}
        architecture: {fromInput: architecture}
        previous: {fromInput: previous, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
        base: {fromInput: base, onMissing: omit}
        changes: {fromInput: changes, onMissing: omit}
      timeout: 30m
    - id: decide
      uses: {kind: Task, name: decide-design-system}
      inputs:
        draft: {fromStep: {stepRef: write, output: designSystem}}
        open: {fromStep: {stepRef: write, output: open}}
        architecture: {fromInput: architecture, onMissing: omit}
        prd: {fromInput: prd}
      timeout: 72h
    - id: record
      uses: {kind: Task, name: write-design-system}
      inputs:
        prd: {fromInput: prd}
        architecture: {fromInput: architecture}
        previous: {fromStep: {stepRef: write, output: designSystem}}
        decisions: {fromStep: {stepRef: decide, output: decisions}}
      timeout: 30m
  transitions:
    - id: after-write
      from: [{stepRef: write, outcomes: [Succeeded]}]
      to: [{stepRef: decide, when: "steps.write.outputs.open.size() > 0"}, {terminal: Succeeded}]
      dispatch: first
    - id: after-decide
      from: [{stepRef: decide, outcomes: [Succeeded]}]
      to: [{stepRef: record}]
    - id: after-record
      from: [{stepRef: record, outcomes: [Succeeded]}]
      to: [{terminal: Succeeded}]
  timeout: 73h
---
# The UI design process (32-ui-design-process.md): the DesignSystem once per product, linted and confirmed by a human.
#   persimmon run design-system --input 'prd={kind: artifact, ref: {...}}' --input 'architecture={...}'
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: design-system}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: DesignSystem}}, required: false, description: "the DesignSystem as it stands, when this run applies downstream answers (38-autopilot.md)"}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false}
  produce:
    uses: {kind: Workflow, name: design-system-draft}
    inputs:
      prd: {fromInput: prd}
      architecture: {fromInput: architecture}
      base: {fromInput: base}
      changes: {fromInput: changes}
    timeout: 73h   # the owner may be a human (23-pack-sdlc.md decide step)
  review:
    uses: {kind: Gate, name: design-system-gate}
    inputs:
      designSystem: {fromStep: {stepRef: produce, output: designSystem}}
      feedback: {fromInput: feedback}
      base: {fromInput: base}
    timeout: 72h
  subject: designSystem
  previous: previous
  feedback: feedback
  maxRounds: 3
  timeout: 240h
---
# One build round (35-build-process.md): the builder builds the task, the project's tests run in the same repository, then
# the auditor reads the tests the record names. Under a TestDesign the Tester writes the task's api tests before the code and
# its e2e tests after it, and the round's cases decide what each level runs (39-test-process.md).
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: build-work}
spec:
  inputs:
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    taskId: {type: {kind: value, schema: {type: string, pattern: "^T-[0-9]+$"}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false, description: "the Adrs the Architecture applies"}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    repository: {type: {kind: externalResource, provider: git, type: repository}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}, required: false}
    previousOutcome: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
    baseline: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false}
    levelBaselines: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the other test levels before build-all (36-test-levels.md)"}
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the Spec's test cases: the Tester writes the api and e2e ones (39-test-process.md)"}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false, description: "the project's test tools (39-test-process.md)"}
  outputs:
    record: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}}}
    testOutcome: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}}
    levelOutcomes: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}}
    audit: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  outputBindings:
    record: {first: [{fromStep: {stepRef: record, output: record}}, {fromStep: {stepRef: implement, output: record}}]}   # whichever path ran
    testOutcome: {fromStep: {stepRef: tests, output: testOutcome}}
    levelOutcomes: {fromStep: {stepRef: levels, output: outcomes}}
    audit: {fromStep: {stepRef: audit, output: audit}}
  entry: [cases]
  steps:
    - id: cases # the task's cases and whether the Tester writes this round (39-test-process.md); none without a TestDesign
      uses: {kind: Task, name: select-cases}
      inputs:
        plan: {fromInput: plan}
        taskId: {fromInput: taskId}
        spec: {fromInput: spec}
        testDesign: {fromInput: testDesign, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
      timeout: 5m
    - id: write-api
      uses: {kind: Task, name: write-api-tests}
      inputs: &tester
        plan: {fromInput: plan}
        taskId: {fromInput: taskId}
        spec: {fromInput: spec}
        designs: {fromInput: designs}
        testDesign: {fromInput: testDesign}
        harness: {fromInput: harness}
        cases: {fromStep: {stepRef: cases, output: cases}}
        repository: {fromInput: repository}
        feedback: {fromInput: feedback, onMissing: omit}
      timeout: 72h
    - id: implement
      uses: {kind: Task, name: implement}
      inputs:
        plan: {fromInput: plan}
        taskId: {fromInput: taskId}
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
        adrs: {fromInput: adrs, onMissing: omit}
        designs: {fromInput: designs}
        glossary: {fromInput: glossary}
        rules: {fromInput: rules}
        repository: {fromInput: repository}
        previous: {fromInput: previous, onMissing: omit}
        previousOutcome: {fromInput: previousOutcome, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
        baseline: {fromInput: baseline, onMissing: omit}
        testDesign: {fromInput: testDesign, onMissing: omit}
        harness: {fromInput: harness, onMissing: omit}
        cases: {fromStep: {stepRef: cases, output: cases}}
        written: {fromStep: {stepRef: write-api, output: written}, onMissing: omit}
      timeout: 72h
    - id: decide # the owner decides the record's open questions inside the round (23-pack-sdlc.md)
      uses: {kind: Task, name: decide-build}
      inputs:
        draft: {fromStep: {stepRef: implement, output: record}}
        open: {fromStep: {stepRef: implement, output: open}}
        architecture: {fromInput: architecture, onMissing: omit}
        designs: {fromInput: designs, onMissing: omit}
        glossary: {fromInput: glossary, onMissing: omit}
        rules: {fromInput: rules, onMissing: omit}
        spec: {fromInput: spec}
        plan: {fromInput: plan}
      timeout: 72h
    - id: record # the builder records the decisions and builds what they imply
      uses: {kind: Task, name: implement}
      inputs:
        plan: {fromInput: plan}
        taskId: {fromInput: taskId}
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
        adrs: {fromInput: adrs, onMissing: omit}
        designs: {fromInput: designs}
        glossary: {fromInput: glossary}
        rules: {fromInput: rules}
        repository: {fromInput: repository}
        baseline: {fromInput: baseline, onMissing: omit}
        testDesign: {fromInput: testDesign, onMissing: omit}
        harness: {fromInput: harness, onMissing: omit}
        cases: {fromStep: {stepRef: cases, output: cases}}
        written: {fromStep: {stepRef: write-api, output: written}, onMissing: omit}
        previous: {fromStep: {stepRef: implement, output: record}}
        decisions: {fromStep: {stepRef: decide, output: decisions}}
      timeout: 72h
    - id: write-e2e
      uses: {kind: Task, name: write-e2e-tests}
      inputs: *tester
      timeout: 72h
    - id: tests
      uses: {kind: Task, name: run-tests}
      inputs:
        record: {first: [{fromStep: {stepRef: record, output: record}}, {fromStep: {stepRef: implement, output: record}}]}   # whichever path ran
        repository: {fromInput: repository}
        baseline: {fromInput: baseline, onMissing: omit}
        harness: {fromInput: harness, onMissing: omit}
        cases: {fromStep: {stepRef: cases, output: cases}}
      timeout: 2h
    - id: levels
      uses: {kind: Task, name: run-levels}
      inputs:
        plan: {fromInput: plan}
        repository: {fromInput: repository}
        record: {first: [{fromStep: {stepRef: record, output: record}}, {fromStep: {stepRef: implement, output: record}}]}   # whichever path ran
        testOutcome: {fromStep: {stepRef: tests, output: testOutcome}}
        baselines: {fromInput: levelBaselines, onMissing: omit}
        harness: {fromInput: harness, onMissing: omit}
        cases: {fromStep: {stepRef: cases, output: cases}}
      timeout: 4h
    - id: audit
      uses: {kind: Task, name: audit-acceptance}
      inputs:
        record: {first: [{fromStep: {stepRef: record, output: record}}, {fromStep: {stepRef: implement, output: record}}]}   # whichever path ran
        testOutcome: {fromStep: {stepRef: tests, output: testOutcome}}
        plan: {fromInput: plan}
        taskId: {fromInput: taskId}
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
        repository: {fromInput: repository}
        levelOutcomes: {fromStep: {stepRef: levels, output: outcomes}}
        testDesign: {fromInput: testDesign, onMissing: omit}
        cases: {fromStep: {stepRef: cases, output: cases}}
      timeout: 1h
  transitions:
    # the Tester's steps are passed by when the task has no case of their level, or a later round names none (39-test-process.md)
    - id: to-write-api
      from: [{stepRef: cases, outcomes: [Succeeded]}]
      to:
        - {stepRef: write-api, when: 'steps.cases.outputs.cases.write.api == true'}
        - {stepRef: implement}
      dispatch: first
    - id: to-implement
      from: [{stepRef: write-api, outcomes: [Succeeded]}]
      to: [{stepRef: implement}]
    - id: to-decide
      from: [{stepRef: implement, outcomes: [Succeeded]}]
      to:
        - {stepRef: decide, when: 'steps.implement.outputs.open.size() > 0'}   # open questions: the owner first (23-pack-sdlc.md)
        - {stepRef: write-e2e, when: 'steps.cases.outputs.cases.write.e2e == true'}
        - {stepRef: tests}
      dispatch: first
    - id: after-decide
      from: [{stepRef: decide, outcomes: [Succeeded]}]
      to: [{stepRef: record}]
    - id: to-write-e2e
      from: [{stepRef: record, outcomes: [Succeeded]}]
      to:
        - {stepRef: write-e2e, when: 'steps.cases.outputs.cases.write.e2e == true'}
        - {stepRef: tests}
      dispatch: first
    - id: to-tests
      from: [{stepRef: write-e2e, outcomes: [Succeeded]}]
      to: [{stepRef: tests}]
    - id: to-levels
      from: [{stepRef: tests, outcomes: [Succeeded]}]
      to: [{stepRef: levels}]
    - id: to-audit
      from: [{stepRef: levels, outcomes: [Succeeded]}]
      to: [{stepRef: audit}]
    - id: done
      from: [{stepRef: audit, outcomes: [Succeeded]}]
      to: [{terminal: Succeeded}]
  timeout: 80h
---
# One Plan task built and checked against its tests (35-build-process.md), up to three rounds; the findings go back to the builder.
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: build-one}
spec:
  inputs:
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    taskId: {type: {kind: value, schema: {type: string, pattern: "^T-[0-9]+$"}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false, description: "the Adrs the Architecture applies"}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    repository: {type: {kind: externalResource, provider: git, type: repository}}
    baseline: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the tests before build-all; run alone, the suite is green before it"}
    levelBaselines: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}, required: false, description: "the other test levels before build-all (36-test-levels.md)"}
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the Spec's test cases (39-test-process.md)"}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false, description: "the project's test tools (39-test-process.md)"}
  produce:
    uses: {kind: Workflow, name: build-work}
    inputs:
      plan: {fromInput: plan}
      taskId: {fromInput: taskId}
      spec: {fromInput: spec}
      architecture: {fromInput: architecture}
      adrs: {fromInput: adrs, onMissing: omit}
      designs: {fromInput: designs}
      glossary: {fromInput: glossary}
      rules: {fromInput: rules}
      repository: {fromInput: repository}
      baseline: {fromInput: baseline}
      levelBaselines: {fromInput: levelBaselines}
      testDesign: {fromInput: testDesign}
      harness: {fromInput: harness}
    timeout: 80h
  review:
    uses: {kind: Gate, name: build-gate}
    inputs:
      record: {fromStep: {stepRef: produce, output: record}}
      testOutcome: {fromStep: {stepRef: produce, output: testOutcome}}
      plan: {fromInput: plan}
      spec: {fromInput: spec}
      previous: {fromInput: previous}
      previousOutcome: {fromInput: previousOutcome}
      taskId: {fromInput: taskId}
      audit: {fromStep: {stepRef: produce, output: audit}}
      baseline: {fromInput: baseline}
      levelOutcomes: {fromStep: {stepRef: produce, output: levelOutcomes}}
      levelBaselines: {fromInput: levelBaselines}
      testDesign: {fromInput: testDesign}
    timeout: 5m
  subject: record
  previous: previous
  feedback: feedback
  carry: {testOutcome: previousOutcome} # the last round's tests come back beside its record: what failed, and which tests ran
  maxRounds: 3
  timeout: 240h
---
# build-all: the tests once as the baseline, then every listed Plan task in order (35-build-process.md); `tasks` in
# ascending T-n, which the Plan's own order is. After the last task, the plan tier: every test level in full against its
# baseline, a new red failing the run plan_regressed (36-test-levels.md). Under a TestDesign the TestReport follows, and a
# fail verdict fails the run the same way (39-test-process.md).
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: build-all}
spec:
  inputs:
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    tasks: {type: {kind: value, schema: {type: array, minItems: 1, maxItems: 20, items: {type: string, pattern: "^T-[0-9]+$"}}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false, description: "the Adrs the Architecture applies"}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    repository: {type: {kind: externalResource, provider: git, type: repository}}
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the Spec's test cases: the Tester writes the api and e2e ones, a TestReport follows (39-test-process.md)"}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false, description: "the project's test tools: every level runs as it names (39-test-process.md)"}
  outputs:
    built: {type: {kind: value, schema: {type: integer}}}
    passed: {type: {kind: value, schema: {type: boolean}}, description: "the regression Gate's verdict; a run that ends Succeeded passed"}
    report: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestReport}}, required: false, description: "the TestReport, under a TestDesign: put out beside passed, so get --passed and fromArtifact find it (08-store.md)"}
  outputBindings:
    built: {expression: "steps.each.iterations"}
    passed: {expression: "steps.plan.outputs.result.passed"}
    report: {fromStep: {stepRef: report, output: report}, onMissing: omit}
  entry: [baseline]
  steps:
    - id: baseline
      uses: {kind: Task, name: run-baseline}
      inputs:
        plan: {fromInput: plan}
        repository: {fromInput: repository}
        harness: {fromInput: harness, onMissing: omit}
      timeout: 2h
    - id: level-baselines
      uses: {kind: Task, name: run-levels}
      inputs:
        plan: {fromInput: plan}
        repository: {fromInput: repository}
        harness: {fromInput: harness, onMissing: omit}
      timeout: 4h
    - id: each
      uses: {kind: ReviewLoop, name: build-one}
      memo: {ignore: [baseline, levelBaselines, harness], when: "outputs.passed"}   # a passed build is done; the baselines are new TestOutcomes every run, and a harness revision alone rebuilds no passed task (the plan tier runs every level under it; a task whose TestDesign moved cases to a new level is rebuilt by that input): a run started again after a stop builds no task twice (11-workflow.md)
      inputs:
        plan: {fromInput: plan}
        taskId: {expression: "inputs.tasks[state.index - 1]"}
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
        adrs: {fromInput: adrs, onMissing: omit}
        designs: {fromInput: designs}
        glossary: {fromInput: glossary}
        rules: {fromInput: rules}
        repository: {fromInput: repository}
        baseline: {fromStep: {stepRef: baseline, output: baseline}}
        levelBaselines: {fromStep: {stepRef: level-baselines, output: outcomes}}
        testDesign: {fromInput: testDesign, onMissing: omit}
        harness: {fromInput: harness, onMissing: omit}
      timeout: 4800h   # a ceiling for the whole repeat, as spec-all's: twenty tasks at a loop's full 240h
      repeat:
        state:
          index: {type: {kind: value, schema: {type: integer, minimum: 1}}}
        initial:
          index: {literal: 1}
        next:
          index: {expression: "state.index + 1"}
        until: "!iteration.outputs.passed || iteration.index >= inputs.tasks.size()"
        maxIterations: 20
    - id: final # the plan tier (36-test-levels.md): every level in full once more, the backstop for what a round's selection missed
      uses: {kind: Task, name: run-final}
      inputs:
        plan: {fromInput: plan}
        repository: {fromInput: repository}
        baseline: {fromStep: {stepRef: baseline, output: baseline}}
        harness: {fromInput: harness, onMissing: omit}
        testDesign: {fromInput: testDesign, onMissing: omit}
      timeout: 2h
    - id: final-levels
      uses: {kind: Task, name: run-levels}
      inputs:
        plan: {fromInput: plan}
        repository: {fromInput: repository}
        baselines: {fromStep: {stepRef: level-baselines, output: outcomes}}
        harness: {fromInput: harness, onMissing: omit}
      timeout: 4h
    - id: evaluate # under a TestDesign: what the plan tier leaves unproven, in words, then the computed TestReport (39-test-process.md)
      uses: {kind: Task, name: evaluate-tests}
      inputs:
        testDesign: {fromInput: testDesign}
        plan: {fromInput: plan}
        final: {fromStep: {stepRef: final, output: final}}
        finals: {fromStep: {stepRef: final-levels, output: outcomes}}
        records: {fromQuery: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}, where: "content.plan == inputs.plan.id"}}
      timeout: 30m
    - id: report
      uses: {kind: Task, name: report-tests}
      inputs:
        plan: {fromInput: plan}
        tasks: {fromInput: tasks}
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
        testDesign: {fromInput: testDesign}
        final: {fromStep: {stepRef: final, output: final}}
        finals: {fromStep: {stepRef: final-levels, output: outcomes}}
        records: {fromQuery: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: AcceptanceRecord}, where: "content.plan == inputs.plan.id"}}
        evaluation: {fromStep: {stepRef: evaluate, output: evaluation}}
      timeout: 5m
    - id: plan
      uses: {kind: Gate, name: regression-gate}
      inputs:
        final: {fromStep: {stepRef: final, output: final}}
        baseline: {fromStep: {stepRef: baseline, output: baseline}}
        levelOutcomes: {fromStep: {stepRef: final-levels, output: outcomes}}
        levelBaselines: {fromStep: {stepRef: level-baselines, output: outcomes}}
        report: {fromStep: {stepRef: report, output: report}, onMissing: omit}
      timeout: 5m
  transitions:
    - id: to-level-baselines
      from: [{stepRef: baseline, outcomes: [Succeeded, Failed]}]
      to:
        - {stepRef: level-baselines, when: 'steps.baseline.phase == "Succeeded"'}
        - {terminal: Failed, reason: step_failed} # the test command could not run; steps.baseline.error names the cause
      dispatch: first
    - id: to-each
      from: [{stepRef: level-baselines, outcomes: [Succeeded, Failed]}]
      to:
        - {stepRef: each, when: 'steps["level-baselines"].phase == "Succeeded"'}
        - {terminal: Failed, reason: step_failed}
      dispatch: first
    - id: built
      from: [{stepRef: each, outcomes: [Succeeded, Failed]}]
      to:
        - {stepRef: final, when: 'steps.each.phase == "Succeeded" && steps.each.outputs.passed'}
        - {terminal: Failed, reason: build_inconsistent, when: 'steps.each.phase == "Succeeded"'} # the Gate rejected the last round
        - {terminal: Failed, reason: step_failed} # the iteration died before its Gate ran; steps.each.error names the cause
      dispatch: first
    - id: to-final-levels
      from: [{stepRef: final, outcomes: [Succeeded, Failed]}]
      to:
        - {stepRef: final-levels, when: 'steps.final.phase == "Succeeded"'}
        - {terminal: Failed, reason: step_failed}
      dispatch: first
    - id: to-plan
      from: [{stepRef: final-levels, outcomes: [Succeeded, Failed]}]
      to:
        - {stepRef: evaluate, when: 'steps["final-levels"].phase == "Succeeded" && has(inputs.testDesign)'}
        - {stepRef: plan, when: 'steps["final-levels"].phase == "Succeeded"'}
        - {terminal: Failed, reason: step_failed}
      dispatch: first
    - id: to-report
      from: [{stepRef: evaluate, outcomes: [Succeeded, Failed]}]
      to:
        - {stepRef: report, when: 'steps.evaluate.phase == "Succeeded"'}
        - {terminal: Failed, reason: step_failed}
      dispatch: first
    - id: reported
      from: [{stepRef: report, outcomes: [Succeeded, Failed]}]
      to:
        - {stepRef: plan, when: 'steps.report.phase == "Succeeded"'}
        - {terminal: Failed, reason: step_failed}
      dispatch: first
    - id: done
      from: [{stepRef: plan, outcomes: [Succeeded]}]
      to:
        - {terminal: Succeeded, when: 'steps.plan.outputs.result.passed'}
        - {terminal: Failed, reason: plan_regressed} # a red no task's round showed, or a fail verdict: investigated as an Issue (36-test-levels.md)
      dispatch: first
  timeout: 4814h
---
# The test setup once per product (39-test-process.md): the Tester sets up each level's tool and seed test, then each level
# runs once; harness-gate finds every seed test green.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: harness-work}
spec:
  inputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false}
    specs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}, required: false}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: false}
    repository: {type: {kind: externalResource, provider: git, type: repository}}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}}
    seed: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}}
    levelOutcomes: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestOutcome}}}
  outputBindings:
    harness: {first: [{fromStep: {stepRef: record, output: harness}}, {fromStep: {stepRef: write, output: harness}}]}   # whichever path ran
    seed: {fromStep: {stepRef: seed, output: seed}}
    levelOutcomes: {fromStep: {stepRef: seed-levels, output: outcomes}}
  entry: [write]
  steps:
    - id: write
      uses: {kind: Task, name: write-harness}
      inputs:
        architecture: {fromInput: architecture}
        adrs: {fromInput: adrs, onMissing: omit}
        specs: {fromInput: specs, onMissing: omit}
        designs: {fromInput: designs, onMissing: omit}
        repository: {fromInput: repository}
        base: {fromInput: base, onMissing: omit}
        changes: {fromInput: changes, onMissing: omit}
        previous: {fromInput: previous, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
      timeout: 72h
    - id: decide
      uses: {kind: Task, name: decide-harness}
      inputs:
        draft: {fromStep: {stepRef: write, output: harness}}
        open: {fromStep: {stepRef: write, output: open}}
        adrs: {fromInput: adrs, onMissing: omit}
        designs: {fromInput: designs, onMissing: omit}
        architecture: {fromInput: architecture}
      timeout: 72h
    - id: record
      uses: {kind: Task, name: write-harness}
      inputs:
        architecture: {fromInput: architecture}
        adrs: {fromInput: adrs, onMissing: omit}
        specs: {fromInput: specs, onMissing: omit}
        designs: {fromInput: designs, onMissing: omit}
        repository: {fromInput: repository}
        previous: {fromStep: {stepRef: write, output: harness}}
        decisions: {fromStep: {stepRef: decide, output: decisions}}
      timeout: 72h
    - id: seed
      uses: {kind: Task, name: run-seed}
      inputs:
        harness: {first: [{fromStep: {stepRef: record, output: harness}}, {fromStep: {stepRef: write, output: harness}}]}
        repository: {fromInput: repository}
      timeout: 2h
    - id: seed-levels
      uses: {kind: Task, name: run-seed-levels}
      inputs:
        harness: {first: [{fromStep: {stepRef: record, output: harness}}, {fromStep: {stepRef: write, output: harness}}]}
        repository: {fromInput: repository}
      timeout: 4h
  transitions:
    - id: after-write
      from: [{stepRef: write, outcomes: [Succeeded]}]
      to: [{stepRef: decide, when: "steps.write.outputs.open.size() > 0"}, {stepRef: seed}]   # open questions: the owner first (23-pack-sdlc.md)
      dispatch: first
    - id: after-decide
      from: [{stepRef: decide, outcomes: [Succeeded]}]
      to: [{stepRef: record}]
    - id: to-seed
      from: [{stepRef: record, outcomes: [Succeeded]}]
      to: [{stepRef: seed}]
    - id: to-seed-levels
      from: [{stepRef: seed, outcomes: [Succeeded]}]
      to: [{stepRef: seed-levels}]
    - id: done
      from: [{stepRef: seed-levels, outcomes: [Succeeded]}]
      to: [{terminal: Succeeded}]
  timeout: 80h
---
# setup-tests: the TestHarness of one product, up to three rounds (39-test-process.md).
#   persimmon run setup-tests --input 'architecture={kind: artifact, ref: {...}}' --input designs=@designs.yaml --input repository=.
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: setup-tests}
spec:
  inputs:
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    adrs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Adr}}, required: false, description: "the Adrs the Architecture applies"}
    specs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}, required: false, description: "the product's Specs: every Given of their scenarios is a state a level's conventions can set up"}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, required: false, description: "the product's Designs: which levels the project needs"}
    repository: {type: {kind: externalResource, provider: git, type: repository}}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}, required: false, description: "the harness before this run, set up again: its levels are kept"}
    changes: {type: {kind: value, schema: {type: array, minItems: 1, items: {type: string, minLength: 1}}}, required: false, description: "the downstream answers this run applies to base, each <artifact id> Q-n: <resolution>"}
  produce:
    uses: {kind: Workflow, name: harness-work}
    inputs:
      architecture: {fromInput: architecture}
      adrs: {fromInput: adrs}
      specs: {fromInput: specs, onMissing: omit}
      designs: {fromInput: designs}
      repository: {fromInput: repository}
      base: {fromInput: base, onMissing: omit}
      changes: {fromInput: changes, onMissing: omit}
    timeout: 80h
  review:
    uses: {kind: Gate, name: harness-gate}
    inputs:
      harness: {fromStep: {stepRef: produce, output: harness}}
      seed: {fromStep: {stepRef: produce, output: seed}}
      levelOutcomes: {fromStep: {stepRef: produce, output: levelOutcomes}}
      architecture: {fromInput: architecture}
      designs: {fromInput: designs, onMissing: omit}
      base: {fromInput: base, onMissing: omit}
      previous: {fromInput: previous}
      feedback: {fromInput: feedback}
    timeout: 72h
  subject: harness
  previous: previous
  feedback: feedback
  maxRounds: 3
  timeout: 240h
---
# One round's TestDesign (23-pack-sdlc.md): the writer drafts; a draft with open questions goes to the owner, decide-test-design,
# and the writer records the decisions in the same round; a draft with none goes straight to the Gate.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: test-design-draft}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}, description: "the Spec's Plan: the task each case is built in, and what the tasks before it build"}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the Spec's TestDesign before this run: start from it and keep its ids"}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}, description: "the product's Designs: the operations and screens a case's steps name"}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}}
    previous: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false}
    feedback: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    testDesign: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}}
  outputBindings:
    testDesign: {first: [{fromStep: {stepRef: fix, output: testDesign}}, {fromStep: {stepRef: record, output: testDesign}}, {fromStep: {stepRef: write, output: testDesign}}]}   # whichever path ran
  entry: [write]
  steps:
    - id: write
      uses: {kind: Task, name: design-tests}
      inputs:
        spec: {fromInput: spec}
        plan: {fromInput: plan}
        base: {fromInput: base, onMissing: omit}
        architecture: {fromInput: architecture}
        designs: {fromInput: designs}
        glossary: {fromInput: glossary}
        rules: {fromInput: rules}
        harness: {fromInput: harness}
        previous: {fromInput: previous, onMissing: omit}
        feedback: {fromInput: feedback, onMissing: omit}
      timeout: 30m
    - id: decide
      uses: {kind: Task, name: decide-test-design}
      inputs:
        draft: {fromStep: {stepRef: write, output: testDesign}}
        open: {fromStep: {stepRef: write, output: open}}
        architecture: {fromInput: architecture, onMissing: omit}
        designs: {fromInput: designs, onMissing: omit}
        rules: {fromInput: rules, onMissing: omit}
        spec: {fromInput: spec}
        plan: {fromInput: plan}
        harness: {fromInput: harness}
      timeout: 72h
    - id: record
      uses: {kind: Task, name: design-tests}
      inputs:
        spec: {fromInput: spec}
        plan: {fromInput: plan}
        architecture: {fromInput: architecture}
        designs: {fromInput: designs}
        glossary: {fromInput: glossary}
        rules: {fromInput: rules}
        harness: {fromInput: harness}
        previous: {fromStep: {stepRef: write, output: testDesign}}
        decisions: {fromStep: {stepRef: decide, output: decisions}}
      timeout: 30m
    - id: check
      uses: {kind: Gate, name: test-design-check}
      inputs:
        testDesign: {first: [{fromStep: {stepRef: record, output: testDesign}}, {fromStep: {stepRef: write, output: testDesign}}]}
        plan: {fromInput: plan}
        designs: {fromInput: designs}
        base: {fromInput: base, onMissing: omit}
        previous: {fromInput: previous, onMissing: omit}
        spec: {fromInput: spec}
        architecture: {fromInput: architecture}
        rules: {fromInput: rules}
        harness: {fromInput: harness}
      timeout: 5m
    - id: fix
      uses: {kind: Task, name: design-tests}
      inputs:
        spec: {fromInput: spec}
        plan: {fromInput: plan}
        architecture: {fromInput: architecture}
        designs: {fromInput: designs}
        glossary: {fromInput: glossary}
        rules: {fromInput: rules}
        harness: {fromInput: harness}
        previous: {first: [{fromStep: {stepRef: record, output: testDesign}}, {fromStep: {stepRef: write, output: testDesign}}]}
        feedback: {fromStep: {stepRef: check, output: result}}
        base: {fromInput: base, onMissing: omit}
      timeout: 30m
  transitions:
    - id: after-write
      from: [{stepRef: write, outcomes: [Succeeded]}]
      to: [{stepRef: decide, when: "steps.write.outputs.open.size() > 0"}, {stepRef: check}]
      dispatch: first
    - id: after-decide
      from: [{stepRef: decide, outcomes: [Succeeded]}]
      to: [{stepRef: record}]
    - id: after-record
      from: [{stepRef: record, outcomes: [Succeeded]}]
      to: [{stepRef: check}]
    - id: after-check   # the last draft written is checked; one the check refuses goes back to the writer once, with the findings, so the Gate never spends a round on it
      from: [{stepRef: check, outcomes: [Succeeded]}]
      to: [{stepRef: fix, when: "!steps.check.outputs.result.passed"}, {terminal: Succeeded}]
      dispatch: first
    - id: after-fix
      from: [{stepRef: fix, outcomes: [Succeeded]}]
      to: [{terminal: Succeeded}]
  timeout: 73h
---
# The test cases of one Spec (39-test-process.md): designed, checked, audited and confirmed by a human, up to three rounds.
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: test-design-one}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}}}
    plan: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}}}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
    glossary: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}}
    base: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}}, required: false, description: "the Spec's TestDesign before this run, whose ids the cases keep"}
  produce:
    uses: {kind: Workflow, name: test-design-draft}
    inputs:
      spec: {fromInput: spec}
      plan: {fromInput: plan}
      architecture: {fromInput: architecture}
      designs: {fromInput: designs}
      glossary: {fromInput: glossary}
      rules: {fromInput: rules}
      harness: {fromInput: harness}
      base: {fromInput: base, onMissing: omit}
    timeout: 73h   # the owner may be a human (23-pack-sdlc.md decide step)
  review:
    uses: {kind: Gate, name: test-design-gate}
    inputs:
      testDesign: {fromStep: {stepRef: produce, output: testDesign}}
      spec: {fromInput: spec}
      plan: {fromInput: plan}
      architecture: {fromInput: architecture}
      designs: {fromInput: designs}
      rules: {fromInput: rules}
      harness: {fromInput: harness}
      base: {fromInput: base, onMissing: omit}
      previous: {fromInput: previous}
      feedback: {fromInput: feedback}
    timeout: 72h
  subject: testDesign
  previous: previous
  feedback: feedback
  maxRounds: 3
  timeout: 240h
---
# test-design-all: the TestDesign of every capability's Spec (39-test-process.md), as plan-all; the Spec of CAP-n bound by its
# chosen id, <prd>-cap-n, at its latest revision.
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: test-design-all}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Prd}}}
    capabilities: {type: {kind: value, schema: {type: array, minItems: 1, maxItems: 40, items: {type: object, required: [id, context], additionalProperties: false, properties: {id: {type: string, pattern: "^CAP-[0-9]+$"}, context: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40, description: "the bounded context that lists the capability: its BoundedContext, <context>-model and <context>-glossary are bound (26-domain-discovery.md)"}}}}}, description: "one entry per capability, with its bounded context, so one run covers every context"}
    architecture: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Architecture}}}
    designs: {type: {kind: artifacts, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: Design}}}
    rules: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: BusinessRules}}}
    harness: {type: {kind: artifact, artifactKind: {apiVersion: sdd.persimmon.ai/v1, kind: TestHarness}}}
  outputs:
    written: {type: {kind: value, schema: {type: integer}}}
  outputBindings:
    written: {expression: "steps.each.iterations"}
  entry: [each]
  steps:
    - id: each
      uses: {kind: ReviewLoop, name: test-design-one}
      inputs:
        spec: {fromArtifact: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: Spec}, id: "inputs.prd.id + '-' + state.cap.id.lowerAscii()"}}
        plan: {fromArtifact: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: Plan}, id: "inputs.prd.id + '-' + state.cap.id.lowerAscii() + '-plan'"}}
        base: {fromArtifact: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: TestDesign}, id: "inputs.prd.id + '-' + state.cap.id.lowerAscii() + '-tests'"}, onMissing: omit}
        architecture: {fromInput: architecture}
        designs: {fromInput: designs}
        glossary: {fromArtifact: {kind: {apiVersion: sdd.persimmon.ai/v1, kind: Glossary}, id: "state.cap.context + '-glossary'"}}   # the context's, as derive-domain names it
        rules: {fromInput: rules}
        harness: {fromInput: harness}
      timeout: 9600h   # a ceiling for the whole repeat: forty loops at a loop's full 240h, each waiting on a human
      memo: {ignore: [base], when: "outputs.passed"}   # unchanged inputs, a passed loop: done already (11-workflow.md)
      repeat:
        state:
          index: {type: {kind: value, schema: {type: integer, minimum: 1}}}
          cap: {type: {kind: value, schema: {type: object, required: [id, context], additionalProperties: false, properties: {id: {type: string, pattern: "^CAP-[0-9]+$"}, context: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$", maxLength: 40, description: "the bounded context that lists the capability: its BoundedContext, <context>-model and <context>-glossary are bound (26-domain-discovery.md)"}}}}}
        initial:
          index: {literal: 1}
          cap: {expression: "inputs.capabilities[0]"}
        next:
          index: {expression: "state.index + 1"}
          cap: {expression: "inputs.capabilities[state.index]"}
        until: "iteration.index >= inputs.capabilities.size()"
        maxIterations: 40
        parallel: 4   # the loops are independent; one rejected does not stop the others (11-workflow.md)
  transitions:
    - id: done
      from: [{stepRef: each, outcomes: [Succeeded, Failed]}]
      to:
        - {terminal: Succeeded, when: 'steps.each.phase == "Succeeded" && steps.each.results.all(r, r.passed)'}
        - {terminal: Failed, reason: test_design_inconsistent, when: 'steps.each.phase == "Succeeded"'} # a Gate rejected some loop's last round; steps.each.results says which
        - {terminal: Failed, reason: step_failed} # the iteration died before its Gate ran; steps.each.error names the cause
      dispatch: first
  timeout: 9614h
