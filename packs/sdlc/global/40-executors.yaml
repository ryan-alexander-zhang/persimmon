# The project's tests, read from their JUnit XML (35-build-process.md). The command is a placeholder: a project
# overrides this Executor by name with its own (`[mvn, test]` with `target/surefire-reports`, `[pytest, --junitxml=junit.xml]`).
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: test-runner}
spec:
  type: script
  adapter: junit/v1
  configuration:
    program: [npm, test]
    junit: junit.xml
  security:
    networkAccess: deny   # declarative on junit/v1, as on subprocess/v1 (13-executor.md decisions)
---
# The project's other test levels, integration, api and e2e, run in that order after the unit tests (36-test-levels.md). None
# here: a project overrides this Executor by name with the levels it has, each {program, junit, paths?, fullOn?, affected?}:
# integration [npm, run, test:integration] (Testcontainers inside the language's runner), api [npm, run, test:api] (a script that
# starts the app and runs `bru run --reporter-junit`), e2e [npx, playwright, test] with affected [npx, playwright, test, --only-changed={base}].
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: level-runner}
spec:
  type: script
  adapter: junit/v1
  configuration:
    levels: {}
  security:
    networkAccess: deny   # declarative, as test-runner's: the project's command starts its app, browser and containers
---
# Who builds a Plan task (35-build-process.md): by default the developer with their own coding agent, answering the form in
# .persimmon/inbox/ with `persimmon complete <taskRun> --file record.yaml`. An unattended Namespace overrides this Executor by
# name: adapter claude-code/v1, type agent, sandbox workspace-write, networkAccess allowlist [api.anthropic.com], and
# allowedTools for its test command. Task implement passes `effort`, a claude-code parameter; codex/v1 takes `reasoningEffort`.
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: builder}
spec:
  type: human
  adapter: cli-human/v1
  configuration: {}
---
# Who audits a built Plan task (35-build-process.md): an agent reading the named tests, read only. It reads a few tests, so a
# smaller model than the pack's writers; a Namespace overrides it by name for another model or agent.
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: auditor}
spec:
  type: agent
  adapter: claude-code/v1
  configuration:
    model: claude-sonnet-5
    sandbox: read-only      # audit-acceptance reads the tests and answers JSON; it writes no file
  security:
    networkAccess: allowlist
    allowedHosts: [api.anthropic.com]
