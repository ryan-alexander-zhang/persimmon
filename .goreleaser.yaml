version: 2

project_name: persimmon

dist: build/goreleaser

before:
  hooks:
    - go -C cli mod tidy

builds:
  - dir: cli
    binary: persimmon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.owner=ryan-alexander-zhang
      - -X main.repo=ai-native-project-template

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

release:
  github:
    owner: ryan-alexander-zhang
    name: persimmon
