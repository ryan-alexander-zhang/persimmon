$schema: https://json-schema.org/draft/2020-12/schema
title: Handler
description: Binds kinds to behaviour. Global.
type: object
required: [apiVersion, kind, metadata, spec]
additionalProperties: false
properties:
  apiVersion: {const: persimmon.ai/v1}
  kind: {const: Handler}
  metadata:
    allOf:
      - {$ref: "resource.yaml#/$defs/Metadata"}
      - not: {required: [namespace]}   # Global kind
  spec: {$ref: "#/$defs/Spec"}
  status: {type: object}

$defs:
  Spec:
    type: object
    required: [kinds, implementation]
    additionalProperties: false
    properties:
      kinds:
        type: array
        minItems: 1
        items:
          type: object
          required: [group, kind, versions]
          additionalProperties: false
          properties:
            group: {$ref: "resource.yaml#/$defs/DnsSubdomain"}
            kind: {$ref: "resource.yaml#/$defs/Kind"}
            versions:
              type: array
              minItems: 1
              items: {type: string, pattern: "^v[0-9]+$"}
      implementation:
        type: object
        additionalProperties: false
        minProperties: 1
        maxProperties: 1
        properties:
          builtin: {$ref: "resource.yaml#/$defs/DnsLabel"}
          adapter:
            type: object
            required: [id]
            additionalProperties: false
            properties:
              id: {$ref: "reconcile.yaml#/$defs/AdapterId"}

  Finding:
    type: object
    required: [severity, message]
    additionalProperties: false
    properties:
      severity: {enum: [error, warning]}
      code: {type: string}
      path: {type: string, pattern: "^(/[^/]*)*$"}
      message: {type: string}

  ValidateResult:
    type: object
    required: [findings]
    additionalProperties: false
    properties:
      findings: {type: array, items: {$ref: "#/$defs/Finding"}}

  Context:
    type: object
    required: [children, timers]
    additionalProperties: false
    properties:
      children:
        type: array
        items:
          type: object
          required: [ref, terminal]
          additionalProperties: false
          properties:
            ref: {$ref: "resource.yaml#/$defs/ObjectRef"}
            terminal: {type: boolean}
            status: {type: object}
      snapshot: {$ref: "resource.yaml#/$defs/Snapshot"}
      actor: {$ref: "resource.yaml#/$defs/Actor"}
      timers: {type: array, items: {type: string}}
      staged:
        type: array
        items:
          type: object
          required: [ref, scope]
          additionalProperties: false
          properties:
            ref: {$ref: "resource.yaml#/$defs/RevisionRef"}
            scope: {$ref: "reconcile.yaml#/$defs/IdempotencyKey"}

  ReconcileInput:
    type: object
    required: [resource, event, context, engine]
    additionalProperties: false
    properties:
      resource: {$ref: "resource.yaml"}
      event: {$ref: "reconcile.yaml#/$defs/Event"}
      context: {$ref: "#/$defs/Context"}
      engine: {$ref: "adapter.yaml#/$defs/Engine"}

  ReconcileResult:
    type: object
    required: [actions]
    additionalProperties: false
    properties:
      statusPatch: {type: object}
      actions:
        type: array
        items: {$ref: "reconcile.yaml#/$defs/Action"}
