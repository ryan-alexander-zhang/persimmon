$schema: https://json-schema.org/draft/2020-12/schema
title: Executor
description: Who does a Task. Definition kind, scope Any.
type: object
required: [apiVersion, kind, metadata, spec]
additionalProperties: false
properties:
  apiVersion: {const: persimmon.ai/v1}
  kind: {const: Executor}
  metadata: {$ref: "resource.yaml#/$defs/Metadata"}
  spec: {$ref: "#/$defs/Spec"}
  status: {type: object}

$defs:
  Spec:
    type: object
    required: [type, adapter]
    additionalProperties: false
    properties:
      type: {enum: [agent, script, tool, human]}
      adapter:
        allOf: [{$ref: "reconcile.yaml#/$defs/AdapterId"}]
        x-persimmon-adapter: {roles: [executor]}
      configuration: {type: object, default: {}}
      security:
        allOf: [{$ref: "#/$defs/Security"}]
        default: {networkAccess: deny}

  Security:
    type: object
    additionalProperties: false
    properties:
      networkAccess: {enum: [deny, allowlist], default: deny}
      allowedHosts:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*(:[0-9]+)?$"}
      credentialBindings:
        type: array
        uniqueItems: true
        items: {$ref: "store.yaml#/$defs/CredentialName"}
    if: {properties: {networkAccess: {const: allowlist}}, required: [networkAccess]}
    then: {required: [allowedHosts]}
    else: {not: {required: [allowedHosts]}}
