$schema: https://json-schema.org/draft/2020-12/schema
title: Relation and RelationType
description: Immutable assertions between artifact revisions and external resources.
$defs:
  EndpointKind:
    type: object
    minProperties: 1
    maxProperties: 1
    additionalProperties: false
    properties:
      revisionKind:
        type: object
        required: [apiVersion, kind]
        additionalProperties: false
        x-persimmon-kind-ref: {}
        properties:
          apiVersion: {$ref: "resource.yaml#/$defs/ApiVersion"}
          kind: {$ref: "resource.yaml#/$defs/Kind"}
      external: {const: true}

  Endpoint:
    type: object
    minProperties: 1
    maxProperties: 1
    additionalProperties: false
    properties:
      revision: {$ref: "resource.yaml#/$defs/RevisionRef"}
      external: {$ref: "resource.yaml#/$defs/ExternalResourceRef"}

  RelationType:
    type: object
    required: [apiVersion, kind, metadata, spec]
    additionalProperties: false
    properties:
      apiVersion: {const: persimmon.ai/v1}
      kind: {const: RelationType}
      metadata: {$ref: "resource.yaml#/$defs/Metadata"}
      spec:
        type: object
        required: [from, to]
        additionalProperties: false
        properties:
          from: {type: array, minItems: 1, items: {$ref: "#/$defs/EndpointKind"}}
          to: {type: array, minItems: 1, items: {$ref: "#/$defs/EndpointKind"}}
          description: {type: string}

  Relation:
    type: object
    required: [apiVersion, kind, metadata, spec]
    additionalProperties: false
    properties:
      apiVersion: {const: persimmon.ai/v1}
      kind: {const: Relation}
      metadata:
        allOf: [{$ref: "resource.yaml#/$defs/Metadata"}, {required: [namespace]}]
      spec:
        type: object
        required: [type, from, to, evidence]
        additionalProperties: false
        properties:
          type:
            allOf: [{$ref: "resource.yaml#/$defs/LocalDefinitionRef"}, {properties: {kind: {const: RelationType}}}]
            x-persimmon-ref: {kinds: [RelationType]}
          from: {$ref: "#/$defs/Endpoint"}
          to: {$ref: "#/$defs/Endpoint"}
          evidence: {type: array, items: {$ref: "resource.yaml#/$defs/RevisionRef"}}
