apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: room-booking-architecture-bb-1-data-schema.r1
spec:
  identity:
    id: room-booking-architecture-bb-1-data-schema
    revision: 1
  content:
    title: Booking Core Data Schema
    type: data-schema
    architecture: room-booking-architecture
    block: BB-1
    domainModel: room-booking-model
    document:
      mediaType: application/sql
      content: |
        -- Room Schedule aggregate (AG-1): entities Room and Booking

        CREATE TABLE room (
          id TEXT PRIMARY KEY,
          seating_capacity INTEGER NOT NULL,
          video_capability BOOLEAN NOT NULL
        );

        CREATE TABLE booking (
          id TEXT PRIMARY KEY,
          owner_id TEXT NOT NULL,
          room_id TEXT NOT NULL REFERENCES room(id),
          date DATE NOT NULL,
          created_date DATE NOT NULL,
          start_time TIME NOT NULL,
          end_time TIME NOT NULL,
          attendee_count INTEGER NOT NULL,
          video_need BOOLEAN NOT NULL,
          status TEXT NOT NULL CHECK (status IN ('active', 'inactive')),
          -- BR-3: slot boundaries fall on 15-minute marks
          CHECK (CAST(EXTRACT(MINUTE FROM start_time) AS INTEGER) % 15 = 0
             AND CAST(EXTRACT(MINUTE FROM end_time) AS INTEGER) % 15 = 0),
          -- BR-4: slot falls entirely within 08:00-20:00
          CHECK (start_time >= TIME '08:00' AND end_time <= TIME '20:00'),
          -- BR-5: slot duration at most 4 hours
          CHECK (end_time > start_time
             AND (CAST(EXTRACT(EPOCH FROM (end_time - start_time)) AS INTEGER) / 3600.0) <= 4),
          -- BR-6: booked at most 30 days ahead of the booking's own creation date
          CHECK (date <= created_date + INTERVAL '30 days')
        );
    elements:
      - id: EL-1
        name: room
        realises:
          kind: aggregate
          name: AG-1
        rules: []
      - id: EL-2
        name: booking
        realises:
          kind: aggregate
          name: AG-1
        rules:
          - BR-3
          - BR-4
          - BR-5
          - BR-6
    rules:
      - BR-3
      - BR-4
      - BR-5
      - BR-6
    decisions: []
    openQuestions:
      - id: Q-1
        question: "Architecture constraint C-3 requires the booking limits BR-2 to BR-6, BR-9 and BR-10 to be data office management edits with no release, but the DomainModel gives no aggregate or entity to hold these thresholds: BR-2's room video capability is already room data, and BR-9/BR-10 appear only as policy parameters (POL-1 checkInWindowMinutes, POL-2 maxHoldDurationMinutes) with no storage entity, while BR-3 to BR-6 have no parameter representation at all. Lacking a modelled store, this schema fixes BR-3 to BR-6 as literal CHECK constraints on booking and omits BR-2, BR-9 and BR-10 as structural constraints (they are cross-table or time-of-check conditions enforced by the application, not the schema). Should the DomainModel add an entity or aggregate for these limits so they can be edited as data without a release?"
---
apiVersion: sdd.persimmon.ai/v1
kind: Plan
metadata:
  name: room-booking-prd-cap-1-plan.r1
spec:
  identity:
    id: room-booking-prd-cap-1-plan
    revision: 1
  content:
    title: Book a Room
    spec: room-booking-prd-cap-1
    architecture: room-booking-architecture
    designs:
      - room-booking-architecture-bb-1-http-api
      - room-booking-architecture-bb-1-data-schema
    tasks:
      - id: T-1
        title: Model rooms and bookings with slot-shape constraints
        block: BB-1
        description: Store Room (seating capacity, video conferencing capability) and Booking (owner, room, date, start time, end time, attendee count, video need, status) so that a booking's slot is structurally limited to a 15-minute boundary, the 08:00-20:00 bookable hours, a duration of at most 4 hours, and a date at most 30 days after the booking's own creation date.
        covers:
          - FR-2
          - FR-4
        verifiedBy:
          - AC-4
          - AC-5
          - AC-6
          - AC-7
        elements:
          - design: room-booking-architecture-bb-1-data-schema
            element: EL-1
          - design: room-booking-architecture-bb-1-data-schema
            element: EL-2
        dependsOn: []
      - id: T-2
        title: Implement Book Room to validate the slot and record or refuse the booking
        block: BB-1
        description: On Book Room, check the requested day, time slot, attendee count and video need against the room's seating capacity and video conferencing capability, against the slot-shape rules held by the Room and Booking data, and against every active booking of the same room for an overlap, within one transaction per room and slot so two confirmations of the same slot cannot both succeed; record Room Booked when every check passes, otherwise report No Available Room Found.
        covers:
          - FR-1
          - FR-2
          - FR-3
          - FR-4
        verifiedBy:
          - AC-1
          - AC-2
          - AC-3
          - AC-8
          - AC-9
          - AC-10
        elements:
          - design: room-booking-architecture-bb-1-http-api
            element: EL-1
        dependsOn:
          - T-1
      - id: T-3
        title: Serve the Room Status View showing each room's current availability
        block: BB-1
        description: Present the Room Status View over the stored rooms and bookings so an employee can see which rooms are free, holding only rooms that fit the requested attendee count and, when video conferencing is needed, that have the capability, ahead of confirming a booking.
        covers:
          - FR-1
        verifiedBy: []
        elements:
          - design: room-booking-architecture-bb-1-http-api
            element: EL-7
        dependsOn:
          - T-1
    openQuestions: []
---
