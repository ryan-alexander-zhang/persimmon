apiVersion: sdd.persimmon.ai/v1
kind: BoundedContext
metadata:
  name: room-booking.r1
spec:
  identity:
    id: room-booking
    revision: 1
  content:
    name: Room Booking
    purpose: "Room Booking manages the office's room schedule: it decides which room fits a requested party size and video need and is free for a given slot, creates and releases scheduled bookings, records check-in to confirm attendance, automatically releases bookings nobody checks into, and lets a walk-in employee claim and hold an empty room on the spot until the hold expires or the room's next scheduled booking begins. It also maintains a live view of every room's status for employees and door/floor screens, and produces a monthly utilisation report for office management."
    inScope:
      - Employee
      - Walk-in Employee
      - Office Management
      - Room Schedule
      - Booking
      - Room
      - Room Status View
      - Monthly Utilisation Report View
    outOfScope: []
    classification: supporting
    relationships: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Glossary
metadata:
  name: room-booking-glossary.r1
spec:
  identity:
    id: room-booking-glossary
    revision: 1
  content:
    title: Room Booking Glossary
    context: room-booking
    terms:
      - name: Employee
        definition: Finds and books a free room that fits their meeting; also the role that cancels and checks in to its own bookings.
        status: active
        related:
          - Booking
          - Room Status View
      - name: Walk-in Employee
        definition: Claims an empty room on the spot with no prior reservation.
        status: active
        related:
          - Booking
          - Room Status View
      - name: Office Management
        definition: Receives the monthly utilisation report covering per-room usage, no-show rate per team, and peak hours.
        status: active
        related:
          - Monthly Utilisation Report View
      - name: Room Schedule
        definition: "Consistency boundary for the office's room schedule: decides which room fits and is free for a requested slot, creates and releases scheduled bookings, records check-in, and also owns walk-in claims and their expiry since a walk-in claim is itself a booking of the same schedule. Owns Book Room, Cancel Booking, Check In Booking, Release Booking As No-Show, Claim Walk-In Room and Expire Walk-In Hold so double-booking (SC-1) is prevented within one transactional boundary."
        status: active
        related:
          - Booking
          - Room
      - name: Booking
        definition: A reservation that an employee makes for a room, day, time slot, attendee count and optional video need; once made it can be cancelled by its owner before the start time, checked into within a window after the start time to confirm attendance, or claimed on the spot by a walk-in employee as a booking of the same room schedule (CAP-1 to CAP-4).
        status: active
        related:
          - Room
          - Employee
          - Walk-in Employee
          - Room Schedule
      - name: Room
        definition: A meeting room with a fixed seating capacity and a known video-conferencing capability, set up in advance (CAP-1).
        status: active
        related:
          - Booking
      - name: Room Status View
        definition: Shows, for every room, whether it is free, who holds it, until when, and what comes next; feeds both the booking decision and the door/floor screens (CAP-1, CAP-5, SC-5).
        status: active
        related:
          - Room
          - Booking
          - Employee
          - Walk-in Employee
      - name: Monthly Utilisation Report View
        definition: Monthly summary of utilisation per room, no-show rate per team, and peak hours of demand, delivered to office management (CAP-6, SC-6).
        status: active
        related:
          - Office Management
    factTypes:
      - name: Booking has owner
        subject: Booking
        predicate: has
        object: Employee
        status: active
      - name: Booking has room
