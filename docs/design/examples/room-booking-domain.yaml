apiVersion: sdd.persimmon.ai/v1
kind: DomainModel
metadata:
  name: room-booking-model.r1
spec:
  identity:
    id: room-booking-model
    revision: 1
  content:
    context: room-booking
    source: room-booking-prd-storming
    aggregates:
      - id: AG-1
        name: Room Schedule
        root: Booking
        entities:
          - name: Booking
            attributes:
              - Booking has owner
              - Booking has room
              - Booking has date
              - Booking has created date
              - Booking has start time
              - Booking has end time
              - Booking has attendee count
              - Booking has video need
              - Booking has status
          - name: Room
            attributes:
              - Room has seating capacity
              - Room has video capability
        valueObjects: []
        commands:
          - Book Room
          - Cancel Booking
          - Check In Booking
          - Release Booking As No-Show
          - Claim Walk-In Room
          - Expire Walk-In Hold
        events:
          - Room Booked
          - No Available Room Found
          - Booking Cancelled
          - Booking Checked In
          - Booking Released As No-Show
          - Walk-In Room Claimed
          - Walk-In Hold Expired
        invariants:
          - statement: room's seating capacity >= requested attendee count
            rules:
              - BR-1
          - statement: room has video-conferencing equipment if the booking requests it
            rules:
              - BR-2
          - statement: requested slot's start and end times fall on 15-minute boundaries
            rules:
              - BR-3
          - statement: requested slot falls entirely between 08:00 and 20:00
            rules:
              - BR-4
          - statement: requested slot duration <= 4 hours
            rules:
              - BR-5
          - statement: requested slot's date is at most 30 days after the date of booking
            rules:
              - BR-6
          - statement: no existing active booking for the room overlaps the requested time slot
            rules:
              - BR-7
          - statement: the command issuer is the booking's owner and the booking's start time has not yet passed
            rules:
              - BR-8
          - statement: the command issuer is the booking's owner and the check-in occurs within the check-in window after the booking's scheduled start time
            rules:
              - BR-9
          - statement: the room has no active booking or hold at the time of claim
            rules: []
    events:
      - name: Room Booked
        pivotal: true
        attributes:
          - Booking has owner
          - Booking has room
          - Booking has date
          - Booking has start time
          - Booking has end time
          - Booking has attendee count
          - Booking has video need
      - name: No Available Room Found
        attributes: []
      - name: Booking Cancelled
        pivotal: true
        attributes:
          - Booking has owner
          - Booking has room
      - name: Booking Checked In
        pivotal: true
        attributes:
          - Booking has owner
          - Booking has room
      - name: Booking Released As No-Show
        pivotal: true
        attributes:
          - Booking has owner
          - Booking has room
      - name: Walk-In Room Claimed
        pivotal: true
        attributes:
          - Booking has owner
          - Booking has room
      - name: Walk-In Hold Expired
        attributes:
          - Booking has room
      - name: Monthly Utilisation Report Generated
        temporal: true
        attributes:
          - Monthly Utilisation Report View has room utilisation
          - Monthly Utilisation Report View has no-show rate per team
          - Monthly Utilisation Report View has peak hours
    policies:
      - id: POL-1
        name: No-Show Release Policy
        when:
          - Room Booked
        then:
          - Release Booking As No-Show
        execution: automatic
        condition: no check-in recorded within the check-in window after the booking's start time
        parameters:
          - name: checkInWindowMinutes
            value: "10"
      - id: POL-2
        name: Walk-In Hold Expiry Policy
        when:
          - Walk-In Room Claimed
        then:
          - Expire Walk-In Hold
        execution: automatic
        condition: maximum hold duration elapsed since the walk-in claim, or the room's next scheduled booking start time reached
        parameters:
          - name: maxHoldDurationMinutes
            value: "60"
    readModels:
      - name: Room Status View
        informs:
          - Employee
          - Walk-in Employee
        fields:
          - Room Status View has status
          - Room Status View has holder
          - Room Status View has held until
          - Room Status View has next
        updatedBy:
          - Room Booked
          - Booking Cancelled
          - Booking Checked In
          - Booking Released As No-Show
          - Walk-In Room Claimed
          - Walk-In Hold Expired
      - name: Monthly Utilisation Report View
        informs:
          - Office Management
        fields:
          - Monthly Utilisation Report View has room utilisation
          - Monthly Utilisation Report View has no-show rate per team
          - Monthly Utilisation Report View has peak hours
        updatedBy:
          - Monthly Utilisation Report Generated
    externalSystems: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Architecture
metadata:
  name: room-booking-architecture.r1
spec:
  identity:
    id: room-booking-architecture
    revision: 1
  content:
    title: Meeting room booking architecture
    owner: office IT
    status: accepted
    introduction:
      prd: room-booking-prd
      qualityGoals:
        - id: QG-1
          quality: reliability
          motivation: One schedule is the truth; a double booking or a lost cancellation is the problem the tool exists to end (G-1, G-2).
        - id: QG-2
          quality: interaction-capability
          motivation: Booking and check-in happen on a phone in a corridor; status must be readable from a screen across the floor (G-3).
        - id: QG-3
          quality: maintainability
          motivation: One office IT person keeps it running beside other work; rules change by editing data, not code.
      stakeholders:
        - role: employee
          expectations: the Prd's; plus a phone-first client and a check-in that takes one scan
        - role: walk-in employee
          expectations: the Prd's; plus a room claimed in one scan
        - role: office management
          expectations: the Prd's; plus the monthly report without asking IT
        - role: office IT
          expectations: one deployable, no local accounts, rules as data
    constraints:
      - id: C-1
        kind: technical
        statement: Sign-in is the company SSO; name and team come from the directory; no local accounts.
        rationale: the brief
      - id: C-2
        kind: technical
        statement: Door and floor screens are browsers in kiosk mode on the office network; they hold no credentials.
        rationale: cheapest hardware IT already runs
      - id: C-3
        kind: organizational
        statement: Room capacities, video capability and the booking limits (BR-2 to BR-6, BR-9, BR-10) are data office management edits; no release.
        rationale: the limits were set by office management and will change
    context:
      business:
        - partner: employee
          exchanges: bookings, cancellations, check-ins
          direction: both
        - partner: walk-in employee
          exchanges: walk-in claims at the door
          direction: in
        - partner: office management
          exchanges: monthly utilisation report; room and limit data
          direction: both
        - partner: Directory
          exchanges: employee name and team by id
          direction: in
      technical:
        - channel: web
          protocol: HTTPS
          carries: everything employees exchange, on phone and desktop
        - channel: door QR
          protocol: HTTPS URL per room
          carries: check-in and walk-in claim
        - channel: screens
          protocol: HTTPS
          carries: room status to door and floor screens
        - channel: directory API
          protocol: HTTPS/JSON
          carries: employee name and team lookups
    strategy:
      - id: S-1
        decision: "One booking core owns the Room Booking context: the schedule, every rule, the status view and the report; clients are thin."
        addresses:
          - QG-1
          - QG-3
      - id: S-2
        decision: Rooms and limits are data the core loads; office management edits them in the web client.
        addresses:
          - C-3
          - QG-3
      - id: S-3
        decision: "A check-in and a walk-in claim are the same door URL: the QR code carries the room id, the core decides which it is."
        addresses:
          - QG-2
      - id: S-4
        decision: The core stores employee ids only; names and teams are read from the Directory when shown or reported.
        addresses:
          - C-1
    buildingBlocks:
      - id: BB-1
        name: booking core
        technology: Node service, SQLite
        responsibility: "the Room Booking context: rooms, bookings, walk-in claims, check-in, no-show release, hold expiry, the room status view, the monthly report"
        interfaces:
          - name: booking API
            kind: provides
            description: book, cancel, check in, claim; room status now; monthly report; rooms and limits for office management
          - name: directory
            kind: requires
            description: employee name and team by id
        contexts:
          - room-booking
      - id: BB-2
        name: web client
        technology: browser app
        responsibility: the employee's booking screens, the door URL that checks in or claims, office management's room and limit editing and the report
        interfaces:
          - name: booking API
            kind: requires
            description: everything shown comes from the core
        contexts: []
      - id: BB-3
        name: status screens
        technology: browser app in kiosk mode
        responsibility: the door screen of one room and the floor screen of every room, refreshed from the status view
        interfaces:
          - name: booking API
            kind: requires
            description: room status now, read only
        contexts: []
    relations:
      - id: REL-1
        from: employee
        to: BB-2
        description: books, cancels, checks in; scans the door QR
        technology: HTTPS
      - id: REL-2
        from: walk-in employee
        to: BB-2
        description: scans the door QR to claim the room
        technology: HTTPS
      - id: REL-3
        from: office management
        to: BB-2
        description: edits rooms and limits; reads the monthly report
        technology: HTTPS
      - id: REL-4
        from: BB-2
        to: BB-1
        description: every command and read of the schedule
        interface: booking API
        technology: HTTPS/JSON
      - id: REL-5
        from: BB-3
        to: BB-1
        description: room status now, every 30 seconds
        interface: booking API
        technology: HTTPS/JSON
      - id: REL-6
        from: BB-1
        to: Directory
        description: employee name and team by id
        interface: directory
        technology: HTTPS/JSON
    concepts:
      - id: CC-1
        topic: domain
        statement: The Room Booking context has one model in the booking core; the Room Schedule aggregate is one transaction per room and slot, so two bookings of the same slot cannot both commit.
      - id: CC-2
        topic: transactions
        statement: No-show release and hold expiry run from a one-minute scheduler in the core; the policy parameters are data (C-3).
      - id: CC-3
        topic: security
        statement: Every call carries the SSO identity; a booking's owner is the id that made it; screens read the status view with no identity.
      - id: CC-4
        topic: errors
        statement: A refused command names the rule BR-n; no other error reaches an employee.
      - id: CC-5
        topic: persistence
        statement: Bookings and their state changes are rows with a history table; the monthly report is a query over it.
    domainModels:
      - room-booking-model
    decisions: []
    qualityScenarios:
      - id: QS-1
        qualityGoal: QG-1
        stimulus: two employees confirm the same room and slot within the same second
        source: employees
        response: one booking is made; the other sees No Available Room Found
        measure: zero overlapping bookings in the history table
      - id: QS-2
        qualityGoal: QG-1
        stimulus: the core restarts during the no-show window
        response: the release still happens within one minute of the window's end
        measure: release time minus window end under 60 seconds
      - id: QS-3
        qualityGoal: QG-2
        stimulus: an employee scans the door QR
        response: the booking is checked in or the room claimed with no further input beyond SSO
        measure: under 5 seconds on the office network
      - id: QS-4
        qualityGoal: QG-2
        stimulus: a booking is cancelled or released
        response: the door and floor screens show the room free
        measure: within 60 seconds
      - id: QS-5
        qualityGoal: QG-3
        stimulus: office management changes the check-in window to 15 minutes
        response: the next release uses it
        measure: no deployment
    risks:
      - id: RK-1
        kind: risk
        statement: The scheduler misses a release while the core is down for longer than the window.
        probability: low
        impact: medium
        mitigation: QS-2; the scheduler catches up on restart from the history table
    glossaries:
      - room-booking-glossary
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: room-booking-prd-cap-1.r1
spec:
  identity:
    id: room-booking-prd-cap-1
    revision: 1
  content:
    title: Book a Room
    prd: room-booking-prd
    capability: CAP-1
    architecture: room-booking-architecture
    domainModel: room-booking-model
    stories:
      - id: US-1
        role: Employee
        goal: book a free room that fits the meeting's attendee count and video need
        benefit: the employee finds and books a free room without wandering the floor (G-1)
        requirements:
          - FR-1
          - FR-2
          - FR-3
          - FR-4
        commands:
          - Book Room
        events:
          - Room Booked
          - No Available Room Found
        readModels:
          - Room Status View
        acceptance:
          - id: AC-1
            title: "Happy path: book a room that fits"
            given:
              - Room Oak seats 8, has no video conferencing capability, and is free on 2026-10-20 from 10:00 to 11:00
            when:
              - An employee books Room Oak for 2026-10-20 from 10:00 to 11:00 for 6 attendees with no video need
            then:
              - Room Booked is recorded for Room Oak, 2026-10-20, 10:00 to 11:00, 6 attendees, no video
          - id: AC-2
            title: Video need restricts eligible rooms (BR-2)
            given:
              - Room Oak seats 8, has no video conferencing capability, and is free on 2026-10-20 from 10:00 to 11:00
              - Room Pine seats 8, has video conferencing capability, and is free on 2026-10-20 from 10:00 to 11:00
            when:
              - An employee requesting a room for 6 attendees on 2026-10-20 from 10:00 to 11:00 with video conferencing needed books Room Pine
            then:
              - Room Booked is recorded for Room Pine
              - Room Oak is not offered because it lacks video conferencing capability
          - id: AC-3
            title: Room too small is not offered (BR-1)
            given:
              - Room Birch seats 4 and is free on 2026-10-20 from 10:00 to 11:00
            when:
              - An employee requesting a room for 12 attendees on 2026-10-20 from 10:00 to 11:00 attempts to book Room Birch
            then:
              - No Available Room Found is returned because Room Birch's seating capacity of 4 is below the requested 12 attendees
          - id: AC-4
            title: Slot off the 15-minute boundary is refused (BR-3)
            given:
              - Room Oak is free on 2026-10-20 from 10:00 onward
            when:
              - An employee attempts to book Room Oak for 2026-10-20 from 10:05 to 11:05
            then:
              - No Available Room Found is returned because the slot does not begin and end on a 15-minute boundary
          - id: AC-5
            title: Slot outside bookable hours is refused (BR-4)
            given:
              - Room Oak is free on 2026-10-20 from 19:00 to 20:00
            when:
              - An employee attempts to book Room Oak for 2026-10-20 from 19:30 to 20:30
            then:
              - No Available Room Found is returned because the slot ends after 20:00
          - id: AC-6
            title: Duration over 4 hours is refused (BR-5)
            given:
              - Room Oak is free all day on 2026-10-20
            when:
              - An employee attempts to book Room Oak for 2026-10-20 from 09:00 to 13:30
            then:
              - No Available Room Found is returned because the requested duration of 4.5 hours exceeds the 4-hour limit
          - id: AC-7
            title: Booking beyond the 30-day advance window is refused (BR-6)
            given:
              - Today is 2026-10-14
              - Room Oak is free on 2026-11-20 from 10:00 to 11:00
            when:
              - An employee attempts to book Room Oak for 2026-11-20 from 10:00 to 11:00
            then:
              - No Available Room Found is returned because 2026-11-20 is more than 30 days after the date of booking, 2026-10-14
          - id: AC-8
            title: Overlapping slot is refused (BR-7)
            given:
              - Room Oak has an active booking on 2026-10-20 from 10:00 to 11:00
            when:
              - An employee attempts to book Room Oak for 2026-10-20 from 10:30 to 11:30
            then:
              - No Available Room Found is returned because the requested slot overlaps Room Oak's existing active booking
          - id: AC-9
            title: Current slot booked with no minimum notice (BR-11)
            given:
              - It is 2026-10-20 at 10:02
              - Room Oak's current 15-minute slot of 10:00 to 10:15 is free
            when:
              - An employee books Room Oak for 2026-10-20 from 10:00 to 10:15 immediately, with no advance notice
            then:
              - Room Booked is recorded for Room Oak, 2026-10-20, 10:00 to 10:15, despite no advance notice
          - id: AC-10
            title: "Concurrent confirmations of the same room and slot: one wins (BR-7)"
            given:
              - Room Oak is free on 2026-10-20 from 14:00 to 15:00
            when:
              - Two employees each book Room Oak for 2026-10-20 from 14:00 to 15:00 within the same second
            then:
              - Room Booked is recorded for Room Oak for one of the two employees
              - The other employee receives No Available Room Found
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When an employee requests a room for a day, a time slot, a number of attendees and optionally a need for video conferencing, the system shall present only the rooms that are free for that slot and satisfy BR-1 and BR-2.
        rules:
          - BR-1
          - BR-2
      - id: FR-2
        pattern: event-driven
        statement: When an employee confirms a presented room for a day and a time slot that satisfies BR-3, BR-4, BR-5, BR-6, BR-7 and BR-11, the system shall book the room.
        rules:
          - BR-3
          - BR-4
          - BR-5
          - BR-6
          - BR-7
          - BR-11
      - id: FR-3
        pattern: unwanted-behaviour
        statement: If the confirmed room is no longer free for the requested slot under BR-7, then the system shall refuse the booking and report that no available room was found.
        rules:
          - BR-7
      - id: FR-4
        pattern: unwanted-behaviour
        statement: If the requested day, time slot, attendee count or video need violates BR-1, BR-2, BR-3, BR-4, BR-5 or BR-6, then the system shall report that no available room was found.
        rules:
          - BR-1
          - BR-2
          - BR-3
          - BR-4
          - BR-5
          - BR-6
    qualities:
      - scenario: QS-1
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: room-booking-prd-cap-2.r1
spec:
  identity:
    id: room-booking-prd-cap-2
    revision: 1
  content:
    title: Cancel a booking
    prd: room-booking-prd
    capability: CAP-2
    architecture: room-booking-architecture
    domainModel: room-booking-model
    stories:
      - id: US-1
        role: Employee
        goal: cancel a booking they own before its start time
        benefit: so that a room they no longer need becomes available to others quickly instead of sitting reserved and unused (G-2)
        requirements:
          - FR-1
          - FR-2
        commands:
          - Cancel Booking
        events:
          - Booking Cancelled
        readModels:
          - Room Status View
        acceptance:
          - id: AC-1
            title: Owner cancels before the start time
            given:
              - an active booking owned by Employee A for Room 3 on 2026-10-20 from 14:00 to 15:00
              - the current time is 2026-10-20 10:00
            when:
              - Employee A cancels the booking
            then:
              - the booking is recorded as cancelled
              - Room 3's Room Status View shows the 14:00-15:00 slot as free
          - id: AC-2
            title: Only the owner may cancel
            given:
              - an active booking owned by Employee A for Room 3 on 2026-10-20 from 14:00 to 15:00
              - the current time is 2026-10-20 10:00
            when:
              - Employee B requests to cancel Employee A's booking
            then:
              - the cancellation is refused
              - the refusal states that only the booking's owner may cancel it
          - id: AC-3
            title: Cannot cancel after the start time has passed
            given:
              - an active booking owned by Employee A for Room 5 on 2026-10-14 from 09:00 to 10:00
              - the current time is 2026-10-14 09:05
            when:
              - Employee A requests to cancel the booking
            then:
              - the cancellation is refused
              - the refusal states that a booking can no longer be cancelled once its start time has passed
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When a booking's owner cancels it in compliance with BR-8, the system shall cancel the booking and update the Room Status View to show the room's slot as free.
        rules:
          - BR-8
      - id: FR-2
        pattern: unwanted-behaviour
        statement: If a cancellation request breaks BR-8, then the system shall refuse the cancellation and state the reason.
        rules:
          - BR-8
    qualities:
      - scenario: QS-4
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: room-booking-prd-cap-3.r1
spec:
  identity:
    id: room-booking-prd-cap-3
    revision: 1
  content:
    title: Check in to confirm a booking
    prd: room-booking-prd
    capability: CAP-3
    architecture: room-booking-architecture
    domainModel: room-booking-model
    stories:
      - id: US-1
        role: Employee
        goal: confirm their presence at a booked room
        benefit: the room remains held for the meeting instead of being released as unused
        requirements:
          - FR-1
          - FR-2
          - FR-3
        commands:
          - Check In Booking
        events:
          - Booking Checked In
        acceptance:
          - id: AC-1
            title: Owner checks in on time
            given:
              - a booking owned by Priya for Conference Room A from 10:00 to 11:00 today, status active with no check-in yet
              - the current time is 10:05
            when:
              - Priya checks in at Conference Room A's door for her 10:00 booking
            then:
              - the booking is recorded as checked in
              - the booking is no longer subject to no-show release
          - id: AC-2
            title: Check-in attempted by someone other than the owner
            given:
              - a booking owned by Priya for Conference Room A from 10:00 to 11:00 today, status active with no check-in yet
              - the current time is 10:03
            when:
              - Daniel, who is not the booking's owner, attempts to check in at Conference Room A's door for Priya's booking
            then:
              - the check-in is refused
              - the refusal states that only the booking's owner may check in
              - the booking remains not checked in
          - id: AC-3
            title: Check-in attempted after the check-in window
            given:
              - a booking owned by Priya for Conference Room A from 10:00 to 11:00 today, status active with no check-in yet
              - the current time is 10:11, 11 minutes after the booking's start time
            when:
              - Priya attempts to check in at Conference Room A's door for her 10:00 booking
            then:
              - the check-in is refused
              - the refusal states that the check-in window has passed
          - id: AC-4
            title: Check-in at the edge of the check-in window
            given:
              - a booking owned by Priya for Conference Room A from 10:00 to 11:00 today, status active with no check-in yet
              - the current time is 10:10, exactly 10 minutes after the booking's start time
            when:
              - Priya checks in at Conference Room A's door for her 10:00 booking
            then:
              - the booking is recorded as checked in
      - id: US-2
        role: Employee
        goal: have a booking nobody checks into released automatically
        benefit: a booked room that goes unused becomes available to others quickly (G-2)
        requirements:
          - FR-4
        commands:
          - Release Booking As No-Show
        events:
          - Booking Released As No-Show
        acceptance:
          - id: AC-5
            title: Booking released as no-show when nobody checks in
            given:
              - a booking owned by Priya for Conference Room A from 10:00 to 11:00 today, status active with no check-in recorded
              - the current time reaches 10:10, 10 minutes after the booking's start time, with no check-in recorded
            when:
              - the check-in window elapses with no check-in recorded for the booking
            then:
              - the booking is released as a no-show
              - the booking's status becomes inactive
              - the room becomes available for other bookings
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When the booking's owner checks in at the room within the check-in window set by BR-9, the system shall record the booking as checked in.
        rules:
          - BR-9
      - id: FR-2
        pattern: unwanted-behaviour
        statement: If a check-in is attempted by someone other than the booking's owner, then the system shall refuse the check-in.
        rules:
          - BR-9
      - id: FR-3
        pattern: unwanted-behaviour
        statement: If a check-in is attempted after the check-in window set by BR-9 has elapsed, then the system shall refuse the check-in.
        rules:
          - BR-9
      - id: FR-4
        pattern: event-driven
        statement: When the check-in window set by BR-9 elapses with no check-in recorded for a booking, the system shall release the booking as a no-show.
        rules:
          - BR-9
    qualities:
      - scenario: QS-2
      - scenario: QS-3
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: room-booking-prd-cap-4.r1
spec:
  identity:
    id: room-booking-prd-cap-4
    revision: 1
  content:
    title: Walk-in ad hoc booking
    prd: room-booking-prd
    capability: CAP-4
    architecture: room-booking-architecture
    domainModel: room-booking-model
    stories:
      - id: US-1
        role: Walk-in employee
        goal: claim an empty room on the spot and hold it until the next scheduled booking or a bounded time elapses
        benefit: they can hold an unplanned meeting without wandering the floor looking for a free room (G-1)
        requirements:
          - FR-1
          - FR-2
          - FR-3
          - FR-4
          - FR-5
        commands:
          - Claim Walk-In Room
          - Expire Walk-In Hold
        events:
          - Walk-In Room Claimed
          - Walk-In Hold Expired
        readModels:
          - Room Status View
        acceptance:
          - id: AC-1
            title: Walk-in employee claims a free room
            given:
              - Room Delta has no active booking or hold
              - it is 14:05 on the booking day
            when:
              - the walk-in employee scans the door QR code of Room Delta to claim it at 14:05
            then:
              - a walk-in booking is created for Room Delta owned by the walk-in employee
              - the booking is recorded with checked-in status at 14:05
              - Walk-In Room Claimed is recorded for Room Delta
          - id: AC-2
            title: Walk-in claim refused when the room is already held
            given:
              - Room Delta has an active booking from 14:00 to 15:00
            when:
              - a walk-in employee scans the door QR code of Room Delta to claim it at 14:10
            then:
              - the claim is refused because Room Delta already has an active booking or hold
              - Room Delta's status is unchanged
          - id: AC-3
            title: Walk-in hold ends at the next scheduled booking
            given:
              - Room Delta has a scheduled booking starting at 15:00
              - a walk-in booking was claimed on Room Delta at 14:30
            when:
              - the system reaches Room Delta's next scheduled booking start time of 15:00 and executes Expire Walk-In Hold on the walk-in booking
            then:
              - the walk-in booking's end time is set to 15:00
              - Walk-In Hold Expired is recorded for Room Delta
              - Room Delta's status shows free for the 15:00 scheduled booking
          - id: AC-4
            title: Walk-in hold ends after one hour with no next booking
            given:
              - Room Delta has no scheduled booking after 14:30
              - a walk-in booking was claimed on Room Delta at 14:30
            when:
              - the system reaches 15:30, one hour after the walk-in check-in, and executes Expire Walk-In Hold on the walk-in booking
            then:
              - the walk-in booking's end time is set to 15:30
              - Walk-In Hold Expired is recorded for Room Delta
              - Room Delta's status shows free
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When an employee claims a room that has no active booking or hold, the system shall create a walk-in booking for that room owned by the employee.
        rules: []
      - id: FR-2
        pattern: unwanted-behaviour
        statement: If an employee attempts to claim a room that has an active booking or hold, then the system shall refuse the claim.
        rules: []
      - id: FR-3
        pattern: event-driven
        statement: When a walk-in booking is created, the system shall record it as checked in at the moment of claim, satisfying BR-9.
        rules:
          - BR-9
      - id: FR-4
        pattern: event-driven
        statement: When a walk-in booking is created, the system shall set the booking's end time according to BR-10.
        rules:
          - BR-10
      - id: FR-5
        pattern: event-driven
        statement: When a walk-in booking's end time is reached, the system shall expire the walk-in hold and make the room available.
        rules: []
    qualities:
      - scenario: QS-1
      - scenario: QS-3
      - scenario: QS-4
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: room-booking-prd-cap-5.r1
spec:
  identity:
    id: room-booking-prd-cap-5
    revision: 1
  content:
    title: Room Status Screens
    prd: room-booking-prd
    capability: CAP-5
    architecture: room-booking-architecture
    domainModel: room-booking-model
    stories:
      - id: US-1
        role: Employee
        goal: see, at a room's door and on a floor-wide screen, which rooms are free, who holds a room and until when, and what comes next
        benefit: they can see at a glance which rooms are free without leaving their desk (G-3)
        requirements:
          - FR-1
          - FR-2
          - FR-3
        commands: []
        events:
          - Room Booked
          - Booking Cancelled
          - Booking Checked In
          - Booking Released As No-Show
          - Walk-In Room Claimed
          - Walk-In Hold Expired
        readModels:
          - Room Status View
        acceptance:
          - id: AC-1
            title: Floor screen lists every room's status
            given:
              - Room 'Atlas' (capacity 6) is booked from 14:00 to 15:00 by Employee Dana
              - Room 'Borealis' (capacity 4) has no active booking or hold
              - Room 'Cassini' (capacity 8) is held by a walk-in claim until 15:30
            when:
              - An employee views the floor-wide room status screen
            then:
              - The screen shows Atlas as booked, held by Dana, until 15:00
              - The screen shows Borealis as free
              - The screen shows Cassini as held until 15:30
          - id: AC-2
            title: Door screen shows a room's status and what's next
            given:
              - Room 'Atlas' is booked from 14:00 to 15:00 by Employee Dana
              - Atlas has a next booking from 15:30 to 16:00 by Employee Lee
            when:
              - An employee views Atlas's door screen
            then:
              - The screen shows Atlas as booked, held by Dana, until 15:00
              - The screen shows the next booking as 15:30 to 16:00 by Lee
          - id: AC-3
            title: Door and floor screens show a cancelled booking's room as free
            given:
              - Room 'Borealis' was booked from 14:00 to 15:00 by Employee Dana
              - Dana has cancelled the booking
            when:
              - An employee views Borealis's door screen and the floor-wide screen
            then:
              - Borealis's door screen shows free
              - The floor-wide screen shows Borealis as free
      - id: US-2
        role: Walk-in employee
        goal: see, at a room's door and on a floor-wide screen, which rooms are free right now
        benefit: they can see at a glance which rooms are free without leaving their desk (G-3)
        requirements:
          - FR-1
          - FR-2
        commands: []
        events: []
        readModels:
          - Room Status View
        acceptance:
          - id: AC-4
            title: Floor screen helps a walk-in employee find a free room
            given:
              - Room 'Atlas' is booked until 15:00
              - Room 'Borealis' has no active booking or hold
              - Room 'Cassini' is held by a walk-in claim until 15:30
            when:
              - A walk-in employee views the floor-wide room status screen
            then:
              - The screen shows Borealis as free
              - The screen shows Atlas and Cassini as unavailable, each with its held-until time
          - id: AC-5
            title: Door screen shows a room free for a walk-in claim
            given:
              - Room 'Borealis' has no active booking or hold
            when:
              - A walk-in employee views Borealis's door screen
            then:
              - The screen shows Borealis as free, with no holder and no held-until time
    requirements:
      - id: FR-1
        pattern: ubiquitous
        statement: The system shall show, at each room's door, the room's current status, its holder, the time it is held until, and the next booking.
      - id: FR-2
        pattern: ubiquitous
        statement: The system shall show, in one floor-wide view, the current status of every room.
      - id: FR-3
        pattern: event-driven
        statement: When a booking is made, cancelled, checked in, released as a no-show, claimed as a walk-in, or its walk-in hold expires, the system shall update the room status shown at the room's door and on the floor-wide view.
    qualities:
      - scenario: QS-4
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: room-booking-prd-cap-6.r1
spec:
  identity:
    id: room-booking-prd-cap-6
    revision: 1
  content:
    title: Monthly Utilisation Report
    prd: room-booking-prd
    capability: CAP-6
    architecture: room-booking-architecture
    domainModel: room-booking-model
    stories:
      - id: US-1
        role: Office management
        goal: see how each meeting room is actually used over a month
        benefit: office management can see how rooms are actually used (G-4)
        requirements:
          - FR-1
          - FR-2
        events:
          - Monthly Utilisation Report Generated
        readModels:
          - Monthly Utilisation Report View
        acceptance:
          - id: AC-1
            title: Report generated at month end
            given:
              - the calendar month of October 2026 has ended
              - bookings, cancellations, check-ins and no-shows were recorded across the eight rooms during October 2026
            when:
              - the calendar month ends
            then:
              - a Monthly Utilisation Report View for October 2026 is generated, recording room utilisation, no-show rate per team, and peak hours of demand
          - id: AC-2
            title: Office management views the report
            given:
              - a Monthly Utilisation Report View for October 2026 has been generated
            when:
              - Office Management views the Monthly Utilisation Report View for October 2026
            then:
              - Office Management sees utilisation per room for October 2026
              - Office Management sees no-show rate per team for October 2026
              - Office Management sees peak hours of demand for October 2026
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When a calendar month ends, the system shall generate the Monthly Utilisation Report View.
      - id: FR-2
        pattern: ubiquitous
        statement: The system shall present the Monthly Utilisation Report View to Office Management.
    qualities: []
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: room-booking-architecture-bb-1-http-api.r1
spec:
  identity:
    id: room-booking-architecture-bb-1-http-api
    revision: 1
  content:
    title: Booking core API
    type: http-api
    architecture: room-booking-architecture
    block: BB-1
    domainModel: room-booking-model
    interface: booking API
    document:
      mediaType: application/openapi+yaml
      content: |
        openapi: 3.1.0
        info:
          title: Booking core API
          version: "1.0.0"
          description: >
            The booking API of the booking core (BB-1): rooms, bookings, walk-in
            claims, check-in, no-show release, hold expiry, the room status view
            and the monthly report. Every call carries the SSO identity as the
            caller; a refused command names the BR-n it broke.
        paths:
          /bookings:
            post:
              operationId: bookRoom
              summary: Book Room
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/BookRoomRequest'
              responses:
                '201':
                  description: Room Booked
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Booking'
                '409':
                  description: No Available Room Found - no room satisfies the requested capacity, video need or free slot
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/NoAvailableRoom'
                '422':
                  description: The requested slot itself breaks a rule
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/RuleViolation'
          /bookings/{bookingId}/cancel:
            post:
              operationId: cancelBooking
              summary: Cancel Booking
              parameters:
                - name: bookingId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Booking Cancelled
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Booking'
                '403':
                  description: Cancellation refused
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/RuleViolation'
                '404':
                  description: Booking not found
          /rooms/{roomId}/check-in:
            post:
              operationId: checkInBooking
              summary: Check In Booking
              parameters:
                - name: roomId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Booking Checked In
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Booking'
                '403':
                  description: Check-in refused
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/RuleViolation'
                '404':
                  description: No active booking owned by the caller at this room
          /bookings/{bookingId}/release-no-show:
            post:
              operationId: releaseBookingAsNoShow
              summary: Release Booking As No-Show
              description: Invoked by the core's one-minute scheduler (CC-2); refused if the check-in window has not yet elapsed.
              parameters:
                - name: bookingId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Booking Released As No-Show
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Booking'
                '409':
                  description: Release refused, the check-in window has not yet elapsed
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/RuleViolation'
                '404':
                  description: Booking not found
          /rooms/{roomId}/claim:
            post:
              operationId: claimWalkInRoom
              summary: Claim Walk-In Room
              parameters:
                - name: roomId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '201':
                  description: Walk-In Room Claimed
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Booking'
                '409':
                  description: Room is not free for a walk-in claim
                '404':
                  description: Room not found
          /rooms/{roomId}/expire-hold:
            post:
              operationId: expireWalkInHold
              summary: Expire Walk-In Hold
              description: Invoked by the core's one-minute scheduler (CC-2); refused if neither bound of BR-10 has been reached.
              parameters:
                - name: roomId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Walk-In Hold Expired
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Booking'
                '409':
                  description: Expiry refused, neither bound of the hold has been reached
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/RuleViolation'
                '404':
                  description: No active walk-in hold for this room
          /rooms/status:
            get:
              operationId: getRoomStatusView
              summary: Room Status View
              responses:
                '200':
                  description: Current status of every room
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/RoomStatusEntry'
          /reports/monthly:
            get:
              operationId: getMonthlyUtilisationReportView
              summary: Monthly Utilisation Report View
              responses:
                '200':
                  description: The monthly utilisation report
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/MonthlyUtilisationReportView'
        components:
          schemas:
            BookRoomRequest:
              type: object
              required: [date, startTime, endTime, attendeeCount]
              properties:
                date:
                  type: string
                  format: date
                startTime:
                  type: string
                endTime:
                  type: string
                attendeeCount:
                  type: integer
                videoNeed:
                  type: boolean
                  default: false
            Booking:
              type: object
              properties:
                id:
                  type: string
                owner:
                  type: string
                room:
                  type: string
                date:
                  type: string
                  format: date
                createdDate:
                  type: string
                  format: date
                startTime:
                  type: string
                endTime:
                  type: string
                attendeeCount:
                  type: integer
                videoNeed:
                  type: boolean
                status:
                  type: string
                  enum: [active, inactive]
            RoomStatusEntry:
              type: object
              properties:
                room:
                  type: string
                status:
                  type: string
                  enum: [free, held, booked]
                holder:
                  type: string
                heldUntil:
                  type: string
                next:
                  type: string
            MonthlyUtilisationReportView:
              type: object
              properties:
                roomUtilisation:
                  type: string
                noShowRatePerTeam:
                  type: string
                peakHours:
                  type: string
            RuleViolation:
              type: object
              required: [rule, message]
              properties:
                rule:
                  type: string
                  pattern: '^BR-[0-9]+$'
                message:
                  type: string
            NoAvailableRoom:
              type: object
              required: [event, rules]
              properties:
                event:
                  type: string
                  const: "No Available Room Found"
                rules:
                  type: array
                  items:
                    type: string
                    pattern: '^BR-[0-9]+$'
                message:
                  type: string
    elements:
      - id: EL-1
        name: POST /bookings
        realises:
          kind: command
          name: Book Room
        rules:
          - BR-1
          - BR-2
          - BR-3
          - BR-4
          - BR-5
          - BR-6
          - BR-7
      - id: EL-2
        name: POST /bookings/{bookingId}/cancel
        realises:
          kind: command
          name: Cancel Booking
        rules:
          - BR-8
      - id: EL-3
        name: POST /rooms/{roomId}/check-in
        realises:
          kind: command
          name: Check In Booking
        rules:
          - BR-9
      - id: EL-4
        name: POST /bookings/{bookingId}/release-no-show
        realises:
          kind: command
          name: Release Booking As No-Show
        rules:
          - BR-9
      - id: EL-5
        name: POST /rooms/{roomId}/claim
        realises:
          kind: command
          name: Claim Walk-In Room
        rules: []
      - id: EL-6
        name: POST /rooms/{roomId}/expire-hold
        realises:
          kind: command
          name: Expire Walk-In Hold
        rules:
          - BR-10
      - id: EL-7
        name: GET /rooms/status
        realises:
          kind: readModel
          name: Room Status View
        rules: []
      - id: EL-8
        name: GET /reports/monthly
        realises:
          kind: readModel
          name: Monthly Utilisation Report View
        rules: []
    rules:
      - BR-1
      - BR-2
      - BR-3
      - BR-4
      - BR-5
      - BR-6
      - BR-7
      - BR-8
      - BR-9
      - BR-10
    decisions: []
    openQuestions:
      - id: Q-1
        question: The Architecture's BB-1 responsibility and 'booking API' interface, strategy S-2 and constraint C-3 require office management to edit rooms (seating capacity, video capability) and the booking-limit policy parameters (e.g. the no-show check-in window, the walk-in hold duration) through this API without a release, but the DomainModel names no command for creating or editing a Room or for setting a policy parameter - only Room as a static entity of AG-1 and the parameters as fixed policy data. No operation can be added for this without inventing a command the DomainModel does not name.
