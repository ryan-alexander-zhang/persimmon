# Meeting room booking: every artifact below was produced by the AI Native pack live (author-prd, domain-discovery,
# spec-all, design-all, plan-all on claude-sonnet-5) except the Architecture, which the human wrote. See 23-pack-ai-native.md.
apiVersion: sdd.persimmon.ai/v1
kind: Prd
metadata:
  name: room-booking-prd.r1
spec:
  identity:
    id: room-booking-prd
    revision: 1
  content:
    title: Meeting Room Booking
    problem: In this office of about 80 people sharing eight meeting rooms (seating 4, 6, 8 and 12, two with video conferencing), rooms are booked through a shared spreadsheet. This produces double bookings, "ghost bookings" where a room is reserved and never used, employees wandering the floor hunting for a free room, and no way for anyone to see which rooms are free right now.
    users:
      - name: Employee
        description: Wants to find and book a free room that fits their meeting, and to see at a glance which rooms are available without walking the floor.
      - name: Walk-in employee
        description: Wants to grab an empty room on the spot for an unplanned meeting without making an advance booking.
      - name: Office management
        description: Wants a monthly view of how rooms are actually used, who leaves rooms unused, and when demand peaks.
    goals:
      - id: G-1
        statement: An employee finds and books a free room that fits their meeting without wandering the floor.
      - id: G-2
        statement: A booked room that goes unused becomes available to others quickly.
      - id: G-3
        statement: Anyone can see which rooms are free right now without leaving their desk.
      - id: G-4
        statement: Office management can see how rooms are actually used.
    nonGoals:
      - Hosting or badging external guests
      - Catering arrangements for meetings
      - Recurring or repeating bookings
      - Integration with external calendar tools
      - Supporting more than one office or time zone
      - Modifying an existing booking's time, attendees or video need; the owner cancels and books again instead
    capabilities:
      - id: CAP-1
        name: Book a room
        description: An employee requests a room for a day, a time slot, a number of attendees and optionally a need for video conferencing, and the tool offers only the rooms that both fit the party and are free for that slot so the employee can confirm a booking.
        priority: P1
        context: room-booking
        rules:
          - BR-1
          - BR-2
          - BR-3
          - BR-4
          - BR-5
          - BR-6
          - BR-7
          - BR-11
      - id: CAP-2
        name: Cancel a booking
        description: The owner of a booking releases it ahead of time so the room becomes available to others, instead of it sitting reserved and unused.
        priority: P1
        context: room-booking
        rules:
          - BR-8
      - id: CAP-3
        name: Check in to confirm a booking
        description: The owner of a booking confirms their presence by checking in at the room's door within a short window of the start time; a booking nobody checks into is recognised as a no-show and the room is freed for others.
        priority: P1
        context: room-booking
        rules:
          - BR-9
      - id: CAP-4
        name: Walk-in ad hoc booking
        description: An employee with no prior reservation claims an empty room on the spot by checking in at its door, holding the room for a bounded time until the next scheduled booking.
        priority: P2
        context: room-booking
        rules:
          - BR-9
          - BR-10
      - id: CAP-5
        name: Room status screens
        description: A screen at each room's door shows whether the room is free, who holds it and until when, and what comes next, while a floor-wide screen lists the current status of every room so anyone can see at a glance what is available.
        priority: P1
        context: room-booking
        rules: []
      - id: CAP-6
        name: Monthly utilisation report
        description: "Office management receives a monthly report summarising how each room is used: utilisation per room, no-show rate per team, and peak hours of demand."
        priority: P2
        context: room-booking
        rules: []
    successCriteria:
      - id: SC-1
        statement: Double-booking incidents on the room schedule drop to zero.
        capabilities:
          - CAP-1
      - id: SC-2
        statement: A cancelled booking's room shows as free to other employees within the same minute.
        capabilities:
          - CAP-2
      - id: SC-3
        statement: A booking with no check-in within 10 minutes of its start is released and the room shows as free within the same minute.
        capabilities:
          - CAP-3
      - id: SC-4
        statement: A walk-in employee can claim an empty room by checking in at the door with no prior booking.
        capabilities:
          - CAP-4
      - id: SC-5
        statement: Every room's current status is visible on its own door screen and on the floor screen without an employee walking to check.
        capabilities:
          - CAP-5
      - id: SC-6
        statement: Office management receives a monthly report covering utilisation per room, no-show rate per team, and peak hours.
        capabilities:
          - CAP-6
    assumptions:
      - Employees sign in through the company SSO, and the directory supplies each employee's name and team.
      - Each meeting room has a fixed seating capacity and a known video-conferencing capability set up in advance.
      - A scannable QR code is posted at each room's door for check-in.
      - The office operates in a single time zone and all bookings are made within it.
      - Door and floor screens have the connectivity needed to show live room status.
    openQuestions:
      - id: Q-2
        question: "How does an employee check in at a room: by scanning the door's QR code with their own device, or via a reader at the door?"
---
apiVersion: sdd.persimmon.ai/v1
kind: BusinessRules
metadata:
  name: room-booking-rules.r1
spec:
  identity:
    id: room-booking-rules
    revision: 1
  content:
    title: Meeting Room Booking Business Rules
    context: room-booking
    owner: Office management
    rules:
      - id: BR-1
        type: constraint
        statement: A room offered for a booking must have a seating capacity at least as large as the requested number of attendees.
        rationale: A room too small to seat the attendees cannot host the meeting.
        source: brief
        status: active
      - id: BR-2
        type: constraint
        statement: A room offered for a booking that requires video conferencing must have video conferencing capability.
        rationale: Only two of the eight rooms have video conferencing, so a video-conferencing meeting must not be placed in a room that lacks it.
        source: brief
        status: active
      - id: BR-3
        type: constraint
        statement: A booking's time slot must begin and end on a 15-minute boundary.
        rationale: The brief sets 15-minute granularity for booking slots.
        source: brief
        status: active
      - id: BR-4
        type: constraint
        statement: A booking must start no earlier than 08:00 and end no later than 20:00.
        rationale: The brief bounds bookable hours to 08:00-20:00.
        source: brief
        status: active
      - id: BR-5
        type: constraint
        statement: A booking must not exceed 4 hours in duration.
        rationale: The brief caps a single booking at 4 hours to limit monopolising a room.
        source: brief
        status: active
      - id: BR-6
        type: constraint
        statement: A booking must not be made more than 30 days ahead of its start.
        rationale: The brief bounds advance booking to 30 days.
        source: brief
        status: active
      - id: BR-7
        type: constraint
        statement: A room must not be offered for a time slot that overlaps an existing active booking for that room.
        rationale: This is the rule that eliminates the double bookings caused by the shared spreadsheet.
        source: brief
        status: active
      - id: BR-8
        type: constraint
        statement: A booking may be cancelled only by its owner, and only before the booking's start time.
        rationale: The brief allows the owner to cancel ahead of time so the room is released for others.
        source: brief
        status: active
      - id: BR-9
        type: decision
        statement: A booking must be considered a no-show and released if the owner has not checked in at the room within 10 minutes of the booking's start time.
        rationale: This is the rule that eliminates ghost bookings by freeing a room nobody actually uses.
        source: brief
        status: active
      - id: BR-10
        type: derivation
        statement: "A walk-in booking must end at whichever is earlier: the start of the room's next scheduled booking, or one hour after the walk-in check-in."
        rationale: The brief bounds a walk-in's hold on a room to the next booking or one hour, whichever comes first.
        source: brief
        status: active
      - id: BR-11
        type: constraint
        statement: A booking may be made for a room's current 15-minute slot with no minimum advance notice, provided the room is free for that slot.
        rationale: The brief states there is no minimum notice period; the next 15-minute slot can always be booked if the room is free.
        source: brief
        status: active
---
apiVersion: sdd.persimmon.ai/v1
kind: EventStorming
metadata:
  name: room-booking-prd-storming.r1
spec:
  identity:
    id: room-booking-prd-storming
    revision: 1
  content:
    version: "4.0"
    meta:
      name: Meeting Room Booking
      level: design
    contexts:
      - id: room-booking
        name: Room Booking
        order: 0
        classification: supporting
    contextRelationships: []
    nodes:
      - id: employee
        type: actor
        label: Employee
        properties:
          description: Finds and books a free room that fits their meeting; also the role that cancels and checks in to its own bookings.
      - id: walk-in-employee
        type: actor
        label: Walk-in Employee
        properties:
          description: Claims an empty room on the spot with no prior reservation.
      - id: office-management
        type: actor
        label: Office Management
        properties:
          description: Receives the monthly utilisation report covering per-room usage, no-show rate per team, and peak hours.
      - id: room-booking-e-room-booked
        type: domainEvent
        label: Room Booked
        context: room-booking
        order: 0
        properties:
          pivotal: true
          alternativeSet: booking-decision
          description: An employee requests a day, time slot, attendee count and optional video need; the tool offers rooms that fit and are free, and the employee confirms one (CAP-1, SC-1).
      - id: room-booking-e-no-room-available
        type: domainEvent
        label: No Available Room Found
        context: room-booking
        order: 0
        properties:
          alternativeSet: booking-decision
          description: No room both fits the party size/video need and is free for the requested slot, so no booking is made (unhappy path of CAP-1).
      - id: room-booking-e-booking-cancelled
        type: domainEvent
        label: Booking Cancelled
        context: room-booking
        order: 1
        properties:
          pivotal: true
          description: The booking's owner releases it ahead of time so the room becomes available to others instead of sitting reserved and unused (CAP-2, SC-2).
      - id: room-booking-e-checked-in
        type: domainEvent
        label: Booking Checked In
        context: room-booking
        order: 2
        properties:
          pivotal: true
          alternativeSet: start-time-outcome
          description: The booking's owner confirms presence at the room's door within a short window of the start time (CAP-3).
      - id: room-booking-e-no-show-released
        type: domainEvent
        label: Booking Released As No-Show
        context: room-booking
        order: 2
        properties:
          pivotal: true
          alternativeSet: start-time-outcome
          description: No check-in occurs within the check-in window of the start time; the No-Show Release Policy releases the booking and frees the room (CAP-3, BR-9, SC-3).
      - id: room-booking-e-walk-in-claimed
        type: domainEvent
        label: Walk-In Room Claimed
        context: room-booking
        order: 3
        properties:
          pivotal: true
          description: An employee with no prior reservation claims an empty room by checking in at its door, holding it for a bounded time (CAP-4, SC-4).
      - id: room-booking-e-walk-in-hold-expired
        type: domainEvent
        label: Walk-In Hold Expired
        context: room-booking
        order: 4
        properties:
          description: The Walk-In Hold Expiry Policy ends the hold on a walk-in claimed room once the maximum duration elapses or the next scheduled booking begins, whichever comes first (CAP-4, BR-10).
      - id: room-booking-e-monthly-report-generated
        type: domainEvent
        label: Monthly Utilisation Report Generated
        context: room-booking
        order: 5
        properties:
          temporal: true
          description: Office management receives a monthly report summarising utilisation per room, no-show rate per team, and peak hours of demand (CAP-6, SC-6).
      - id: room-booking-h-checkin-mechanism
        type: hotspot
        label: Check-in mechanism undecided
        context: room-booking
        properties:
          kind: question
          priority: high
          state: open
          description: "PRD open question Q-2: does an employee check in by scanning the door's QR code with their own device, or via a reader at the door? Affects both scheduled check-in (CAP-3) and walk-in claiming (CAP-4)."
      - id: room-booking-h-report-delivery
        type: hotspot
        label: Report delivery channel unspecified
        context: room-booking
        properties:
          kind: question
          priority: low
          state: open
          description: CAP-6/SC-6 say office management 'receives' a monthly report but not through what channel (email, dashboard, export) or in what format.
      - id: room-booking-h-room-schedule-aggregate-size
        type: hotspot
        label: Room Schedule aggregate exceeds size guideline
        context: room-booking
        properties:
          kind: risk
          priority: medium
          state: open
          description: Room Schedule now handles 6 commands (Book Room, Cancel Booking, Check In Booking, Release Booking As No-Show, Claim Walk-In Room, Expire Walk-In Hold) and emits 7 events, both above the five-each split guideline. Kept as one aggregate per explicit direction that a walk-in claim is a booking of the same room schedule, not a separate consistency boundary; flagged here as a risk to revisit if the aggregate becomes hard to reason about.
      - id: room-booking-c-book-room
        type: command
        label: Book Room
        context: room-booking
        properties:
          description: Employee requests a day, time slot, attendee count and optional video need; results in a confirmed booking when a fitting free room exists, or no match otherwise (CAP-1, BR-1 to BR-7, BR-11).
      - id: room-booking-c-cancel-booking
        type: command
        label: Cancel Booking
        context: room-booking
        properties:
          description: The booking's owner releases a booking ahead of time so the room becomes available to others (CAP-2, BR-8).
      - id: room-booking-c-check-in-booking
        type: command
        label: Check In Booking
        context: room-booking
        properties:
          alternativeSet: start-time-outcome
          description: The booking's owner confirms presence at the room's door within the check-in window of the start time (CAP-3, BR-9).
      - id: room-booking-c-claim-walk-in-room
        type: command
        label: Claim Walk-In Room
        context: room-booking
        properties:
          description: An employee with no prior reservation claims an empty room by checking in at its door (CAP-4, BR-9, BR-10).
      - id: room-booking-c-release-no-show
        type: command
        label: Release Booking As No-Show
        context: room-booking
        properties:
          alternativeSet: start-time-outcome
          description: System releases a booking recognised as a no-show after the check-in window elapses with no check-in (CAP-3, BR-9).
      - id: room-booking-c-expire-walk-in-hold
        type: command
        label: Expire Walk-In Hold
        context: room-booking
        properties:
          description: System ends a walk-in hold once the maximum hold duration elapses or the room's next scheduled booking begins (CAP-4, BR-10).
      - id: room-booking-p-no-show-release
        type: policy
        label: No-Show Release Policy
        context: room-booking
        properties:
          execution: automatic
          condition: no check-in recorded within the check-in window after the booking's start time
          parameters:
            - name: checkInWindowMinutes
              value: "10"
          description: If the booking's owner has not checked in within the check-in window after the booking's start time, the booking is released and the room freed (CAP-3, BR-9, SC-3).
      - id: room-booking-p-walk-in-hold-expiry
        type: policy
        label: Walk-In Hold Expiry Policy
        context: room-booking
        properties:
          execution: automatic
          condition: maximum hold duration elapsed since the walk-in claim, or the room's next scheduled booking start time reached
          parameters:
            - name: maxHoldDurationMinutes
              value: "60"
          description: A walk-in hold ends after the maximum hold duration or when the next scheduled booking for the room begins, whichever comes first (CAP-4, BR-10).
      - id: room-booking-rm-room-status-view
        type: readModel
        label: Room Status View
        context: room-booking
        properties:
          description: Shows, for every room, whether it is free, who holds it, until when, and what comes next; feeds both the booking decision and the door/floor screens (CAP-1, CAP-5, SC-5).
      - id: room-booking-rm-monthly-utilisation-report-view
        type: readModel
        label: Monthly Utilisation Report View
        context: room-booking
        properties:
          description: Monthly summary of utilisation per room, no-show rate per team, and peak hours of demand, delivered to office management (CAP-6, SC-6).
      - id: room-booking-ag-room-schedule
        type: aggregate
        label: Room Schedule
        context: room-booking
        properties:
          description: "Consistency boundary for the office's room schedule: decides which room fits and is free for a requested slot, creates and releases scheduled bookings, records check-in, and also owns walk-in claims and their expiry since a walk-in claim is itself a booking of the same schedule. Owns Book Room, Cancel Booking, Check In Booking, Release Booking As No-Show, Claim Walk-In Room and Expire Walk-In Hold so double-booking (SC-1) is prevented within one transactional boundary."
      - id: room-booking-cons-room-capacity-fit
        type: constraint
        label: Room Capacity Fits Party
        context: room-booking
        properties:
          rule: room's seating capacity >= requested attendee count
          description: Only a room whose seating capacity fits the requested attendee count may be offered or booked (CAP-1, BR-1).
      - id: room-booking-cons-video-capability
        type: constraint
        label: Video Capability Required When Requested
        context: room-booking
        properties:
          rule: room has video-conferencing equipment if the booking requests it
          description: A room can only be offered or booked for a request that needs video conferencing if the room has that capability (CAP-1, BR-2).
      - id: room-booking-cons-slot-15-min-boundary
        type: constraint
        label: Slot On 15-Minute Boundary
        context: room-booking
        properties:
          rule: requested slot's start and end times fall on 15-minute boundaries
          description: A booking's requested slot must start and end on a 15-minute boundary (CAP-1, BR-3).
      - id: room-booking-cons-slot-within-operating-hours
        type: constraint
        label: Slot Within Operating Hours
        context: room-booking
        properties:
          rule: requested slot falls entirely between 08:00 and 20:00
          description: A booking's requested slot must fall entirely within the office's 08:00-20:00 operating hours (CAP-1, BR-4).
      - id: room-booking-cons-max-duration
        type: constraint
        label: Booking Duration At Most Four Hours
        context: room-booking
        properties:
          rule: requested slot duration <= 4 hours
          description: A single booking's requested slot may span at most 4 hours (CAP-1, BR-5).
      - id: room-booking-cons-max-advance-notice
        type: constraint
        label: Booking At Most 30 Days Ahead
        context: room-booking
        properties:
          rule: requested slot's date is at most 30 days after the date of booking
          description: A room cannot be booked more than 30 days in advance (CAP-1, BR-6).
      - id: room-booking-cons-slot-free
        type: constraint
        label: Slot Must Be Free
        context: room-booking
        properties:
          rule: no existing active booking for the room overlaps the requested time slot
          description: A room may only be booked for a slot with no overlapping active booking, so double bookings cannot occur (CAP-1, BR-7, SC-1).
      - id: room-booking-cons-cancel-owner-only
        type: constraint
        label: Only Owner May Cancel Before Start
        context: room-booking
        properties:
          rule: the command issuer is the booking's owner and the booking's start time has not yet passed
          description: Only the booking's owner may cancel it, and only before the booking's start time (CAP-2, BR-8).
      - id: room-booking-cons-checkin-owner-window
        type: constraint
        label: Check-In By Owner Within Window
        context: room-booking
        properties:
          rule: the command issuer is the booking's owner and the check-in occurs within the check-in window after the booking's scheduled start time
          description: Only the booking's owner can check in, and only within the check-in window (10 minutes, matching the No-Show Release Policy) after the start time; otherwise the booking is instead released as a no-show (CAP-3, BR-9).
      - id: room-booking-cons-room-free-to-claim
        type: constraint
        label: Room Must Be Free To Claim
        context: room-booking
        properties:
          rule: the room has no active booking or hold at the time of claim
          description: A walk-in employee may only claim a room that is currently empty, with no active scheduled booking or existing hold (CAP-4).
    edges:
      - id: e-room-booking-01
        source: room-booking-h-checkin-mechanism
        target: room-booking-e-checked-in
        relation: annotates
      - id: e-room-booking-02
        source: room-booking-h-checkin-mechanism
