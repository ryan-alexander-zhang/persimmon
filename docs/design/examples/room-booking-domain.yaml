  content:
    title: Check in to confirm a booking
    spec: room-booking-prd-cap-3
    architecture: room-booking-architecture
    designs:
      - room-booking-architecture-bb-1-http-api
      - room-booking-architecture-bb-1-data-schema
    tasks:
      - id: T-1
        title: Persist a booking's check-in state
        block: BB-1
        covers: []
        verifiedBy: []
        elements:
          - design: room-booking-architecture-bb-1-data-schema
            element: EL-2
        dependsOn: []
        description: Extend the booking storage so a booking can record that it has been checked in, distinct from its active/inactive status, so a checked-in booking can be told apart from one still subject to no-show release.
      - id: T-2
        title: Check in a booking at the room
        block: BB-1
        covers:
          - FR-1
          - FR-2
          - FR-3
        verifiedBy:
          - AC-1
          - AC-2
          - AC-3
          - AC-4
        elements:
          - design: room-booking-architecture-bb-1-http-api
            element: EL-3
        dependsOn:
          - T-1
        description: "Handle Check In Booking: when the caller is the booking's owner and the check-in window set by BR-9 has not elapsed, record the booking as checked in; refuse a check-in by anyone else, and refuse a check-in attempted after the window has elapsed."
      - id: T-3
        title: Release an unchecked booking as a no-show
        block: BB-1
        covers:
          - FR-4
        verifiedBy:
          - AC-5
        elements:
          - design: room-booking-architecture-bb-1-http-api
            element: EL-4
        dependsOn:
          - T-1
        description: "Handle Release Booking As No-Show, invoked by the core's one-minute scheduler once the check-in window set by BR-9 elapses with no check-in recorded: make the booking inactive and free the room for other bookings."
    openQuestions:
      - id: Q-1
        question: Design room-booking-architecture-bb-1-data-schema's booking aggregate (EL-2) carries only a status of active/inactive and CHECK constraints for BR-3 to BR-6; it has no column recording that a booking was checked in (FR-1, AC-1) nor any representation of BR-9's check-in window. T-1 needs this storage extended before Check In Booking and Release Booking As No-Show can be built against it.
