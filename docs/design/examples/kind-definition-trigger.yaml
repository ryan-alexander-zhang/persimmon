# Reacting kind: subscribes to Outbox events; not part of any snapshot; never finishes (no terminal).
apiVersion: persimmon.ai/v1
kind: KindDefinition
metadata:
  name: triggers.persimmon.ai
spec:
  group: persimmon.ai
  names: {kind: Trigger, plural: triggers}
  scope: Namespaced
  versions:
    - name: v1
      schema:
        type: object
        required: [event, run]
        properties:
          event: {type: object}
          run: {type: object}
          enabled: {type: boolean}
      statusSchema:
        type: object
        properties:
          lastRun: {type: object}
          failures: {type: array}
  mutability: SpecMutable
  snapshot: "None"
  handlerRef: {name: trigger}
  subscriptions:
    - eventType: artifact.published
    - eventType: resource.finished
      filter: 'event.subject.kind == "WorkflowRun"'
