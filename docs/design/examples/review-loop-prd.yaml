# workflow-review-loop.yaml as a ReviewLoop: write-prd produces, the approval gate reviews; the verdict and the last PRD feed the next round.
apiVersion: persimmon.ai/v1
kind: ReviewLoop
metadata: {name: prd-with-review, namespace: demo}
spec:
  inputs:
    research: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ResearchReport}}}
  produce:
    uses: {kind: Task, name: write-prd}            # inputs research, previous? (ProductRequirement), feedback? (GateResult); output prd
    inputs: {research: {fromInput: research}}
    timeout: 35m
  review:
    uses: {kind: Gate, name: prd-approval-gate}
    inputs: {prd: {fromStep: {stepRef: produce, output: prd}}}
    timeout: 72h
  subject: prd
  previous: previous
  feedback: feedback
  maxRounds: 3
  timeout: 24h
