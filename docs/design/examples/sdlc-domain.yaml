# The Expenses context projected from the design-level model; the Validator domain-consistency proves it agrees.
apiVersion: sdd.persimmon.ai/v1
kind: DomainModel
metadata: {name: expenses-model.r1}
spec:
  identity: {id: expenses-model, revision: 1}
  content:
    context: expenses
    source: expense-claims-storming
    aggregates:
      - id: AG-1
        name: Claim
        root: claim
        entities:
          - {name: claim, attributes: [claim has employee, claim has total, claim has submission date, claim is complete]}
          - {name: claim line, attributes: [claim line has amount, claim line has date, claim line has receipt, claim line has justification, claim line has category]}
          - {name: trip, attributes: [trip has days]}
        valueObjects:
          - {name: receipt, attributes: []}
        commands: [Draft Claim, Attach Receipt, Add Trip, Submit Claim]
        events: [Claim Drafted, Receipt Attached, Trip Added, Claim Submitted, Submission Refused]
        invariants:
          - {statement: "every claim line of 25 EUR or more has a receipt, unless its category is per diem", rules: [BR-2]}
      - id: AG-2
        name: Claim Decision
        root: claim decision
        entities:
          - {name: claim decision, attributes: [claim has approver, claim has risk flag]}
        valueObjects: []
        commands: [Route Claim, Set Risk Flag, Approve Claim, Reject Claim]
        events: [Claim Routed, Risk Flag Set, Claim Approved, Claim Rejected]
        invariants:
          - {statement: "approver is not the claim's employee", rules: [BR-5]}
          - {statement: "a line over its policy limit has a justification and the approver is a director", rules: [BR-3]}
      - id: AG-3
        name: Export Record
        root: export record
        entities:
          - {name: export record, attributes: []}
        valueObjects: []
        commands: [Export Claim]
        events: [Claim Exported]
        invariants: []
    events:
      - {name: Claim Drafted}
      - {name: Receipt Attached}
      - {name: Trip Added}
      - {name: Claim Submitted, pivotal: true}
      - {name: Submission Refused}
      - {name: Claim Routed}
      - {name: Risk Flag Set}
      - {name: Claim Approved, pivotal: true}
      - {name: Claim Rejected}
      - {name: Claim Exported, pivotal: true}
    policies:
      - {id: POL-1, name: Routing Policy, when: [Claim Submitted], then: [Route Claim], execution: automatic}
      - {id: POL-2, name: Export Policy, when: [Claim Approved], then: [Export Claim], execution: automatic}
    readModels:
      - {name: Claims To Decide View, informs: [Approver], updatedBy: [Claim Routed], fields: [claim has total, claim has risk flag]}
      - {name: My Claims View, informs: [Employee], updatedBy: [Claim Submitted, Claim Approved, Claim Rejected], fields: [claim has total, claim has submission date]}
      - {name: Export Status View, informs: [Finance operator], updatedBy: [Claim Exported, Claim Paid], fields: [claim has total]}
    externalSystems: []   # the Accounting ledger lives in the acc context; no edge of its own reaches into exp
---
# The Spec of CAP-1. Stories are the employee's side (Connextra) and cover requirements; requirements are the
# system's side (EARS) and enforce rules; acceptance scenarios (Given/When/Then) carry concrete values. Every command,
# event and read model is the DomainModel's, every rule BR-n, every quality QS-n.
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata: {name: submit-a-claim.r1}
spec:
  identity: {id: submit-a-claim, revision: 1}
  content:
    businessRules: expenses-rules
    title: Submit a claim
    prd: expense-claims
    capability: CAP-1
    architecture: expense-claims-architecture
    domainModel: expenses-model
    stories:
      - id: US-1
        role: employee
        goal: build a claim from claim lines and attach a receipt to each line that needs one
        benefit: the claim is complete before anyone else sees it (G-2)
        requirements: [FR-1, FR-2]
        commands: [Draft Claim, Attach Receipt]
        events: [Claim Drafted, Receipt Attached]
        acceptance:
          - id: AC-1
            title: A 30 EUR meals line without a receipt shows the claim as not complete
            given: [a drafted claim with one meals line of 30 EUR and no receipt]
            when: [the employee opens the claim]
            then: [the claim shows as not complete, naming the meals line and BR-2]
          - id: AC-2
            title: Attaching the receipt completes the claim
            given: [a drafted claim with one meals line of 30 EUR and no receipt]
            when: [the employee attaches a receipt to the meals line]
            then: [the receipt shows on the meals line, the claim shows as complete]
          - id: AC-3
            title: A per diem line needs no receipt
            given: [a drafted claim with one per diem line of 120 EUR and no receipt]
            when: [the employee opens the claim]
            then: [the claim shows as complete]
          # AC-8 and AC-9 came after AC-7, found by the auditor (27-spec-process.md): a scenario added later takes the next
          # number under its own story
          - id: AC-8
            title: Drafting a claim records each line
            given: [no claim of the employee]
            when: [the employee drafts a claim with one taxi line of 24.99 EUR dated 2026-03-02 and no receipt]
            then: [the claim shows one taxi line of 24.99 EUR dated 2026-03-02, the claim shows as complete]
          - id: AC-9
            title: A 25.00 EUR taxi line without a receipt shows the claim as not complete
            given: [a drafted claim with one taxi line of 25.00 EUR and no receipt]
            when: [the employee opens the claim]
            then: [the claim shows as not complete, naming the taxi line and BR-2]
      - id: US-2
        role: employee
        goal: submit a claim and learn at once which line and which rule hold it back
        benefit: a claim that reaches an approver never comes back for paperwork (G-2)
        requirements: [FR-3, FR-4, FR-5]
        commands: [Submit Claim]
        events: [Claim Submitted, Submission Refused]
        acceptance:
          - id: AC-4
            title: A complete claim is submitted
            given: [a complete claim with two lines of 30 EUR and 40 EUR, each with a receipt, both under their category's policy limit]
            when: [the employee submits the claim]
            then: [the claim is recorded as submitted with today's date as submission date]
          - id: AC-5
            title: A line over its policy limit without a justification refuses the submission
            given: [a complete claim with one equipment line of 900 EUR and its receipt, policy limit 500 EUR, no justification]
            when: [the employee submits the claim]
            then: [the submission is refused, the refusal names the equipment line and BR-3, the claim, its line and its receipt are unchanged]
          - id: AC-6
            title: A missing receipt refuses the submission
            given: [a claim with one meals line of 30 EUR and no receipt]
            when: [the employee submits the claim]
            then: [the submission is refused, the refusal names the meals line and BR-2]
      - id: US-3
        role: employee
        goal: see each claim of mine with its total and submission date
        benefit: no mail to the approver asking where a claim is (G-1)
        requirements: [FR-6]
        readModels: [My Claims View]
        events: [Claim Submitted]
        acceptance:
          - id: AC-7
            title: My claims list shows total and submission date
            given: [an employee with one claim of 70 EUR submitted on 2026-09-28 and one claim of 130 EUR submitted on 2026-10-01]
            when: [the employee opens My Claims View]
            then: [two claims show, the first with total 70 EUR and submission date 2026-09-28, the second with total 130 EUR and submission date 2026-10-01]
    requirements:
      - {id: FR-1, pattern: event-driven, statement: "When the employee drafts a claim, the system shall record each claim line's amount, date and category."}
      - {id: FR-2, pattern: state-driven, statement: "While a claim line breaks BR-2, the system shall show the claim as not complete and name the line with the rule it breaks.", rules: [BR-2]}
      - {id: FR-3, pattern: event-driven, statement: "When the employee submits a claim whose claim lines all honour BR-2 and BR-3, the system shall record the claim as submitted with the submission date.", rules: [BR-2, BR-3]}
      - {id: FR-4, pattern: unwanted-behaviour, statement: "If a claim line breaks BR-2 or BR-3, then the system shall refuse the submission and name every such line with the rule it breaks.", rules: [BR-2, BR-3]}
      - {id: FR-5, pattern: unwanted-behaviour, statement: "If the submission is refused, then the system shall keep the claim and every claim line and receipt unchanged."}
      - {id: FR-6, pattern: ubiquitous, statement: "The system shall list the employee's own claims with each claim's total and submission date."}
    qualities:
      - {scenario: QS-1}
      - {scenario: QS-3}
    openQuestions:
      - id: Q-1
        question: After a refused submission, may the employee edit the refused lines in place, or is the refusal the end of that claim and a new draft starts?
      - id: Q-2
        question: Is a claim line's amount entered in the currency paid (the Glossary term) or in EUR (the fact type and BR-2)? Accounting converts at booking.
      - id: Q-3
        question: CAP-1 refuses a submission that breaks BR-2, so no submitted claim is incomplete; CAP-2 and BR-9 route an incomplete claim back to the employee. Which holds?
        resolution: CAP-1's; BR-9 is withdrawn and the refusal returns the claim to the employee.
---
# The Design of BB-1's claims API, one asset for CAP-1, CAP-2 and CAP-4: every command and read model the block's
# responsibility names, as OpenAPI 3.1 embedded whole; the elements index says what each operation realises. The caller
# is the SSO identity (C-3), so no operation takes an employee as a parameter (QS-3).
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata: {name: claims-api.r1}
spec:
  identity: {id: claims-api, revision: 1}
  content:
    businessRules: expenses-rules
    title: Claims API
    type: http-api
    architecture: expense-claims-architecture
    block: BB-1
    interface: claims API
    domainModel: expenses-model
    document:
      mediaType: application/openapi+yaml
      content: |
        openapi: 3.1.0
        info: {title: Claims API, version: "1", description: the caller is the SSO identity; an employee sees their own claims, an approver those routed to them, finance the export status of every approved claim}
        components:
          parameters:
            claimId: {name: claimId, in: path, required: true, schema: {type: string}}
            lineId: {name: lineId, in: path, required: true, schema: {type: string}}
          schemas:
            ClaimDraft: {type: object, required: [lines], properties: {lines: {type: array, items: {allOf: [{$ref: "#/components/schemas/ClaimLineDraft"}, {not: {required: [category], properties: {category: {const: per diem}}}}], description: a per diem line only a trip adds (BR-4)}}}}
            ClaimLineDraft: {type: object, required: [amount, date, category], properties: {amount: {type: number}, date: {type: string, format: date}, category: {enum: [travel, meals, lodging, equipment, per diem, other]}, justification: {type: string}}}
            ClaimLine:
              allOf:
                - {$ref: "#/components/schemas/ClaimLineDraft"}
                - {type: object, required: [id, receipt], properties: {id: {type: string}, receipt: {type: boolean, description: a receipt is attached}}}
            Finding: {type: object, required: [rule], properties: {lineId: {type: string, description: the line the rule is broken on; absent for a rule over the whole claim (BR-5)}, rule: {type: string, pattern: "^BR-[0-9]+$"}}}
            Claim:
              type: object
              required: [id, employee, total, complete, findings, lines]
              properties:
                id: {type: string}
                employee: {type: string}
                total: {type: number}
                complete: {type: boolean}
                findings: {type: array, items: {$ref: "#/components/schemas/Finding"}, description: every line that breaks a rule, with the rule}
                submissionDate: {type: string, format: date}
                approver: {type: string}
                riskFlag: {type: boolean}
                route: {enum: [finance-review, auto-approve, approver]}
                reason: {type: string, description: the reason of the approval or rejection}
                lines: {type: array, items: {$ref: "#/components/schemas/ClaimLine"}}
            ClaimSummary: {type: object, required: [id, total], properties: {id: {type: string}, total: {type: number}, submissionDate: {type: string, format: date}}}
            ClaimToDecide: {type: object, required: [id, total, riskFlag], properties: {id: {type: string}, total: {type: number}, riskFlag: {type: boolean}}}
            ExportStatus: {type: object, required: [id, total], properties: {id: {type: string}, total: {type: number}, exportRecord: {type: string, description: the export record of the claim; absent while it waits}}}
            Trip: {type: object, required: [days, destinationCountry, date], properties: {days: {type: integer, minimum: 1}, destinationCountry: {type: string}, date: {type: string, format: date, description: the first day; the per diem line's date}}}
            Refusal: {type: object, required: [findings], properties: {findings: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Finding"}}}}
            Decision: {type: object, required: [reason], properties: {reason: {type: string}}}
        paths:
          /claims:
            post:
              operationId: draftClaim
              requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ClaimDraft"}}}}
              responses: {"201": {description: the drafted claim, content: {application/json: {schema: {$ref: "#/components/schemas/Claim"}}}}}
          /claims/mine:
            get:
              operationId: myClaims
              responses: {"200": {description: the caller's claims, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ClaimSummary"}}}}}}
          /claims/to-decide:
            get:
              operationId: claimsToDecide
              responses: {"200": {description: the claims routed to the caller as approver, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ClaimToDecide"}}}}}}
          /claims/exports:
            get:
              operationId: exportStatus
              responses: {"200": {description: every approved claim, exported or waiting, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ExportStatus"}}}}}}
          /claims/{claimId}:
            parameters: [{$ref: "#/components/parameters/claimId"}]
            get:
              operationId: getClaim
              responses: {"200": {description: the claim with its lines and findings, for its employee, its approver or finance, content: {application/json: {schema: {$ref: "#/components/schemas/Claim"}}}}}
          /claims/{claimId}/lines/{lineId}/receipt:
            parameters: [{$ref: "#/components/parameters/claimId"}, {$ref: "#/components/parameters/lineId"}]
            get:
              operationId: getReceipt
              responses: {"200": {description: the receipt as stored, read by its digest, content: {application/octet-stream: {schema: {type: string, format: binary}}}}}
            put:
              operationId: attachReceipt
              requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
              responses: {"200": {description: the claim with the receipt on the line, content: {application/json: {schema: {$ref: "#/components/schemas/Claim"}}}}}
          /claims/{claimId}/trips:
            parameters: [{$ref: "#/components/parameters/claimId"}]
            post:
              operationId: addTrip
              requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Trip"}}}}
              responses: {"200": {description: the claim with its per diem line, content: {application/json: {schema: {$ref: "#/components/schemas/Claim"}}}}}
          /claims/{claimId}/submission:
            parameters: [{$ref: "#/components/parameters/claimId"}]
            post:
              operationId: submitClaim
              responses:
                "200": {description: submitted, content: {application/json: {schema: {$ref: "#/components/schemas/Claim"}}}}
                "422": {description: refused; every broken line with its rule, content: {application/json: {schema: {$ref: "#/components/schemas/Refusal"}}}}
          /claims/{claimId}/route:
            parameters: [{$ref: "#/components/parameters/claimId"}]
            post:
              operationId: routeClaim
              responses: {"200": {description: the claim with its recorded route, content: {application/json: {schema: {$ref: "#/components/schemas/Claim"}}}}}
          /claims/{claimId}/approval:
            parameters: [{$ref: "#/components/parameters/claimId"}]
            post:
              operationId: approveClaim
              requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Decision"}}}}
              responses:
                "200": {description: approved, content: {application/json: {schema: {$ref: "#/components/schemas/Claim"}}}}
                "422": {description: refused; the caller is the claim's employee or not a director where one is needed, content: {application/json: {schema: {$ref: "#/components/schemas/Refusal"}}}}
          /claims/{claimId}/rejection:
            parameters: [{$ref: "#/components/parameters/claimId"}]
            post:
              operationId: rejectClaim
              requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Decision"}}}}
              responses:
                "200": {description: rejected with the reason, content: {application/json: {schema: {$ref: "#/components/schemas/Claim"}}}}
                "422": {description: refused; the caller is the claim's employee, content: {application/json: {schema: {$ref: "#/components/schemas/Refusal"}}}}
    elements:
      - {id: EL-1, name: POST /claims, realises: {kind: command, name: Draft Claim}}
      - {id: EL-2, name: "PUT /claims/{claimId}/lines/{lineId}/receipt", realises: {kind: command, name: Attach Receipt}}
      - {id: EL-3, name: "POST /claims/{claimId}/submission", realises: {kind: command, name: Submit Claim}, rules: [BR-2, BR-3]}
      - {id: EL-4, name: GET /claims/mine, realises: {kind: readModel, name: My Claims View}}
      - {id: EL-5, name: "POST /claims/{claimId}/trips", realises: {kind: command, name: Add Trip}, rules: [BR-4]}
      - {id: EL-6, name: "POST /claims/{claimId}/route", realises: {kind: command, name: Route Claim}, rules: [BR-7, BR-8, BR-10]}
      - {id: EL-7, name: "POST /claims/{claimId}/approval", realises: {kind: command, name: Approve Claim}, rules: [BR-3, BR-5]}
      - {id: EL-8, name: "POST /claims/{claimId}/rejection", realises: {kind: command, name: Reject Claim}, rules: [BR-5]}
      - {id: EL-9, name: GET /claims/to-decide, realises: {kind: readModel, name: Claims To Decide View}}
      - {id: EL-10, name: GET /claims/exports, realises: {kind: readModel, name: Export Status View}}
      - {id: EL-11, name: "GET /claims/{claimId}", realises: {kind: aggregate, name: AG-1}}
      - {id: EL-12, name: "GET /claims/{claimId}/lines/{lineId}/receipt", realises: {kind: aggregate, name: AG-1}}
    rules: [BR-2, BR-3, BR-4, BR-5, BR-7, BR-8, BR-10]
    decisions: [adr-receipts-as-blobs, adr-routing-in-core]
    openQuestions:
      - id: Q-1
        question: Is a claim line's amount in EUR or in the currency paid? The Glossary term says currency paid, the fact type says EUR; the schema leaves `amount` unitless until that is settled.
      - id: Q-2
        question: The DomainModel names no fact type for a rejection reason, yet the approver rejects with one (Architecture context); `Decision.reason` is unmodelled.
---
# The Plan of CAP-1's Spec: four tasks in build order, each on one block, together covering FR-1..FR-6 and verified by
# AC-1..AC-7. Tasks on BB-1 realise operations of the claims API Design; BB-2 has no Design yet, which is Q-1.
apiVersion: sdd.persimmon.ai/v1
kind: Plan
metadata: {name: submit-a-claim-plan.r1}
spec:
  identity: {id: submit-a-claim-plan, revision: 1}
  content:
    title: Submit a claim, plan
    spec: submit-a-claim
    architecture: expense-claims-architecture
    designs: [claims-api]
    tasks:
      - id: T-1
        title: Claim aggregate with Draft Claim and Attach Receipt
        description: The Claim aggregate, its lines, the BR-2 completeness check as a read of the claim, and the two operations that build a draft.
        block: BB-1
        covers: [FR-1, FR-2]
        verifiedBy: [AC-1, AC-3, AC-8, AC-9, QS-3]  # QS-3: the receipt URL names a claim id; another employee's is refused
        elements:
          - {design: claims-api, element: EL-1}
          - {design: claims-api, element: EL-2}
      - id: T-2
        title: Receipt store put and get by digest
        description: Store a receipt by content, hand back its digest for the claim line; the claim's access rule applies on get.
        block: BB-2
        covers: []            # groundwork: no requirement of this Spec names the store; AC-2 needs it
        verifiedBy: [AC-2]
        dependsOn: [T-1]
      - id: T-3
        title: Submit Claim with refusal naming line and rule
        description: The submission operation; BR-2 and BR-3 checked over every line, a refusal names each breaking line with its rule and changes nothing.
        block: BB-1
        covers: [FR-3, FR-4, FR-5]
        verifiedBy: [AC-4, AC-5, AC-6]
        elements:
          - {design: claims-api, element: EL-3}
        dependsOn: [T-1, T-2]
      - id: T-4
        title: My Claims View
        description: The employee's list of own claims with total and submission date, updated on Claim Submitted.
        block: BB-1
        covers: [FR-6]
        verifiedBy: [AC-7]
        elements:
          - {design: claims-api, element: EL-4}
        dependsOn: [T-3]
    openQuestions:
      - id: Q-1
        question: BB-2's blob API has no Design yet; T-2 names no element until one exists. Write the Design before T-2 starts, or let T-2 produce it?
---
# The project's test tools, recorded once by the Tester (39-test-process.md): vitest for unit, a Bruno collection for the
# claims API, its script starting the app first. No ui Design yet, so no e2e level.
apiVersion: sdd.persimmon.ai/v1
kind: TestHarness
metadata: {name: expense-claims-architecture-harness.r1}
spec:
  identity: {id: expense-claims-architecture-harness, revision: 1}
  content:
    architecture: expense-claims-architecture
    levels:
      unit:
        tool: vitest 3.2
        run: [npx, vitest, run, --reporter=junit, --outputFile=junit.xml]
        one: [npx, vitest, run, -t, "{test}", --reporter=junit, --outputFile=junit.xml]
        affected: [npx, vitest, related, "{files}", --run, --reporter=junit, --outputFile=junit.xml]
        fullOn: [package-lock.json, vitest.config.ts]
        junit: junit.xml
        paths: ["src/**"]
        testDir: test
        seed: claim > a drafted claim starts with no lines
        conventions: One file per aggregate under test/, named after it; a test's title opens with the case it runs, `CAP-1/TC-3 a per diem line needs no receipt`; no database, the aggregate is built from its events.
        coverage: {report: coverage/cobertura-coverage.xml}
      api:
        tool: Bruno 2.3
        run: [sh, scripts/api.sh]
        one: [sh, scripts/api.sh, "{test}"]
        junit: junit-api.xml
        paths: ["src/**", "api/**"]
        testDir: api
        seed: the app answers its health check
        conventions: One .bru request per test under api/claims/, its test() named with the case it runs; scripts/api.sh starts the app on port 3996 with an empty store, waits for /health, runs `bru run --env local --reporter-junit junit-api.xml` and stops it; the caller is set by the X-Test-Employee header the local env sends.
    app:
      start: [npm, run, dev]
      ready: http://localhost:3996/health
    openQuestions: []
---
# The test cases of CAP-1's Spec, designed before T-1 is built (39-test-process.md): a scenario whose When is a request is an
# api case, a rule inside the Claim aggregate a unit case. T-1's cases are TC-1, TC-3, TC-8, TC-9 and TC-10.
apiVersion: sdd.persimmon.ai/v1
kind: TestDesign
metadata: {name: submit-a-claim-tests.r1}
spec:
  identity: {id: submit-a-claim-tests, revision: 1}
  content:
    spec: submit-a-claim
    harness: expense-claims-architecture-harness
    cases:
      - id: TC-1
        title: a meals line without a receipt keeps the claim not complete
        verifies: [AC-1, FR-2, BR-2]
        level: api
        priority: P0
        execution: automated
        preconditions: [employee E-1 signed in]
        steps:
          - {action: "POST /claims with one meals line of 30 EUR dated 2026-03-02 and no receipt", expected: 201 with the claim id}
          - {action: "GET /claims/{claimId}", expected: "complete is false"}
        expected: the claim is not complete and names the meals line and BR-2
      - id: TC-2
        title: attaching a receipt completes the claim
        verifies: [AC-2, FR-2]
        level: api
        priority: P1
        execution: automated
        preconditions: [employee E-1 signed in, a drafted claim with one meals line of 30 EUR and no receipt]
        steps:
          - {action: "PUT /claims/{claimId}/lines/{lineId}/receipt with a PNG receipt", expected: "204"}
          - {action: "GET /claims/{claimId}", expected: the line shows its receipt}
        expected: the receipt shows on the meals line and the claim is complete
      - id: TC-3
        title: a per diem line needs no receipt
        verifies: [AC-3, BR-2]
        level: unit
        priority: P1
        execution: automated
        expected: a claim with one per diem line of 120 EUR and no receipt is complete
      - id: TC-4
        title: a complete claim is submitted with today's date
        verifies: [AC-4, FR-3]
        level: api
        priority: P0
        execution: automated
        preconditions: [employee E-1 signed in, a complete claim with lines of 30 EUR and 40 EUR, each with a receipt]
        steps:
          - {action: "POST /claims/{claimId}/submission", expected: "200"}
        expected: the claim is submitted with today's date as submission date
      - id: TC-5
        title: a line over its policy limit refuses the submission and changes nothing
        verifies: [AC-5, FR-4, FR-5, BR-3]
        level: api
        priority: P0
        execution: automated
        preconditions: [employee E-1 signed in, a complete claim with one equipment line of 900 EUR and its receipt, no justification]
        steps:
          - {action: "POST /claims/{claimId}/submission", expected: 422 naming the equipment line and BR-3}
          - {action: "GET /claims/{claimId}", expected: "the claim, its line and its receipt as before"}
        expected: the submission is refused naming the equipment line and BR-3, and nothing changed
      - id: TC-6
        title: a line without a receipt refuses the submission
        verifies: [AC-6, FR-4, BR-2]
        level: api
        priority: P1
        execution: automated
        preconditions: [employee E-1 signed in, a claim with one meals line of 30 EUR and no receipt]
        steps:
          - {action: "POST /claims/{claimId}/submission", expected: 422 naming the meals line and BR-2}
        expected: the submission is refused naming the meals line and BR-2
      - id: TC-7
        title: my claims list each claim's total and submission date
        verifies: [AC-7, FR-6]
        level: api
        priority: P2
        execution: automated
        preconditions: [employee E-1 with a claim of 70 EUR submitted on 2026-09-28 and one of 130 EUR submitted on 2026-10-01]
        steps:
          - {action: GET /claims/mine, expected: 200 with two claims}
        expected: both claims listed with their totals and submission dates
      - id: TC-8
        title: drafting a claim records each line's amount, date and category
        verifies: [AC-8, FR-1]
        level: unit
        priority: P1
        execution: automated
        expected: the claim holds one taxi line of 24.99 EUR dated 2026-03-02 and is complete
      - id: TC-9
        title: a taxi line at the receipt threshold needs a receipt
        verifies: [AC-9, BR-2]
        level: unit
        priority: P1
        execution: automated
        expected: a claim with one taxi line of 25.00 EUR and no receipt is not complete and names the taxi line and BR-2
      - id: TC-10
        title: a request naming another employee's claim is refused and logged
        verifies: [QS-3]
        level: api
        priority: P0
        execution: automated
        preconditions: [employee E-1 signed in, a claim of employee E-2]
        steps:
          - {action: "GET /claims/{claimId} of E-2's claim", expected: "404"}
          - {action: "PUT /claims/{claimId}/lines/{lineId}/receipt on E-2's claim", expected: "404"}
        expected: both refused, and each refusal is in the access log
    openQuestions: []
