# Closure resolved when WorkflowRun prd-create-001 is stored. No run identity, no engine metadata.
version: 1
resources:
  - apiVersion: persimmon.ai/v1
    kind: Executor
    metadata: {name: claude-agent, namespace: demo}
    spec:
      type: agent
      adapter: claude-code/v1
      configuration: {model: claude-opus-5, sandbox: workspace-write}
      security: {networkAccess: allowlist, allowedHosts: [api.anthropic.com, github.com], credentialBindings: [demo/github-token]}
  - apiVersion: persimmon.ai/v1
    kind: KindDefinition
    metadata: {name: executors.persimmon.ai}
    spec: {group: persimmon.ai, names: {kind: Executor, plural: executors}, scope: Any, versions: [{name: v1, schema: {type: object, properties: {adapter: {type: string, x-persimmon-adapter: {roles: [executor]}}}}}], mutability: SpecMutable, snapshot: Definition, handlerRef: {name: executor}}
  - apiVersion: persimmon.ai/v1
    kind: KindDefinition
    metadata: {name: productrequirements.engineering.persimmon.ai}
    spec: {group: engineering.persimmon.ai, names: {kind: ProductRequirement, plural: productrequirements}, scope: Namespaced, versions: [{name: v1, schema: {type: object, required: [title]}}], mutability: Immutable, revisioned: true, snapshot: "None"}
  - apiVersion: persimmon.ai/v1
    kind: KindDefinition
    metadata: {name: prompts.persimmon.ai}
    spec: {group: persimmon.ai, names: {kind: Prompt, plural: prompts}, scope: Any, versions: [{name: v1, schema: {type: object}}], mutability: SpecMutable, snapshot: Definition}
  - apiVersion: persimmon.ai/v1
    kind: KindDefinition
    metadata: {name: researchreports.engineering.persimmon.ai}
    spec: {group: engineering.persimmon.ai, names: {kind: ResearchReport, plural: researchreports}, scope: Namespaced, versions: [{name: v1, schema: {type: object, required: [title, findings]}}], mutability: Immutable, revisioned: true, snapshot: "None"}
  - apiVersion: persimmon.ai/v1
    kind: KindDefinition
    metadata: {name: skills.persimmon.ai}
    spec: {group: persimmon.ai, names: {kind: Skill, plural: skills}, scope: Any, versions: [{name: v1, schema: {type: object}}], mutability: SpecMutable, snapshot: Definition}
  - apiVersion: persimmon.ai/v1
    kind: KindDefinition
    metadata: {name: tasks.persimmon.ai}
    spec:
      group: persimmon.ai
      names: {kind: Task, plural: tasks}
      scope: Any
      versions: [{name: v1, schema: {type: object, properties: {executorRef: {x-persimmon-ref: {kinds: [Executor]}}, action: {properties: {context: {items: {properties: {ref: {x-persimmon-ref: {kinds: [Prompt, Skill]}}}}}}}, outputs: {additionalProperties: {properties: {type: {properties: {artifactKind: {x-persimmon-kind-ref: {}}}}}}}}}}]
      mutability: SpecMutable
      snapshot: Definition
      handlerRef: {name: task}
      stepContract: {inputsPath: spec.inputs, outputsPath: spec.outputs, runKind: {group: persimmon.ai, kind: TaskRun}, phasePath: status.phase, outputsValuePath: status.outputs, errorPath: status.error}
  - apiVersion: persimmon.ai/v1
    kind: KindDefinition
    metadata: {name: taskruns.persimmon.ai}
    spec: {group: persimmon.ai, names: {kind: TaskRun, plural: taskruns}, scope: Namespaced, versions: [{name: v1, schema: {type: object}}], mutability: Immutable, snapshot: "None", handlerRef: {name: task}, terminal: {path: status.phase, values: [Succeeded, Failed, Cancelled]}}
  - apiVersion: persimmon.ai/v1
    kind: KindDefinition
    metadata: {name: workflowruns.persimmon.ai}
    spec: {group: persimmon.ai, names: {kind: WorkflowRun, plural: workflowruns}, scope: Namespaced, versions: [{name: v1, schema: {type: object}}], mutability: Immutable, snapshot: "None", snapshotOnCreate: true, handlerRef: {name: workflow}, terminal: {path: status.phase, values: [Succeeded, Failed, Cancelled]}}
  - apiVersion: persimmon.ai/v1
    kind: KindDefinition
    metadata: {name: workflows.persimmon.ai}
    spec: {group: persimmon.ai, names: {kind: Workflow, plural: workflows}, scope: Any, versions: [{name: v1, schema: {type: object}}], mutability: SpecMutable, snapshot: Definition}
  - apiVersion: persimmon.ai/v1
    kind: Prompt
    metadata: {name: write-prd-template, namespace: demo}
    spec:
      mediaType: text/markdown
      content: |
        You are writing a product requirement document.
        Preserve entity ids from the research report.
        One requirement per line, each with an id and a testable statement.
  - apiVersion: persimmon.ai/v1
    kind: Skill
    metadata: {name: prd-writer, namespace: demo}
    spec:
      source: {provider: git, type: repository, id: github.com/persimmon-ai/skills, locator: {remote: https://github.com/persimmon-ai/skills.git, path: prd-writer}, version: 2f9a1c0e7b3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f}
      digest: sha256:9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b
      format: claude-code-skill/v1
  - apiVersion: persimmon.ai/v1
    kind: Task
    metadata: {name: research, namespace: demo}
    spec:
      executorRef: {kind: Executor, name: claude-agent}
      action: {instructions: "Research the checkout v2 problem space."}
      inputs: {repository: {type: {kind: externalResource, provider: git, type: repository}}}
      outputs: {report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ResearchReport}}}}
      timeout: 20m
      sideEffects: none
  - apiVersion: persimmon.ai/v1
    kind: Task
    metadata: {name: write-prd, namespace: demo}
    spec:
      inputs:
        research: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ResearchReport}}}
        repository: {type: {kind: externalResource, provider: git, type: repository}, required: false}
        maxRequirements: {type: {kind: value, schema: {type: integer, minimum: 1}}, required: false, default: {kind: value, value: 12}}
      outputs:
        prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ProductRequirement}}}
      executorRef: {kind: Executor, name: claude-agent}
      action:
        instructions: "Write the PRD. Preserve entity ids. Respect the maxRequirements input."
        context:
          - {kind: file, input: repository, path: AGENTS.md}
          - {kind: artifact, input: research}
          - {kind: prompt, ref: {kind: Prompt, name: write-prd-template}}
          - {kind: skill, ref: {kind: Skill, name: prd-writer}}
        parameters: {effort: high}
      timeout: 30m
      retryPolicy:
        maxAttempts: 3
        backoff: {strategy: exponential, initial: 30s, max: 5m, jitter: full}
        retryOn: [timeout, rate_limit, transient_network]
        abortOn: [permission_denied, invalid_input, schema_violation]
      sideEffects: none
  - apiVersion: persimmon.ai/v1
    kind: Workflow
    metadata: {name: prd-create, namespace: demo}
    spec:
      inputs:
        repository: {type: {kind: externalResource, provider: git, type: repository}}
      outputs:
        prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ProductRequirement}}}
      outputBindings:
        prd: {fromStep: {stepRef: write-prd, output: prd}}
      entry: [research]
      steps:
        - {id: research, uses: {kind: Task, name: research}, inputs: {repository: {fromInput: repository}}, timeout: 25m}
        - {id: write-prd, uses: {kind: Task, name: write-prd}, inputs: {research: {fromStep: {stepRef: research, output: report}}}, timeout: 35m}
      transitions:
        - {id: to-write, from: [{stepRef: research, outcomes: [Succeeded]}], to: [{stepRef: write-prd}]}
        - {id: done, from: [{stepRef: write-prd, outcomes: [Succeeded]}], to: [{terminal: Succeeded}]}
      timeout: 2h
adapters:
  - id: claude-code/v1
    describeDigest: sha256:a3f1c8d2e4b6079f1e2d3c4b5a69788796a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1
