# One of each Action. Each list item validates against reconcile.yaml#/$defs/Action.
- type: createResource
  snapshot: inherit
  resource:
    apiVersion: persimmon.ai/v1
    kind: TaskRun
    metadata: {name: prd-create-001-research, namespace: demo}
    spec:
      taskRef: {kind: Task, name: research}
      stepRef: research
      logicalExecutionId: prd-create-001//research

- type: cancelResource
  ref: {apiVersion: persimmon.ai/v1, kind: TaskRun, namespace: demo, name: prd-create-001-research}

- type: publishArtifact
  kind: {apiVersion: engineering.persimmon.ai/v1, kind: ResearchReport}
  id: research-checkout-v2
  content: {title: "Checkout v2 research", findings: []}
  representations: [{name: markdown, mediaType: text/markdown, digest: sha256:0f1e2d3c4b5a69788796a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4}]

- type: commitScope
  key: prd-create-001//research/1

- type: abandonScope
  key: prd-create-001//research/2

- type: emitEvent
  eventType: review.requested
  payload: {workflowRun: prd-create-001, step: review}

- type: setTimer
  key: deadline
  at: "2026-09-22T09:00:00Z"

- type: clearTimer
  key: deadline

- type: callAdapter
  adapterId: claude-code/v1
  op: execute
  idempotencyKey: prd-create-001//research/1
  payload:
    taskRun: {name: prd-create-001-research, logicalExecutionId: prd-create-001//research, attempt: 1}
