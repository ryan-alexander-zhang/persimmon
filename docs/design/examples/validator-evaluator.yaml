# adapter Validator: an Adapter with Role evaluator scans the PRD; configuration validated by its describe.
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: prd-security-scan, namespace: demo}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ProductRequirement}}}
  evaluator:
    type: adapter
    adapter: threat-model/v1
    configuration: {ruleset: owasp-2025, failOn: high}
  timeout: 15m
