# One domain written with the AI Native pack's artifact kinds (23-pack-ai-native.md): a BoundedContext, its Glossary
# (terms and fact types), BusinessRules with logic, one DecisionTable, the Prd that cites them, two Adrs taken against the
# Prd and the rules, and the Architecture that applies them. Validates after
# `persimmon apply packs/ai-native/global/*.yaml --global`. Prose uses Glossary term names only, never an alias.
apiVersion: sdd.persimmon.ai/v1
kind: BoundedContext
metadata: {name: expenses.r1}
spec:
  identity: {id: expenses, revision: 1}
  content:
    name: Expenses
    purpose: >-
      Owns the life of an expense claim from the moment an employee submits it until it is approved or rejected
      and handed to Accounting for payment. Decides what a claim may contain, who may approve it, and when it is final.
    inScope: [claim, claim line, receipt, category, policy limit, approver, director, risk flag, trip, destination country, per diem]
    outOfScope:
      - "employee, reporting line, cost centre membership: Identity context"
      - "payment, ledger posting, currency conversion at booking: Accounting context"
    owner: Finance operations
    relationships:
      - {context: identity, role: downstream, pattern: conformist, note: "we read employees and reporting lines as Identity publishes them"}
      - {context: accounting, role: upstream, pattern: published-language, note: "we publish approved claims as a fixed export record"}
---
apiVersion: sdd.persimmon.ai/v1
kind: Glossary
metadata: {name: expenses-glossary.r1}
spec:
  identity: {id: expenses-glossary, revision: 1}
  content:
    title: Expenses glossary
    context: expenses
    terms:
      - name: claim
        definition: One request by an employee to be reimbursed, made of one or more claim lines, with one status at a time.
        aliases: [reimbursement request]
        related: [claim line, approver]
        status: active
      - name: claim line
        definition: "One cost on a claim: date, category, amount in the currency paid, and the receipt that proves it."
        aliases: [line item, expense]
        related: [claim, receipt, category]
        status: active
      - name: receipt
        definition: The document that proves a claim line was paid; an image or PDF attached to the line.
        aliases: [proof of payment, invoice]
        related: [claim line]
        status: active
      - name: category
        definition: The kind of cost a claim line is; each category has one policy limit.
        aliases: [expense type]
        related: [claim line, policy limit]
        status: active
      - name: policy limit
        definition: The largest amount a category allows per claim line without a written justification.
        aliases: [cap]
        related: [claim line, category]
        status: active
      - name: employee
        definition: "As in Identity: a person on the payroll with one reporting line. Borrowed; Identity owns it."
        related: [claim, approver]
        status: active
      - name: approver
        definition: The person who decides a claim, as Identity reports the employee's reporting line on the day of submission.
        aliases: [reviewer]
        related: [claim, employee, director]
        status: active
      - name: director
        definition: An approver two or more levels above the employee in the reporting line, as Identity reports it.
        related: [approver]
        status: active
      - name: risk flag
        definition: A mark Finance puts on a claim that matches a fraud pattern; set by the risk check, never by the employee.
        related: [claim]
        status: active
      - name: trip
        definition: A period of travel days on one claim, with one destination country.
        related: [per diem, destination country]
        status: active
      - name: destination country
        definition: The country a trip goes to; it sets the daily rate for per diem.
        related: [trip, per diem]
        status: active
      - name: per diem
        definition: A fixed daily allowance for the days of a trip that replaces receipts for meals; one claim line per trip.
        aliases: [daily allowance]
        related: [claim line, trip]
        status: active
      - name: auditor
        definition: A person outside Finance who checks, years later, that every reimbursed cost had an unchanged receipt.
        related: [receipt]
        status: active
      - name: export record
        definition: "As in Accounting: the fixed record of one approved claim that Accounting books and pays. Borrowed; Accounting owns it."
        related: [claim]
        status: active
      - name: expense report
        definition: Old name for claim.
        status: deprecated
        replacedBy: claim
    factTypes:
      - {name: claim has approver, subject: claim, predicate: has, object: approver, status: active}
      - {name: claim has employee, subject: claim, predicate: has, object: employee, status: active}
      - {name: claim has risk flag, subject: claim, predicate: has, object: {type: boolean}, status: active}
      - {name: claim has total, subject: claim, predicate: has, object: {type: decimal, unit: EUR}, status: active}
      - {name: claim has submission date, subject: claim, predicate: has, object: {type: date}, status: active}
      - {name: claim is complete, subject: claim, predicate: is, object: {type: boolean}, description: "every claim line that needs a receipt has one", status: active}
      - {name: claim line has amount, subject: claim line, predicate: has, object: {type: decimal, unit: EUR}, status: active}
      - {name: claim line has date, subject: claim line, predicate: has, object: {type: date}, status: active}
      - {name: claim line has receipt, subject: claim line, predicate: has, object: {type: boolean}, status: active}
      - {name: claim line has justification, subject: claim line, predicate: has, object: {type: boolean}, status: active}
      - {name: claim line has category, subject: claim line, predicate: has, object: {type: enum, values: [travel, meals, lodging, equipment, per diem, other]}, status: active}
      - {name: category has policy limit, subject: category, predicate: has, object: {type: decimal, unit: EUR}, status: active}
      - {name: approver is director, subject: approver, predicate: is, object: {type: boolean}, status: active}
      - {name: approver is employee, subject: approver, predicate: is, object: {type: boolean}, description: "the approver is the claim's own employee", status: active}
      - {name: trip has days, subject: trip, predicate: has, object: {type: integer, unit: days}, status: active}
      - {name: destination country has daily rate, subject: destination country, predicate: has, object: {type: decimal, unit: EUR}, status: active}
