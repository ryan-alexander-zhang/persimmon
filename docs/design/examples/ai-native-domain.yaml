apiVersion: sdd.persimmon.ai/v1
kind: BusinessRules
metadata: {name: expenses-rules.r1}
spec:
  identity: {id: expenses-rules, revision: 1}
  content:
    title: Expense claim rules
    context: expenses
    owner: Finance operations
    rules:
      - id: BR-1
        type: fact
        factType: claim has approver
        statement: A claim must have exactly one approver, the one Identity reports for the employee on the day the claim is submitted.
        rationale: Reporting lines change; the approver must not change under a claim in flight.
        source: Finance policy FP-12 §3
        status: active
      - id: BR-2
        type: constraint
        statement: A claim line of 25 EUR or more must have a receipt attached before the claim can be submitted, unless its category is per diem.
        rationale: Tax audit requires proof for every reimbursed cost above the small-amount limit; per diem is an allowance, not a cost paid.
        source: Tax code, small-amount receipts rule
        effectiveFrom: 2024-01-01
        status: active
        examples: ["24.99 EUR taxi, no receipt: allowed", "25.00 EUR taxi, no receipt: refused at submit", "120 EUR per diem, no receipt: allowed"]
        logic:
          inputs:
            - {name: amount, factType: claim line has amount}
            - {name: receipt, factType: claim line has receipt}
            - {name: category, factType: claim line has category}
          when:
            all:
              - {field: amount, op: gte, value: 25}
              - {field: receipt, op: eq, value: false}
              - {field: category, op: ne, value: per diem}
          then: {violation: "claim line of 25 EUR or more without a receipt"}
      - id: BR-3
        type: constraint
        statement: A claim line above its category's policy limit must carry a written justification, and its claim's approver must be a director.
        rationale: Exceptions are allowed but visible and signed one level higher.
        source: Finance policy FP-12 §5
        status: active
        logic:
          inputs:
            - {name: amount, factType: claim line has amount}
            - {name: limit, factType: category has policy limit}
            - {name: justification, factType: claim line has justification}
            - {name: director, factType: approver is director}
          when:
            all:
              - {field: amount, op: gt, value: {field: limit}}
              - any:
                  - {field: justification, op: eq, value: false}
                  - {field: director, op: eq, value: false}
          then: {violation: "claim line over the policy limit without a justification, or not approved by a director"}
      - id: BR-4
        type: derivation
        statement: The per diem of a trip must be computed as the destination country's daily rate times the trip's days, with the first and the last day at half rate.
        rationale: Matches the statutory allowance table; half days avoid paying meals the employee did not need.
        source: Statutory allowance table, revised yearly
        owner: Payroll
        status: active
        examples: ["3-day trip to a 60 EUR/day country: 30 + 60 + 30 = 120 EUR", "1-day trip: 30 EUR, the one day is both first and last"]
        logic:
          inputs:
            - {name: days, factType: trip has days}
            - {name: rate, factType: destination country has daily rate}
            - {name: perDiem, factType: claim line has amount}
          then: {derive: perDiem, expression: "if days = 1 then rate / 2 else rate * (days - 1)"}
      - id: BR-5
        type: constraint
        statement: An employee must not be the approver of their own claim.
        rationale: Separation of duties.
        source: Internal control IC-4
        status: active
        logic:
          inputs:
            - {name: self, factType: approver is employee}
          when: {field: self, op: eq, value: true}
          then: {violation: "approver is the claim's own employee"}
      - id: BR-6
        type: constraint
        statement: A claim must be submitted within 90 days of the earliest claim line date.
        rationale: Old costs cannot be booked to the right period. Informal; never given logic, withdrawn before the 2026 revision.
        source: Finance policy FP-12 §2
        effectiveTo: 2025-12-31
        status: deprecated
      - id: BR-7
        type: decision
        statement: A submitted claim must be considered routed to auto-approve if it is complete, has no risk flag, and its total is 5000 EUR or less.
        rationale: Nine of ten claims are small and clean; an approver's minute is for the rest.
        source: Finance policy FP-12 §4, 2026 revision
        effectiveFrom: 2026-01-01
        status: active
        logic:
          inputs:
            - {name: complete, factType: claim is complete}
            - {name: risk, factType: claim has risk flag}
            - {name: total, factType: claim has total}
          when:
            all:
              - {field: complete, op: eq, value: true}
              - {field: risk, op: eq, value: false}
              - {field: total, op: lte, value: 5000}
          then: {decision: {route: auto-approve}}
      - id: BR-8
        type: decision
        statement: A submitted claim must be considered routed to finance-review if it has a risk flag, whatever else it holds.
        rationale: Fraud patterns are checked by people trained for it, not by approvers.
        source: Internal control IC-7
        status: active
        logic:
          inputs:
            - {name: risk, factType: claim has risk flag}
          when: {field: risk, op: eq, value: true}
          then: {decision: {route: finance-review}}
      - id: BR-9
        type: decision
        statement: A submitted claim must be considered routed to return-to-employee if it has no risk flag and is not complete.
        rationale: An approver never sees a claim a receipt would have fixed.
        source: Finance policy FP-12 §4
        status: active
        logic:
          inputs:
            - {name: risk, factType: claim has risk flag}
            - {name: complete, factType: claim is complete}
          when:
            all:
              - {field: risk, op: eq, value: false}
              - {field: complete, op: eq, value: false}
          then: {decision: {route: return-to-employee}}
      - id: BR-10
        type: decision
        statement: A submitted claim must be considered routed to approver if it has no risk flag, is complete, and its total is above 5000 EUR.
        rationale: Large clean claims are an approver's call.
        source: Finance policy FP-12 §4
        status: active
        logic:
          inputs:
            - {name: risk, factType: claim has risk flag}
            - {name: complete, factType: claim is complete}
            - {name: total, factType: claim has total}
          when:
            all:
              - {field: risk, op: eq, value: false}
              - {field: complete, op: eq, value: true}
              - {field: total, op: gt, value: 5000}
          then: {decision: {route: approver}}
      - id: BR-11
        type: constraint
        statement: A receipt of an approved claim must be kept unchanged for ten years after the approval.
        rationale: The tax authority may audit any reimbursed cost within the statutory retention period. Informal; retention is enforced by the receipt store, not evaluated per claim.
        source: Tax code, retention of accounting records
        status: active
---
apiVersion: sdd.persimmon.ai/v1
kind: DecisionTable
metadata: {name: claim-routing.r1}
spec:
  identity: {id: claim-routing, revision: 1}
  content:
    title: Claim routing
    context: expenses
    decision: Where does a submitted claim go next?
    owner: Finance operations
    source: Finance policy FP-12 §4, Internal control IC-7
    status: active
    cites: [BR-2, BR-7, BR-8, BR-9, BR-10]
    inputs:
      - {name: risk, factType: claim has risk flag}
      - {name: complete, factType: claim is complete}
      - {name: total, factType: claim has total}
    outputs:
      - {name: route, type: enum, values: [finance-review, return-to-employee, auto-approve, approver]}
    hitPolicy: unique
    rows:
      - {id: R-1, when: {risk: "true", complete: "-", total: "-"}, then: {route: finance-review}, cites: [BR-8]}
      - {id: R-2, when: {risk: "false", complete: "false", total: "-"}, then: {route: return-to-employee}, cites: [BR-9], note: "complete is BR-2 applied to every claim line"}
      - {id: R-3, when: {risk: "false", complete: "true", total: "<= 5000"}, then: {route: auto-approve}, cites: [BR-7]}
      - {id: R-4, when: {risk: "false", complete: "true", total: "> 5000"}, then: {route: approver}, cites: [BR-10], note: "BR-3 may still demand a director"}
---
apiVersion: sdd.persimmon.ai/v1
kind: Prd
metadata: {name: expense-claims.r1}
spec:
  identity: {id: expense-claims, revision: 1}
  content:
    title: Expense claims without the spreadsheet
    problem: >-
      Employees file claims as spreadsheets mailed to their approver with receipts as separate attachments. Finance
      re-keys every claim line into the ledger, chases missing receipts by mail, and cannot tell which claims wait
      on whom. A claim takes a median of 23 days from submission to payment; 18% are returned at least once for a
      missing receipt or a line over the policy limit.
    users:
      - {name: employee, description: Anyone who pays a work cost and wants it back; files a claim a few times a year.}
      - {name: approver, description: Decides claims for the employees in their reporting line; wants to decide in under a minute per claim.}
      - {name: finance operator, description: Finance operations staff who hand approved claims to Accounting and answer audit questions.}
    goals:
      - {id: G-1, statement: An employee gets a decision on a claim within the same working week.}
      - {id: G-2, statement: A claim that reaches an approver is complete and never comes back for paperwork.}
      - {id: G-3, statement: Finance operators read and audit; they never type a claim.}
    nonGoals:
      - Paying the employee; Accounting pays from the export.
      - Corporate card reconciliation.
      - Travel booking or pre-approval of trips.
    capabilities:
      - id: CAP-1
        name: Submit a claim
        description: >-
          An employee builds a claim from claim lines, attaches a receipt to each line that needs one, and submits
          it. The claim refuses submission while a rule is broken and says which line and which rule, so a claim
          that reaches an approver is already complete.
        priority: P1
        context: expenses
        rules: [BR-2, BR-3]
      - id: CAP-2
        name: Route and decide a claim
        description: >-
          A submitted claim is routed by the claim routing decision: a flagged claim to Finance, an incomplete one
          back to the employee, a small clean one approved at once, the rest to the approver. The approver sees the
          claim, every receipt, and every line that needed a justification, and approves or rejects it with a reason.
        priority: P1
        context: expenses
        rules: [BR-1, BR-3, BR-5, BR-7, BR-8, BR-9, BR-10]
      - id: CAP-3
        name: Per diem lines
        description: >-
          An employee adds a trip with its days and destination country; the claim computes the per diem line
          itself and needs no receipt for it.
        priority: P2
        context: expenses
        rules: [BR-2, BR-4]
      - id: CAP-4
        name: Export approved claims
        description: >-
          Approved claims appear to Accounting as export records in the published format, once each, with the
          receipts reachable by reference. Finance operators see which claims are exported and which wait.
        priority: P1
        context: expenses
    successCriteria:
      - {id: SC-1, statement: Median submission-to-approval time is under 3 working days over a full quarter.}
      - {id: SC-2, statement: Fewer than 5% of submitted claims are rejected or returned over a full quarter., capabilities: [CAP-1]}
      - {id: SC-3, statement: Every approved claim in a quarter has exactly one export record and no finance operator typed any of it., capabilities: [CAP-4]}
      - {id: SC-4, statement: An approver decides 9 of 10 claims without opening anything beyond the claim screen., capabilities: [CAP-2]}
    assumptions:
      - Identity publishes every employee's reporting line and cost centre and is correct on the day of submission.
      - Accounting accepts the published export record format and converts currency at booking.
      - Receipts are images or PDFs; paper receipts are photographed by the employee.
    openQuestions:
      - id: Q-1
        question: >-
          Who is the approver of a director's own claim? BR-5 forbids self-approval and BR-1 takes the approver from
          Identity; the top of the reporting line has none.
      - id: Q-2
        question: Is the 90-day submission window (BR-6, deprecated) coming back? Finance mentioned reinstating it next fiscal year.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata: {name: adr-receipts-as-blobs.r1}
spec:
  identity: {id: adr-receipts-as-blobs, revision: 1}
  content:
    title: Store receipts as immutable blobs addressed by digest
    status: accepted
    deciders: [Finance operations, platform team]
    context: >-
      A receipt proves a claim line to an auditor (BR-2); it must be unchanged for ten years (BR-11) and reachable from
      the export record. Employees upload images and PDFs from phones; the same receipt may be attached twice by mistake.
      Taken against the Prd and the rules, before the Architecture.
    drivers: [BR-2, BR-11, SC-3]
    decision: >-
      A receipt is written once to the blob store under its sha256 digest; a claim line references the digest. Nothing
      ever overwrites or deletes a blob within the retention period; the export record carries the digest.
    alternatives:
      - option: Receipts as rows in the claims database
        rejectedBecause: backups and retention would couple audit evidence to the claim lifecycle, and a database row can be updated
      - option: Receipts in the employee's mailbox by link
        rejectedBecause: the mailbox leaves the company with the employee
    consequences:
      - kind: positive
        statement: A duplicate upload is the same digest; the second attach is free and visibly the same receipt.
      - kind: positive
        statement: Audit evidence is content-addressed; an auditor verifies a receipt by hashing it.
      - kind: negative
        statement: A receipt uploaded to the wrong claim cannot be edited, only re-attached; the UI must make re-attach easy.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata: {name: adr-routing-in-core.r1}
spec:
  identity: {id: adr-routing-in-core, revision: 1}
  content:
    title: Evaluate the claim routing decision in the claims core, never in a client
    status: accepted
    deciders: [Finance operations, platform team]
    context: >-
      The route of a submitted claim is the claim routing DecisionTable (BR-7 to BR-10). A client could compute it to
      show the employee the outcome while typing, which an approver's minute (SC-4) would welcome; but a client is
      outside Finance's control and the table changes yearly. Taken against the Prd and the rules, before the Architecture.
    drivers: [BR-7, BR-8, BR-9, BR-10]
    decision: >-
      The claims core evaluates the claim routing table at submission and records the route and the row that fired on
      the claim. Clients display the recorded route; they never compute one.
    alternatives:
      - option: Evaluate in the web client for instant feedback
        rejectedBecause: two implementations of one table drift, and an audit question "why this route" needs the core's record
    consequences:
      - kind: positive
        statement: One evaluation, one record per claim, the row id as the audit answer.
      - kind: neutral
        statement: The employee sees the route after submission, not while typing.
---
apiVersion: sdd.persimmon.ai/v1
kind: Architecture
metadata: {name: expense-claims-architecture.r1}
spec:
  identity: {id: expense-claims-architecture, revision: 1}
  content:
    title: Expense claims architecture
    owner: platform team
    status: accepted
    introduction:
      prd: expense-claims
      qualityGoals:
        - id: QG-1
          quality: reliability
          motivation: The record is the only evidence; a lost or altered claim cannot be rebuilt from mail (G-3).
        - id: QG-2
          quality: security
          motivation: Receipts and amounts are personal and financial data under audit for ten years.
        - id: QG-3
          quality: interaction-capability
          motivation: The approver's screen is where G-1 is won or lost; the phone is where claims are filed.
      stakeholders:
        - {role: employee, expectations: the Prd's; plus a phone-first client}
        - {role: approver, expectations: the Prd's; plus one screen per claim}
        - {role: finance operator, expectations: the Prd's; plus rules and the routing table editable without a release}
        - {role: auditor, expectations: every reimbursed cost traceable to an unchanged receipt for ten years}
    constraints:
      - id: C-1
        kind: organizational
        statement: Finance owns the business rules and the routing table; a change needs no release.
        rationale: the table is revised yearly with policy FP-12
      - id: C-2
        kind: technical
        statement: Receipts and claims stay in the company's EU region; no third-party storage.
      - id: C-3
        kind: technical
        statement: Sign-in and reporting lines come from Identity's SSO and directory; no local accounts.
    context:
      business:
        - {partner: employee, exchanges: "claims, claim lines, receipts, trips", direction: in}
        - {partner: approver, exchanges: "claims to decide; approvals and rejections with reasons", direction: both}
        - {partner: finance operator, exchanges: "risk flags, export status, audit questions", direction: both}
        - {partner: Identity, context: identity, exchanges: "employees, reporting lines, cost centres", direction: in}
        - {partner: Accounting, context: accounting, exchanges: export records with receipt references, direction: out}
      technical:
        - {channel: web and mobile web, protocol: HTTPS, carries: "everything employees, approvers and finance operators exchange"}
        - {channel: directory API, protocol: HTTPS/JSON, carries: employee and reporting line lookups against Identity}
        - {channel: export, protocol: HTTPS API with signed export records, carries: approved claims to Accounting}
    strategy:
      - {id: S-1, decision: "One claims core owns the Expenses context and every rule; clients are thin.", addresses: [QG-1, C-1]}
      - {id: S-2, decision: "Rules and the routing table are data the core loads, revised by Finance without a release.", addresses: [C-1]}
      - {id: S-3, decision: "Receipts are content-addressed blobs; the export carries digests, not copies.", addresses: [QG-2, C-2]}
      - {id: S-4, decision: "Identity is the only source of people; the core stores ids, never names or lines.", addresses: [QG-2, C-3]}
    buildingBlocks:
      - id: BB-1
        name: claims core
        technology: Node service, event store
        responsibility: "the Expenses context: claims, claim lines, trips, per diem, rules, routing, approval state"
        interfaces:
          - {name: claims API, kind: provides, description: "submit, read, decide a claim; list by employee, approver, state"}
          - {name: directory, kind: requires, description: "employee and reporting line by id, from Identity"}
        contexts: [expenses]
      - id: BB-2
        name: receipt store
        technology: object store, EU region
        responsibility: "immutable receipt blobs by digest, retention, access by claim membership"
        interfaces:
          - {name: blob API, kind: provides, description: "put by content, get by digest, with the claim's access rule"}
        contexts: []
      - id: BB-3
        name: risk check
        technology: Node service
        responsibility: sets the risk flag on a submitted claim from Finance's fraud patterns
        interfaces:
          - {name: risk API, kind: provides, description: flag or clear a submitted claim against the fraud patterns}
        contexts: [expenses]
      - id: BB-4
        name: export gateway
        technology: Node service
        responsibility: "one signed export record per approved claim to Accounting, with export status"
        interfaces:
          - {name: export intake, kind: provides, description: takes an approved claim once and owns its export status}
          - {name: Accounting export API, kind: requires, description: export records in Accounting's published language}
        contexts: [expenses]
      - id: BB-5
        name: web client
        technology: browser app
        responsibility: "the employee, approver and finance operator screens over the claims API"
        interfaces:
          - {name: claims API, kind: requires, description: everything shown comes from the core}
        contexts: []
    relations:
      - {id: REL-1, from: employee, to: BB-5, description: builds and submits claims; attaches receipts; adds trips, technology: HTTPS}
      - {id: REL-2, from: approver, to: BB-5, description: reads and decides claims, technology: HTTPS}
      - {id: REL-3, from: finance operator, to: BB-5, description: sets risk flags; follows export status; answers audit questions, technology: HTTPS}
      - {id: REL-4, from: BB-5, to: BB-1, description: every read and command of a claim, interface: claims API, technology: HTTPS/JSON}
      - {id: REL-5, from: BB-1, to: BB-2, description: puts a receipt by content; reads it by digest for the approver, interface: blob API}
      - {id: REL-6, from: BB-1, to: BB-3, description: asks for the risk flag of a submitted claim, interface: risk API}
      - {id: REL-7, from: BB-1, to: Identity, description: employee and reporting line by id, interface: directory, technology: HTTPS/JSON}
      - {id: REL-8, from: BB-1, to: BB-4, description: hands over an approved claim once, interface: export intake}
      - {id: REL-9, from: BB-4, to: Accounting, description: one signed export record per approved claim, interface: Accounting export API, technology: HTTPS API}
    concepts:
      - id: CC-1
        topic: domain
        statement: The Expenses BoundedContext has one model in the claims core; one transaction per claim; a DomainModel artifact will name the aggregates.
      - id: CC-2
        topic: security
        statement: A claim is readable by its employee, its approver, finance operators and auditors; roles come from Identity; every read of a receipt is logged.
      - id: CC-3
        topic: persistence
        statement: Claims are event-sourced in the core so every state and the row that routed it are replayable; receipts are blobs, never rows.
      - id: CC-4
        topic: errors
        statement: A refused submission names the claim line and the BR-n; no other error reaches an employee.
      - id: CC-5
        topic: testing
        statement: Every BR-n with logic and every DecisionTable row has a derived test in the core; the tests are the rules' regression suite.
    domainModels: []
    decisions: [adr-receipts-as-blobs, adr-routing-in-core]
    qualityScenarios:
      - id: QS-1
        qualityGoal: QG-1
        stimulus: the core restarts during a submission
        source: operations
        response: the claim is either fully submitted or not at all; the employee sees which
        measure: zero half-submitted claims in a quarter
      - id: QS-2
        qualityGoal: QG-1
        stimulus: Finance revises the routing table
        response: claims submitted after the revision route by the new table; earlier claims keep their recorded row
        measure: every claim's route explainable by its recorded row and table revision
      - id: QS-3
        qualityGoal: QG-2
        stimulus: an employee opens another employee's claim by URL
        response: refused and logged
        measure: zero cross-employee reads outside the approver and finance roles
      - id: QS-4
        qualityGoal: QG-3
        stimulus: an approver opens a claim with eight lines and eight receipts
        response: the claim, every receipt thumbnail and every justification render on one screen
        measure: under 2 seconds on the office network
    risks:
      - id: RK-1
        kind: risk
        statement: Identity's directory lags a reorganisation and the wrong approver is named for a day.
        probability: medium
        impact: medium
        mitigation: BR-1 pins the approver at submission; Finance can reassign with a logged reason
      - id: RK-2
        kind: debt
        statement: The risk check (BB-3) starts with a fixed list of fraud patterns in its code; Finance cannot edit them without a release, against C-1.
        mitigation: move patterns to data once Finance has written three
    glossaries: [expenses-glossary]
