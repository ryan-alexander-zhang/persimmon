apiVersion: sdd.persimmon.ai/v1
kind: Plan
metadata:
  name: room-booking-prd-cap-6-plan.r1
spec:
  identity:
    id: room-booking-prd-cap-6-plan
    revision: 1
  content:
    title: Monthly Utilisation Report Plan
    spec: room-booking-prd-cap-6
    architecture: room-booking-prd-architecture
    designs:
      - room-booking-prd-architecture-bb-1-http-api
    tasks:
      - id: T-1
        title: Compute monthly utilisation metrics and emit Monthly Utilisation Report Generated
        description: At the end of each calendar month, compute utilisation per room, no-show rate per team, and peak hours of demand from that month's booking history held in the Room Booking Service's store, and generate a Monthly Utilisation Report Generated event summarising them.
        block: BB-1
        covers:
          - FR-1
        verifiedBy: []
      - id: T-2
        title: Serve the Monthly Utilisation Report View
        description: Make the computed utilisation per room, no-show rate per team, and peak hours of demand available to office management as a Monthly Utilisation Report View, queried for a given month over the Room Booking Service's own store.
        block: BB-1
        covers:
          - FR-2
        dependsOn:
          - T-1
        elements:
          - design: room-booking-prd-architecture-bb-1-http-api
            element: EL-8
        verifiedBy:
          - AC-1
          - AC-2
          - AC-3
          - AC-4
    openQuestions:
      - id: Q-1
        question: No Design in context models the 'Monthly Utilisation Report Generated' event itself or the month-end scheduling/computation that produces it (only the GET /reports/monthly-utilisation query in the http-api Design, and the underlying room/booking/booking_limit_config tables in the data-schema Design, are modelled). Which Design covers T-1's event emission and monthly trigger?
      - id: Q-2
        question: "The data-schema Design's own Q-2 asks where a booking owner's team comes from for a no-show-rate-per-team report: captured on the booking row at command time, or joined from the company directory when the report runs. FR-1 and AC-2 need this resolved before T-1's per-team no-show rate computation can be implemented correctly."
