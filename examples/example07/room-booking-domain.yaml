apiVersion: sdd.persimmon.ai/v1
kind: BoundedContext
metadata:
  name: room-booking.r1
spec:
  identity:
    id: room-booking
    revision: 1
  content:
    name: Room Booking
    purpose: "The Room Booking context manages the office's room schedule: it decides which room fits a requested day, time slot, attendee count and optional video need and is free for that slot, creates and releases scheduled bookings, records check-in at the room's door, and releases bookings nobody checks into as no-shows. It also owns walk-in claims on empty rooms and the bounded-time hold such a claim places on a room, since a walk-in claim is itself a booking of the same schedule. It keeps the room status view that tells employees and walk-in employees what is free right now, and produces the monthly utilisation report that tells office management how rooms are actually used."
    inScope:
      - Room Schedule
      - Room
      - Booking
      - Walk-In Hold
      - Room Status View
      - Monthly Utilisation Report View
      - Employee
      - Walk-in Employee
      - Office Management
    outOfScope: []
    classification: supporting
    subdomain: room-booking
    capabilities: [CAP-1, CAP-2, CAP-3, CAP-4, CAP-5, CAP-6]
    relationships: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Glossary
metadata:
  name: room-booking-glossary.r1
spec:
  identity:
    id: room-booking-glossary
    revision: 1
  content:
    title: Room Booking Glossary
    context: room-booking
    terms:
      - name: Room Schedule
        definition: "Consistency boundary for the office's room schedule: decides which room fits and is free for a requested slot, creates and releases scheduled bookings, records check-in, and also owns walk-in claims and their expiry since a walk-in claim is itself a booking of the same schedule."
        status: active
        related:
          - Room
          - Booking
          - Walk-In Hold
      - name: Room
        definition: One of the office's eight meeting rooms (seating 4, 6, 8 or 12, two with video-conferencing equipment) that can be offered and booked for a time slot when its seating capacity and video capability fit the request and it is free.
        status: active
        related:
          - Booking
          - Room Schedule
      - name: Booking
        definition: A confirmed reservation of a room for a day and time slot by an employee, created when a room is booked, and released by cancellation, no-show, or (as a walk-in booking) by hold expiry.
        status: active
        related:
          - Room
          - Walk-In Hold
          - Employee
      - name: Walk-In Hold
        definition: The bounded-time hold a walk-in employee places on a room by checking in at its door with no prior reservation, ending at the earlier of the maximum hold duration or the room's next scheduled booking.
        status: active
        related:
          - Booking
          - Room
          - Walk-in Employee
      - name: Room Status View
        definition: Shows, for every room, whether it is free, who holds it, until when, and what comes next; feeds both the booking decision and the door/floor screens.
        status: active
        related:
          - Room
          - Booking
          - Employee
          - Walk-in Employee
      - name: Monthly Utilisation Report View
        definition: Monthly summary of utilisation per room, no-show rate per team, and peak hours of demand, delivered to office management.
        status: active
        related:
          - Office Management
      - name: Employee
        definition: Finds and books a free room that fits their meeting; also the role that cancels and checks in to its own bookings.
        status: active
        related:
          - Booking
          - Room Status View
      - name: Walk-in Employee
        definition: Claims an empty room on the spot with no prior reservation.
        status: active
        related:
          - Walk-In Hold
          - Room Status View
      - name: Office Management
        definition: Receives the monthly utilisation report covering per-room usage, no-show rate per team, and peak hours.
        status: active
        related:
          - Monthly Utilisation Report View
    factTypes:
      - name: Room has seating capacity
        subject: Room
        predicate: has
        object:
          type: integer
        status: active
      - name: Room has video capability
        subject: Room
        predicate: has
        object:
          type: boolean
        status: active
      - name: Booking has owner
        subject: Booking
        predicate: has
        object: Employee
        status: active
      - name: Booking has room
        subject: Booking
        predicate: has
        object: Room
        status: active
      - name: Booking has start time
        subject: Booking
        predicate: has
        object:
          type: string
        status: active
      - name: Booking has end time
        subject: Booking
        predicate: has
        object:
          type: string
        status: active
      - name: Booking has attendee count
        subject: Booking
        predicate: has
        object:
          type: integer
        status: active
      - name: Booking has video need
        subject: Booking
        predicate: has
        object:
          type: boolean
        status: active
      - name: Booking has check-in time
        subject: Booking
        predicate: has
        object:
          type: string
        status: active
      - name: Booking has status
        subject: Booking
        predicate: has
        object:
          type: enum
          values:
            - booked
            - cancelled
            - checked-in
            - no-show-released
            - walk-in-claimed
            - walk-in-hold-expired
        status: active
      - name: Walk-In Hold has booking
        subject: Walk-In Hold
        predicate: has
        object: Booking
        status: active
      - name: Walk-In Hold has expiry time
        subject: Walk-In Hold
        predicate: has
        object:
          type: string
        status: active
      - name: Walk-In Hold has max duration
        subject: Walk-In Hold
        predicate: has
        object:
          type: integer
          unit: minutes
        status: active
      - name: Room Status View has free status
        subject: Room Status View
        predicate: has
        object:
          type: boolean
        status: active
      - name: Room Status View has holder
        subject: Room Status View
        predicate: has
