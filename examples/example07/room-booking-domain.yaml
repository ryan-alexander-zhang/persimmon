apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: room-booking-prd-architecture-bb-1-data-schema.r1
spec:
  identity:
    id: room-booking-prd-architecture-bb-1-data-schema
    revision: 1
  content:
    businessRules: room-booking-rules
    title: Room Booking Service Data Schema
    type: data-schema
    architecture: room-booking-prd-architecture
    block: BB-1
    domainModel: room-booking-model
    document:
      mediaType: application/sql
      content: |-
        -- Room Booking Service (BB-1) data schema.
        -- Dialect: portable/ANSI SQL. The Architecture names the store only as "one transactional
        -- relational store" (BB-1 technology) without a specific product, so no product-specific
        -- syntax (no SERIAL/AUTO_INCREMENT, no vendor date functions) is used; see Q-1.

        CREATE TABLE room (
            id                 CHAR(36)     NOT NULL PRIMARY KEY,
            seating_capacity   INTEGER      NOT NULL CHECK (seating_capacity > 0),
            video_capability   BOOLEAN      NOT NULL
        );
        -- Room is the AG-1 (Room Schedule) entity holding the values BR-1 (capacity) and BR-2 (video
        -- capability) are checked against when the aggregate decides whether a room fits a request.
        -- Office management edits these rows directly, without a release (C-7, S-7, Configuration
        -- interface); the Room Schedule aggregate re-reads the current row on every booking decision,
        -- so a capacity or video-capability change takes effect immediately.

        CREATE TABLE booking (
            id                 CHAR(36)     NOT NULL PRIMARY KEY,
            room_id            CHAR(36)     NOT NULL REFERENCES room (id),
            owner              VARCHAR(256) NOT NULL,
            date               DATE         NOT NULL,
            created_date       DATE         NOT NULL,
            start_time         TIME         NOT NULL,
            end_time           TIME         NOT NULL,
            attendee_count     INTEGER      NOT NULL CHECK (attendee_count > 0),
            video_need         BOOLEAN      NOT NULL,
            status             VARCHAR(8)   NOT NULL CHECK (status IN ('active', 'inactive')),
            CHECK (end_time > start_time)
        );
        -- Booking is the AG-1 (Room Schedule) root entity: one row per Book Room, Claim Walk-In Room,
        -- Cancel Booking, Check In Booking, Release Booking As No-Show or Expire Walk-In Hold outcome.
        -- owner is the employee identifier federated from the company SSO/directory at command time
        -- (C-1, S-4); no local employee table is kept.
        -- BR-7 (no overlapping active booking for the same room_id) and BR-8 (only the booking's owner
        -- may cancel it, and only before start_time) are cross-row and time-of-request checks; they are
        -- enforced by the Room Schedule aggregate inside its single transaction boundary (CC-1, CC-3),
        -- not by a static constraint on this table.
        -- BR-3 to BR-6 (slot granularity, booking hours, max duration, max advance) and BR-9 (no-show
        -- check-in window) are likewise enforced by the aggregate against the current values in
        -- booking_limit_config below, rather than as fixed CHECK constraints here, so that changing a
        -- configured limit takes effect with no code change or redeploy (C-7, QS-5).

        CREATE TABLE booking_limit_config (
            id                               INTEGER NOT NULL PRIMARY KEY CHECK (id = 1),
            slot_granularity_minutes         INTEGER NOT NULL DEFAULT 15,
            booking_window_start_time        TIME    NOT NULL DEFAULT TIME '08:00:00',
            booking_window_end_time          TIME    NOT NULL DEFAULT TIME '20:00:00',
            max_duration_minutes             INTEGER NOT NULL DEFAULT 240,
            max_advance_days                 INTEGER NOT NULL DEFAULT 30,
            no_show_check_in_window_minutes  INTEGER NOT NULL DEFAULT 10,
            walk_in_max_hold_minutes         INTEGER NOT NULL DEFAULT 60
        );
        -- Single-row table (id = 1) holding the booking-limit parameters office management edits
        -- directly without a release (C-7, S-7, QS-5, Configuration interface):
        -- slot_granularity_minutes/booking_window_start_time/booking_window_end_time/
        -- max_duration_minutes/max_advance_days parameterize BR-3, BR-4, BR-5 and BR-6;
        -- no_show_check_in_window_minutes parameterizes BR-9 and the No-Show Release Policy (POL-1);
        -- walk_in_max_hold_minutes parameterizes BR-10 and the Walk-In Hold Expiry Policy (POL-2). The
        -- Room Schedule aggregate reads this row on every command and policy run instead of a compiled
        -- constant.
    elements:
      - id: EL-1
        name: room
        realises:
          kind: aggregate
          name: AG-1
        rules:
          - BR-1
          - BR-2
      - id: EL-2
        name: booking
        realises:
          kind: aggregate
          name: AG-1
        rules:
          - BR-7
          - BR-8
      - id: EL-3
        name: booking_limit_config
        realises:
          kind: aggregate
          name: AG-1
        rules:
          - BR-3
          - BR-4
          - BR-5
          - BR-6
          - BR-9
          - BR-10
    rules:
      - BR-1
      - BR-2
      - BR-3
      - BR-4
      - BR-5
      - BR-6
      - BR-7
      - BR-8
      - BR-9
      - BR-10
    decisions:
      - room-booking-prd-adr-1
      - room-booking-prd-adr-2
      - room-booking-prd-adr-3
      - room-booking-prd-adr-4
      - room-booking-prd-adr-5
    openQuestions:
      - id: Q-1
        question: BB-1's technology names only "one transactional relational store" without a specific product. This schema is written in portable/ANSI SQL with no vendor-specific syntax. Which relational store will actually run this, and does it need dialect-specific adjustments?
      - id: Q-2
        question: "The Monthly Utilisation Report View needs a no-show rate per team, but the DomainModel's \"Booking has owner\" fact and the Glossary's Employee term carry no decomposed name/team fields, and there is no local employee store (S-4, C-1, no local account store). Where does a booking's owner's team come from for this report: captured on the booking at command time, or joined from the directory when the report runs?"
      - id: Q-3
        question: AG-1's Booking attributes and invariants do not include a field distinguishing a walk-in claim from a scheduled booking, yet Claim Walk-In Room, Expire Walk-In Hold and the Walk-In Hold Expiry Policy (POL-2) must act only on walk-in holds. Is this an implicit value of an existing attribute, or does the DomainModel need an explicit origin/type attribute on Booking?
---
