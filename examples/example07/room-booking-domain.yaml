          occupied: "#374151"
          on-occupied: "#FFFFFF"
        typography:
          display-lg:
            fontFamily: "Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"
            fontSize: "80px"
            fontWeight: 700
            lineHeight: 1.1
          display-md:
            fontFamily: "Inter, -apple-system, 'Segoe UI', Roboto, sans-serif"
