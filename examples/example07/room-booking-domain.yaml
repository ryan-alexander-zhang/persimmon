    openQuestions:
      - id: Q-1
        question: The Architecture gives BB-1 a provided 'Configuration' interface (REL-15) for office management to edit room capacity, video capability and booking-limit parameters, but the DomainModel names no command or read model for it. What should the configuration-edit operation(s) look like, and is it in scope for this Design, or a separate one once the DomainModel is extended?
      - id: Q-2
        question: PRD open question Q-2 (carried into Architecture C-3/RK-2) leaves whether check-in is scanned by the employee's own device or a door reader. This affects whether POST /bookings/{bookingId}/check-in is always called under the employee's own SSO bearer token, or sometimes by an unauthenticated door-reader device on the employee's behalf.
      - id: Q-3
        question: The Glossary types 'Booking has start time', 'Booking has end time', 'Room Status View has held until' and 'has next' as plain strings with no format. This Design assumes a local-time-of-day string in the office's single time zone (C-4); the exact wire format (e.g. 'HH:mm' vs a full timestamp) is unconfirmed.
