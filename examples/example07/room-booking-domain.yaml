apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: room-booking-prd-architecture-bb-6-ui.r1
spec:
  identity:
    id: room-booking-prd-architecture-bb-6-ui
    revision: 1
  content:
    businessRules: room-booking-rules
    title: Door Status Screen — Door Status Design
    type: ui
    architecture: room-booking-prd-architecture
    block: BB-6
    designSystem: room-booking-prd-design-system
    document:
      mediaType: text/markdown
      content: |-
        ## Door Status

        ### Purpose

        Shows, for the one room this kiosk sits outside, its current status, who holds it, until when, and what's next, so a passer-by or the room's own booked employee can tell at a glance whether to enter, without walking the floor (QG-3, SC-5), and shows the QR code used to check in at this room. The screen is read-only: per CC-6, no booking action is taken at the screen itself, so its own availability or staleness can never block a booking.

        ### Data

        Reads this room's Room Status View (Architecture BB-1, interface Room Status View; carried by `GET /rooms/{roomId}/status` on the Booking Commands API):

        - Room Status View has free status — whether the room is currently free.
        - Room Status View has holder — the employee or walk-in currently holding the room, when occupied or held.
        - Room Status View has held until — the time the current hold or booking ends.
        - Room Status View has next booking — a short summary (owner, start time) of the room's next scheduled booking, when one exists.

        The room's own name/identity and its printed check-in QR code are fixed per physical installation (this kiosk is mounted at one specific room, C-2) and are not fields of the Room Status View; see Q-3.

        ### Actions

        None. Per CC-6 the Door Status Screen submits no command itself. The QR code it displays encodes this room's identity so that a visitor's own device, scanning it through the Employee Booking App (BB-5), can submit Check In Booking or Claim Walk-In Room against the Booking Commands API (`POST /bookings/{bookingId}/check-in`, `POST /rooms/{roomId}/walk-in-claims`); any refusal those commands produce (BR-9, or the room already held at the time of claim) is shown on the scanning device, not here. Whether the scan is read by the visitor's own device or by a reader built into this kiosk is open (C-3, Q-2); either way this screen itself issues no request.

        ### States

        - Loading — the screen has not yet received a response from the Room Status View query; shows a neutral placeholder in place of the `status-badge`, no holder or held-until text.
        - Free / idle — free status is true; shows only the status badge (`success`) and the room name; holder, held-until and what's-next are empty since none apply.
        - Held or booked — free status is false; shows holder, held-until (`body-lg`) and what's-next (`body-md`) alongside the matching status badge (`occupied` for a confirmed booking in progress, `warning` for a walk-in hold or a booking nearing its no-show window).
        - Stale / offline — the screen's connection to the Room Booking Service has gone stale past a timeout (RK-1); shows `status-badge-offline` and an explicit "status unavailable" message in place of the last-known status, never holding the prior value silently.

        ### Layout

        Full-bleed, single-purpose, no navigation chrome (CC-6), stacked and centred top to bottom per the DesignSystem's Door Status Screen layout: the room's name (`title-lg`, static per installation) above the status headline (`display-md`, inside a `door-status-panel`, coloured by `status-badge`/`status-badge-occupied`/`status-badge-held`/`status-badge-offline`), then holder and held-until (`body-lg`), then what's-next (`body-md`), with the room's check-in QR code anchored at the bottom. Sized for someone reading from arm's length to a few metres while approaching the room (DesignSystem Q-3).
    elements:
      - id: EL-1
        name: Door Status
        realises:
          kind: operation
          name: GET /rooms/{roomId}/status
        rules: []
    rules: []
    decisions: []
    openQuestions:
      - id: Q-1
        question: PRD/Architecture open question (C-3, RK-2) leaves whether check-in at a room is scanned by the employee's own device or by a reader built into this kiosk. This Design assumes the screen only displays a static QR code and issues no request itself either way, but if a door reader is chosen, the Door Status Screen would need its own scanning and command-submission behaviour, which is out of scope here.
      - id: Q-2
        question: DesignSystem Q-3 assumes the Door Status Screen is read from arm's length to a few metres by someone approaching the room. If that mounting distance is wrong, the `display-md`/`title-lg` sizes this Design relies on may need to change.
      - id: Q-3
        question: The DomainModel's Room Status View names no field for the room's own name or identity, yet the DesignSystem's Door Status Screen layout shows a room name above the status. This Design assumes the room name is fixed, physical-installation configuration read outside the Room Status View query, not a queried field; confirm that assumption or add a room-identity field to the read model.
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: room-booking-prd-architecture-bb-7-ui.r1
spec:
  identity:
    id: room-booking-prd-architecture-bb-7-ui
    revision: 1
  content:
    businessRules: room-booking-rules
    title: Floor Status Screen
    type: ui
    architecture: room-booking-prd-architecture
    block: BB-7
    designSystem: room-booking-prd-design-system
    document:
      mediaType: text/markdown
      content: |-
        ## Floor Status

        **Purpose**

        Lists the current status of every room on the floor on one screen, so anyone can see at a glance which rooms are available without walking the floor or leaving their desk (QG-3, SC-5, REL-12).

        **Data**

        For every room, the Room Status View:
        - free status (`Room Status View has free status`) — drives which status badge the tile shows.
        - holder (`Room Status View has holder`) — shown when the room is held or occupied.
        - held until (`Room Status View has held until`) — shown when the room is held or occupied.
        - next booking (`Room Status View has next booking`) — shown as what's next for the room.
        - the room's id (structural, not a domain word; identifies which tile is which room — see Q-1 on whether a room also has a displayable name).

        **Actions**

        None. The Floor Status Screen is a read-only display; no control on it submits a command, so a room's availability here can never be blocked by this screen itself (CC-6).

        **States**

        - Loading: while the initial Room Status View query for all rooms is in flight, each tile shows a loading placeholder instead of a status badge.
        - Stale/offline: if the connection to the Room Status View is lost or a tile's data goes stale, that tile (or the whole screen) switches to the offline status badge rather than silently holding its last-known status (RK-1, C-5).
        - No refusal state applies: the screen submits no command, so no `BR-n` can be broken here.

        **Layout**

        A full-bleed, chrome-free kiosk layout with no navigation (per CC-6, there is nothing to tap). A responsive grid of `floor-room-tile` components, one per room, at `spacing.lg` gutters, reflowing by room count rather than scrolling so every room stays visible without interaction. Each tile shows the room's id in `headline-md` above its status in `display-lg`, coloured with the shared `status-badge` family: `status-badge` (free), `status-badge-occupied` (booked and in use), `status-badge-held` (walk-in hold or approaching no-show turnover), `status-badge-offline` (stale/disconnected).
    elements:
      - id: EL-1
        name: Floor Status
        realises:
          kind: operation
          name: GET /rooms/{roomId}/status
        rules: []
    rules: []
    decisions: []
    openQuestions:
      - id: Q-1
        question: The DomainModel's Room entity has only seating capacity and video capability (no name fact type), and the Room Status View carries no room identifier field either, yet the DesignSystem's floor-room-tile shows a room name above its status. Should each tile display the room's id (structural, used here) or does the domain need a 'Room has name' fact type for a human-readable label?
      - id: Q-2
        question: The Glossary types 'Room Status View has held until' and 'has next booking' as plain strings with no format (same gap as Q-3 in the Booking Commands API Design). This screen assumes a local-time-of-day string in the office's single time zone (C-4); the exact wire format is unconfirmed.
---
