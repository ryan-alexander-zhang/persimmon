apiVersion: sdd.persimmon.ai/v1
kind: DomainModel
metadata:
  name: room-booking-model.r1
spec:
  identity:
    id: room-booking-model
    revision: 1
  content:
    context: room-booking
    source: room-booking-prd-storming
    aggregates:
      - id: AG-1
        name: Room Schedule
        root: Room Schedule
        entities:
          - name: Room Schedule
            attributes: []
          - name: Room
            attributes:
              - Room has seating capacity
              - Room has video capability
          - name: Booking
            attributes:
              - Booking has owner
              - Booking has room
              - Booking has start time
              - Booking has end time
              - Booking has attendee count
              - Booking has video need
              - Booking has check-in time
              - Booking has status
          - name: Walk-In Hold
            attributes:
              - Walk-In Hold has booking
              - Walk-In Hold has expiry time
              - Walk-In Hold has max duration
        valueObjects: []
        commands:
          - Book Room
          - Cancel Booking
          - Check In Booking
          - Release Booking As No-Show
          - Claim Walk-In Room
          - Expire Walk-In Hold
        events:
          - Room Booked
          - No Available Room Found
          - Booking Cancelled
          - Booking Checked In
          - Booking Released As No-Show
          - Walk-In Room Claimed
          - Walk-In Hold Expired
        invariants:
          - statement: room's seating capacity >= requested attendee count
            rules:
              - BR-1
          - statement: room has video-conferencing equipment if the booking requests it
            rules:
              - BR-2
          - statement: requested slot's start and end times fall on 15-minute boundaries
            rules:
              - BR-3
          - statement: requested slot falls entirely between 08:00 and 20:00
            rules:
              - BR-4
          - statement: requested slot duration <= 4 hours
            rules:
              - BR-5
          - statement: requested slot's date is at most 30 days after the date of booking
            rules:
              - BR-6
          - statement: no existing active booking for the room overlaps the requested time slot
            rules:
              - BR-7
          - statement: the command issuer is the booking's owner and the booking's start time has not yet passed
            rules:
              - BR-8
          - statement: the command issuer is the booking's owner and the check-in occurs within the check-in window after the booking's scheduled start time
            rules:
              - BR-9
          - statement: the room has no active booking or hold at the time of claim
            rules: []
    events:
      - name: Room Booked
        pivotal: true
        attributes:
          - Booking has owner
          - Booking has room
          - Booking has start time
          - Booking has end time
          - Booking has attendee count
          - Booking has video need
      - name: No Available Room Found
        attributes:
          - Booking has attendee count
          - Booking has video need
      - name: Booking Cancelled
        pivotal: true
        attributes:
          - Booking has owner
          - Booking has room
      - name: Booking Checked In
        pivotal: true
        attributes:
          - Booking has owner
          - Booking has check-in time
      - name: Booking Released As No-Show
        pivotal: true
        attributes:
          - Booking has owner
          - Booking has room
      - name: Walk-In Room Claimed
        pivotal: true
        attributes:
          - Booking has owner
          - Booking has room
          - Walk-In Hold has expiry time
      - name: Walk-In Hold Expired
        attributes:
          - Walk-In Hold has booking
          - Walk-In Hold has expiry time
      - name: Monthly Utilisation Report Generated
        temporal: true
        attributes:
          - Monthly Utilisation Report View has room utilisation
          - Monthly Utilisation Report View has no-show rate
          - Monthly Utilisation Report View has peak hours
    policies:
      - id: POL-1
        name: No-Show Release Policy
        when:
          - Room Booked
        then:
          - Release Booking As No-Show
        execution: automatic
        condition: no check-in recorded within the check-in window after the booking's start time
        parameters:
          - name: checkInWindowMinutes
            value: "10"
      - id: POL-2
        name: Walk-In Hold Expiry Policy
        when:
          - Walk-In Room Claimed
        then:
          - Expire Walk-In Hold
        execution: automatic
        condition: maximum hold duration elapsed since the walk-in claim, or the room's next scheduled booking start time reached
        parameters:
          - name: maxHoldDurationMinutes
            value: "60"
    readModels:
      - name: Room Status View
        informs:
          - Employee
          - Walk-in Employee
        fields:
          - Room Status View has free status
          - Room Status View has holder
          - Room Status View has held until
          - Room Status View has next booking
        updatedBy:
          - Room Booked
          - Booking Cancelled
          - Booking Checked In
          - Booking Released As No-Show
          - Walk-In Room Claimed
          - Walk-In Hold Expired
      - name: Monthly Utilisation Report View
        informs:
          - Office Management
        fields:
          - Monthly Utilisation Report View has room utilisation
          - Monthly Utilisation Report View has no-show rate
          - Monthly Utilisation Report View has peak hours
        updatedBy:
          - Monthly Utilisation Report Generated
    externalSystems: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Architecture
metadata:
  name: room-booking-prd-architecture.r1
spec:
  identity:
    id: room-booking-prd-architecture
    revision: 1
  content:
    businessRules: room-booking-rules
    title: Meeting Room Booking Architecture
    owner: Office management
    status: accepted
    introduction:
      prd: room-booking-prd
      qualityGoals:
        - id: QG-1
          quality: functional-suitability
          motivation: An employee's booking request must only ever land in a room that is free and fits, so double-booking incidents on the schedule drop to zero (G-1, SC-1).
        - id: QG-2
          quality: performance-efficiency
          motivation: A cancelled or no-show booking must free its room, and the room must show as free to others, within the same minute (G-2, SC-2, SC-3).
        - id: QG-3
          quality: interaction-capability
          motivation: Anyone must be able to see every room's current status on its door screen or the floor screen without leaving their desk or walking the floor (G-3, SC-5).
        - id: QG-4
          quality: functional-suitability
          motivation: Office management's monthly report must completely and correctly cover utilisation per room, no-show rate per team and peak hours (G-4, SC-6).
        - id: QG-5
          quality: maintainability
          motivation: One office IT person must keep the service running alongside other work, and office management must be able to change room capacities, video capability and the booking limits (BR-2 to BR-6, BR-9, BR-10) without needing a release.
      stakeholders:
        - role: Employee
          expectations: Finds and books a free room that fits the meeting, and sees at a glance which rooms are available.
        - role: Walk-in Employee
          expectations: Grabs an empty room on the spot for an unplanned meeting with no advance booking.
        - role: Office Management
          expectations: Sees a monthly view of actual room usage, no-shows by team, and peak demand, and can change room and booking-limit data directly.
        - role: Service Operator
          expectations: Keeps the single Room Booking Service, the door/floor screens and the SSO integration running single-handedly, and can tell when a screen has gone stale or offline.
    constraints:
      - id: C-1
        kind: organizational
        statement: Employees sign in through the company SSO; the directory is the source of each employee's name and team.
        rationale: PRD assumption; BR-8 and BR-9 need a trustworthy owner identity.
      - id: C-2
        kind: technical
        statement: Each meeting room's seating capacity and video-conferencing capability are fixed and configured in advance; the product does not let employees define or edit rooms.
        rationale: PRD assumption backing BR-1 and BR-2.
      - id: C-3
        kind: technical
        statement: Check-in at a room is performed by scanning a QR code posted at that room's door; whether it is scanned with the employee's own device or a door reader is open (PRD Q-2).
        rationale: PRD assumption 3 and open question Q-2.
      - id: C-4
        kind: organizational
        statement: The office operates in a single time zone; all bookings and the 08:00-20:00 booking window (BR-4) are in that time zone.
        rationale: PRD assumption 4; out of scope to support more than one office or time zone.
      - id: C-5
        kind: technical
        statement: Door and floor screens require live connectivity to show current room status; offline screens are not a supported mode.
        rationale: PRD assumption 5.
      - id: C-6
        kind: convention
        statement: An existing booking's time, attendees or video need cannot be edited in place; the owner cancels it and books again instead.
        rationale: PRD non-goal.
      - id: C-7
        kind: technical
        statement: Room seating capacity, video-conferencing capability, and the booking-limit parameters (BR-2 to BR-6, BR-9, BR-10) are configuration data that office management edits directly, without a code change or redeploy.
        rationale: "Human review: one office IT person must keep the service running beside other work, and these values change far more often than the code that enforces them."
    context:
      business:
        - partner: Employee
          exchanges: Booking requests, cancellations, check-ins, and Room Status View queries
          direction: both
        - partner: Walk-in Employee
          exchanges: On-the-spot room claims via check-in, and Room Status View queries
          direction: both
        - partner: Office Management
          exchanges: The Monthly Utilisation Report View (utilisation per room, no-show rate per team, peak hours), and edits to room capacity, video capability and booking-limit configuration
          direction: both
        - partner: Company Directory
          exchanges: Employee identity (name and team) for sign-in
          direction: in
      technical:
        - channel: Booking app to Room Booking Service
          protocol: HTTPS/JSON
          carries: Booking, cancellation and check-in commands
        - channel: Door and floor screens to Room Booking Service
          protocol: HTTPS/JSON
          carries: Live Room Status View queries
        - channel: Room Booking Service to Company Directory
          protocol: OIDC/SAML
          carries: Employee identity and team
        - channel: Room Booking Service to Office Management
          protocol: Email/file export
          carries: The Monthly Utilisation Report View
        - channel: Office Management to Room Booking Service
          protocol: HTTPS/JSON
          carries: Configuration edits to room capacity, video capability and booking-limit parameters
    strategy:
      - id: S-1
        decision: Serialize every room-schedule command through a single Room Schedule aggregate per room, inside one transaction.
        addresses:
          - QG-1
      - id: S-3
        decision: Release no-show bookings and expire walk-in holds via a timer running inside the Room Booking Service itself, not a separate worker process and not in response to a user request.
        addresses:
          - QG-2
          - QG-5
      - id: S-4
        decision: Federate employee identity through the company SSO/directory; no local account store.
        addresses:
          - C-1
      - id: S-6
        decision: Serve the Room Status View and the Monthly Utilisation Report as queries over the Room Booking Service's own store, instead of a separate event-driven read model or analytical reporting service.
        addresses:
          - QG-2
          - QG-3
          - QG-4
          - QG-5
      - id: S-7
        decision: Hold room capacities, video capability and the booking-limit parameters as configuration data inside the Room Booking Service that office management edits directly, instead of constants compiled into the code.
        addresses:
          - QG-5
          - C-7
    buildingBlocks:
      - id: BB-1
        name: Room Booking Service
        responsibility: "Owns the Room Schedule aggregate: decides which room fits and is free for a requested slot, and executes Book Room, Cancel Booking, Check In Booking, Release Booking As No-Show, Claim Walk-In Room and Expire Walk-In Hold as one transaction boundary per room; serves the Room Status View and the Monthly Utilisation Report View as queries over that same store; runs the no-show release and walk-in hold expiry policies on an internal timer; and holds room capacities, video capability and the booking-limit parameters as configuration data office management edits directly."
        technology: Single backend service with one transactional relational store (one aggregate instance per room), an internal scheduler, and a configuration table
        interfaces:
          - name: Booking Commands
            kind: provides
            description: Book Room, Cancel Booking, Check In Booking, Release Booking As No-Show, Claim Walk-In Room and Expire Walk-In Hold against the Room Schedule aggregate.
          - name: Room Status View
            kind: provides
            description: Per-room status, holder, held-until time and what's next, queried directly from the Room Schedule's current state, for booking decisions and the door/floor screens.
          - name: Monthly Utilisation Report
            kind: provides
            description: Utilisation per room, no-show rate per team, and peak hours of demand, computed as a query over the booking history kept in the same store, delivered monthly to office management.
          - name: Configuration
            kind: provides
            description: Lets office management view and edit room seating capacity, video capability and the booking-limit parameters (BR-2 to BR-6, BR-9, BR-10) directly, without a release.
          - name: Identity
            kind: requires
            description: The employee's name and team, from the company SSO/directory, to attribute and authorize commands.
        contexts:
          - room-booking
      - id: BB-5
        name: Employee Booking App
        responsibility: Client employees and walk-in employees use to find a fitting, free room, book it, cancel it, check in, or claim a walk-in room.
        technology: Web/mobile client
        interfaces:
          - name: Booking Commands
            kind: requires
            description: Submits Book Room, Cancel Booking, Check In Booking and Claim Walk-In Room on the employee's behalf.
          - name: Room Status View
            kind: requires
            description: Reads current room status to offer only rooms that fit and are free for the requested slot.
          - name: Identity
            kind: requires
            description: Authenticates the employee and reads their name and team.
        contexts: []
      - id: BB-6
        name: Door Status Screen
        responsibility: Shows the status, holder, held-until time and what's next for the room it sits outside, and displays the QR code used for check-in at that room.
        technology: Kiosk display at the room's door
        interfaces:
          - name: Room Status View
            kind: requires
            description: Reads that room's status, holder, held-until time and what's next.
        contexts: []
      - id: BB-7
        name: Floor Status Screen
        responsibility: Lists the current status of every room on the floor so anyone can see at a glance what is available.
        technology: Shared kiosk/dashboard display
        interfaces:
          - name: Room Status View
            kind: requires
            description: Reads the status of every room to list them at a glance.
        contexts: []
    relations:
      - id: REL-1
        from: Employee
        to: BB-5
        description: Employee uses the booking app to find a room, book it, cancel it, or check into it.
      - id: REL-2
        from: BB-5
        to: BB-1
        interface: Booking Commands
        technology: HTTPS/JSON
        description: Booking app submits Book Room, Cancel Booking and Check In Booking commands.
      - id: REL-3
        from: BB-5
        to: BB-1
        interface: Room Status View
        technology: HTTPS/JSON
        description: Booking app queries which rooms are currently free before offering them for a slot.
      - id: REL-4
        from: BB-5
        to: Company Directory
        interface: Identity
        technology: OIDC/SAML
        description: Booking app authenticates the employee through SSO and reads their name and team.
      - id: REL-5
        from: Walk-in Employee
        to: BB-6
        description: Walk-in employee reads the door screen to see whether the room is free before claiming it.
      - id: REL-6
        from: Walk-in Employee
        to: BB-5
        description: Walk-in employee scans the room's QR code with their device to claim it as a walk-in booking.
      - id: REL-11
        from: BB-6
        to: BB-1
        interface: Room Status View
        description: Door screen displays its room's status, holder, held-until time and what's next.
      - id: REL-12
        from: BB-7
        to: BB-1
        interface: Room Status View
        description: Floor screen lists the current status of every room.
      - id: REL-13
        from: Office Management
        to: BB-1
        interface: Monthly Utilisation Report
        description: Office management receives the monthly report covering utilisation per room, no-show rate per team, and peak hours.
      - id: REL-14
        from: Employee
        to: BB-7
        description: Employee checks the floor screen to see which rooms are free without walking the floor.
      - id: REL-15
        from: Office Management
        to: BB-1
        interface: Configuration
        description: Office management edits room capacity, video capability and booking-limit parameters directly, without a release.
    concepts:
      - id: CC-1
        topic: domain
        statement: The Room Schedule aggregate (DomainModel room-booking-model, AG-1) is the single transaction boundary for Book Room, Cancel Booking, Check In Booking, Release Booking As No-Show, Claim Walk-In Room and Expire Walk-In Hold, so no two commands can commit overlapping bookings for the same room.
      - id: CC-2
        topic: persistence
        statement: All booking state, current room status and booking history are persisted in the Room Booking Service's single transactional store; the Room Status View and the Monthly Utilisation Report View are queries over that store, not separate replicated read models or analytical stores.
      - id: CC-3
        topic: errors
        statement: A Book Room command that violates BR-1, BR-2, BR-3, BR-4, BR-5, BR-6 or BR-7 is refused with no booking created; a Cancel Booking command that violates BR-8, or a Check In Booking command that violates BR-9, is refused the same way.
      - id: CC-4
        topic: transactions
        statement: POL-1 (no-show release) and POL-2 (walk-in hold expiry) run as time-triggered commands issued by an internal scheduler inside the Room Booking Service against the Room Schedule aggregate, each its own transaction separate from the booking command that created the state it acts on.
      - id: CC-5
        topic: security
        statement: Every command and query carries the employee's identity and team from the company SSO; the Room Schedule enforces that only a booking's owner can cancel it (BR-8) or check into it (BR-9).
      - id: CC-6
        topic: ux
        statement: Door and floor screens are read-only displays of the Room Status View; no booking action is taken at the screen itself, so their availability can never block a booking.
      - id: CC-7
        topic: persistence
        statement: Room seating capacity, video-conferencing capability, and the booking-limit parameters (BR-2 to BR-6, BR-9, BR-10) are stored as configuration data in the Room Booking Service's own store, separate from the deployed code, so office management changes them without a release (C-7).
    domainModels:
      - room-booking-model
    decisions:
      - room-booking-prd-adr-1
      - room-booking-prd-adr-2
      - room-booking-prd-adr-3
      - room-booking-prd-adr-4
      - room-booking-prd-adr-5
    qualityScenarios:
      - id: QS-1
        qualityGoal: QG-1
        stimulus: Two employees try to book the same room for overlapping slots at the same time.
        response: The Room Schedule accepts the first commit and refuses the second with no overlapping booking created (BR-7).
        measure: Zero double-booking incidents recorded on the schedule (SC-1).
        method: test
        stage: build
      - id: QS-2
        qualityGoal: QG-2
        stimulus: A booking's owner cancels it before the start time, or does not check in within 10 minutes of the start.
        response: The Room Schedule releases the booking, and the Room Status View, queried from the same store, immediately reflects the room as free.
        measure: The room shows as free to other employees within one minute of the cancellation or no-show release (SC-2, SC-3).
        method: test
        stage: build
      - id: QS-3
        qualityGoal: QG-3
        stimulus: An employee opens a room's door screen or the floor screen without having made any booking.
        response: The screen displays that room's current status, holder, held-until time and what's next, queried directly from the Room Booking Service.
        measure: Every room's current status is visible on its door screen and on the floor screen (SC-5).
        method: test
        stage: build
      - id: QS-4
        qualityGoal: QG-4
        stimulus: The end of the month arrives.
        response: The Room Booking Service compiles utilisation per room, no-show rate per team, and peak hours from the month's booking history in its own store and delivers it to office management.
        measure: A monthly report is delivered covering all three measures (SC-6).
        method: test
        stage: build
      - id: QS-5
        qualityGoal: QG-5
        stimulus: Office management decides to change the no-show check-in window from 10 to 15 minutes (BR-9).
        response: An operator edits the check-in window as configuration data in the Room Booking Service.
        measure: The new window takes effect with no code change and no redeployment.
        method: test
        stage: build
    glossaries:
      - room-booking-glossary
    risks:
      - id: RK-1
        kind: risk
        statement: Door or floor screens lose connectivity and keep showing a stale status, so employees act on wrong information.
        probability: medium
        impact: medium
        mitigation: Have the screens show a visibly stale/offline state past a timeout instead of silently holding the last-known value.
      - id: RK-2
        kind: risk
        statement: The check-in mechanism (own-device QR scan vs. a door reader, PRD Q-2) is still open; building the booking app's and door screen's check-in interaction around the wrong choice reworks both.
        probability: medium
        impact: medium
        mitigation: Resolve Q-2 before implementing the check-in UI; keep check-in as a single Booking Commands operation so either input device can call it unchanged.
      - id: RK-3
        kind: debt
        statement: Keeping live schedule state and accumulating booking history in the same transactional store risks the history growing large enough over time to slow live booking and status queries.
        mitigation: Archive or partition bookings older than the current reporting month within the same store; revisit a separate analytical store only if volume becomes an actual problem.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: room-booking-prd-adr-1.r1
spec:
  identity:
    id: room-booking-prd-adr-1
    revision: 1
  content:
    title: Serialize bookings through one Room Schedule aggregate per room
    status: accepted
    deciders:
      - Engineering Lead
      - Office Management
    context: QG-1 requires that double-booking incidents on the schedule drop to zero (SC-1). BR-7 forbids a room being offered for a slot that overlaps an existing active booking for that room. With eight rooms shared by about 80 people, concurrent booking attempts for the same popular room and slot are routine, so two users can submit Book Room commands for the same room and overlapping times nearly simultaneously.
    drivers:
      - QG-1
      - BR-7
      - SC-1
      - CAP-1
    decision: Model the office's room schedule as one Room Schedule aggregate per room (DomainModel room-booking-model, AG-1) and serialize every Book Room, Cancel Booking, Check In Booking, Release Booking As No-Show, Claim Walk-In Room and Expire Walk-In Hold command for that room through a single transaction against that aggregate, so BR-7 is checked and enforced atomically against the room's current bookings.
    alternatives:
      - option: Optimistic concurrency with retries across a shared bookings table, validated at the database level without a per-room aggregate boundary
        rejectedBecause: Leaves a window where two overlap checks can both pass before either write commits, reintroducing the double-booking failure the spreadsheet already has.
      - option: A global lock across all rooms for every booking command
        rejectedBecause: Serializes unrelated rooms against each other for no reason, hurting responsiveness for the 8 rooms with no corresponding benefit to BR-7.
    consequences:
      - kind: positive
        statement: BR-7 is enforced within a single transaction, so double bookings cannot occur regardless of request timing.
      - kind: negative
        statement: Two commands against the same room cannot be processed concurrently; acceptable given the office's scale (8 rooms, ~80 people).
      - kind: neutral
        statement: Each room's bookings are independent, so load on one room's aggregate never blocks another room's.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: room-booking-prd-adr-2.r1
spec:
  identity:
    id: room-booking-prd-adr-2
    revision: 1
  content:
    title: Run no-show release and walk-in hold expiry on an internal timer
    status: accepted
    deciders:
      - Engineering Lead
      - Office Management
    context: QG-2 requires a cancelled or no-show booking to free its room, and show as free, within the same minute (SC-2, SC-3). BR-9 defines a booking as a no-show once 10 minutes pass with no check-in; BR-10 bounds a walk-in hold to the room's next booking or one hour. Neither release depends on any employee action, so something must evaluate these time-based conditions on its own schedule. With one office IT person expected to keep the system running beside other work (QG-5), adding a second deployable purely to run two timers is overhead the office doesn't need.
    drivers:
      - QG-2
      - QG-5
      - BR-9
      - BR-10
      - SC-2
      - SC-3
      - SC-4
    decision: Run POL-1 (no-show release) and POL-2 (walk-in hold expiry) as an internal scheduler inside the Room Booking Service that periodically issues Release Booking As No-Show and Expire Walk-In Hold commands against the Room Schedule aggregate, rather than as a separate worker process.
    alternatives:
      - option: A standalone scheduling worker service polling the booking store and issuing release commands over the network
        rejectedBecause: Adds a second deployable, a second thing to monitor and restart, for one office IT person to operate, with no scaling or isolation benefit at this volume.
      - option: Release no-shows and expire holds lazily, only when an employee's next query or booking attempt touches that room
        rejectedBecause: Leaves a stale 'booked' room showing until someone happens to query it, missing the one-minute bound in SC-2 and SC-3.
    consequences:
      - kind: positive
        statement: No-show release and hold expiry happen on time without any extra process to deploy or operate.
      - kind: positive
        statement: Fewer moving parts for the single IT operator to monitor (QG-5).
      - kind: negative
        statement: The timer's sweep granularity must be frequent enough to stay within the one-minute bound of SC-2 and SC-3.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: room-booking-prd-adr-3.r1
spec:
  identity:
    id: room-booking-prd-adr-3
    revision: 1
  content:
    title: Federate employee identity through the company SSO
    status: accepted
    deciders:
      - Engineering Lead
      - Office Management
    context: C-1 fixes that employees sign in through the company SSO and the directory supplies each employee's name and team. BR-8 and BR-9 require that only a booking's owner can cancel or check into it, so the system needs a trustworthy owner identity on every command.
    drivers:
      - C-1
      - BR-8
      - BR-9
    decision: Authenticate every employee through the company SSO/directory (OIDC/SAML) and read their name and team from it on every command and query; the Room Booking Service keeps no local account store or password.
    alternatives:
      - option: A local account store with its own sign-up and password management
        rejectedBecause: Duplicates identity the company directory already owns, and conflicts with C-1's assumption that employees sign in through SSO.
      - option: Trust a client-supplied employee name with no authentication
        rejectedBecause: Cannot reliably enforce BR-8 and BR-9's owner-only checks; any employee could cancel or check into another's booking.
    consequences:
      - kind: positive
        statement: BR-8 and BR-9's owner checks rely on an identity the company already manages and trusts.
      - kind: positive
        statement: No password reset, account lockout or credential storage to build or operate.
      - kind: negative
        statement: The service depends on the company SSO/directory being available; an SSO outage blocks all bookings, cancellations and check-ins.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: room-booking-prd-adr-4.r1
spec:
  identity:
    id: room-booking-prd-adr-4
    revision: 1
  content:
    title: Serve room status and the monthly report as queries over the single store
    status: accepted
    deciders:
      - Engineering Lead
      - Office Management
    context: QG-2 and QG-3 need every room's live status visible to the booking app and the door/floor screens; QG-4 needs a complete monthly report; QG-5 needs one office IT person to keep the whole thing running beside other work. At the scale of 8 rooms and about 80 people, the query load behind the Room Status View and the Monthly Utilisation Report View is small enough that a dedicated event-driven read model and a separate analytical reporting store would be machinery bought for a scale this office doesn't have, each an extra deployable, data pipeline and failure mode to operate.
    drivers:
      - QG-2
      - QG-3
      - QG-4
      - QG-5
      - SC-2
      - SC-3
      - SC-5
      - SC-6
    decision: Serve the Room Status View (status, holder, held-until, next) and the Monthly Utilisation Report View (utilisation, no-show rate, peak hours) as queries directly over the Room Booking Service's own transactional store, instead of projecting them into a separate event-driven read model or a separate analytical reporting store.
    alternatives:
      - option: An event-driven Room Status Read Model kept current by subscribing to domain events, plus a separate batch Reporting Service with its own analytical store
        rejectedBecause: Three deployables and an event pipeline for one office IT person to run and monitor, when the live-status and monthly-report query volume for 8 rooms doesn't need the throughput or isolation that split buys.
      - option: Serve room status and the report from the booking app client by fetching and aggregating raw booking records itself
        rejectedBecause: Pushes query logic and knowledge of the BR rules' no-show and peak-hour definitions into every client, duplicating logic the service already has to enforce.
    consequences:
      - kind: positive
        statement: One deployable and one store to run, monitor and back up, matching the one-IT-person reality of the office (QG-5).
      - kind: positive
        statement: Room status and the monthly report are always consistent with the schedule that produced them, with no replication lag to reason about.
      - kind: negative
        statement: Monthly report queries and live status queries run against the same store as booking commands, so a reporting query must be written not to lock out live bookings.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: room-booking-prd-adr-5.r1
spec:
  identity:
    id: room-booking-prd-adr-5
    revision: 1
  content:
    title: Hold room and booking-limit parameters as editable configuration
    status: accepted
    deciders:
      - Engineering Lead
      - Office Management
    context: C-7 fixes that room seating capacity, video capability and the booking-limit parameters (BR-2 to BR-6, BR-9, BR-10) are data office management can change directly. QG-5 expects one office IT person to keep the service running beside other work; routing every change to a room's capacity or to the no-show window through a code change and release is a disproportionate cost for a value office management decides on its own.
    drivers:
      - QG-5
      - C-7
      - BR-2
      - BR-3
      - BR-4
      - BR-5
      - BR-6
      - BR-9
      - BR-10
    decision: Store room seating capacity, video capability, and the booking-limit parameters (slot granularity, booking hours, maximum duration, advance-booking window, check-in window, walk-in hold duration) as configuration data inside the Room Booking Service's own store, editable by office management, rather than as constants compiled into the service's code.
    alternatives:
      - option: Compile room and limit data into the service as code constants, changed by a developer and redeployed
        rejectedBecause: Makes office management dependent on a release for routine changes like a new room or a different no-show window, which QG-5 and C-7 rule out.
      - option: A general-purpose feature-flag or configuration-management service
        rejectedBecause: Another deployable and vendor relationship to operate for a handful of office-level values, disproportionate for one office IT person running one service.
    consequences:
      - kind: positive
        statement: Office management changes a room's capacity or a booking limit directly, with no deployment (QS-5).
      - kind: positive
        statement: The rules themselves (BR-1 through BR-10) stay in code; only their parameters move to configuration, so enforcement logic isn't scattered.
      - kind: negative
        statement: The service must validate configuration edits itself (e.g. a sane check-in window), since there is no code review gate on these changes anymore.
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: room-booking-prd-cap-1.r1
spec:
  identity:
    id: room-booking-prd-cap-1
    revision: 1
  content:
    businessRules: room-booking-rules
    title: Book a Room
    prd: room-booking-prd
    capability: CAP-1
    architecture: room-booking-prd-architecture
    domainModel: room-booking-model
    stories:
      - id: US-1
        role: Employee
        goal: book a room that fits the meeting and is free for the requested time slot
        benefit: the employee finds and books a free room that fits their meeting without wandering the floor (G-1)
        requirements:
          - FR-1
          - FR-2
          - FR-3
          - FR-4
          - FR-5
          - FR-6
          - FR-7
          - FR-8
          - FR-9
          - FR-10
        commands:
          - Book Room
        events:
          - Room Booked
          - No Available Room Found
        readModels:
          - Room Status View
        acceptance:
          - id: AC-1
            title: Room offered and booked for a fitting, free slot
            given:
              - Room A seats 8 attendees and is free on 2026-10-20 from 10:00 to 11:00
            when:
              - Employee books Room A for 2026-10-20, 10:00 to 11:00, for 6 attendees, no video need
            then:
              - Room Booked is recorded for Room A, 2026-10-20, 10:00 to 11:00, 6 attendees
              - The employee sees the booking confirmed
          - id: AC-2
            title: "Refused: room too small"
            given:
              - Room A seats 6 attendees and is free on 2026-10-20 from 10:00 to 11:00
            when:
              - Employee books Room A for 2026-10-20, 10:00 to 11:00, for 8 attendees
            then:
              - "The booking is refused: BR-1, Room A's seating capacity of 6 is below the requested 8 attendees"
              - No booking is recorded
          - id: AC-3
            title: "Refused: no video-conferencing capability"
            given:
              - Room A seats 8 attendees, has no video-conferencing capability, and is free on 2026-10-20 from 10:00 to 11:00
            when:
              - Employee books Room A for 2026-10-20, 10:00 to 11:00, for 6 attendees, with video need
            then:
              - "The booking is refused: BR-2, Room A has no video-conferencing capability"
              - No booking is recorded
          - id: AC-4
            title: "Refused: slot off the 15-minute boundary"
            given:
              - Room A is free on 2026-10-20 from 10:00 onward
            when:
              - Employee books Room A for 2026-10-20, 10:05 to 11:00, for 6 attendees
            then:
              - "The booking is refused: BR-3, 10:05 is not on a 15-minute boundary"
              - No booking is recorded
          - id: AC-5
            title: "Refused: slot starts before opening hours"
            given:
              - Room A is free on 2026-10-20 from 07:00 onward
            when:
              - Employee books Room A for 2026-10-20, 07:30 to 08:30, for 6 attendees
            then:
              - "The booking is refused: BR-4, 07:30 is before the 08:00 opening time"
              - No booking is recorded
          - id: AC-6
            title: "Refused: slot ends after closing hours"
            given:
              - Room A is free on 2026-10-20 from 19:00 onward
            when:
              - Employee books Room A for 2026-10-20, 19:30 to 20:30, for 6 attendees
            then:
              - "The booking is refused: BR-4, 20:30 is after the 20:00 closing time"
              - No booking is recorded
          - id: AC-7
            title: "Accepted: slot ends exactly at closing time"
            given:
              - Room A is free on 2026-10-20 from 19:00 onward
            when:
              - Employee books Room A for 2026-10-20, 19:00 to 20:00, for 6 attendees
            then:
              - Room Booked is recorded for Room A, 2026-10-20, 19:00 to 20:00, 6 attendees
          - id: AC-8
            title: "Refused: duration over 4 hours"
            given:
              - Room A is free on 2026-10-20 from 09:00 onward
            when:
              - Employee books Room A for 2026-10-20, 09:00 to 13:15, for 6 attendees
            then:
              - "The booking is refused: BR-5, 4 hours and 15 minutes is over the 4-hour limit"
              - No booking is recorded
          - id: AC-9
            title: "Accepted: duration exactly 4 hours"
            given:
              - Room A is free on 2026-10-20 from 09:00 onward
            when:
              - Employee books Room A for 2026-10-20, 09:00 to 13:00, for 6 attendees
            then:
              - Room Booked is recorded for Room A, 2026-10-20, 09:00 to 13:00, 6 attendees
          - id: AC-10
            title: "Refused: more than 30 days ahead"
            given:
              - Today is 2026-10-14
              - Room A is free on 2026-11-14 from 10:00 to 11:00
            when:
              - Employee books Room A for 2026-11-14, 10:00 to 11:00, for 6 attendees
            then:
              - "The booking is refused: BR-6, 2026-11-14 is 31 days after the booking date of 2026-10-14"
              - No booking is recorded
          - id: AC-11
            title: "Accepted: exactly 30 days ahead"
            given:
              - Today is 2026-10-14
              - Room A is free on 2026-11-13 from 10:00 to 11:00
            when:
              - Employee books Room A for 2026-11-13, 10:00 to 11:00, for 6 attendees
            then:
              - Room Booked is recorded for Room A, 2026-11-13, 10:00 to 11:00, 6 attendees
          - id: AC-12
            title: "Refused: overlaps an existing booking"
            given:
              - Room A has an active booking on 2026-10-20 from 10:00 to 11:00
            when:
              - Employee books Room A for 2026-10-20, 10:30 to 11:30, for 6 attendees
            then:
              - "The booking is refused: BR-7, the 10:30 to 11:30 slot overlaps the existing 10:00 to 11:00 booking"
              - No booking is recorded
          - id: AC-13
            title: "Accepted: back-to-back booking with no overlap"
            given:
              - Room A has an active booking on 2026-10-20 from 10:00 to 11:00
            when:
              - Employee books Room A for 2026-10-20, 11:00 to 12:00, for 6 attendees
            then:
              - Room Booked is recorded for Room A, 2026-10-20, 11:00 to 12:00, 6 attendees
          - id: AC-14
            title: "Accepted: current 15-minute slot booked with no advance notice"
            given:
              - The current time is 2026-10-14 10:00
              - Room A is free from 10:00 to 10:15
            when:
              - Employee books Room A for 2026-10-14, 10:00 to 10:15, for 4 attendees
            then:
              - Room Booked is recorded for Room A, 2026-10-14, 10:00 to 10:15, 4 attendees
          - id: AC-15
            title: No room available for the requested slot
            given:
              - Every room seating 10 or more attendees is already booked on 2026-10-20 from 14:00 to 15:00
            when:
              - Employee requests a room for 2026-10-20, 14:00 to 15:00, for 10 attendees
            then:
              - No Available Room Found is returned
              - No booking is recorded
    requirements:
      - id: FR-1
        pattern: ubiquitous
        statement: The system shall offer only rooms that satisfy BR-1 for the requested number of attendees.
        rules:
          - BR-1
      - id: FR-2
        pattern: optional
        statement: Where a booking requests video conferencing, the system shall offer only rooms that satisfy BR-2.
        rules:
          - BR-2
      - id: FR-3
        pattern: unwanted-behaviour
        statement: If a requested time slot breaks BR-3, then the system shall refuse the booking.
        rules:
          - BR-3
      - id: FR-4
        pattern: unwanted-behaviour
        statement: If a requested time slot breaks BR-4, then the system shall refuse the booking.
        rules:
          - BR-4
      - id: FR-5
        pattern: unwanted-behaviour
        statement: If a requested booking breaks BR-5, then the system shall refuse the booking.
        rules:
          - BR-5
      - id: FR-6
        pattern: unwanted-behaviour
        statement: If a requested booking breaks BR-6, then the system shall refuse the booking.
        rules:
          - BR-6
      - id: FR-7
        pattern: unwanted-behaviour
        statement: If a requested time slot breaks BR-7, then the system shall refuse the booking.
        rules:
          - BR-7
      - id: FR-8
        pattern: ubiquitous
        statement: The system shall allow a booking request for a room's current 15-minute slot per BR-11.
        rules:
          - BR-11
      - id: FR-9
        pattern: event-driven
        statement: When a requested booking satisfies BR-1, BR-2, BR-3, BR-4, BR-5, BR-6 and BR-7, the system shall record the booking and confirm the room to the employee.
        rules:
          - BR-1
          - BR-2
          - BR-3
          - BR-4
          - BR-5
          - BR-6
          - BR-7
      - id: FR-10
        pattern: event-driven
        statement: When no room satisfies the requested attendee count, video need and time slot, the system shall report that no room is available.
        rules: []
    qualities:
      - scenario: QS-1
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: room-booking-prd-cap-2.r1
spec:
  identity:
    id: room-booking-prd-cap-2
    revision: 1
  content:
    businessRules: room-booking-rules
    title: Cancel a Booking
    prd: room-booking-prd
    capability: CAP-2
    architecture: room-booking-prd-architecture
    domainModel: room-booking-model
    stories:
      - id: US-1
        role: Employee
        goal: cancel a booking I own before it starts
        benefit: so that the room becomes available to others quickly instead of sitting reserved and unused (G-2)
        requirements:
          - FR-1
          - FR-2
        commands:
          - Cancel Booking
        events:
          - Booking Cancelled
        readModels:
          - Room Status View
        acceptance:
          - id: AC-1
            title: Owner cancels a booking before it starts
            given:
              - An active booking owned by Priya for Room 6 on 2026-10-20 from 14:00 to 15:00
              - The current time is 2026-10-20 09:00
            when:
              - Priya cancels the booking
            then:
              - Booking Cancelled is recorded for Priya and Room 6
              - Room Status View shows Room 6 as free
          - id: AC-2
            title: Non-owner cannot cancel another employee's booking
            given:
              - An active booking owned by Priya for Room 6 on 2026-10-20 from 14:00 to 15:00
              - The current time is 2026-10-20 09:00
            when:
              - Dev, who does not own the booking, attempts to cancel it
            then:
              - "The cancellation is refused: BR-8, Dev is not the booking's owner"
              - The booking remains active
          - id: AC-3
            title: Owner cannot cancel after the booking has started
            given:
              - An active booking owned by Priya for Room 6 on 2026-10-20 from 14:00 to 15:00
              - The current time is 2026-10-20 14:05
            when:
              - Priya attempts to cancel the booking
            then:
              - "The cancellation is refused: BR-8, the booking's start time has passed"
              - The booking remains active
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When the owner of an active booking cancels it before its start time, the system shall cancel the booking and free the room.
        rules:
          - BR-8
      - id: FR-2
        pattern: unwanted-behaviour
        statement: If a cancellation request breaks BR-8, then the system shall refuse the cancellation with no booking released.
        rules:
          - BR-8
    qualities:
      - scenario: QS-2
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: room-booking-prd-cap-3.r1
spec:
  identity:
    id: room-booking-prd-cap-3
    revision: 1
  content:
    businessRules: room-booking-rules
    title: Check In to Confirm a Booking
    prd: room-booking-prd
    capability: CAP-3
    architecture: room-booking-prd-architecture
    domainModel: room-booking-model
    stories:
      - id: US-1
        role: Employee
        goal: confirm presence at a booked room by checking in
        benefit: so that my booking is honoured instead of being treated as a no-show
        requirements:
          - FR-1
          - FR-2
        commands:
          - Check In Booking
        events:
          - Booking Checked In
        readModels: []
        acceptance:
          - id: AC-1
            title: Owner checks in within the check-in window
            given:
              - a booking for Room 3B from 10:00 to 11:00 owned by Priya
              - the current time is 10:05, 5 minutes after the booking's start
            when:
              - Priya checks in at Room 3B via Check In Booking
            then:
              - the booking is recorded as checked in
              - a Booking Checked In event is recorded for Priya and Room 3B
          - id: AC-2
            title: Check-in exactly at the 10-minute boundary succeeds
            given:
              - a booking for Room 4 from 11:00 to 12:00 owned by Kai
              - the current time is 11:10, exactly 10 minutes after the booking's start
            when:
              - Kai checks in at Room 4 via Check In Booking
            then:
              - the booking is recorded as checked in
              - a Booking Checked In event is recorded for Kai and Room 4
          - id: AC-3
            title: Check-in by someone other than the owner is refused
            given:
              - a booking for Room 2A from 14:00 to 15:00 owned by Omar
              - the current time is 14:03, 3 minutes after the booking's start
            when:
              - Lena attempts to check in at Room 2A via Check In Booking
            then:
              - "the check-in is refused: BR-9, Lena is not the booking's owner"
              - no Booking Checked In event is recorded
          - id: AC-4
            title: Check-in after the check-in window has passed is refused
            given:
              - a booking for Room 1 from 09:00 to 10:00 owned by Sam
              - the current time is 09:11, 11 minutes after the booking's start
            when:
              - Sam attempts to check in at Room 1 via Check In Booking
            then:
              - "the check-in is refused: BR-9, 11 minutes have passed since the booking's start, more than the check-in window allows"
              - no Booking Checked In event is recorded
      - id: US-2
        role: Employee
        goal: have a booking nobody checks into released automatically
        benefit: so that a room that goes unused becomes available to others quickly (G-2)
        requirements:
          - FR-3
          - FR-4
        commands:
          - Release Booking As No-Show
        events:
          - Booking Released As No-Show
        readModels:
          - Room Status View
        acceptance:
          - id: AC-5
            title: Booking with no check-in is released as a no-show
            given:
              - a booking for Room 5 from 13:00 to 14:00 owned by Dana
              - no check-in recorded by 13:10, 10 minutes after the booking's start
            when:
              - the check-in window elapses with no check-in recorded
            then:
              - the booking is recorded as released as a no-show
              - a Booking Released As No-Show event is recorded for Dana and Room 5
              - the Room Status View shows Room 5 as free
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When the booking's owner checks in at the room, the system shall record the booking as checked in.
        rules: []
      - id: FR-2
        pattern: unwanted-behaviour
        statement: If a check-in breaks BR-9, then the system shall refuse the check-in with no booking checked in.
        rules:
          - BR-9
      - id: FR-3
        pattern: event-driven
        statement: When a booking breaks BR-9, the system shall release the booking as a no-show.
        rules:
          - BR-9
      - id: FR-4
        pattern: event-driven
        statement: When a booking is checked in or released as a no-show, the system shall update the Room Status View to reflect the room's current status.
        rules: []
    qualities:
      - scenario: QS-2
    openQuestions:
      - id: Q-1
        question: Is check-in performed by the employee scanning the room's QR code with their own device, or via a reader at the door (Prd Q-2, Architecture C-3)?
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: room-booking-prd-cap-4.r1
spec:
  identity:
    id: room-booking-prd-cap-4
    revision: 1
  content:
    businessRules: room-booking-rules
    title: Walk-in Ad Hoc Booking
    prd: room-booking-prd
    capability: CAP-4
    architecture: room-booking-prd-architecture
    domainModel: room-booking-model
    stories:
      - id: US-1
        role: Walk-in employee
        goal: claim an empty room on the spot for an unplanned meeting
        benefit: so that an unplanned meeting gets a room immediately, without wandering the floor or making an advance booking (G-1)
        requirements:
          - FR-1
          - FR-2
          - FR-3
        commands:
          - Claim Walk-In Room
        events:
          - Walk-In Room Claimed
        readModels:
          - Room Status View
        acceptance:
          - id: AC-1
            title: Walk-in employee claims a free room
            given:
              - Meeting Room 3 (seats 6, no video) is free with no active booking or hold at 14:00
              - Dana, a walk-in employee, holds no prior booking for Meeting Room 3
            when:
              - Dana claims Meeting Room 3 by checking in at its door at 14:00
            then:
              - A walk-in booking is recorded for Meeting Room 3 with Dana as owner starting 14:00
              - Meeting Room 3's Room Status View shows it held by Dana
              - The claim itself satisfies BR-9's check-in requirement, so the booking is never subject to no-show release
          - id: AC-2
            title: Walk-in claim refused when room already held
            given:
              - Meeting Room 3 has an active booking from 14:00 to 15:00 owned by Priya
            when:
              - Dana attempts to claim Meeting Room 3 at 14:15 by checking in at its door
            then:
              - "The claim is refused: Meeting Room 3 is not free, it already has an active booking at the time of claim"
              - No Walk-In Room Claimed event is recorded
      - id: US-2
        role: Walk-in employee
        goal: hold a claimed room only until the next scheduled booking or a bounded time limit
        benefit: so that a room grabbed on the spot becomes available to others again once it is no longer needed (G-2)
        requirements:
          - FR-4
          - FR-5
        commands:
          - Expire Walk-In Hold
        events:
          - Walk-In Hold Expired
        readModels:
          - Room Status View
        acceptance:
          - id: AC-3
            title: Walk-in hold ends at the next scheduled booking
            given:
              - Dana's walk-in claim on Meeting Room 3 started at 14:00 under BR-10
              - Meeting Room 3 has a scheduled booking starting at 14:40
            when:
              - 14:40 arrives
            then:
              - The walk-in hold on Meeting Room 3 expires at 14:40
              - A Walk-In Hold Expired event is recorded for Meeting Room 3
              - Meeting Room 3's Room Status View shows it free for the 14:40 booking's owner
          - id: AC-4
            title: Walk-in hold ends after 60 minutes with no next booking
            given:
              - Dana's walk-in claim on Meeting Room 4 started at 09:00 under BR-10
              - Meeting Room 4 has no scheduled booking after 09:00
            when:
              - 10:00 arrives, 60 minutes after the claim
            then:
              - The walk-in hold on Meeting Room 4 expires at 10:00
              - A Walk-In Hold Expired event is recorded for Meeting Room 4
              - Meeting Room 4's Room Status View shows it free
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When a walk-in employee claims a room that is free, the system shall record a walk-in booking for that room with the claimant as its owner.
      - id: FR-2
        pattern: unwanted-behaviour
        statement: If a room is not free at the time of a walk-in claim, then the system shall refuse the claim.
      - id: FR-3
        pattern: event-driven
        statement: When a walk-in booking is claimed, the system shall treat the claim itself as satisfying BR-9's check-in requirement, so the booking is never released as a no-show.
        rules:
          - BR-9
      - id: FR-4
        pattern: event-driven
        statement: When a walk-in booking is claimed, the system shall determine its end time under BR-10.
        rules:
          - BR-10
      - id: FR-5
        pattern: event-driven
        statement: When a walk-in booking's end time determined under BR-10 is reached, the system shall expire the walk-in hold and make the room available.
        rules:
          - BR-10
    qualities:
      - scenario: QS-1
      - scenario: QS-2
    openQuestions:
      - id: Q-1
        question: "How does a walk-in employee check in at a room's door to claim it: by scanning the door's QR code with their own device, or via a reader at the door (PRD Q-2)?"
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: room-booking-prd-cap-5.r1
spec:
  identity:
    id: room-booking-prd-cap-5
    revision: 1
  content:
    businessRules: room-booking-rules
    title: Room status screens
    prd: room-booking-prd
    capability: CAP-5
    architecture: room-booking-prd-architecture
    domainModel: room-booking-model
    stories:
      - id: US-1
        role: Employee
        goal: see the current status of every room at a glance on a floor-wide screen
        benefit: so that they can find a free room right now without walking the floor (G-3)
        requirements:
          - FR-2
        readModels:
          - Room Status View
        acceptance:
          - id: AC-1
            title: Floor screen lists every room's status
            given:
              - "the office's eight meeting rooms are in a mix of states: three free, two held, three booked and occupied"
            when:
              - an Employee opens the floor-wide screen
            then:
              - the screen lists all eight rooms, each showing its current status of free, held, or booked
          - id: AC-2
            title: Floor screen reflects a room freed by cancellation
            given:
              - Room 7 (capacity 8) was booked by Employee Priya Nair from 10:00 to 11:00 today
              - Priya Nair has cancelled that booking before 10:00
            when:
              - an Employee opens the floor-wide screen at 09:50
            then:
              - the screen shows Room 7 as free
      - id: US-2
        role: Employee
        goal: see a specific room's status, holder, held-until time and what's next at its door
        benefit: so that they know whether that room is usable without walking over to check (G-3)
        requirements:
          - FR-1
        readModels:
          - Room Status View
        acceptance:
          - id: AC-3
            title: Door screen shows a free room
            given:
              - Room 2 (capacity 4, no video conferencing) has no active booking or hold for the current time
            when:
              - an Employee looks at Room 2's door screen
            then:
              - the screen shows Room 2's status as free, with no holder and no held-until time
          - id: AC-4
            title: Door screen shows holder and held-until time for a booked room
            given:
              - Room 5 (capacity 6) has an active booking by Employee Dana Lee from 14:00 to 15:00 today
              - the current time is 14:10
            when:
              - an Employee looks at Room 5's door screen
            then:
              - the screen shows Room 5's status as booked, holder Dana Lee, and held until 15:00
          - id: AC-5
            title: Door screen shows what's next after the current booking
            given:
              - Room 5 is booked by Dana Lee from 14:00 to 15:00 today
              - Room 5 has a further booking by Employee Omar Reyes from 15:30 to 16:00 today
            when:
              - an Employee looks at Room 5's door screen at 14:10
            then:
              - the screen shows held until 15:00 and what's next as Omar Reyes's booking starting at 15:30
      - id: US-3
        role: Walk-in employee
        goal: see a room's status at its door before claiming it
        benefit: so that they only attempt to claim a room that is actually free right now (G-3)
        requirements:
          - FR-1
        readModels:
          - Room Status View
        acceptance:
          - id: AC-6
            title: Walk-in employee sees a free room before claiming it
            given:
              - Room 2 (capacity 4) has no active booking or hold for the current time
            when:
              - a Walk-in employee looks at Room 2's door screen
            then:
              - the screen shows Room 2's status as free
          - id: AC-7
            title: Walk-in employee sees a held room and does not attempt to claim it
            given:
              - Room 2 is currently held by a walk-in claim from Employee Sam Okafor until 11:30
            when:
              - a Walk-in employee looks at Room 2's door screen at 11:00
            then:
              - the screen shows Room 2's status as held, holder Sam Okafor, and held until 11:30
    requirements:
      - id: FR-1
        pattern: ubiquitous
        statement: The system shall display, on each room's door screen, that room's current status, holder, held-until time and what comes next.
      - id: FR-2
        pattern: ubiquitous
        statement: The system shall display, on a floor-wide screen, the current status of every room.
    qualities:
      - scenario: QS-3
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: room-booking-prd-cap-6.r1
spec:
  identity:
    id: room-booking-prd-cap-6
    revision: 1
  content:
    businessRules: room-booking-rules
    title: Monthly Utilisation Report
    prd: room-booking-prd
    capability: CAP-6
    architecture: room-booking-prd-architecture
    domainModel: room-booking-model
    stories:
      - id: US-1
        role: Office management
        goal: receive a monthly summary of how rooms are actually used
        benefit: office management can see how rooms are actually used (G-4)
        requirements:
          - FR-1
          - FR-2
        events:
          - Monthly Utilisation Report Generated
        readModels:
          - Monthly Utilisation Report View
        acceptance:
          - id: AC-1
            title: Monthly report compiled at month end
            given:
              - September 2026 has booking history for all 8 rooms, including completed bookings, cancellations, no-shows and walk-ins
            when:
              - September 2026 ends and the Room Booking Service generates the Monthly Utilisation Report
            then:
              - Office management receives a Monthly Utilisation Report View for September 2026 showing utilisation per room, no-show rate per team, and peak hours of demand
          - id: AC-2
            title: No-show rate shown per team
            given:
              - In September 2026 the Engineering team had 20 bookings of which 4 were released as no-shows, and the Sales team had 10 bookings of which 1 was released as a no-show
            when:
              - September 2026 ends and the Room Booking Service generates the Monthly Utilisation Report
            then:
              - The Monthly Utilisation Report View shows a no-show rate of 20% for Engineering and 10% for Sales
          - id: AC-3
            title: Peak hours identified from booking history
            given:
              - In September 2026 bookings across all rooms clustered between 10:00 and 11:00 far more than in any other hour
            when:
              - September 2026 ends and the Room Booking Service generates the Monthly Utilisation Report
            then:
              - The Monthly Utilisation Report View lists 10:00-11:00 among the month's peak hours of demand
          - id: AC-4
            title: Zero utilisation for an unused room
            given:
              - Room 12-Seat-B had no bookings at all during September 2026
            when:
              - September 2026 ends and the Room Booking Service generates the Monthly Utilisation Report
            then:
              - The Monthly Utilisation Report View shows 0% utilisation for Room 12-Seat-B
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When a calendar month ends, the system shall generate a Monthly Utilisation Report Generated event summarising that month's utilisation per room, no-show rate per team, and peak hours of demand.
      - id: FR-2
        pattern: ubiquitous
        statement: The system shall make a Monthly Utilisation Report View, containing utilisation per room, no-show rate per team, and peak hours of demand, available to office management.
    qualities:
      - scenario: QS-4
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: room-booking-prd-architecture-bb-1-http-api.r1
spec:
  identity:
    id: room-booking-prd-architecture-bb-1-http-api
    revision: 1
  content:
    businessRules: room-booking-rules
    title: Room Booking Service — Booking Commands API
    type: http-api
    architecture: room-booking-prd-architecture
    block: BB-1
    domainModel: room-booking-model
    interface: Booking Commands
    document:
      mediaType: application/openapi+yaml
      content: |
        openapi: 3.1.0
        info:
          title: Room Booking Service - Booking Commands
          version: "1.0.0"
          description: >
            Commands and queries against the Room Schedule aggregate (one room
            booking schedule), plus the Room Status View and Monthly Utilisation
            Report View served as queries over the same store.
        security:
          - ssoBearer: []
        components:
          securitySchemes:
            ssoBearer:
              type: http
              scheme: bearer
              description: Employee identity and team federated from the company SSO/directory (C-1, S-4).
          schemas:
            Employee:
              type: object
              properties:
                name:
                  type: string
                team:
                  type: string
              required: [name, team]
            Room:
              type: object
              properties:
                id:
                  type: string
                seatingCapacity:
                  type: integer
                videoCapability:
                  type: boolean
              required: [id, seatingCapacity, videoCapability]
            Booking:
              type: object
              properties:
                id:
                  type: string
                owner:
                  $ref: '#/components/schemas/Employee'
                room:
                  $ref: '#/components/schemas/Room'
                date:
                  type: string
                  format: date
                createdDate:
                  type: string
                  format: date
                startTime:
                  type: string
                endTime:
                  type: string
                attendeeCount:
                  type: integer
                videoNeed:
                  type: boolean
                status:
                  type: string
                  enum: [active, inactive]
              required: [id, owner, room, date, createdDate, startTime, endTime, attendeeCount, videoNeed, status]
            BookRoomRequest:
              type: object
              properties:
                date:
                  type: string
                  format: date
                startTime:
                  type: string
                endTime:
                  type: string
                attendeeCount:
                  type: integer
                videoNeed:
                  type: boolean
              required: [date, startTime, endTime, attendeeCount, videoNeed]
            RoomStatusView:
              type: object
              properties:
                roomId:
                  type: string
                status:
                  type: string
                  enum: [free, held, booked]
                holder:
                  type: string
                heldUntil:
                  type: string
                next:
                  type: string
              required: [roomId, status]
            MonthlyUtilisationReportView:
              type: object
              properties:
                month:
                  type: string
                roomUtilisation:
                  type: string
                noShowRatePerTeam:
                  type: string
                peakHours:
                  type: string
              required: [month, roomUtilisation, noShowRatePerTeam, peakHours]
            Refusal:
              type: object
              properties:
                brokenRules:
                  type: array
                  items:
                    type: string
                message:
                  type: string
              required: [brokenRules, message]
        paths:
          /bookings:
            post:
              operationId: bookRoom
              summary: Book Room
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/BookRoomRequest'
              responses:
                '201':
                  description: Room Booked
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Booking'
                '422':
                  description: Refused - no room fits and is free for the slot, or the slot itself is invalid (BR-1 to BR-7); corresponds to No Available Room Found when no room qualifies.
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Refusal'
          /bookings/{bookingId}/cancel:
            parameters:
              - name: bookingId
                in: path
                required: true
                schema:
                  type: string
            post:
              operationId: cancelBooking
              summary: Cancel Booking
              responses:
                '200':
                  description: Booking Cancelled
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Booking'
                '409':
                  description: Refused - not the booking's owner, or the start time has already passed (BR-8).
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Refusal'
          /bookings/{bookingId}/check-in:
            parameters:
              - name: bookingId
                in: path
                required: true
                schema:
                  type: string
            post:
              operationId: checkInBooking
              summary: Check In Booking
              responses:
                '200':
                  description: Booking Checked In
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Booking'
                '409':
                  description: Refused - not the booking's owner, or outside the check-in window after the scheduled start time (BR-9).
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Refusal'
          /bookings/{bookingId}/no-show-release:
            parameters:
              - name: bookingId
                in: path
                required: true
                schema:
                  type: string
            post:
              operationId: releaseBookingAsNoShow
              summary: Release Booking As No-Show
              description: Normally issued by the Room Booking Service's internal no-show timer (POL-1), not by a caller.
              responses:
                '200':
                  description: Booking Released As No-Show
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Booking'
          /rooms/{roomId}/walk-in-claims:
            parameters:
              - name: roomId
                in: path
                required: true
                schema:
                  type: string
            post:
              operationId: claimWalkInRoom
              summary: Claim Walk-In Room
              responses:
                '201':
                  description: Walk-In Room Claimed
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Booking'
                '409':
                  description: Refused - the room already has an active booking or hold at the time of claim.
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Refusal'
          /bookings/{bookingId}/expire-walk-in-hold:
            parameters:
              - name: bookingId
                in: path
                required: true
                schema:
                  type: string
            post:
              operationId: expireWalkInHold
              summary: Expire Walk-In Hold
              description: Normally issued by the Room Booking Service's internal walk-in hold timer (POL-2), not by a caller.
              responses:
                '200':
                  description: Walk-In Hold Expired
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Booking'
          /rooms/{roomId}/status:
            parameters:
              - name: roomId
                in: path
                required: true
                schema:
                  type: string
            get:
              operationId: getRoomStatus
              summary: Room Status View
              responses:
                '200':
                  description: Current status, holder, held-until time and what's next for the room.
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/RoomStatusView'
          /reports/monthly-utilisation:
            get:
              operationId: getMonthlyUtilisationReport
              summary: Monthly Utilisation Report View
              parameters:
                - name: month
                  in: query
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Utilisation per room, no-show rate per team, and peak hours for the requested month.
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/MonthlyUtilisationReportView'
    elements:
      - id: EL-1
        name: POST /bookings
        realises:
          kind: command
          name: Book Room
        rules:
          - BR-1
          - BR-2
          - BR-3
          - BR-4
          - BR-5
          - BR-6
          - BR-7
      - id: EL-2
        name: POST /bookings/{bookingId}/cancel
        realises:
          kind: command
          name: Cancel Booking
        rules:
          - BR-8
      - id: EL-3
        name: POST /bookings/{bookingId}/check-in
        realises:
          kind: command
          name: Check In Booking
        rules:
          - BR-9
      - id: EL-4
        name: POST /bookings/{bookingId}/no-show-release
        realises:
          kind: command
          name: Release Booking As No-Show
        rules: []
      - id: EL-5
        name: POST /rooms/{roomId}/walk-in-claims
        realises:
          kind: command
          name: Claim Walk-In Room
        rules: []
      - id: EL-6
        name: POST /bookings/{bookingId}/expire-walk-in-hold
        realises:
          kind: command
          name: Expire Walk-In Hold
        rules: []
      - id: EL-7
        name: GET /rooms/{roomId}/status
        realises:
          kind: readModel
          name: Room Status View
        rules: []
      - id: EL-8
        name: GET /reports/monthly-utilisation
        realises:
          kind: readModel
          name: Monthly Utilisation Report View
        rules: []
    rules:
      - BR-1
