      - id: Q-2
        question: Neither document names a typeface the office already owns or standardises on. Is there a licensed/brand typeface to use instead of Inter, the open, highly legible neutral chosen here?
      - id: Q-3
        question: The Door Status Screen and Floor Status Screen are kiosk displays (Architecture BB-6, BB-7), but neither document states their mounting distance. This file assumes the door screen is read from arm's length to a few metres (someone approaching the room) and the floor screen is read from across the room (several metres, from a desk). Is that right, or does either screen need larger/smaller type?
    document:
      mediaType: text/markdown
      content: |-
        ---
        version: alpha
        name: Meeting Room Booking
        colors:
          primary: "#1D4ED8"
          on-primary: "#FFFFFF"
          primary-hover: "#1E40AF"
          secondary: "#4B5563"
