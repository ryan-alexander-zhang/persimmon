        description: "Implement Claim Walk-In Room against the Room Schedule aggregate: when the claimed room is free, record a new walk-in booking with the claimant as owner, treating the claim itself as satisfying BR-9's check-in requirement so the booking is never later released as a no-show; when the room already has an active booking or hold at the time of claim, refuse the claim and record no Walk-In Room Claimed event."
      - id: T-2
        title: Determine a walk-in hold's end time under BR-10 and expire it
        block: BB-1
        covers:
          - FR-4
          - FR-5
        verifiedBy: []
        elements:
          - design: room-booking-prd-architecture-bb-1-http-api
            element: EL-6
          - design: room-booking-prd-architecture-bb-1-data-schema
            element: EL-3
        dependsOn:
          - T-1
        description: When a walk-in booking is claimed, determine its end time under BR-10 as the room's next scheduled booking start time, or walk_in_max_hold_minutes after the claim if there is none sooner. Run Expire Walk-In Hold against the Room Schedule aggregate when that end time is reached, recording a Walk-In Hold Expired event and making the room available again.
      - id: T-3
        title: Show walk-in holds and their expiry on the Room Status View
        block: BB-1
        covers: []
        verifiedBy:
          - AC-1
          - AC-3
          - AC-4
        elements:
          - design: room-booking-prd-architecture-bb-1-http-api
            element: EL-7
          - design: room-booking-prd-architecture-bb-1-data-schema
            element: EL-2
        dependsOn:
          - T-1
          - T-2
        description: Extend the Room Status View query so that a room held under a walk-in claim reports itself held by the claimant, and reports itself free again, for the next scheduled booking's owner or generally, once Expire Walk-In Hold has run on that room.
    openQuestions:
      - id: Q-1
        question: The data-schema Design's own Q-3 notes that AG-1's Booking carries no attribute marking a booking as a walk-in claim versus a scheduled booking. Without it, T-1 cannot mark a claimed booking exempt from BR-9's no-show release (FR-3), and T-2 cannot limit Expire Walk-In Hold (BR-10) to walk-in holds only, as both act on the same booking table (EL-2) as scheduled bookings.
      - id: Q-2
        question: The http-api Design's EL-5 (POST /rooms/{roomId}/walk-in-claims, realising Claim Walk-In Room) lists no rules, though T-1 realises FR-2's refusal when the room is not free against it. Should EL-5 name the room-free check it enforces, so T-1's coverage of FR-1/FR-2 is traceable to a rule the way EL-1's BR-1 to BR-7 are for Book Room?
---
