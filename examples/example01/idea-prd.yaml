# idea-to-prd: idea -> codex research -> PRD (Summary + EARS features) -> sonnet review -> fix P0 -> your approval.
# Install: persimmon apply idea-prd.yaml    Run: persimmon run idea-to-prd --input idea="..." --follow
apiVersion: persimmon.ai/v1
kind: KindDefinition
metadata: {name: earsprds.engineering.persimmon.ai}
spec:
  group: engineering.persimmon.ai
  names: {kind: EarsPrd, plural: earsprds}
  scope: Namespaced
  versions:
    - name: v1
      schema:
        type: object
        required: [title, summary, features]
        properties:
          title: {type: string}
          summary: {type: string, description: "Section 1: the problem, the users, the outcome, in prose"}
          features:
            type: array
            minItems: 1
            description: "Section 2: one entry per feature"
            items:
              type: object
              required: [id, name, requirements]
              properties:
                id: {type: string}
                name: {type: string}
                requirements:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, pattern, statement]
                    properties:
                      id: {type: string}
                      pattern: {enum: [ubiquitous, event-driven, state-driven, unwanted-behaviour, optional, complex]}
                      statement: {type: string, description: "EARS sentence, e.g. 'When <trigger>, the <system> shall <response>'"}
  mutability: Immutable
  revisioned: true
  snapshot: "None"
---
apiVersion: persimmon.ai/v1
kind: Prompt
metadata: {name: ears-prd-template}
spec:
  mediaType: text/markdown
  content: |
    PRD template. Two sections, nothing else.
    Section 1 "summary": problem, target users, expected outcome. Prose, at most 200 words.
    Section 2 "features": each feature has an id (F1, F2, ...), a name and its requirements.
    Every requirement is one EARS sentence and names its pattern:
    - ubiquitous:          The <system> shall <response>.
    - event-driven:        When <trigger>, the <system> shall <response>.
    - state-driven:        While <state>, the <system> shall <response>.
    - unwanted-behaviour:  If <condition>, then the <system> shall <response>.
    - optional:            Where <feature is included>, the <system> shall <response>.
    - complex:             a combination of the above.
    Requirement ids are F1-R1, F1-R2, ... Every statement is testable.
---
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: codex-researcher}
spec:
  type: agent
  adapter: codex/v1
  configuration: {model: gpt-6-sol, sandbox: workspace-write}
  security:
    networkAccess: allowlist        # codex has one network switch; this list cannot narrow hosts
    allowedHosts: [api.openai.com]
---
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: sonnet-agent}
spec:
  type: agent
  adapter: claude-code/v1
  configuration: {model: claude-sonnet-5, sandbox: read-only}
  security:
    networkAccess: allowlist
    allowedHosts: [api.anthropic.com]
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: research-idea}
spec:
  inputs:
    idea: {type: {kind: value, schema: {type: string, minLength: 1}}}
  outputs:
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ResearchReport}}}
  executorRef: {kind: Executor, name: codex-researcher}
  action:
    instructions: |
      Research the idea given in the inputs. Use the network: read official blogs, product pages and
      documentation of comparable products (fetch pages with curl). Publish a ResearchReport: every finding
      has one statement and the URLs it comes from. Cover: existing solutions, gaps, user needs, risks.
    parameters: {reasoningEffort: xhigh}
  timeout: 30m
  retryPolicy:
    maxAttempts: 2
    backoff: {strategy: exponential, initial: 30s, max: 5m, jitter: full}
    retryOn: [timeout, rate_limit, transient_network]
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: write-ears-prd}
spec:
  inputs:
    idea: {type: {kind: value, schema: {type: string, minLength: 1}}}
    research: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ResearchReport}}}
  outputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: EarsPrd}}}
  executorRef: {kind: Executor, name: sonnet-agent}
  action:
    instructions: "Write the PRD for the idea from the research report. Follow the template exactly."
    context:
      - {kind: artifact, input: research}
      - {kind: prompt, ref: {kind: Prompt, name: ears-prd-template}}
    parameters: {effort: high}
  timeout: 30m
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: review-ears-prd}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: EarsPrd}}}
  outputs:
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ReviewReport}}}
  executorRef: {kind: Executor, name: sonnet-agent}
  action:
    instructions: |
      Review the PRD. Check: the summary states problem, users and outcome; every requirement is a valid
      EARS sentence of its declared pattern; every statement is testable; no feature lacks requirements;
      no contradictions. Publish a ReviewReport. severity error = P0 (must fix), warning = P1, info = note.
      Name the requirement id in every finding message.
    context:
      - {kind: artifact, input: prd}
    parameters: {effort: high}
  timeout: 20m
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: fix-ears-prd}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: EarsPrd}}}
    review: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ReviewReport}}}
  outputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: EarsPrd}}}
  executorRef: {kind: Executor, name: sonnet-agent}
  action:
    instructions: |
      Publish a revised PRD. Fix every finding with severity error (P0). Leave warning and info findings
      unchanged unless the fix is trivial. Keep every id. Keep the template.
    context:
      - {kind: artifact, input: prd}
      - {kind: artifact, input: review}
      - {kind: prompt, ref: {kind: Prompt, name: ears-prd-template}}
    parameters: {effort: high}
  timeout: 30m
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: approve-ears-prd}
spec:
  inputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: EarsPrd}}}
    review: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ReviewReport}}}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: "Approve or reject the revised PRD. The agent review it was fixed against is attached."
    context:
      - {kind: artifact, input: prd}
      - {kind: artifact, input: review}
  timeout: 48h
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: idea-to-prd}
spec:
  inputs:
    idea: {type: {kind: value, schema: {type: string, minLength: 1}}}
  outputs:
    prd: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: EarsPrd}}}
    approved: {type: {kind: value, schema: {type: boolean}}}
  outputBindings:
    prd: {fromStep: {stepRef: fix, output: prd}}
    approved: {expression: 'steps.approve.outputs.result.passed'}
  entry: [research]
  steps:
    - id: research
      uses: {kind: Task, name: research-idea}
      inputs: {idea: {fromInput: idea}}
      timeout: 35m
    - id: write
      uses: {kind: Task, name: write-ears-prd}
      inputs:
        idea: {fromInput: idea}
        research: {fromStep: {stepRef: research, output: report}}
      timeout: 35m
    - id: review
      uses: {kind: Task, name: review-ears-prd}
      inputs: {prd: {fromStep: {stepRef: write, output: prd}}}
      timeout: 25m
    - id: fix
      uses: {kind: Task, name: fix-ears-prd}
      inputs:
        prd: {fromStep: {stepRef: write, output: prd}}
        review: {fromStep: {stepRef: review, output: report}}
      timeout: 35m
    - id: approve
      uses: {kind: Task, name: approve-ears-prd}
      inputs:
        prd: {fromStep: {stepRef: fix, output: prd}}
        review: {fromStep: {stepRef: review, output: report}}
      timeout: 48h
  transitions:
    - {id: to-write,   from: [{stepRef: research, outcomes: [Succeeded]}], to: [{stepRef: write}]}
    - {id: to-review,  from: [{stepRef: write,    outcomes: [Succeeded]}], to: [{stepRef: review}]}
    - {id: to-fix,     from: [{stepRef: review,   outcomes: [Succeeded]}], to: [{stepRef: fix}]}
    - {id: to-approve, from: [{stepRef: fix,      outcomes: [Succeeded]}], to: [{stepRef: approve}]}
    - id: done
      from: [{stepRef: approve, outcomes: [Succeeded, Failed]}]
      to:
        - {terminal: Succeeded, when: 'steps.approve.outputs.result.passed == true'}
        - {terminal: Failed, reason: prd_rejected}
      dispatch: first
  timeout: 52h
