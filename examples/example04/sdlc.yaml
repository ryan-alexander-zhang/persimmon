# idea-to-verified: one line -> Idea (agent, your template) -> you approve -> Spec (EARS + GWT, your template)
#   -> code (codex) behind a Gate (coverage script + codex checks every GWT AC has a test) -> verification report (your template).
# Install: persimmon apply templates.yaml sdlc.yaml    Run: persimmon run idea-to-verified --input idea="..." --follow
apiVersion: persimmon.ai/v1
kind: KindDefinition
metadata: {name: ideas.engineering.persimmon.ai}
spec:
  group: engineering.persimmon.ai
  names: {kind: Idea, plural: ideas}
  scope: Namespaced
  versions:
    - name: v1
      schema:
        type: object
        required: [title, problem, proposal, outOfScope, successSignal]
        properties:
          title: {type: string}
          problem: {type: string}
          proposal: {type: string}
          outOfScope: {type: array, items: {type: string}}
          successSignal: {type: string}
  mutability: Immutable
  revisioned: true
  snapshot: "None"
---
apiVersion: persimmon.ai/v1
kind: KindDefinition
metadata: {name: specs.engineering.persimmon.ai}
spec:
  group: engineering.persimmon.ai
  names: {kind: Spec, plural: specs}
  scope: Namespaced
  versions:
    - name: v1
      schema:
        type: object
        required: [title, summary, features]
        properties:
          title: {type: string}
          summary: {type: string}
          features:
            type: array
            minItems: 1
            items:
              type: object
              required: [id, name, requirements, acceptance]
              properties:
                id: {type: string}
                name: {type: string}
                requirements:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, pattern, statement]
                    properties:
                      id: {type: string}
                      pattern: {enum: [ubiquitous, event-driven, state-driven, unwanted-behaviour, optional]}
                      statement: {type: string}
                acceptance:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, given, when, then]
                    properties:
                      id: {type: string}
                      given: {type: string}
                      when: {type: string}
                      then: {type: string}
  mutability: Immutable
  revisioned: true
  snapshot: "None"
---
apiVersion: persimmon.ai/v1
kind: KindDefinition
metadata: {name: implementationreports.engineering.persimmon.ai}
spec:
  group: engineering.persimmon.ai
  names: {kind: ImplementationReport, plural: implementationreports}
  scope: Namespaced
  versions:
    - name: v1
      schema:
        type: object
        required: [summary, files, tests]
        properties:
          summary: {type: string}
          files: {type: array, items: {type: string}}
          tests: {type: array, items: {type: object, required: [ac, file, name], properties: {ac: {type: string}, file: {type: string}, name: {type: string}}}, description: "which test verifies which AC"}
  mutability: Immutable
  revisioned: true
  snapshot: "None"
---
apiVersion: persimmon.ai/v1
kind: KindDefinition
metadata: {name: verificationreports.engineering.persimmon.ai}
spec:
  group: engineering.persimmon.ai
  names: {kind: VerificationReport, plural: verificationreports}
  scope: Namespaced
  versions:
    - name: v1
      schema:
        type: object
        required: [passed, path, summary, verified, total]
        properties:
          passed: {type: boolean}
          path: {type: string, description: "the HTML file, relative to app/"}
          summary: {type: string}
          coverage: {type: string}
          rounds: {type: integer}
          verified: {type: integer, description: "ACs with a test that verifies them"}
          total: {type: integer, description: "ACs in the spec"}
  mutability: Immutable
  revisioned: true
  snapshot: "None"
---
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: writer}
spec:
  type: agent
  adapter: claude-code/v1
  configuration: {model: claude-sonnet-5, sandbox: read-only}
  security: {networkAccess: allowlist, allowedHosts: [api.anthropic.com]}
---
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: coder}
spec:
  type: agent
  adapter: codex/v1
  configuration: {model: gpt-6-sol, sandbox: workspace-write}
  security: {networkAccess: deny}
---
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: verifier}
spec:
  type: agent
  adapter: codex/v1
  configuration: {model: gpt-6-sol, sandbox: read-only}
  security: {networkAccess: deny}
---
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: reporter}
spec:
  type: agent
  adapter: claude-code/v1
  configuration: {model: claude-sonnet-5, sandbox: workspace-write}
  security: {networkAccess: allowlist, allowedHosts: [api.anthropic.com]}
---
apiVersion: persimmon.ai/v1
kind: Executor
metadata: {name: coverage-script}
spec:
  type: script
  adapter: subprocess/v1
  configuration: {program: [node, ../scripts/coverage.mjs], resultFile: coverage/result.json}
  security: {networkAccess: deny}
---
# A Skill: a directory with SKILL.md, pinned by digest (`persimmon digest skills/vitest-style`). The coder gets it as a native skill.
apiVersion: persimmon.ai/v1
kind: Skill
metadata: {name: vitest-style}
spec:
  source: {provider: file, type: directory, id: vitest-style, locator: {path: skills/vitest-style}, version: "1"}
  digest: sha256:9affade7a53d25d202e08c2b85a83dc2d772e2253eaf350c75dbb57bbab816f1
  format: claude-code-skill/v1
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: write-idea}
spec:
  inputs:
    idea: {type: {kind: value, schema: {type: string, minLength: 1}}}
  outputs:
    idea: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: Idea}}}
  executorRef: {kind: Executor, name: writer}
  action:
    instructions: "Write the Idea document for the one-line idea in the inputs. Follow the template."
    context:
      - {kind: prompt, ref: {kind: Prompt, name: idea-template}}
    parameters: {effort: medium}
  timeout: 10m
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: approve-idea}
spec:
  inputs:
    idea: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: Idea}}}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: local-reviewer}
  action:
    instructions: "Approve the idea to continue to the spec, or reject it with the reason."
    context:
      - {kind: artifact, input: idea}
  timeout: 48h
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: write-spec}
spec:
  inputs:
    idea: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: Idea}}}
  outputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: Spec}}}
  executorRef: {kind: Executor, name: writer}
  action:
    instructions: |
      Write the Spec for the approved idea. Follow the template: EARS requirements, GWT acceptance criteria.
      The system is a Node ESM command-line program with no dependencies; every AC must be checkable by a
      vitest test that runs the command or calls the module.
    context:
      - {kind: artifact, input: idea}
      - {kind: prompt, ref: {kind: Prompt, name: spec-template}}
    parameters: {effort: high}
  timeout: 15m
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: implement}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: Spec}}}
    previous: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ImplementationReport}}}
  executorRef: {kind: Executor, name: coder}
  action:
    instructions: |
      Implement the spec in the current directory, the app (Node ESM, no dependencies; vitest is installed).
      Source under src/, tests under test/*.test.mjs. One test per acceptance criterion, named with the AC id,
      whose body sets up the Given, performs the When, asserts the Then. Run `npm run coverage` until every
      test passes and every metric is at least 90%. The `previous` input, when present, is the last Gate
      verdict: fix every finding in it first. Never run git. Publish an ImplementationReport: summary, the
      files you wrote, which test verifies which AC. Write the tests the way the vitest-style skill says.
    context:
      - {kind: artifact, input: spec}
      - {kind: skill, ref: {kind: Skill, name: vitest-style}}
    workspace: {path: app}
    parameters: {reasoningEffort: medium}
  timeout: 30m
  sideEffects: idempotent
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: coverage-check}
spec:
  inputs:
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ImplementationReport}}}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: coverage-script}
  action:
    instructions: "Run the tests with coverage; pass when every metric is at least 90%."
    workspace: {path: app}
  timeout: 10m
  sideEffects: idempotent
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: gwt-check}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: Spec}}}
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ImplementationReport}}}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/ValidationResult"}}}
  executorRef: {kind: Executor, name: verifier}
  action:
    instructions: |
      Read the tests in test/ and the code in src/ of the current directory. For every acceptance criterion in
      the spec, find the test that verifies it: its setup matches the Given, it performs the When, and its
      assertions check the Then, exactly (the same text, exit code, file content the AC names). A test that
      exists but asserts something weaker does not count. Do not trust the report; read the test bodies.
      Answer a ValidationResult: passed only when every AC is verified; one finding per unverified AC,
      severity error, code = the AC id, message = which part (given, when, then) is not verified and why.
      Add one info finding per verified AC, code = the AC id, message = "<file>: <test name>".
    context:
      - {kind: artifact, input: spec}
      - {kind: artifact, input: report}
    workspace: {path: app}
    parameters: {reasoningEffort: high}
  timeout: 15m
  sideEffects: none
---
apiVersion: persimmon.ai/v1
kind: Task
metadata: {name: write-report}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: Spec}}}
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ImplementationReport}}}
    verdict: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
    rounds: {type: {kind: value, schema: {type: integer}}}
  outputs:
    verification: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: VerificationReport}}}
  executorRef: {kind: Executor, name: reporter}
  action:
    instructions: |
      Write the verification report to reports/verification.html in the current directory, the app (create
      the directory), following the template. The verdict input holds the Gate result: results.coverage and
      results.acceptance with their findings. Then publish a VerificationReport: passed, path, summary,
      coverage, rounds, verified (ACs with an info finding), total (ACs in the spec).
    context:
      - {kind: artifact, input: spec}
      - {kind: artifact, input: report}
      - {kind: prompt, ref: {kind: Prompt, name: report-template}}
    workspace: {path: app}
    parameters: {effort: medium}
  timeout: 15m
  sideEffects: idempotent
---
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: coverage}
spec:
  inputs:
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ImplementationReport}}}
  evaluator: {type: task, taskRef: {kind: Task, name: coverage-check}, resultOutput: result}
  timeout: 10m
---
apiVersion: persimmon.ai/v1
kind: Validator
metadata: {name: acceptance}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: Spec}}}
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ImplementationReport}}}
  evaluator: {type: task, taskRef: {kind: Task, name: gwt-check}, resultOutput: result}
  timeout: 15m
---
apiVersion: persimmon.ai/v1
kind: Gate
metadata: {name: quality-gate}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: Spec}}}
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ImplementationReport}}}
  outputs:
    result: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
  validators:
    - {name: coverage, ref: {kind: Validator, name: coverage}, inputs: {report: {fromInput: report}}}
    - {name: acceptance, ref: {kind: Validator, name: acceptance}, inputs: {spec: {fromInput: spec}, report: {fromInput: report}}}
  policy: {strategy: all}
  timeout: 30m
---
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: code-round}
spec:
  inputs:
    spec: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: Spec}}}
    previous: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
  outputs:
    report: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: ImplementationReport}}}
    verdict: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}}
    passed: {type: {kind: value, schema: {type: boolean}}}
  outputBindings:
    report: {fromStep: {stepRef: implement, output: report}}
    verdict: {fromStep: {stepRef: gate, output: result}}
    passed: {expression: 'steps.gate.outputs.result.passed'}
  entry: [implement]
  steps:
    - id: implement
      uses: {kind: Task, name: implement}
      inputs: {spec: {fromInput: spec}, previous: {fromInput: previous, onMissing: omit}}
      timeout: 35m
    - id: gate
      uses: {kind: Gate, name: quality-gate}
      inputs: {spec: {fromInput: spec}, report: {fromStep: {stepRef: implement, output: report}}}
      timeout: 35m
  transitions:
    - {id: to-gate, from: [{stepRef: implement, outcomes: [Succeeded]}], to: [{stepRef: gate}]}
    - {id: done, from: [{stepRef: gate, outcomes: [Succeeded]}], to: [{terminal: Succeeded}]}
  timeout: 2h
---
apiVersion: persimmon.ai/v1
kind: Workflow
metadata: {name: idea-to-verified}
spec:
  inputs:
    idea: {type: {kind: value, schema: {type: string, minLength: 1}}}
    maxRounds: {type: {kind: value, schema: {type: integer, minimum: 1}}, required: false, default: {kind: value, value: 3}}
  outputs:
    idea: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: Idea}}}
    spec: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: Spec}}}
    verification: {type: {kind: artifact, artifactKind: {apiVersion: engineering.persimmon.ai/v1, kind: VerificationReport}}}
    passed: {type: {kind: value, schema: {type: boolean}}}
  outputBindings:
    idea: {fromStep: {stepRef: write-idea, output: idea}}
    spec: {fromStep: {stepRef: write-spec, output: spec}}
    verification: {fromStep: {stepRef: report, output: verification}}
    passed: {fromStep: {stepRef: rounds, output: passed}}
  entry: [write-idea]
  steps:
    - id: write-idea
      uses: {kind: Task, name: write-idea}
      inputs: {idea: {fromInput: idea}}
      timeout: 15m
    - id: approve
      uses: {kind: Task, name: approve-idea}
      inputs: {idea: {fromStep: {stepRef: write-idea, output: idea}}}
      timeout: 48h
    - id: write-spec
      uses: {kind: Task, name: write-spec}
      inputs: {idea: {fromStep: {stepRef: write-idea, output: idea}}}
      timeout: 20m
    - id: rounds
      uses: {kind: Workflow, name: code-round}
      inputs: {spec: {fromStep: {stepRef: write-spec, output: spec}}, previous: {fromState: previous, onMissing: omit}}
      timeout: 6h
      repeat:
        state:
          previous: {type: {kind: value, schema: {$ref: "persimmon.ai/v1#/GateResult"}}, required: false}
        initial: {}
        next: {previous: {fromIterationOutput: verdict}}
        until: 'iteration.outputs.passed || iteration.index >= inputs.maxRounds'
        maxIterations: 10
    - id: report
      uses: {kind: Task, name: write-report}
      inputs:
        spec: {fromStep: {stepRef: write-spec, output: spec}}
        report: {fromStep: {stepRef: rounds, output: report}}
        verdict: {fromStep: {stepRef: rounds, output: verdict}}
        rounds: {expression: 'steps.rounds.iterations'}
      timeout: 20m
  transitions:
    - {id: to-approve, from: [{stepRef: write-idea, outcomes: [Succeeded]}], to: [{stepRef: approve}]}
    - id: approved
      from: [{stepRef: approve, outcomes: [Succeeded, Failed]}]
      to:
        - {stepRef: write-spec, when: 'steps.approve.outputs.result.passed == true'}
        - {terminal: Failed, reason: idea_rejected}
      dispatch: first
    - {id: to-rounds, from: [{stepRef: write-spec, outcomes: [Succeeded]}], to: [{stepRef: rounds}]}
    - {id: to-report, from: [{stepRef: rounds, outcomes: [Succeeded]}], to: [{stepRef: report}]}
    - id: done
      from: [{stepRef: report, outcomes: [Succeeded]}]
      to:
        - {terminal: Succeeded, when: 'steps.rounds.outputs.passed == true'}
        - {terminal: Failed, reason: quality_not_met}
      dispatch: first
  timeout: 56h
