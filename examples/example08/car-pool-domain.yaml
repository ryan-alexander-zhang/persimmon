        block: BB-1
        description: "Store a reservation's status across the long-reservation approval workflow: pending approval, approved, declined, created, alongside the existing pickup/return states."
        covers: []
        verifiedBy: []
        elements:
          - design: car-pool-prd-architecture-bb-1-car-reservations-data-schema
            element: EL-1
      - id: T-2
        title: Request long reservation approval
        block: BB-1
        description: When a requested reservation breaks the standard-limit rule, record a long reservation approval request instead of creating the reservation.
        covers:
          - FR-1
        verifiedBy: []
        dependsOn:
          - T-1
        elements:
          - design: car-pool-prd-architecture-bb-1-reservations-http-api
            element: EL-2
      - id: T-3
        title: Pending approvals view
        block: BB-1
        description: List every reservation awaiting a long-reservation decision, with its employee and requested slot, so the fleet coordinator can act before each requested start passes.
        covers:
          - FR-5
        verifiedBy:
          - AC-1
          - AC-5
        dependsOn:
          - T-2
        elements:
          - design: car-pool-prd-architecture-bb-1-reservations-http-api
            element: EL-9
      - id: T-4
        title: Approve long reservation
        block: BB-1
        description: When the fleet coordinator approves a long reservation, create the reservation and remove the request from the pending approvals view.
        covers:
          - FR-2
        verifiedBy:
          - AC-2
        dependsOn:
          - T-3
        elements:
          - design: car-pool-prd-architecture-bb-1-reservations-http-api
            element: EL-4
      - id: T-5
        title: Deny long reservation
        block: BB-1
        description: When the fleet coordinator denies a long reservation, decline the reservation request and remove it from the pending approvals view.
        covers:
          - FR-3
        verifiedBy:
          - AC-3
        dependsOn:
          - T-3
        elements:
          - design: car-pool-prd-architecture-bb-1-reservations-http-api
            element: EL-5
      - id: T-6
        title: Lapse an undecided long reservation approval
        block: BB-1
        description: When a long reservation approval request is not decided by the reservation's requested start, lapse the approval and decline the reservation request, removing it from the pending approvals view.
        covers:
          - FR-4
        verifiedBy:
          - AC-4
        dependsOn:
          - T-3
        elements: []
      - id: T-7
        title: "Available cars: request a long reservation"
        block: BB-3
        description: Let an employee submit a reservation request from the Available cars screen and see a pending status when the request exceeds the standard limit and awaits the coordinator's approval.
        covers:
          - FR-1
        verifiedBy: []
        dependsOn:
          - T-2
        elements:
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-2
      - id: T-8
        title: Pending approvals screen
        block: BB-3
        description: Let the fleet coordinator see every reservation awaiting a long-reservation decision and approve or deny each one.
        covers:
          - FR-2
          - FR-3
          - FR-5
        verifiedBy: []
        dependsOn:
          - T-3
          - T-4
          - T-5
        elements:
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-8
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-9
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-10
      - id: T-9
        title: "My reservations: reflect a lapsed approval"
        block: BB-3
        description: Let an employee see their reservation request as declined once an undecided long-reservation approval lapses at the requested start.
        covers:
          - FR-4
        verifiedBy: []
        dependsOn:
          - T-6
        elements:
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-3
    openQuestions:
      - id: Q-1
        question: FR-4 requires the system to lapse an undecided long-reservation approval once the reservation's requested start passes. No Design in context models the mechanism that detects this time-based condition and triggers the lapse (the Reservation API Design only exposes user-invoked approve/deny commands, not an internal scheduler or job). T-6 has no element because the Design that would define this trigger (e.g. a scheduled-process or policy Design for BB-1) is missing from context.
