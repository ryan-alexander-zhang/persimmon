    tasks:
      - id: T-1
        title: Derive service-due state and serve the Service-due view
        description: Hold each car's mileage, next-service threshold, and service state in the Car record, and derive from it which cars have crossed their next-service threshold so they can be listed on the Service-due view for the fleet coordinator.
        block: BB-1
        covers:
          - FR-1
          - FR-2
        verifiedBy:
          - AC-1
          - AC-2
        elements:
          - design: car-pool-prd-architecture-bb-1-fleet-care-data-schema
            element: EL-1
          - design: car-pool-prd-architecture-bb-1-fleet-http-api
            element: EL-6
      - id: T-2
        title: Show the Service-due view to the fleet coordinator
        description: Let the fleet coordinator see, on the Service-due view, every car that has crossed its mileage or date threshold.
        block: BB-3
        covers:
          - FR-2
        verifiedBy:
          - AC-1
          - AC-2
        dependsOn:
          - T-1
        elements:
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-13
      - id: T-3
        title: Schedule garage service and take a service-due car out of service
        description: When the fleet coordinator schedules a service-due car's garage service, take the car out of service for the booked garage days.
        block: BB-1
        covers:
          - FR-3
        verifiedBy:
          - AC-3
        dependsOn:
          - T-1
        elements:
          - design: car-pool-prd-architecture-bb-1-fleet-care-data-schema
            element: EL-1
          - design: car-pool-prd-architecture-bb-1-fleet-http-api
            element: EL-3
      - id: T-4
        title: Let the fleet coordinator schedule garage service from the Service-due view
        description: Let the fleet coordinator, from the Service-due view, schedule a service-due car's garage service and see it leave service for the booked days.
        block: BB-3
        covers:
          - FR-3
        verifiedBy:
          - AC-3
        dependsOn:
          - T-2
          - T-3
        elements:
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-14
      - id: T-5
        title: Record garage completion and return a serviced car to service
        description: When the fleet coordinator records that the garage has completed a car's service, show the car as serviced on the Garage status view; when the fleet coordinator returns the car from scheduled maintenance, record the mileage and next-service threshold the garage reports and put the car back in service, reflected on the Fleet record view.
        block: BB-1
        covers:
          - FR-4
          - FR-5
        verifiedBy:
          - AC-4
          - AC-5
        dependsOn:
          - T-3
        elements:
          - design: car-pool-prd-architecture-bb-1-fleet-care-data-schema
            element: EL-1
          - design: car-pool-prd-architecture-bb-1-fleet-http-api
            element: EL-4
          - design: car-pool-prd-architecture-bb-1-fleet-http-api
            element: EL-7
          - design: car-pool-prd-architecture-bb-1-fleet-http-api
            element: EL-2
      - id: T-6
        title: Show garage status and the returned car's updated fleet record
        description: Let the fleet coordinator see a car marked serviced on the Garage status view, return it to service recording its mileage and next-service threshold, and see the updated record on the Fleet record view.
        block: BB-3
        covers:
          - FR-4
          - FR-5
        verifiedBy:
          - AC-4
          - AC-5
        dependsOn:
          - T-5
        elements:
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-15
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-16
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-11
    openQuestions:
      - id: Q-1
        question: FR-1's story names a 'Mark car service-due' command, but no Design element in context models it as a distinct command; the Fleet record schema's service_state column only allows 'in-service'/'out-of-service' (no stored 'service-due' value), and GET /cars/service-due (BR-15) computes the crossing instead. T-1 treats the threshold crossing as derived at query time rather than as a separate stored transition.
      - id: Q-2
        question: FR-4 (recording that the garage completed service, shown on the Garage status view) and FR-5 (returning the car to service with recorded mileage/threshold) are modelled by the Fleet record API as a single endpoint, POST /cars/{carId}/complete-service, which requires mileage and next-service threshold and immediately sets the car in-service. No Design element lets the coordinator record garage completion alone while the car remains out-of-service, as AC-4 describes; T-5 and T-6 realise both FR-4 and FR-5 through that one command.
