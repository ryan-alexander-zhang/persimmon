spec:
  identity:
    id: fleet-care-model
    revision: 1
  content:
    context: fleet-care
    source: car-pool-prd-storming
    aggregates:
      - id: AG-1
        name: Car
        root: Car
        entities:
          - name: Car
            attributes:
              - Car has plate
              - Car has seats
              - Car has gearbox
              - Car has van flag
              - Car has mileage
              - Car has next-service threshold
              - Car has service state
        valueObjects: []
        commands:
          - Update car record
          - Update car mileage
          - Mark car service-due
          - Schedule car service
          - Return car to service after maintenance
          - Take car out of service for damage
          - Return car to service after repair
        events:
          - Car record updated
          - Car mileage updated
          - Car became service-due
          - Car taken out of service for scheduled maintenance
          - Car returned to service after maintenance
          - Car taken out of service for unsafe damage
          - Car returned to service after repair
