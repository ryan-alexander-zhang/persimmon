apiVersion: sdd.persimmon.ai/v1
kind: Plan
metadata:
  name: car-pool-prd-cap-1-plan.r1
spec:
  identity:
    id: car-pool-prd-cap-1-plan
    revision: 1
  content:
    title: Car search and reservation
    spec: car-pool-prd-cap-1
    architecture: car-pool-prd-architecture
    designs:
      - car-pool-prd-architecture-bb-1-data-schema
      - car-pool-prd-architecture-bb-1-http-api
      - car-pool-prd-architecture-bb-1-async-api
      - car-pool-prd-architecture-bb-3-ui
    tasks:
      - id: T-1
        title: Persist trip request criteria, availability projection, and reservations
        block: BB-1
        description: Store each trip request's seat, van, and gearbox criteria and slot; store the available-cars projection that search filters against; store active reservations recording the car, employee, and slot a reservation is held against.
        covers:
          - FR-1
          - FR-2
          - FR-3
          - FR-4
          - FR-5
        verifiedBy: []
        elements:
          - design: car-pool-prd-architecture-bb-1-data-schema
            element: EL-1
          - design: car-pool-prd-architecture-bb-1-data-schema
            element: EL-3
          - design: car-pool-prd-architecture-bb-1-data-schema
            element: EL-5
        dependsOn: []
      - id: T-2
        title: Serve available-cars search filtered by fit, overlap, in-service, and not-service-due
        block: BB-1
        description: Answer a trip request with only cars whose seats, van availability, and gearbox match the request, that hold no overlapping reservation, that are in service, and whose next service is not due before the slot ends.
        covers:
          - FR-1
          - FR-2
          - FR-3
          - FR-4
        verifiedBy:
          - AC-1
          - AC-2
          - AC-3
          - AC-4
          - AC-5
          - AC-6
          - AC-7
        elements:
          - design: car-pool-prd-architecture-bb-1-http-api
            element: EL-1
        dependsOn:
          - T-1
      - id: T-3
        title: Present the Search Cars screen with trip filters and results
        block: BB-3
        description: Let the employee enter a trip's slot, seats, van, and gearbox needs and see the resulting fitting, free, in-service, not-service-due cars.
        covers:
          - FR-1
          - FR-2
          - FR-3
          - FR-4
        verifiedBy: []
        elements:
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-1
        dependsOn:
          - T-2
      - id: T-4
        title: Reserve a specific offered car, refusing on conflict, out-of-service, or service-due
        block: BB-1
        description: Record a reservation against exactly one specific car chosen by the employee; refuse the reservation, citing the broken rule, when the car is already reserved for an overlapping slot, has left service, or has become service-due before the slot ends since it was offered.
        covers:
          - FR-5
          - FR-6
          - FR-7
          - FR-8
        verifiedBy:
          - AC-8
          - AC-9
          - AC-10
          - AC-11
        elements:
          - design: car-pool-prd-architecture-bb-1-http-api
            element: EL-2
        dependsOn:
          - T-1
      - id: T-5
        title: Publish Car reserved on a successful reservation
        block: BB-1
        description: Publish an event recording the reservation, car, employee, and slot once a reservation is confirmed.
        covers:
          - FR-5
        verifiedBy:
          - AC-8
        elements:
          - design: car-pool-prd-architecture-bb-1-async-api
            element: EL-1
          - design: car-pool-prd-architecture-bb-1-async-api
            element: EL-12
        dependsOn:
          - T-4
      - id: T-6
        title: Present the reserve action with refusal reasons on the Search Cars screen
        block: BB-3
        description: Let the employee reserve a specific car from the search results, and show the broken rule when the reservation is refused.
        covers:
          - FR-5
          - FR-6
          - FR-7
          - FR-8
        verifiedBy:
          - AC-8
          - AC-9
          - AC-10
          - AC-11
        elements:
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-2
        dependsOn:
          - T-3
          - T-5
    openQuestions:
      - id: Q-1
        question: The Reservations data schema's available_cars_view (car-pool-prd-architecture-bb-1-data-schema EL-5) stores no car attributes beyond car_id, yet FR-1, FR-3, and FR-4 require filtering on seats, van flag, gearbox, and service state sourced from Fleet care; which fields the projection carries and from which Fleet care status event payloads they are populated is undefined, leaving T-1 and T-2 without a specified field set to implement against.
      - id: Q-2
        question: The Reservation API's GET /available-cars response (car-pool-prd-architecture-bb-1-http-api EL-1) returns only carId, so the Search Cars screen (car-pool-prd-architecture-bb-3-ui EL-1, built in T-3) has no fields to display to help an employee compare or recognise a fitting car before reserving it.
