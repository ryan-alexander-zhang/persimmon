        title: Put a car back into service from the Cars at garage view
        block: BB-3
        description: Let the fleet coordinator, from the Cars at garage view, put a serviced car back into service with its refreshed mileage and next service threshold, including the refusal naming BR-18 when the car is not out of service.
        covers:
          - FR-4
          - FR-5
        verifiedBy:
          - AC-5
          - AC-6
        dependsOn:
          - T-5
        elements:
          - design: car-pool-prd-architecture-bb-3-ui
            element: EL-16
    openQuestions:
      - id: Q-1
        question: FR-1 and AC-2 require marking a car service-due when the current date reaches its next service due date, but car-pool-prd-architecture-bb-2-async-api defines no channel or trigger for the Spec's 'Service date reached' event, only the mileage-triggered path (carMileageUpdated leading to carServiceDue). T-1 realises the mileage-crossing path from existing Design elements; no Design element models how or when the date-crossing check itself runs.
