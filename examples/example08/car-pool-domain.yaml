      - id: Q-2
        question: Does the company own or standardize on a particular typeface for internal tools, or is a neutral system font acceptable?
        resolution: Left open; the file uses a neutral system font stack ('Inter', system-ui, -apple-system, sans-serif) as a placeholder until a company typeface is supplied.
