apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: car-pool-prd-architecture-bb-1-data-schema.r1
spec:
  identity:
    id: car-pool-prd-architecture-bb-1-data-schema
    revision: 1
  content:
    title: Reservations Module Data Schema
    type: data-schema
    architecture: car-pool-prd-architecture
    block: BB-1
    domainModel: reservations-model
    businessRules: car-pool-rules
    decisions:
      - car-pool-prd-adr-2
      - car-pool-prd-adr-3
    document:
      mediaType: application/sql
      content: |
        -- Reservations module (BB-1) persistence schema
        -- Dialect: portable ANSI SQL; exact RDBMS engine open (see Q-1)

        -- Trip request aggregate (AG-1)

        CREATE TABLE trip_request (
            id TEXT PRIMARY KEY,
            employee_id TEXT NOT NULL,
            car_id TEXT,
            slot_start TIMESTAMP NOT NULL,
            slot_end TIMESTAMP NOT NULL,
            requested_seats INTEGER NOT NULL,
            van_required BOOLEAN NOT NULL,
            automatic_gearbox_required BOOLEAN NOT NULL,
            passenger_count INTEGER NOT NULL,
            purpose TEXT NOT NULL,
            CHECK (slot_end > slot_start)
        );

        CREATE TABLE long_trip_approval (
            id TEXT PRIMARY KEY,
            trip_request_id TEXT NOT NULL UNIQUE REFERENCES trip_request(id),
            requested_at TIMESTAMP NOT NULL,
            decided_at TIMESTAMP,
            decision TEXT CHECK (decision IN ('approved', 'denied', 'lapsed'))
        );

        -- Active reservation aggregate (AG-2)

        CREATE TABLE active_reservation (
            id TEXT PRIMARY KEY,
            trip_request_id TEXT NOT NULL UNIQUE REFERENCES trip_request(id),
            car_id TEXT NOT NULL,
            employee_id TEXT NOT NULL,
            slot_start TIMESTAMP NOT NULL,
            slot_end TIMESTAMP NOT NULL,
            status TEXT NOT NULL DEFAULT 'reserved' CHECK (status IN ('reserved', 'picked_up', 'cancelled', 'released', 'returned')),
            pickup_time TIMESTAMP,
            return_mileage INTEGER, -- km
            damage_note TEXT,
            late_cancellation BOOLEAN,
            CHECK (slot_end > slot_start)
        );

        -- Out-of-service impact aggregate (AG-3)

        CREATE TABLE out_of_service_impact (
            id TEXT PRIMARY KEY,
            car_id TEXT NOT NULL
        );

        -- Available cars view (read model, event-fed from Fleet care status events)

        CREATE TABLE available_cars_view (
            car_id TEXT PRIMARY KEY
        );

        -- Pending approvals view (read model)

        CREATE TABLE pending_approvals_view (
            trip_request_id TEXT PRIMARY KEY REFERENCES trip_request(id),
            requested_at TIMESTAMP NOT NULL,
            slot_start TIMESTAMP NOT NULL
        );

        -- My reservations view (read model)

        CREATE TABLE my_reservations_view (
            trip_request_id TEXT PRIMARY KEY REFERENCES trip_request(id),
            employee_id TEXT NOT NULL,
            slot_start TIMESTAMP NOT NULL,
            slot_end TIMESTAMP NOT NULL,
            decision TEXT CHECK (decision IN ('approved', 'denied', 'lapsed')),
            pickup_time TIMESTAMP,
            return_mileage INTEGER -- km
        );

        -- Cancellation and no-show counts view (read model, counted per calendar month)

        CREATE TABLE cancellation_and_no_show_counts_view (
            employee_id TEXT NOT NULL,
            month DATE NOT NULL,
            late_cancellation_count INTEGER NOT NULL DEFAULT 0,
            no_show_count INTEGER NOT NULL DEFAULT 0,
            PRIMARY KEY (employee_id, month)
        );
    elements:
      - id: EL-1
        name: trip_request
        realises:
          kind: aggregate
          name: AG-1
        rules:
          - BR-1
          - BR-3
          - BR-5
          - BR-7
          - BR-8
      - id: EL-2
        name: long_trip_approval
        realises:
          kind: aggregate
          name: AG-1
        rules:
          - BR-6
      - id: EL-3
        name: active_reservation
        realises:
          kind: aggregate
          name: AG-2
        rules:
          - BR-4
          - BR-9
      - id: EL-4
        name: out_of_service_impact
        realises:
          kind: aggregate
          name: AG-3
        rules:
          - BR-17
      - id: EL-5
        name: available_cars_view
        realises:
          kind: readModel
          name: Available cars view
        rules:
          - BR-7
          - BR-8
      - id: EL-6
        name: pending_approvals_view
        realises:
          kind: readModel
          name: Pending approvals view
        rules:
          - BR-6
      - id: EL-7
        name: my_reservations_view
        realises:
          kind: readModel
          name: My reservations view
        rules:
          - BR-17
      - id: EL-8
        name: cancellation_and_no_show_counts_view
        realises:
          kind: readModel
          name: Cancellation and no-show counts view
        rules:
          - BR-9
          - BR-10
    rules:
      - BR-1
      - BR-3
      - BR-4
      - BR-5
      - BR-6
      - BR-7
      - BR-8
      - BR-9
      - BR-10
      - BR-17
    openQuestions:
      - id: Q-1
        question: The Architecture names BB-4's technology only as 'Relational database' with no specific engine (PostgreSQL, MySQL, SQLite); this schema uses portable ANSI SQL types (TEXT, TIMESTAMP, BOOLEAN) pending that choice.
      - id: Q-2
        question: "The reservations-model's Available cars view read model lists no fields ('fields': []), yet car attributes (seats, van flag, gearbox, service-due state) needed to answer a trip search are owned by the fleet-care context, not reservations-glossary; which fields the projection carries beyond car_id, and their source event payloads, are undefined."
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: car-pool-prd-architecture-bb-1-http-api.r1
spec:
  identity:
    id: car-pool-prd-architecture-bb-1-http-api
    revision: 1
  content:
    title: Reservation API
    type: http-api
    architecture: car-pool-prd-architecture
    block: BB-1
    interface: Reservation API
    domainModel: reservations-model
    businessRules: car-pool-rules
    document:
      mediaType: application/openapi+yaml
      content: |
        openapi: 3.1.0
        info:
          title: Reservation API
          version: "1.0.0"
          description: >
            Matches trip requests to fitting, available, in-service, not-service-due cars;
            routes long trips to approval; confirms reservations; tracks pickup and release;
            records returns; tracks cancellations and no-shows. Caller identity and role
            (Employee or Fleet coordinator) come from the company directory sign-in token.
        security:
          - bearerAuth: []
        paths:
          /available-cars:
            get:
              operationId: searchAvailableCars
              summary: List cars fitting a trip's seats, van and gearbox needs that are free, in service, and not service-due before the slot ends
              parameters:
                - name: slotStart
                  in: query
                  required: true
                  schema: { type: string, format: date-time }
                - name: slotEnd
                  in: query
                  required: true
                  schema: { type: string, format: date-time }
                - name: requestedSeats
                  in: query
                  required: true
                  schema: { type: integer, minimum: 1 }
                - name: vanRequired
                  in: query
                  required: false
                  schema: { type: boolean, default: false }
                - name: automaticGearboxRequired
                  in: query
                  required: false
                  schema: { type: boolean, default: false }
              responses:
                "200":
                  description: Cars meeting fit, availability, in-service and not-service-due criteria (BR-1, BR-3, BR-7, BR-8)
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: "#/components/schemas/AvailableCar"
          /trip-requests:
            post:
              operationId: reserveCar
              summary: Reserve a specific car for a trip; confirms at once for a slot of three days or less, otherwise opens a long-trip approval request
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/TripRequest"
              responses:
                "201":
                  description: Reservation confirmed (Car reserved)
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/ConfirmedReservation"
                "202":
                  description: Trip exceeds three days (BR-6); a long-trip approval request was opened instead of an immediate reservation
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/PendingLongTripRequest"
                "409":
                  description: Refused
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Refusal"
          /trip-requests/{tripRequestId}/approve:
            post:
              operationId: approveLongTrip
              summary: Fleet coordinator approves a pending long-trip request
              parameters:
                - name: tripRequestId
                  in: path
                  required: true
                  schema: { type: string }
              responses:
                "200":
                  description: Long-trip approval approved
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/LongTripApproval"
                "409":
                  description: The request has already lapsed or already received a decision
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Error"
          /trip-requests/{tripRequestId}/deny:
            post:
              operationId: denyLongTrip
              summary: Fleet coordinator denies a pending long-trip request
              parameters:
                - name: tripRequestId
                  in: path
                  required: true
                  schema: { type: string }
              responses:
                "200":
                  description: Long-trip approval denied
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/LongTripApproval"
                "409":
                  description: The request has already lapsed or already received a decision
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Error"
          /reservations/{reservationId}/pickup:
            post:
              operationId: pickUpCar
              summary: Record that the car was picked up for its reservation
              parameters:
                - name: reservationId
                  in: path
                  required: true
                  schema: { type: string }
              responses:
                "200":
                  description: Pickup recorded
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Reservation"
                "404":
                  description: No such active reservation
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Error"
          /reservations/{reservationId}/return:
            post:
              operationId: returnCar
              summary: Record a car's return, its mileage, and any damage note
              parameters:
                - name: reservationId
                  in: path
                  required: true
                  schema: { type: string }
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/ReturnCarRequest"
              responses:
                "200":
                  description: Return recorded (Car returned)
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Reservation"
                "404":
                  description: No such active reservation
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Error"
          /reservations/{reservationId}/cancel:
            post:
              operationId: cancelReservation
              summary: Cancel an active reservation; marked late if made less than two hours before the slot starts (BR-9)
              parameters:
                - name: reservationId
                  in: path
                  required: true
                  schema: { type: string }
              responses:
                "200":
                  description: Reservation cancelled
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Reservation"
                "404":
                  description: No such active reservation
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/Error"
          /pending-approvals:
            get:
              operationId: listPendingApprovals
              summary: Long-trip requests awaiting the fleet coordinator's decision before they lapse
              responses:
                "200":
                  description: Pending approvals
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: "#/components/schemas/PendingApproval"
          /my-reservations:
            get:
              operationId: listMyReservations
              summary: The signed-in employee's own reservations and their outcomes
              responses:
                "200":
                  description: My reservations
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: "#/components/schemas/MyReservation"
          /cancellation-counts:
            get:
              operationId: listCancellationAndNoShowCounts
              summary: Each employee's late cancellations and no-shows, counted per calendar month (BR-9, BR-10)
              parameters:
                - name: month
                  in: query
                  required: true
                  schema: { type: string, format: date }
              responses:
                "200":
                  description: Cancellation and no-show counts
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: "#/components/schemas/CancellationCounts"
        components:
          securitySchemes:
            bearerAuth:
              type: http
              scheme: bearer
              bearerFormat: JWT
          schemas:
            AvailableCar:
              type: object
              properties:
                carId: { type: string }
              required: [carId]
            TripRequest:
              type: object
              properties:
                carId: { type: string }
                slotStart: { type: string, format: date-time }
                slotEnd: { type: string, format: date-time }
                requestedSeats: { type: integer, minimum: 1 }
                vanRequired: { type: boolean, default: false }
                automaticGearboxRequired: { type: boolean, default: false }
                passengerCount: { type: integer, minimum: 0 }
                purpose: { type: string }
              required: [carId, slotStart, slotEnd, requestedSeats, passengerCount, purpose]
            ConfirmedReservation:
              type: object
              properties:
                id: { type: string }
                carId: { type: string }
                status: { type: string, enum: [confirmed] }
                slotStart: { type: string, format: date-time }
                slotEnd: { type: string, format: date-time }
              required: [id, carId, status, slotStart, slotEnd]
            PendingLongTripRequest:
              type: object
              properties:
                id: { type: string }
                carId: { type: string }
                status: { type: string, enum: [pending_approval] }
                slotStart: { type: string, format: date-time }
                slotEnd: { type: string, format: date-time }
                requestedAt: { type: string, format: date-time }
              required: [id, carId, status, slotStart, slotEnd, requestedAt]
            LongTripApproval:
              type: object
              properties:
                tripRequestId: { type: string }
                decidedAt: { type: string, format: date-time }
                decision: { type: string, enum: [approved, denied, lapsed] }
              required: [tripRequestId, decidedAt, decision]
            Reservation:
              type: object
              properties:
                id: { type: string }
                carId: { type: string }
                slotStart: { type: string, format: date-time }
                slotEnd: { type: string, format: date-time }
                pickupTime: { type: string, format: date-time }
                returnMileage: { type: integer, description: "km" }
                damageNote: { type: string }
                lateCancellation: { type: boolean }
              required: [id, carId, slotStart, slotEnd]
            ReturnCarRequest:
              type: object
              properties:
                returnMileage: { type: integer, description: "km" }
                damageNote: { type: string }
              required: [returnMileage]
            PendingApproval:
              type: object
              properties:
                tripRequestId: { type: string }
                requestedAt: { type: string, format: date-time }
                slotStart: { type: string, format: date-time }
              required: [tripRequestId, requestedAt, slotStart]
            MyReservation:
              type: object
              properties:
                id: { type: string }
                slotStart: { type: string, format: date-time }
                slotEnd: { type: string, format: date-time }
                decision: { type: string, enum: [approved, denied, lapsed] }
                pickupTime: { type: string, format: date-time }
                returnMileage: { type: integer, description: "km" }
              required: [id, slotStart, slotEnd]
            CancellationCounts:
              type: object
              properties:
                employeeId: { type: string }
                month: { type: string, format: date }
                lateCancellationCount: { type: integer, minimum: 0 }
                noShowCount: { type: integer, minimum: 0 }
              required: [employeeId, month, lateCancellationCount, noShowCount]
            Refusal:
              type: object
              properties:
                rule: { type: string, enum: [BR-1, BR-3, BR-5, BR-7, BR-8] }
                message: { type: string }
              required: [rule, message]
            Error:
              type: object
              properties:
                message: { type: string }
              required: [message]
    elements:
      - id: EL-1
        name: GET /available-cars
        realises:
          kind: readModel
          name: Available cars view
        rules:
          - BR-1
          - BR-3
          - BR-7
          - BR-8
      - id: EL-2
        name: POST /trip-requests
        realises:
          kind: command
          name: Reserve car
        rules:
          - BR-1
          - BR-3
          - BR-5
          - BR-6
          - BR-7
          - BR-8
      - id: EL-3
        name: POST /trip-requests/{tripRequestId}/approve
        realises:
          kind: command
          name: Approve long trip
      - id: EL-4
        name: POST /trip-requests/{tripRequestId}/deny
        realises:
          kind: command
          name: Deny long trip
      - id: EL-5
        name: POST /reservations/{reservationId}/pickup
        realises:
          kind: command
          name: Pick up car
      - id: EL-6
        name: POST /reservations/{reservationId}/return
        realises:
          kind: command
          name: Return car
      - id: EL-7
        name: POST /reservations/{reservationId}/cancel
        realises:
          kind: command
          name: Cancel reservation
        rules:
          - BR-9
      - id: EL-8
        name: GET /pending-approvals
        realises:
          kind: readModel
          name: Pending approvals view
      - id: EL-9
        name: GET /my-reservations
        realises:
          kind: readModel
          name: My reservations view
      - id: EL-10
        name: GET /cancellation-counts
        realises:
          kind: readModel
          name: Cancellation and no-show counts view
        rules:
          - BR-9
          - BR-10
    rules:
      - BR-1
      - BR-3
      - BR-5
      - BR-6
      - BR-7
      - BR-8
      - BR-9
      - BR-10
    decisions:
      - car-pool-prd-adr-1
      - car-pool-prd-adr-2
      - car-pool-prd-adr-3
      - car-pool-prd-adr-4
    openQuestions:
      - id: Q-1
        question: The DomainModel's Available cars view lists no fields beyond the cars it includes; the reservations Glossary carries no fact types for a car's seats, van flag, gearbox, or plate, so GET /available-cars returns only carId. Should the Fleet care-owned attributes needed for display be exposed through this read model, and if so, which ones?
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: car-pool-prd-architecture-bb-2-async-api.r1
spec:
  identity:
    id: car-pool-prd-architecture-bb-2-async-api
    revision: 1
  content:
    title: Fleet care status events
    type: async-api
    architecture: car-pool-prd-architecture
    block: BB-2
    interface: Fleet care status events
    domainModel: fleet-care-model
    businessRules: car-pool-rules
    document:
      mediaType: application/asyncapi+yaml
      content: |
        asyncapi: 3.0.0
        info:
          title: Fleet care status events
          version: 1.0.0
          description: >
            Domain events published by the Fleet care module reflecting car-state
            changes, consumed by the Reservations module to keep its available-cars
            projection current and to cancel future reservations and notify
            affected employees when a car leaves service (BR-7, BR-8, BR-17).
        servers:
          internalBus:
            host: in-process
            protocol: internal
            description: >
              In-process event bus within the single Car Pool Service deployable
              shared by the Reservations and Fleet care modules (S-1, S-2); see Q-1.
        defaultContentType: application/json
        channels:
          carRegistered:
            address: car.registered
            messages:
              CarRecordRegistered:
                $ref: '#/components/messages/CarRecordRegistered'
          carMileageUpdated:
            address: car.mileageUpdated
            messages:
              CarMileageUpdated:
                $ref: '#/components/messages/CarMileageUpdated'
          carServiceDue:
            address: car.serviceDue
            messages:
              CarBecameServiceDue:
                $ref: '#/components/messages/CarBecameServiceDue'
          carBookedWithGarage:
            address: car.bookedWithGarage
            messages:
              CarBookedWithGarage:
                $ref: '#/components/messages/CarBookedWithGarage'
          carTakenOutOfService:
            address: car.takenOutOfService
            messages:
              CarTakenOutOfService:
                $ref: '#/components/messages/CarTakenOutOfService'
          carPutBackIntoService:
            address: car.putBackIntoService
            messages:
              CarPutBackIntoService:
                $ref: '#/components/messages/CarPutBackIntoService'
        operations:
          publishCarRegistered:
            action: send
            channel:
              $ref: '#/channels/carRegistered'
            summary: Fleet care publishes when a car record is registered (BR-11).
          publishCarMileageUpdated:
            action: send
            channel:
              $ref: '#/channels/carMileageUpdated'
            summary: Fleet care publishes when a car's mileage is updated on return (BR-12).
          publishCarServiceDue:
            action: send
            channel:
              $ref: '#/channels/carServiceDue'
            summary: Fleet care publishes when a car becomes service-due (BR-13).
          publishCarBookedWithGarage:
            action: send
            channel:
              $ref: '#/channels/carBookedWithGarage'
            summary: >
              Fleet care publishes when a service-due car is booked with the garage
              and taken out of service for its garage days (BR-14).
          publishCarTakenOutOfService:
            action: send
            channel:
              $ref: '#/channels/carTakenOutOfService'
            summary: >
              Fleet care publishes when a car is taken out of service, for garage
              days or unsafe damage (BR-14, BR-16); Reservations consumes this to
              cancel the car's future reservations and notify affected employees
              (BR-17).
          publishCarPutBackIntoService:
            action: send
            channel:
              $ref: '#/channels/carPutBackIntoService'
            summary: >
              Fleet care publishes when the garage returns a car and it is put back
              into service with its new mileage and next service threshold (BR-18).
        components:
          messages:
            CarRecordRegistered:
              name: CarRecordRegistered
              title: Car record registered
              payload:
                $ref: '#/components/schemas/CarRecordRegisteredPayload'
            CarMileageUpdated:
              name: CarMileageUpdated
              title: Car mileage updated
              payload:
                $ref: '#/components/schemas/CarMileageUpdatedPayload'
            CarBecameServiceDue:
              name: CarBecameServiceDue
              title: Car became service due
              payload:
                $ref: '#/components/schemas/CarBecameServiceDuePayload'
            CarBookedWithGarage:
              name: CarBookedWithGarage
              title: Car booked with garage
              payload:
                $ref: '#/components/schemas/CarBookedWithGaragePayload'
            CarTakenOutOfService:
              name: CarTakenOutOfService
              title: Car taken out of service
              payload:
                $ref: '#/components/schemas/CarTakenOutOfServicePayload'
            CarPutBackIntoService:
              name: CarPutBackIntoService
              title: Car put back into service
              payload:
                $ref: '#/components/schemas/CarPutBackIntoServicePayload'
          schemas:
            CarRecordRegisteredPayload:
              type: object
              properties:
                carId:
                  type: string
                plate:
                  type: string
                seats:
                  type: integer
                gearbox:
                  type: string
                  enum: [manual, automatic]
                vanFlag:
                  type: boolean
                mileage:
                  type: integer
                  description: kilometres
                nextServiceDueDate:
                  type: string
                  format: date
                nextServiceDueMileage:
                  type: integer
                  description: kilometres
              required: [carId, plate, seats, gearbox, vanFlag, mileage, nextServiceDueDate, nextServiceDueMileage]
            CarMileageUpdatedPayload:
              type: object
              properties:
                carId:
                  type: string
                mileage:
                  type: integer
                  description: kilometres
              required: [carId, mileage]
            CarBecameServiceDuePayload:
              type: object
              properties:
                carId:
                  type: string
                status:
                  type: string
                  enum: [service-due, booked-with-garage, out-of-service, in-service]
              required: [carId, status]
            CarBookedWithGaragePayload:
              type: object
              properties:
                carId:
                  type: string
                status:
                  type: string
                  enum: [service-due, booked-with-garage, out-of-service, in-service]
              required: [carId, status]
            CarTakenOutOfServicePayload:
              type: object
              properties:
                carId:
                  type: string
                state:
                  type: string
                  enum: [in-service, out-of-service]
                status:
                  type: string
                  enum: [service-due, booked-with-garage, out-of-service, in-service]
              required: [carId, state, status]
            CarPutBackIntoServicePayload:
              type: object
              properties:
                carId:
                  type: string
                state:
                  type: string
                  enum: [in-service, out-of-service]
                mileage:
                  type: integer
                  description: kilometres
                nextServiceDueMileage:
                  type: integer
                  description: kilometres
                nextServiceDueDate:
                  type: string
                  format: date
                status:
                  type: string
                  enum: [service-due, booked-with-garage, out-of-service, in-service]
              required: [carId, state, mileage, nextServiceDueMileage, nextServiceDueDate, status]
    elements:
      - id: EL-1
        name: carRegistered
        realises:
          kind: event
          name: Car record registered
        rules:
          - BR-11
      - id: EL-2
        name: carMileageUpdated
        realises:
          kind: event
          name: Car mileage updated
        rules:
          - BR-12
      - id: EL-3
        name: carServiceDue
        realises:
          kind: event
          name: Car became service due
        rules:
          - BR-13
      - id: EL-4
        name: carBookedWithGarage
        realises:
          kind: event
          name: Car booked with garage
        rules:
          - BR-14
      - id: EL-5
        name: carTakenOutOfService
        realises:
          kind: event
          name: Car taken out of service
        rules:
          - BR-14
          - BR-16
          - BR-17
      - id: EL-6
        name: carPutBackIntoService
        realises:
          kind: event
          name: Car put back into service
        rules:
          - BR-18
      - id: EL-7
        name: CarRecordRegistered
        realises:
          kind: event
          name: Car record registered
        rules:
          - BR-11
      - id: EL-8
        name: CarMileageUpdated
        realises:
          kind: event
          name: Car mileage updated
        rules:
          - BR-12
      - id: EL-9
        name: CarBecameServiceDue
        realises:
          kind: event
          name: Car became service due
        rules:
          - BR-13
      - id: EL-10
        name: CarBookedWithGarage
        realises:
          kind: event
          name: Car booked with garage
        rules:
          - BR-14
      - id: EL-11
        name: CarTakenOutOfService
        realises:
          kind: event
          name: Car taken out of service
        rules:
          - BR-14
          - BR-16
          - BR-17
      - id: EL-12
        name: CarPutBackIntoService
        realises:
          kind: event
          name: Car put back into service
        rules:
          - BR-18
    rules:
      - BR-11
      - BR-12
      - BR-13
      - BR-14
      - BR-16
      - BR-17
      - BR-18
    decisions: []
    references: []
    openQuestions:
      - id: Q-1
        question: The Architecture names no message-broker or wire protocol for the Fleet care status events interface; S-1/S-2 place both modules in one deployable sharing one store and integrate them through asynchronous domain events rather than a shared transaction, suggesting an in-process event bus rather than a networked broker, but this is not stated. This document models the channel on a generic 'internal' server binding pending that decision.
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: car-pool-prd-architecture-bb-2-data-schema.r1
spec:
  identity:
    id: car-pool-prd-architecture-bb-2-data-schema
    revision: 1
  content:
    title: Fleet care data schema
    type: data-schema
    architecture: car-pool-prd-architecture
    block: BB-2
    domainModel: fleet-care-model
    businessRules: car-pool-rules
    document:
      mediaType: application/sql
      content: |
        -- Standard SQL (ANSI), engine-neutral per Q-1: BB-4 names only "Relational database" with no specific engine.

        CREATE TABLE car_record (
          id INTEGER PRIMARY KEY,
          plate TEXT NOT NULL UNIQUE,
          seats INTEGER NOT NULL,
          gearbox TEXT NOT NULL CHECK (gearbox IN ('manual', 'automatic')),
          van_flag BOOLEAN NOT NULL,
          mileage INTEGER NOT NULL, -- km
          next_service_due_date DATE NOT NULL,
          next_service_due_mileage INTEGER NOT NULL, -- km
          state TEXT NOT NULL CHECK (state IN ('in-service', 'out-of-service'))
        );

        CREATE TABLE car_service_lifecycle (
          id INTEGER PRIMARY KEY,
          car_id INTEGER NOT NULL UNIQUE REFERENCES car_record (id),
          status TEXT NOT NULL CHECK (status IN ('service-due', 'booked-with-garage', 'out-of-service', 'in-service'))
        );

        CREATE TABLE damage_report (
          id INTEGER PRIMARY KEY,
          car_id INTEGER NOT NULL REFERENCES car_record (id),
          note TEXT NOT NULL,
          severity TEXT CHECK (severity IN ('minor', 'unsafe'))
        );
    elements:
      - id: EL-1
        name: car_record
        realises:
          kind: aggregate
          name: AG-1
        rules:
          - BR-11
      - id: EL-2
        name: car_service_lifecycle
        realises:
          kind: aggregate
          name: AG-2
      - id: EL-3
        name: damage_report
        realises:
          kind: aggregate
          name: AG-3
        rules:
          - BR-15
    rules:
      - BR-11
      - BR-15
    decisions: []
    openQuestions:
      - id: Q-1
        question: The Architecture names BB-4's technology only as "Relational database" without a specific engine (e.g. PostgreSQL, SQLite, MySQL). This schema uses portable, engine-neutral standard SQL (no engine-specific identity/sequence syntax); confirm the actual engine so the dialect can be sharpened if needed.
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: car-pool-prd-architecture-bb-2-http-api.r1
spec:
  identity:
    id: car-pool-prd-architecture-bb-2-http-api
    revision: 1
  content:
    title: Fleet care API
    type: http-api
    architecture: car-pool-prd-architecture
    block: BB-2
    interface: Fleet care API
    domainModel: fleet-care-model
    businessRules: car-pool-rules
    document:
      mediaType: application/openapi+yaml
      content: |
        openapi: 3.1.0
        info:
          title: Fleet care API
          version: "1.0.0"
        paths:
          /cars:
            post:
              operationId: registerCar
              summary: Register a car record
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/RegisterCarRequest'
              responses:
                '201':
                  description: Car record registered
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/CarRecord'
            get:
              operationId: listCars
              summary: List car records
              parameters:
                - name: state
                  in: query
                  required: false
                  schema:
                    type: string
                    enum: [in-service, out-of-service]
              responses:
                '200':
                  description: Car records
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/CarRecord'
          /cars/{carId}:
            get:
              operationId: getCar
              summary: Get a car record
              parameters:
                - name: carId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Car record
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/CarRecord'
                '404':
                  description: No car record with this id
          /cars/{carId}/condition:
            get:
              operationId: getCarCondition
              summary: Car condition view
              parameters:
                - name: carId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Reviewed damage history for the car, shown before it is taken
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/DamageReportSummary'
          /cars/{carId}/garage-bookings:
            post:
              operationId: bookCarWithGarage
              summary: Book a service-due or unsafe car with the garage
              parameters:
                - name: carId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '201':
                  description: Car booked with garage and taken out of service for its garage days
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/CarServiceLifecycle'
                '409':
                  description: The car is neither service-due nor already out of service for unsafe damage (BR-14)
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Refusal'
          /cars/{carId}/service-lifecycle/return-from-garage:
            post:
              operationId: putCarBackIntoService
              summary: Put a serviced car back into service
              parameters:
                - name: carId
                  in: path
                  required: true
                  schema:
                    type: string
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ReturnFromGarageRequest'
              responses:
                '200':
                  description: Car put back into service with its new mileage and next service threshold
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/CarRecord'
                '409':
                  description: The car is not currently out of service (BR-18)
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Refusal'
          /cars/service-due:
            get:
              operationId: listServiceDueCars
              summary: Service-due cars view
              responses:
                '200':
                  description: Cars that have become service-due and still need to be booked with the garage
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceLifecycleSummary'
          /cars/at-garage:
            get:
              operationId: listCarsAtGarage
              summary: Cars at garage view
              responses:
                '200':
                  description: Cars currently booked with or returned by the garage
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceLifecycleSummary'
          /damage-reports:
            get:
              operationId: listPendingDamageReports
              summary: Pending damage reports view
              parameters:
                - name: status
                  in: query
                  required: false
                  schema:
                    type: string
                    enum: [pending]
              responses:
                '200':
                  description: Damage reports awaiting the fleet coordinator's severity review
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/PendingDamageReport'
          /damage-reports/{damageReportId}/classify-as-minor:
            patch:
              operationId: classifyDamageAsMinor
              summary: Classify a damage report as minor
              parameters:
                - name: damageReportId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Damage classified as minor; the car stays in service
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/DamageReport'
          /damage-reports/{damageReportId}/classify-as-unsafe:
            patch:
              operationId: classifyDamageAsUnsafe
              summary: Classify a damage report as unsafe
              parameters:
                - name: damageReportId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Damage classified as unsafe; the car is taken out of service at once (BR-16)
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/DamageReport'
        components:
          schemas:
            CarRecord:
              type: object
              required: [id, plate, seats, gearbox, vanFlag, mileage, nextServiceDueDate, nextServiceDueMileage, state]
              properties:
                id:
                  type: string
                plate:
                  type: string
                seats:
                  type: integer
                gearbox:
                  type: string
                  enum: [manual, automatic]
                vanFlag:
                  type: boolean
                mileage:
                  type: integer
                  description: current odometer reading, in km
                nextServiceDueDate:
                  type: string
                  format: date
                nextServiceDueMileage:
                  type: integer
                  description: in km
                state:
                  type: string
                  enum: [in-service, out-of-service]
            RegisterCarRequest:
              type: object
              required: [plate, seats, gearbox, vanFlag, mileage, nextServiceDueDate, nextServiceDueMileage]
              properties:
                plate:
                  type: string
                seats:
                  type: integer
                gearbox:
                  type: string
                  enum: [manual, automatic]
                vanFlag:
                  type: boolean
                mileage:
                  type: integer
                  description: in km
                nextServiceDueDate:
                  type: string
                  format: date
                nextServiceDueMileage:
                  type: integer
                  description: in km
            CarServiceLifecycle:
              type: object
              required: [carId, status]
              properties:
                carId:
                  type: string
                status:
                  type: string
                  enum: [service-due, booked-with-garage, out-of-service, in-service]
            ServiceLifecycleSummary:
              type: object
              required: [carId, plate, status]
              properties:
                carId:
                  type: string
                plate:
                  type: string
                status:
                  type: string
                  enum: [service-due, booked-with-garage, out-of-service, in-service]
            ReturnFromGarageRequest:
              type: object
              required: [mileage, nextServiceDueDate, nextServiceDueMileage]
              properties:
                mileage:
                  type: integer
                  description: in km
                nextServiceDueDate:
                  type: string
                  format: date
                nextServiceDueMileage:
                  type: integer
                  description: in km
            DamageReportSummary:
              type: object
              required: [note, severity]
              properties:
                note:
                  type: string
                severity:
                  type: string
                  enum: [minor, unsafe]
            PendingDamageReport:
              type: object
              required: [id, carId, note]
              properties:
                id:
                  type: string
                carId:
                  type: string
                note:
                  type: string
            DamageReport:
              type: object
              required: [id, carId, note, severity]
              properties:
                id:
                  type: string
                carId:
                  type: string
                note:
                  type: string
                severity:
                  type: string
                  enum: [minor, unsafe]
            Refusal:
              type: object
              required: [rule, message]
              properties:
                rule:
                  type: string
                  enum: [BR-14, BR-18]
                message:
                  type: string
    elements:
      - id: EL-1
        name: POST /cars
        realises:
          kind: command
          name: Register car
        rules:
          - BR-11
      - id: EL-2
        name: GET /cars
        realises:
          kind: aggregate
          name: AG-1
        rules: []
      - id: EL-3
        name: GET /cars/{carId}
        realises:
          kind: aggregate
          name: AG-1
        rules: []
      - id: EL-4
        name: GET /cars/{carId}/condition
        realises:
          kind: readModel
          name: Car condition view
        rules: []
      - id: EL-5
        name: POST /cars/{carId}/garage-bookings
        realises:
          kind: command
          name: Book car with garage
        rules:
          - BR-14
      - id: EL-6
        name: POST /cars/{carId}/service-lifecycle/return-from-garage
        realises:
          kind: command
          name: Put car back into service
        rules:
          - BR-18
      - id: EL-7
        name: GET /cars/service-due
        realises:
          kind: readModel
          name: Service-due cars view
        rules: []
      - id: EL-8
        name: GET /cars/at-garage
        realises:
          kind: readModel
          name: Cars at garage view
        rules: []
      - id: EL-9
        name: GET /damage-reports
        realises:
          kind: readModel
          name: Pending damage reports view
        rules: []
      - id: EL-10
        name: PATCH /damage-reports/{damageReportId}/classify-as-minor
        realises:
          kind: command
          name: Classify damage as minor
        rules:
          - BR-15
      - id: EL-11
        name: PATCH /damage-reports/{damageReportId}/classify-as-unsafe
        realises:
          kind: command
          name: Classify damage as unsafe
        rules:
          - BR-15
          - BR-16
    rules:
      - BR-11
      - BR-14
      - BR-15
      - BR-16
      - BR-18
    decisions: []
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: DesignSystem
metadata:
  name: car-pool-prd-design-system.r1
spec:
  identity:
    id: car-pool-prd-design-system
    revision: 1
  content:
    title: Company Car Pool — Design System
    prd: car-pool-prd
    decisions: []
    openQuestions:
      - id: Q-1
        question: Does the Rotterdam office have an existing company brand color that the primary palette should match, or is a neutral blue acceptable?
      - id: Q-2
        question: Does the office have a licensed or standard corporate typeface, or is the system default (Inter / platform system font) acceptable?
    document:
      mediaType: text/markdown
      content: |-
        ---
        version: alpha
        name: Company Car Pool
        colors:
          primary: "#1D4ED8"
          primary-hover: "#1E40AF"
          on-primary: "#FFFFFF"
          primary-container: "#DBEAFE"
          on-primary-container: "#1E3A8A"
          secondary: "#475569"
          on-secondary: "#FFFFFF"
          error: "#B91C1C"
          error-hover: "#991B1B"
          on-error: "#FFFFFF"
          error-container: "#FEE2E2"
          on-error-container: "#7F1D1D"
          success-container: "#DCFCE7"
          on-success-container: "#14532D"
          warning-container: "#FEF3C7"
          on-warning-container: "#78350F"
          surface: "#FFFFFF"
          on-surface: "#1E293B"
          surface-variant: "#F1F5F9"
          on-surface-variant: "#334155"
          surface-disabled: "#E2E8F0"
          on-surface-disabled: "#334155"
          background: "#F8FAFC"
          on-background: "#1E293B"
          outline: "#CBD5E1"
        typography:
          headline-lg:
            fontFamily: "Inter, system-ui, sans-serif"
            fontSize: "32px"
            fontWeight: 700
            lineHeight: "40px"
          headline-md:
            fontFamily: "Inter, system-ui, sans-serif"
            fontSize: "28px"
            fontWeight: 700
            lineHeight: "36px"
          headline-sm:
            fontFamily: "Inter, system-ui, sans-serif"
            fontSize: "24px"
            fontWeight: 600
            lineHeight: "32px"
          title-lg:
            fontFamily: "Inter, system-ui, sans-serif"
            fontSize: "20px"
            fontWeight: 600
            lineHeight: "28px"
          title-md:
            fontFamily: "Inter, system-ui, sans-serif"
            fontSize: "18px"
            fontWeight: 600
            lineHeight: "24px"
          title-sm:
            fontFamily: "Inter, system-ui, sans-serif"
            fontSize: "16px"
            fontWeight: 600
            lineHeight: "22px"
          body-lg:
            fontFamily: "Inter, system-ui, sans-serif"
            fontSize: "16px"
            fontWeight: 400
            lineHeight: "24px"
          body-md:
            fontFamily: "Inter, system-ui, sans-serif"
            fontSize: "14px"
            fontWeight: 400
            lineHeight: "20px"
          body-sm:
            fontFamily: "Inter, system-ui, sans-serif"
            fontSize: "12px"
            fontWeight: 400
            lineHeight: "16px"
          label-lg:
            fontFamily: "Inter, system-ui, sans-serif"
            fontSize: "14px"
            fontWeight: 600
            lineHeight: "20px"
          label-md:
            fontFamily: "Inter, system-ui, sans-serif"
            fontSize: "12px"
            fontWeight: 600
            lineHeight: "16px"
          label-sm:
            fontFamily: "Inter, system-ui, sans-serif"
            fontSize: "11px"
            fontWeight: 600
            lineHeight: "14px"
        spacing:
          xs: "4px"
          sm: "8px"
          md: "16px"
          lg: "24px"
          xl: "32px"
          gutter: "16px"
          margin: "24px"
        rounded:
          sm: "4px"
          md: "8px"
          lg: "16px"
          full: "9999px"
        components:
          button-primary:
            backgroundColor: "{colors.primary}"
            textColor: "{colors.on-primary}"
            typography: "{typography.label-lg}"
            rounded: "{rounded.md}"
            padding: "{spacing.sm}"
            height: "44px"
          button-primary-hover:
            backgroundColor: "{colors.primary-hover}"
            textColor: "{colors.on-primary}"
            typography: "{typography.label-lg}"
            rounded: "{rounded.md}"
            padding: "{spacing.sm}"
            height: "44px"
          button-primary-disabled:
            backgroundColor: "{colors.surface-disabled}"
            textColor: "{colors.on-surface-disabled}"
            typography: "{typography.label-lg}"
            rounded: "{rounded.md}"
            padding: "{spacing.sm}"
            height: "44px"
          button-secondary:
            backgroundColor: "{colors.surface-variant}"
            textColor: "{colors.on-surface-variant}"
            typography: "{typography.label-lg}"
            rounded: "{rounded.md}"
            padding: "{spacing.sm}"
            height: "44px"
          button-secondary-hover:
            backgroundColor: "{colors.secondary}"
            textColor: "{colors.on-secondary}"
            typography: "{typography.label-lg}"
            rounded: "{rounded.md}"
            padding: "{spacing.sm}"
            height: "44px"
          button-destructive:
            backgroundColor: "{colors.error}"
            textColor: "{colors.on-error}"
            typography: "{typography.label-lg}"
            rounded: "{rounded.md}"
            padding: "{spacing.sm}"
            height: "44px"
          button-destructive-hover:
            backgroundColor: "{colors.error-hover}"
            textColor: "{colors.on-error}"
            typography: "{typography.label-lg}"
            rounded: "{rounded.md}"
            padding: "{spacing.sm}"
            height: "44px"
          input:
            backgroundColor: "{colors.surface}"
            textColor: "{colors.on-surface}"
            typography: "{typography.body-md}"
            rounded: "{rounded.sm}"
            padding: "{spacing.sm}"
            height: "44px"
          input-error:
            backgroundColor: "{colors.surface}"
            textColor: "{colors.on-surface}"
            typography: "{typography.body-md}"
            rounded: "{rounded.sm}"
            padding: "{spacing.sm}"
            height: "44px"
          card:
            backgroundColor: "{colors.surface}"
            textColor: "{colors.on-surface}"
            typography: "{typography.body-md}"
            rounded: "{rounded.lg}"
            padding: "{spacing.md}"
          status-badge-available:
            backgroundColor: "{colors.success-container}"
            textColor: "{colors.on-success-container}"
            typography: "{typography.label-sm}"
            rounded: "{rounded.full}"
            padding: "{spacing.xs}"
          status-badge-attention:
            backgroundColor: "{colors.warning-container}"
            textColor: "{colors.on-warning-container}"
            typography: "{typography.label-sm}"
            rounded: "{rounded.full}"
            padding: "{spacing.xs}"
          status-badge-out-of-service:
            backgroundColor: "{colors.error-container}"
            textColor: "{colors.on-error-container}"
            typography: "{typography.label-sm}"
            rounded: "{rounded.full}"
            padding: "{spacing.xs}"
          status-badge-pending:
            backgroundColor: "{colors.primary-container}"
            textColor: "{colors.on-primary-container}"
            typography: "{typography.label-sm}"
            rounded: "{rounded.full}"
            padding: "{spacing.xs}"
        ---

        ## Overview

        Company Car Pool is used by about sixty Rotterdam-office employees who book, pick up, and return one of twelve shared cars, and by the fleet coordinator (and the office manager covering for them) who keeps every car's service and damage record current, reviews damage, and schedules the garage. The architecture serves both audiences from a single responsive single-page web application running in an ordinary browser (BB-3) — there is no kiosk and no dedicated mobile app, so the same screens must work at a desk when an employee plans a multi-day trip or the coordinator reviews a damage report, and on a phone browser when an employee double-checks a booking on the way to the key cabinet. The product replaces a shared calendar and a disconnected spreadsheet, so the visual language's first job is trust: a car's availability, service status, and condition must read unambiguously and instantly, because a misread status is exactly how the three original problems (double-booking, service-overdue trips, late-discovered damage) happened. The feel is calm, utilitarian, and quietly confident — an internal operations tool, not a consumer or marketing surface — with status color doing the most important communication work on every screen.

        ## Colors

        `primary` (and its `-hover`, `-container` pair) carries the system's key actions — reserving a car, confirming a pickup or return — so an employee's eye finds the one thing to do next on a busy search-results screen. `secondary` and `surface-variant` give lower-emphasis actions (cancel, back) a tonal, non-competing treatment that strengthens to a solid fill on hover so interaction is still obvious. `success-container`, `warning-container`, and `error-container` exist solely to drive `status-badge`: available/in-service, service-due or pending-approval, and out-of-service/unsafe, respectively. These three are the literal fix for the brief's problems — a car that cannot be safely booked must never look like one that can — so each pairs a pale, low-saturation background with a dark, fully-saturated text color rather than relying on hue alone, keeping the distinction legible for anyone with reduced color vision. `error` and `error-hover` (full-strength, not the pale container) are reserved for the one truly destructive action in the product: the coordinator marking a car unsafe, which cancels its future reservations. `surface`, `surface-variant`, `background`, and `outline` stay deliberately neutral and low-contrast against each other so the status and action colors are never fighting the canvas for attention. `surface-disabled`/`on-surface-disabled` keep a disabled control (e.g. the Reserve button before a slot is chosen) at full AA contrast while still reading as inactive, through a flatter, lower-saturation fill rather than faded text. Until Q-1 is answered, `primary` is a neutral, unbranded blue rather than any assumed company color.

        ## Typography

        Twelve levels cover the product without a marketing-scale display tier, which this internal tool has no use for. `headline-*` marks page and section titles (Search cars, Fleet records, Damage review). `title-*` marks card and dialog headings — a single car's detail panel, the approval-request dialog. `body-*` carries running text, form values, and table cells, sized so a coordinator scanning twelve cars' records or an employee comparing several offered cars can read quickly without zooming on a phone browser. `label-*` is reserved for compact UI text: button labels, form field labels, and — at `label-sm`, the smallest level in the system — the text inside a `status-badge`, where a car's available/pending/out-of-service state must stay legible even at pill size.

        ## Layout

        The web client uses a responsive grid: on a desk-width viewport, car search results and fleet records lay out as a filterable list beside a detail panel; below a tablet-width breakpoint, this collapses to a single stacked column so the same screens work on an employee's phone browser while they're near the key cabinet. `spacing.margin` sets the outer page margin and `spacing.gutter` the space between cards in a list or columns in a form, keeping rhythm consistent whether the screen shows two columns or one. Interactive controls hold a 44px minimum height (see `button-primary`, `input`) so the pickup/return and cancellation flows stay comfortable to tap on a phone, not just a desktop pointer.

        ## Elevation & Depth

        Depth is used sparingly, only to separate transient surfaces from the page: `card` rests directly on `background` with a hairline `outline` border rather than a shadow, since a dense list of twelve cars reads faster as flat, evenly-weighted rows than as a stack of floating panels. Modal dialogs — the long-trip approval request, the damage-report form, the unsafe-car confirmation — lift above the page with a soft shadow to signal that they demand a decision before the underlying screen can be used again. Buttons, inputs, and status badges stay flat; they are read as part of the page, not as objects above it.

        ## Shapes

        `rounded.sm` softens small controls — `input` and nothing larger — just enough to feel approachable without reducing the field's clickable area. `rounded.md` is the standard corner for every `button-*`, giving actions a consistent, slightly friendlier edge than the data they act on. `rounded.lg` marks `card` as a distinct content block (a car, a reservation, a fleet record) sitting on the page background. `rounded.full` turns `status-badge` into a pill, the shape convention that separates a status indicator from every rectangular control around it at a glance.

        ## Components

        `button-primary` is the one high-emphasis action per screen (Reserve, Confirm pickup, Confirm return, Submit approval request); `button-primary-hover` darkens the fill and `button-primary-disabled` switches to the neutral disabled pair when the action isn't yet valid (e.g. no slot selected). `button-secondary` is the tonal, lower-emphasis counterpart (Cancel, Back) and strengthens to a solid `secondary` fill on hover so it doesn't read as inert. `button-destructive` and its hover state are reserved for the fleet coordinator's one high-consequence action, marking a car unsafe and taking it out of service. `input` carries a 1px `{colors.outline}` border (not an expressible token) and switches that border to `{colors.error}` as `input-error`, used for a rejected mileage entry or a required field left blank; its error message renders beneath the field in `typography.body-sm` colored with `{colors.error}`. `card` carries the same `{colors.outline}` hairline border as `input` and is the shared container for a car in search results, a reservation summary, and a fleet record row. `status-badge-available`, `status-badge-attention`, `status-badge-out-of-service`, and `status-badge-pending` are the compact pill used everywhere a car's or a trip's state must be read at a glance: in service and bookable, service-due or awaiting approval, out of service or unsafe, and pending coordinator approval.

        ## Do's and Don'ts

        - Do reserve `status-badge-out-of-service` strictly for a car that cannot be booked (out of service or deemed unsafe) — never reuse its color for anything merely urgent.
        - Do keep `button-primary` to one instance per screen; a search-results row offers a car, it doesn't also compete for primary emphasis against the page's main action.
        - Do use `button-destructive` only for the unsafe/out-of-service action; cancelling a reservation is a normal `button-secondary`, not a destructive one.
        - Don't introduce a shadow or border outside what Elevation & Depth and the Components prose describe — `card` and `input` get the hairline `outline` border and nothing heavier.
        - Don't drop text below `body-sm` or `label-sm`; this system's smallest sizes are already tuned to the minimum size a coordinator scanning twelve cars, or an employee on a phone, can read reliably.
        - Don't pair any `-container` color with its sibling family's text token (e.g. `warning-container` with `on-error-container`) — the accessible pairs are fixed as defined, swapping them breaks the AA contrast guarantee.
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: car-pool-prd-architecture-bb-3-ui.r1
spec:
  identity:
    id: car-pool-prd-architecture-bb-3-ui
    revision: 1
  content:
    title: Web client
    type: ui
    architecture: car-pool-prd-architecture
    block: BB-3
    businessRules: car-pool-rules
    designSystem: car-pool-prd-design-system
    document:
      mediaType: text/markdown
      content: |-
        ## Search Cars

        ### Purpose
        Let an employee find a car fitting their trip's seats, van, and gearbox needs for a chosen slot, and reserve one.

        ### Data
        `GET /available-cars` — `carId` for each car that fits and is free, in service, and not service-due before the slot ends.

        ### Actions
        Reserve — `POST /trip-requests`

        ### States
        - empty: no car fits the chosen seats, van, gearbox and slot
        - loading: results are being fetched
        - refusal: naming BR-1 (does not fit), BR-3 (already reserved for the slot), BR-5 (more than two future reservations), BR-7 (out of service), BR-8 (service due before the slot ends)

        ### Layout
        `card` per car in a filterable list, `input` for the trip's slot and seat/van/gearbox filters, `button-primary` for Reserve, `spacing.gutter` between cards, `spacing.margin` page margin.

        ## Car Condition

        ### Purpose
        Show the reviewed damage history noted by prior drivers for a car, before it is taken.

        ### Data
        `GET /cars/{carId}/condition` — `note` and `severity` for each prior damage report.

        ### Actions
        None.

        ### States
        - empty: no damage reports exist for this car
        - loading: condition history is being fetched

        ### Layout
        `card` per report, `status-badge-out-of-service` on a report whose severity is unsafe, `spacing.sm` between report rows.

        ## My Reservations

        ### Purpose
        Let the employee see their own reservations and outcomes, and pick up, return, or cancel one.

        ### Data
        `GET /my-reservations` — `id`, `slotStart`, `slotEnd`, `decision`, `pickupTime`, `returnMileage` for each of the employee's reservations.

        ### Actions
        - Pick up — `POST /reservations/{reservationId}/pickup`
        - Return — `POST /reservations/{reservationId}/return`
        - Cancel — `POST /reservations/{reservationId}/cancel`

        ### States
        - empty: the employee holds no reservations
        - loading: reservations are being fetched
        - late: a cancellation made less than two hours before `slotStart` is recorded as late (BR-9)

        ### Layout
        `card` per reservation, `status-badge-pending` on a reservation awaiting a long-trip decision, `button-primary` for Pick up and Return, `button-secondary` for Cancel, `spacing.gutter` between cards.

        ## Pending Approvals

        ### Purpose
        Let the fleet coordinator review and decide long-trip requests before they lapse.

        ### Data
        `GET /pending-approvals` — `tripRequestId`, `requestedAt`, `slotStart` for each request awaiting a decision.

        ### Actions
        - Approve — `POST /trip-requests/{tripRequestId}/approve`
        - Deny — `POST /trip-requests/{tripRequestId}/deny`

        ### States
        - empty: no request is pending
        - loading: requests are being fetched
        - conflict: the request has already lapsed or already received a decision

        ### Layout
        `card` per request, `status-badge-pending`, `button-primary` for Approve, `button-secondary` for Deny, `spacing.gutter` between cards.

        ## Fleet Records

        ### Purpose
        Give the fleet coordinator one current record per car — plate, seats, gearbox, van flag, mileage, service status, and state — replacing the spreadsheet, and let them register a new car.

        ### Data
        `GET /cars` — `id`, `plate`, `seats`, `gearbox`, `vanFlag`, `mileage`, `nextServiceDueDate`, `nextServiceDueMileage`, `state` for each car record.

        ### Actions
        Register Car — `POST /cars`

        ### States
        - empty: no car record exists yet
        - loading: records are being fetched

        ### Layout
        `card` per car beside a detail panel, `status-badge-available` on an in-service car, `status-badge-out-of-service` on an out-of-service car, `input` and `input-error` on the registration form, `button-primary` for Register Car, `spacing.gutter` between rows.

        ## Service Due Cars

        ### Purpose
        Let the fleet coordinator see cars that have become service-due and still need a garage booking, and book them.

        ### Data
        `GET /cars/service-due` — `carId`, `plate`, `status` for each service-due car.

        ### Actions
        Book with Garage — `POST /cars/{carId}/garage-bookings`

        ### States
        - empty: no car is currently service-due
        - loading: cars are being fetched
        - refusal: naming BR-14 (the car is neither service-due nor already out of service for unsafe damage)

        ### Layout
        `card` per car, `status-badge-attention`, `button-primary` for Book with Garage, `spacing.gutter` between cards.

        ## Cars at Garage

        ### Purpose
        Let the fleet coordinator see cars currently booked with or returned by the garage, and put a serviced car back into service with its new mileage and next service threshold.

        ### Data
        `GET /cars/at-garage` — `carId`, `plate`, `status` for each car at the garage.

        ### Actions
        Put Back in Service — `POST /cars/{carId}/service-lifecycle/return-from-garage`

        ### States
        - empty: no car is currently at the garage
        - loading: cars are being fetched
        - refusal: naming BR-18 (the car is not currently out of service)

        ### Layout
        `card` per car, `status-badge-out-of-service`, `input` on the new-mileage/next-service form, `button-primary` for Put Back in Service, `spacing.gutter` between cards.

        ## Damage Review

        ### Purpose
        Let the fleet coordinator review a pending damage report and classify it as minor or unsafe, taking the car out of service at once when unsafe.

        ### Data
        `GET /damage-reports` — `id`, `carId`, `note` for each pending damage report.

        ### Actions
        - Classify as Minor — `PATCH /damage-reports/{damageReportId}/classify-as-minor`
        - Classify as Unsafe — `PATCH /damage-reports/{damageReportId}/classify-as-unsafe`

        ### States
        - empty: no damage report is pending review
        - loading: reports are being fetched

        ### Layout
        `card` per report, `button-secondary` for Classify as Minor, `button-destructive` for Classify as Unsafe, `spacing.gutter` between cards.

        ## Cancellation & No-Show Counts

        ### Purpose
        Give the fleet coordinator a monthly view of each employee's late cancellations and no-shows.

        ### Data
        `GET /cancellation-counts` — `employeeId`, `month`, `lateCancellationCount`, `noShowCount` for each employee.

        ### Actions
        None.

        ### States
        - empty: no cancellation or no-show is recorded for the chosen month
        - loading: counts are being fetched

        ### Layout
        `card` rows, `input` for the month selector, `spacing.sm` between rows.
    elements:
