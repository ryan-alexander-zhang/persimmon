              - A reservation for car plate 34-XYZ-7 picked up at 09:05 on 2026-10-15
            when:
              - The employee returns the car at 11:00 on 2026-10-15, recording a mileage of 61,340 km and noting damage at the rear bumper, drivable, with a photo attached
            then:
