      - name: Car record updated
        attributes:
          - Car has plate
          - Car has seats
          - Car has gearbox
          - Car has van flag
          - Car has next-service threshold
      - name: Car became service-due
        temporal: true
        pivotal: true
        attributes: []
      - name: Car taken out of service for scheduled maintenance
        pivotal: true
        attributes:
          - Car has service state
      - name: Car serviced by garage
        attributes: []
      - name: Car returned to service after maintenance
        pivotal: true
        attributes:
