      - name: Damage classified as minor
        attributes:
          - Damage report has severity
      - name: Damage classified as unsafe
        pivotal: true
        attributes:
          - Damage report has severity
      - name: Car booked with garage
        attributes:
          - Car service lifecycle has status
      - name: Car taken out of service
        attributes:
          - Car record has state
          - Car service lifecycle has status
      - name: Car serviced
        attributes: []
      - name: Car put back into service
        pivotal: true
        attributes:
          - Car record has state
          - Car record has mileage
          - Car record has next service due mileage
          - Car record has next service due date
          - Car service lifecycle has status
    policies:
      - id: POL-1
        name: Mileage update policy
        when:
          - Car returned
        then:
          - Update car mileage
        execution: automatic
      - id: POL-2
        name: Damage report policy
        when:
          - Car returned
        then:
          - Open damage report
        execution: automatic
        condition: a damage note was recorded on return
      - id: POL-3
        name: Service due policy
        when:
          - Car mileage updated
          - Service date reached
        then:
          - Mark car service due
        execution: automatic
        condition: current mileage reaches the next service mileage threshold or the current date reaches the next service due date
      - id: POL-4
        name: Unsafe damage policy
        when:
          - Damage classified as unsafe
        then:
          - Take car out of service
        execution: automatic
      - id: POL-5
        name: Garage days policy
        when:
          - Car booked with garage
        then:
          - Take car out of service
        execution: automatic
    readModels:
      - name: Car condition view
        informs:
          - Employee
        fields:
          - Damage report has note
          - Damage report has severity
        updatedBy:
          - Damage report opened
          - Damage classified as minor
          - Damage classified as unsafe
      - name: Pending damage reports view
        informs:
          - Fleet coordinator
        fields:
          - Damage report has note
        updatedBy:
          - Damage report opened
      - name: Service-due cars view
        informs:
          - Fleet coordinator
        fields:
          - Car record has plate
          - Car service lifecycle has status
        updatedBy:
          - Car became service due
      - name: Cars at garage view
        informs:
          - Fleet coordinator
        fields:
          - Car record has plate
          - Car service lifecycle has status
        updatedBy:
          - Car booked with garage
          - Car serviced
    externalSystems:
      - name: Garage
        emits:
          - Car serviced
---
apiVersion: sdd.persimmon.ai/v1
kind: Architecture
metadata:
  name: car-pool-prd-architecture.r1
spec:
  identity:
    id: car-pool-prd-architecture
    revision: 1
  content:
    title: Company Car Pool
    owner: Fleet coordinator
    status: accepted
    introduction:
      prd: car-pool-prd
      qualityGoals:
        - id: QG-1
          quality: reliability
          motivation: An employee must never be handed a double-booked, out-of-service, or service-overdue car (G-1, G-2, SC-1, SC-2).
        - id: QG-2
          quality: safety
          motivation: A car found unsafe must be withdrawn before it can be driven again, with every affected employee notified (G-2, G-3, SC-6).
        - id: QG-3
          quality: functional-suitability
          motivation: The fleet coordinator needs one trustworthy record per car for condition, service, and damage, replacing the spreadsheet entirely (G-4, SC-8).
        - id: QG-4
          quality: interaction-capability
          motivation: An employee must be able to search, reserve, pick up, return, and cancel a trip, and see prior damage, without friction (G-1, G-3, G-5).
        - id: QG-5
          quality: reliability
          motivation: Automatic policies (pickup-timeout release, service-due detection) must fire promptly and consistently (SC-3, SC-9).
      stakeholders:
        - role: Employee
          expectations: Search and reserve a car that fits the trip, know it is actually available and roadworthy, and see any damage noted by the previous driver before taking it.
        - role: Fleet coordinator
          expectations: One current record per car replacing the spreadsheet, the ability to approve long trips and review damage, and visibility into service-due and garage status.
        - role: Office manager
          expectations: The same fleet-coordinator capabilities, under their own identity, while covering an absence.
        - role: System operator (Rotterdam IT)
          expectations: The system signs employees and the fleet coordinator in through the existing company directory and runs reliably on the office's existing infrastructure without a new account system.
    constraints:
      - id: C-1
        kind: organizational
        statement: Employees and the fleet coordinator sign in through the existing company directory; no separate account system is built.
        rationale: Stated assumption; avoids duplicating identity management the company already has.
      - id: C-2
        kind: organizational
        statement: The office manager signs in with their own identity, granted the fleet coordinator role, while covering an absence.
        rationale: Q-4 resolution; keeps per-person accountability.
      - id: C-3
        kind: technical
        statement: Physical keys stay in the cabinet; the system does not sense or control physical access to cars.
        rationale: Stated non-goal; no telematics or keyless entry.
      - id: C-4
        kind: organizational
        statement: The system supports twelve cars and about sixty employees at a single Rotterdam office; no other offices are in scope.
        rationale: Stated assumption and non-goal; fixes the scale design must fit.
      - id: C-5
        kind: convention
        statement: Fuel cards, expense tracking, telematics, keyless entry, and insurance claims beyond the damage report are out of scope.
        rationale: Stated non-goals; keeps the system's surface area to booking, fleet record, and damage.
    context:
      business:
        - partner: Employee
          exchanges: Trip requests (seats, van, gearbox, slot), reservations, pickups, returns (mileage, damage notes), cancellations, and views of available cars, their own reservations, and car condition.
          direction: both
        - partner: Fleet coordinator
          exchanges: Car records, long-trip approval decisions, damage severity reviews, garage bookings and service-lifecycle transitions, and the cancellation/no-show counts view.
          direction: both
        - partner: Office manager
          exchanges: The same fleet coordinator exchanges (car records, approvals, damage review, garage scheduling), performed under the Fleet coordinator role while covering an absence.
          direction: both
        - partner: Garage
          exchanges: Service bookings for service-due or unsafe cars, and notice that a car has been serviced, with its new mileage.
          direction: both
        - partner: Company directory
          exchanges: Sign-in identity for employees, the fleet coordinator, and the office manager.
          direction: in
      technical:
        - channel: Employee/Fleet coordinator web client
          protocol: HTTPS/JSON
          carries: trip requests, reservations, pickup/return recording, cancellations, car record maintenance, approvals, damage review, garage scheduling, and all read views
        - channel: Company directory SSO
          protocol: OIDC/SAML
          carries: sign-in identity
        - channel: Garage coordination (phone/email, recorded by the fleet coordinator)
          protocol: manual, recorded via the web client
          carries: service bookings and completion notices
    strategy:
      - id: S-1
        decision: Ship Reservations and Fleet care as two modules inside one deployable application process sharing one relational store, not as independently deployed services.
        addresses:
          - QG-3
          - C-4
      - id: S-2
        decision: Keep each bounded context's aggregates transactionally independent and integrate the Reservations/Fleet care partnership through asynchronous domain events rather than a shared cross-context transaction.
        addresses:
          - QG-1
          - QG-2
      - id: S-3
        decision: Serve car search from an event-fed available-cars projection owned by Reservations, re-checked at reservation time, instead of calling Fleet care synchronously on every search.
        addresses:
          - QG-1
          - QG-4
      - id: S-4
        decision: Delegate authentication to the existing company directory and model the office manager as the fleet coordinator role granted to a distinct identity.
        addresses:
          - C-1
          - C-2
    buildingBlocks:
      - id: BB-1
        name: Reservations module
        responsibility: Matches trip requests to fitting, available, in-service, not-service-due cars; routes long trips to approval; confirms reservations; tracks pickup and release; records returns; tracks cancellations and no-shows; reacts to a car leaving service by cancelling its future reservations and notifying affected employees.
        technology: Server-side application module (backend framework) within the Car Pool Service
        interfaces:
          - name: Reservation API
            kind: provides
            description: HTTPS/JSON endpoints for trip search, reservation, pickup/return recording, cancellation, and long-trip approval requests (CAP-1 through CAP-4).
          - name: Reservation events
            kind: provides
            description: Domain events, including Car returned (return mileage, damage note), published for Fleet care to consume.
          - name: Fleet care status events
            kind: requires
            description: Car record and service-lifecycle events consumed to keep the available-cars projection current and to cancel future reservations when a car leaves service (BR-7, BR-8, BR-17).
          - name: Persistence
            kind: requires
            description: Durable storage for trip requests, active reservations, and read models.
        contexts:
          - reservations
      - id: BB-2
        name: Fleet care module
        responsibility: Owns each car's record (plate, seats, gearbox, van flag, mileage, service threshold, state), its service lifecycle (service-due, garage booking, out-of-service, back-in-service), and damage reports reviewed as minor or unsafe.
        technology: Server-side application module (backend framework) within the Car Pool Service
        interfaces:
          - name: Fleet care API
            kind: provides
            description: HTTPS/JSON endpoints for car record maintenance, service lifecycle, damage review, and garage scheduling (CAP-5 through CAP-7).
          - name: Fleet care status events
            kind: provides
            description: Domain events reflecting car-state changes (registered, mileage updated, became service-due, booked with garage, taken out of service, put back into service), published for Reservations to consume.
          - name: Reservation events
            kind: requires
            description: The Car returned event (return mileage, damage note), consumed to update car mileage (BR-12) and open a damage report when a note was left (CAP-7).
          - name: Persistence
            kind: requires
            description: Durable storage for car records, service lifecycle, and damage reports.
        contexts:
          - fleet-care
      - id: BB-3
        name: Web client
        responsibility: Presents search, reservation, pickup/return, cancellation, fleet record, damage review, and garage-scheduling screens to employees and the fleet coordinator/office manager.
        technology: Single-page web application (browser)
        interfaces:
          - name: Reservation API
            kind: requires
            description: Calls the Reservations module for search, reservation, pickup/return, cancellation, and approval requests.
          - name: Fleet care API
            kind: requires
            description: Calls the Fleet care module for car record, service lifecycle, damage review, and garage scheduling.
          - name: Sign-in
            kind: requires
            description: Authenticates the signed-in user against the company directory (C-1, C-2).
        contexts: []
      - id: BB-4
        name: Data store
        responsibility: Durable relational storage for both modules' aggregates and read models, with each context's tables logically separated (CC-4).
        technology: Relational database
        interfaces:
          - name: Persistence
            kind: provides
            description: Durable read/write storage used by the Reservations and Fleet care modules.
        contexts: []
    relations:
      - id: REL-1
        from: Employee
        to: BB-3
        description: Employee searches, reserves, picks up/returns cars, cancels reservations, and views car condition, their reservations, and cancellation/no-show counts.
      - id: REL-2
        from: BB-3
        to: BB-1
        interface: Reservation API
        description: Web client calls the Reservations module to search, reserve, record pickup/return, cancel, and request long-trip approval.
        technology: HTTPS/JSON
      - id: REL-3
        from: BB-3
        to: BB-2
        interface: Fleet care API
        description: Web client calls the Fleet care module for car record maintenance, damage review, garage scheduling, and approval/damage views.
        technology: HTTPS/JSON
      - id: REL-4
        from: BB-3
        to: Company directory
        interface: Sign-in
        description: Web client authenticates the signed-in user via the company directory's SSO.
        technology: OIDC/SAML
      - id: REL-5
        from: BB-1
        to: BB-4
        interface: Persistence
        description: Reservations module stores and retrieves trip requests, active reservations, and read models.
        technology: SQL
      - id: REL-6
        from: BB-2
        to: BB-4
        interface: Persistence
        description: Fleet care module stores and retrieves car records, service lifecycle state, and damage reports.
        technology: SQL
      - id: REL-7
        from: BB-1
        to: BB-2
        interface: Fleet care status events
        description: Reservations module consumes Fleet care's car-state events to keep its available-cars projection current and to cancel future reservations and notify employees when a car leaves service (BR-7, BR-8, BR-17).
      - id: REL-8
        from: BB-2
        to: BB-1
        interface: Reservation events
        description: Fleet care module consumes the Car returned event to update the car's mileage (BR-12) and open a damage report when a note was left (CAP-7).
      - id: REL-9
        from: Fleet coordinator
        to: BB-3
        description: Fleet coordinator maintains car records, reviews damage, approves long trips, and schedules garage visits through the web client.
      - id: REL-10
        from: Office manager
        to: BB-3
        description: Office manager performs the same fleet coordinator actions through the web client while covering an absence (C-2).
      - id: REL-11
        from: BB-2
        to: Garage
        description: Fleet coordinator records garage bookings and completion outcomes against a car's service lifecycle (BR-14, BR-18); the booking itself happens off-system.
    concepts:
      - id: CC-1
        topic: domain
        statement: Reservations' transaction boundary is one of its aggregates (Trip request, Active reservation, or Out-of-service impact) per command, matching reservations-model AG-1..AG-3; invariants such as no double-booking (BR-3) and no out-of-service or overdue car (BR-7, BR-8) are enforced inside the Trip request aggregate at reservation time against its own fleet-status projection, never by locking across contexts.
      - id: CC-2
        topic: domain
        statement: Fleet care's transaction boundary is one of its aggregates (Car record, Car service lifecycle, or Damage report) per command, matching fleet-care-model AG-1..AG-3; each car's record, lifecycle, and damage reports evolve independently.
      - id: CC-3
        topic: security
        statement: Authentication delegates to the company directory (C-1); authorization is role-based (Employee vs. Fleet coordinator), with the office manager's identity granted the Fleet coordinator role for the duration of an absence (C-2).
      - id: CC-4
        topic: persistence
        statement: Each bounded context owns its own tables within the shared relational store (BB-4); cross-context reads happen only through the published event-fed projections (Fleet care status events, Reservation events), never through direct cross-schema queries.
      - id: CC-5
        topic: errors
        statement: "A command that would violate a business rule is refused with the rule's id surfaced to the caller: reserving an out-of-service car cites BR-7, reserving a car whose service is due before the slot ends cites BR-8, exceeding two future reservations cites BR-5, and a trip over three days without approval cites BR-6."
      - id: CC-6
        topic: transactions
        statement: Fleet care's car-state events reach Reservations' available-cars projection asynchronously; a narrow staleness window exists between a car leaving service in Fleet care and its disappearance from the projection, closed by the reservation-time re-check (see RK-1).
      - id: CC-7
        topic: logging
        statement: Long-trip approval decisions, damage severity classifications, and out-of-service cascades are retained with their timestamp and acting identity, to support the fleet coordinator's monthly review (SC-5) and the recorded-approval requirement (SC-7).
    businessRules: car-pool-rules
    domainModels:
      - fleet-care-model
      - reservations-model
    glossaries:
      - fleet-care-glossary
      - reservations-glossary
    decisions:
      - car-pool-prd-adr-1
      - car-pool-prd-adr-2
      - car-pool-prd-adr-3
      - car-pool-prd-adr-4
    qualityScenarios:
      - id: QS-1
        qualityGoal: QG-1
        stimulus: Two employees try to reserve the same car for overlapping slots within the same second.
        response: The system accepts the first reservation and refuses the second, citing BR-3.
        measure: 0 overlapping accepted reservations across 10,000 concurrent-reservation test runs (SC-1).
        method: load
        stage: release
      - id: QS-2
        qualityGoal: QG-1
        stimulus: An employee requests a car whose next service is due before the requested slot ends.
        response: The car is excluded from the available-cars results.
        measure: 100% of such cars excluded across a full day's search traffic (SC-2).
        method: test
        stage: build
      - id: QS-3
        qualityGoal: QG-2
        stimulus: The fleet coordinator classifies a damage report as unsafe for a car holding three future reservations.
        response: The car is taken out of service at once, its three future reservations are cancelled, and the three employees are notified.
        measure: 0 uncancelled future reservations remain on the car within 1 minute of classification (SC-6).
        method: test
        stage: build
      - id: QS-4
        qualityGoal: QG-3
        stimulus: The fleet coordinator looks up a car's plate, seats, gearbox, van flag, mileage, service status, and state.
        response: The fleet record returns all seven fields from the single system of record; no spreadsheet is consulted.
        measure: 12 of 12 cars have complete fleet records (SC-8).
        method: observe
        stage: runtime
      - id: QS-5
        qualityGoal: QG-4
        stimulus: An employee submits a trip request for 4 seats, no van, automatic gearbox, for a free afternoon slot.
        response: The system returns only cars meeting the fit criteria that are free, in service, and not service-due before the slot ends.
        measure: Search results render within 2 seconds for the 12-car fleet.
        method: load
        stage: release
      - id: QS-6
        qualityGoal: QG-5
        stimulus: A reservation's start time passes with no pickup recorded.
        response: The reservation is released automatically so another employee can take the car.
        measure: Released within 30 minutes of the reservation's start, every time (SC-3).
        method: test
        stage: build
    risks:
      - id: RK-1
        kind: risk
        statement: Reservations' available-cars projection may briefly lag Fleet care's car-state events, letting a just-out-of-service or just-service-due car appear available for a few seconds.
        impact: medium
        probability: low
        mitigation: Keep the event-to-projection lag small and re-validate the car's live state inside the Trip request aggregate's reservation invariant at commit time (BR-7, BR-8), not only against the projection.
      - id: RK-2
        kind: risk
        statement: Because the office manager and fleet coordinator share one role, an audit cannot tell which of the two performed a given action from the role alone.
        impact: low
        probability: medium
        mitigation: Record the acting identity, not just the role, on every fleet-care and approval action (CC-7).
      - id: RK-3
        kind: debt
        statement: One shared relational store for both modules couples their schemas today; splitting into separate deployables later would require extracting schemas and replacing in-process events with a message bus.
        impact: low
        mitigation: Keep each context's tables logically separated (CC-4) and interactions limited to the published event interfaces, so a future split changes only the transport.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: car-pool-prd-adr-1.r1
spec:
  identity:
    id: car-pool-prd-adr-1
    revision: 1
  content:
    title: Build the Car Pool system as a single modular-monolith deployable
    status: accepted
    strategy: S-1
    deciders:
      - Architect
      - Fleet coordinator
    context: The fleet runs twelve cars for about sixty employees at a single Rotterdam office (C-4); building and operating separate services for Reservations and Fleet care would add deployment, networking and operational overhead the Prd's scale does not justify, while the coordinator needs one simple, maintainable system for the fleet record that replaces the spreadsheet (QG-3).
    drivers:
      - QG-3
      - C-4
      - G-4
      - SC-8
    decision: Ship the Reservations and Fleet care bounded contexts as two modules inside one deployable application process, sharing one relational store, rather than as independently deployed services.
    alternatives:
      - option: Separate microservices per bounded context
        rejectedBecause: adds network calls, independent deployment pipelines and operational burden disproportionate to a 12-car, 60-employee fleet.
      - option: A single undifferentiated application with no module boundaries
        rejectedBecause: would blur the Reservations/Fleet care boundary the Prd's two subdomains and business-rule ownership require, making BR ownership and a future split harder.
    consequences:
      - kind: positive
        statement: One deployable to build, test and operate; operational cost matches the fleet's scale.
      - kind: negative
        statement: The two modules share a process and a failure domain; a defect in one module can affect the other's availability.
      - kind: neutral
        statement: A future split into separate services remains possible if scale grows (see RK-3).
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: car-pool-prd-adr-2.r1
spec:
  identity:
    id: car-pool-prd-adr-2
    revision: 1
  content:
    title: Integrate Reservations and Fleet care through domain events, not a shared transaction
    status: accepted
    strategy: S-2
    deciders:
      - Architect
      - Fleet coordinator
    context: Reservations and Fleet care are a declared partnership (cr-01) that each evolve their own aggregates (reservations-model AG-1..AG-3, fleet-care-model AG-1..AG-3); a car's return affects mileage and damage in Fleet care (BR-12), and a car leaving service must cancel Reservations' future bookings (BR-17), but spanning both contexts' aggregates in one transaction would threaten QG-1's reliability and QG-2's safety guarantees under concurrent updates.
    drivers:
      - QG-1
      - QG-2
      - BR-12
      - BR-17
    decision: Keep each bounded context's aggregates transactionally independent and propagate cross-context effects (car returned; car taken out of, booked with garage, or put back into service) as domain events consumed asynchronously by the other module.
    alternatives:
      - option: A single cross-context transaction spanning both modules' aggregates
        rejectedBecause: couples Reservations' and Fleet care's consistency boundaries, contradicting each aggregate's own transaction boundary (CC-1, CC-2) and increasing lock contention on the shared car record.
      - option: Reservations calls Fleet care synchronously inside the reservation command and vice versa
        rejectedBecause: makes each context's command availability depend on the other's being up, the double-dependency QG-1 is meant to avoid.
    consequences:
      - kind: positive
        statement: Each context keeps a simple, enforceable transaction boundary matching its own aggregates.
      - kind: negative
        statement: Cross-context effects are eventually consistent, leaving a narrow staleness window (RK-1).
      - kind: positive
        statement: A car taken out of service reliably cancels its future reservations and notifies employees even if Reservations was briefly unavailable when the event was published, because delivery is retried.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: car-pool-prd-adr-3.r1
spec:
  identity:
    id: car-pool-prd-adr-3
    revision: 1
  content:
    title: Serve car search from an event-fed projection in Reservations, not a live call to Fleet care
    status: accepted
    strategy: S-3
    deciders:
      - Architect
      - Fleet coordinator
    context: CAP-1 must filter cars by fit, free slot, in-service state and service-due threshold (BR-1, BR-3, BR-7, BR-8) on every search; calling Fleet care synchronously for every search would make search latency and availability depend on Fleet care, working against QG-4's responsiveness and QG-1's reliability.
    drivers:
      - QG-1
      - QG-4
      - BR-7
      - BR-8
      - CAP-1
    decision: Reservations maintains its own read-optimized available-cars projection, kept current by consuming Fleet care's car-state events (Car record registered, Car mileage updated, Car became service due, Car booked with garage, Car taken out of service, Car put back into service), and re-checks the car's live state inside the Trip request aggregate at the moment of reserving.
    alternatives:
      - option: Query Fleet care synchronously on every search and every reservation
        rejectedBecause: ties search latency and availability to Fleet care and adds load to its write-side aggregates for a read-heavy operation.
      - option: Let employees see the full static fleet list and discover service/out-of-service status only at pickup
        rejectedBecause: "reintroduces the problem the brief names: a car going out on a trip while its service is due or while out of service (G-2, SC-2)."
    consequences:
      - kind: positive
        statement: Search stays fast and available even if Fleet care is briefly degraded.
      - kind: negative
        statement: The projection can lag Fleet care's true state by the event-propagation delay (RK-1), mitigated by the reservation-time re-check.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: car-pool-prd-adr-4.r1
spec:
  identity:
    id: car-pool-prd-adr-4
    revision: 1
  content:
    title: Delegate sign-in to the company directory and model the office manager as a granted role
    status: accepted
    strategy: S-4
    deciders:
      - Architect
      - Fleet coordinator
    context: The Prd assumes employees and the fleet coordinator sign in through the existing company directory with no separate account system (C-1), and the office manager covers the fleet coordinator's duties under their own identity (C-2, Q-4 resolution).
    drivers:
      - C-1
      - C-2
      - G-4
    decision: Authenticate all users against the existing company directory (SSO) and authorize by role, granting the office manager's own identity the Fleet coordinator role for the duration of an absence, instead of building a separate account system or sharing the fleet coordinator's login.
    alternatives:
      - option: Build a separate account/password system for the pool-car application
        rejectedBecause: duplicates identity management the company directory already provides and contradicts C-1.
      - option: Office manager signs in using the fleet coordinator's own account during an absence
        rejectedBecause: loses per-person accountability for approvals and damage reviews, contradicted by Q-4's resolution that the office manager keeps their own identity.
    consequences:
      - kind: positive
        statement: No new credential store to secure or maintain.
      - kind: positive
        statement: Every action is attributable to the acting person even when the office manager is covering (mitigates RK-2).
      - kind: negative
        statement: The application depends on the company directory's availability for sign-in.
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: car-pool-prd-cap-1.r1
spec:
  identity:
    id: car-pool-prd-cap-1
    revision: 1
  content:
    title: Car search and reservation
    prd: car-pool-prd
    capability: CAP-1
    architecture: car-pool-prd-architecture
    domainModel: reservations-model
    businessRules: car-pool-rules
    stories:
      - id: US-1
        role: Employee
        goal: see only cars that fit a trip and are free, in service, and not due for service
        benefit: so that they can choose a car that fits the trip without later discovering a conflict or an unsafe car (G-1, G-2)
        requirements:
          - FR-1
          - FR-2
          - FR-3
          - FR-4
        readModels:
          - Available cars view
        acceptance:
          - id: AC-1
            title: Fitting, free, in-service, not-service-due car is offered
            given:
              - Car KL-01-ZB has 5 seats, is not a van, has an automatic gearbox, is in service, and its next service is due at 40,000 km while its current mileage is 38,000 km
              - Car KL-01-ZB has no reservation overlapping 2026-10-20 14:00-16:00
            when:
              - Employee submits a trip request for 4 seats, no van required, automatic gearbox required, for the slot 2026-10-20 14:00-16:00
            then:
              - Car KL-01-ZB is included among the offered cars
          - id: AC-2
            title: Car with too few seats is not offered
            given:
              - Car KL-02-ZB has 2 seats, is in service, and is free for 2026-10-21 09:00-11:00
            when:
              - Employee submits a trip request for 4 seats, no van required, no automatic gearbox required, for the slot 2026-10-21 09:00-11:00
            then:
              - Car KL-02-ZB is excluded from the offered cars
          - id: AC-3
            title: Non-van car is not offered when a van is required
            given:
              - Car KL-03-ZB has 5 seats, is not a van, is in service, and is free for 2026-10-21 09:00-11:00
            when:
              - Employee submits a trip request for 4 seats, a van required, no automatic gearbox required, for the slot 2026-10-21 09:00-11:00
            then:
              - Car KL-03-ZB is excluded from the offered cars
          - id: AC-4
            title: Manual-gearbox car is not offered when an automatic gearbox is required
            given:
              - Car KL-04-ZB has 5 seats, a manual gearbox, is in service, and is free for 2026-10-21 09:00-11:00
            when:
              - Employee submits a trip request for 4 seats, no van required, automatic gearbox required, for the slot 2026-10-21 09:00-11:00
            then:
              - Car KL-04-ZB is excluded from the offered cars
          - id: AC-5
            title: Car already reserved for an overlapping slot is not offered
            given:
              - Car KL-05-ZB fits the requested seats, van, and gearbox, and is in service
              - Car KL-05-ZB already holds a reservation for 2026-10-22 13:00-15:00
            when:
              - Employee submits a trip request for the slot 2026-10-22 14:00-16:00
            then:
              - Car KL-05-ZB is excluded from the offered cars
          - id: AC-6
            title: Out-of-service car is not offered
            given:
              - Car KL-06-ZB fits the requested seats, van, and gearbox, is free for 2026-10-23 09:00-11:00, and is out of service
            when:
              - Employee submits a trip request for the slot 2026-10-23 09:00-11:00
            then:
              - Car KL-06-ZB is excluded from the offered cars
          - id: AC-7
            title: Car due for service before the slot ends is not offered
            given:
              - Car KL-07-ZB fits the requested seats, van, and gearbox, is in service, is free for 2026-10-24 09:00-17:00, and has a next service due date of 2026-10-24
            when:
              - Employee submits a trip request for the slot 2026-10-24 09:00-17:00
            then:
              - Car KL-07-ZB is excluded from the offered cars
      - id: US-2
        role: Employee
        goal: reserve one specific offered car for a trip
        benefit: so that the car is held for the trip without conflicting with another booking (G-1)
        requirements:
          - FR-5
          - FR-6
          - FR-7
          - FR-8
        commands:
          - Reserve car
        events:
          - Car reserved
        acceptance:
          - id: AC-8
            title: Employee reserves one offered car
            given:
              - Car KL-01-ZB is among the cars offered for a trip request for the slot 2026-10-20 14:00-16:00
            when:
              - Employee reserves car KL-01-ZB for the slot 2026-10-20 14:00-16:00
            then:
              - A reservation is recorded for exactly car KL-01-ZB for the slot 2026-10-20 14:00-16:00
              - A Car reserved event is published for car KL-01-ZB
          - id: AC-9
            title: Reservation refused when the car was booked for an overlapping slot first
            given:
              - Car KL-08-ZB was offered to two employees for the overlapping slot 2026-10-25 10:00-12:00
              - Employee A has already reserved car KL-08-ZB for 2026-10-25 10:00-12:00
            when:
              - Employee B reserves car KL-08-ZB for 2026-10-25 11:00-13:00
            then:
              - "Employee B's reservation is refused: BR-3, car KL-08-ZB is already reserved for an overlapping slot"
          - id: AC-10
            title: Reservation refused when the car left service after being offered
            given:
              - Car KL-09-ZB was offered to Employee for the slot 2026-10-26 09:00-11:00
              - Car KL-09-ZB was taken out of service after being offered and before the reservation was made
            when:
              - Employee reserves car KL-09-ZB for 2026-10-26 09:00-11:00
            then:
              - "The reservation is refused: BR-7, car KL-09-ZB is out of service"
          - id: AC-11
            title: Reservation refused when the car's service became due after being offered
            given:
              - Car KL-10-ZB was offered to Employee for the slot 2026-10-27 09:00-17:00
              - Car KL-10-ZB's next service became due on 2026-10-27, before the reservation was made
            when:
              - Employee reserves car KL-10-ZB for 2026-10-27 09:00-17:00
            then:
              - "The reservation is refused: BR-8, car KL-10-ZB's service is due before the slot ends"
    requirements:
      - id: FR-1
        pattern: event-driven
        rules:
          - BR-1
        statement: When an employee submits a trip request, the system shall offer only cars whose seats, van availability, and gearbox match the request, enforcing BR-1.
      - id: FR-2
        pattern: event-driven
        rules:
          - BR-3
        statement: When an employee submits a trip request, the system shall offer only cars not already reserved for a slot overlapping the requested slot, enforcing BR-3.
      - id: FR-3
        pattern: event-driven
        rules:
          - BR-7
        statement: When an employee submits a trip request, the system shall offer only cars that are in service, enforcing BR-7.
      - id: FR-4
        pattern: event-driven
        rules:
          - BR-8
        statement: When an employee submits a trip request, the system shall offer only cars whose next service is not due before the requested slot ends, enforcing BR-8.
      - id: FR-5
        pattern: event-driven
        rules:
          - BR-2
        statement: When an employee reserves a car from the offered cars, the system shall record the reservation against exactly one specific car, enforcing BR-2.
      - id: FR-6
        pattern: unwanted-behaviour
        rules:
          - BR-3
        statement: If reserving a car would break BR-3, then the system shall refuse the reservation, citing BR-3.
      - id: FR-7
        pattern: unwanted-behaviour
        rules:
          - BR-7
        statement: If reserving a car would break BR-7, then the system shall refuse the reservation, citing BR-7.
      - id: FR-8
        pattern: unwanted-behaviour
        rules:
          - BR-8
        statement: If reserving a car would break BR-8, then the system shall refuse the reservation, citing BR-8.
    qualities:
      - scenario: QS-1
      - scenario: QS-2
      - scenario: QS-5
    openQuestions: []
