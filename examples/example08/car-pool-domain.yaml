            typography: "{typography.label-sm}"
            rounded: "{rounded.full}"
            padding: "{spacing.xs}"
          status-badge-pending:
            backgroundColor: "{colors.secondary}"
            textColor: "{colors.on-secondary}"
            typography: "{typography.label-sm}"
            rounded: "{rounded.full}"
            padding: "{spacing.xs}"
          status-badge-warning:
            backgroundColor: "{colors.warning}"
            textColor: "{colors.on-warning}"
            typography: "{typography.label-sm}"
            rounded: "{rounded.full}"
            padding: "{spacing.xs}"
          status-badge-error:
            backgroundColor: "{colors.error}"
            textColor: "{colors.on-error}"
            typography: "{typography.label-sm}"
            rounded: "{rounded.full}"
            padding: "{spacing.xs}"
        ---

        ## Overview

        The Company Car Pool is looked at by two people inside one Rotterdam office: the Employee, who glances at it while deciding whether a car is free and later stands beside the car itself recording mileage and damage at pickup and return, and the Fleet coordinator, who sits at a desk reading a dense record of twelve cars' service and damage state and deciding, often under time pressure, whether a car is safe to send out. Both reach the product through the Pool Web Application, a single-page browser app (no kiosk, no dedicated device) — but the two moments of use differ: the Employee's pickup/return moment is a quick, often one-handed phone interaction standing in a garage, so tap targets stay large and status reads at a glance; the coordinator's desk moment is a denser, table-like read of many cars at once, so the same tokens must also support tight, scannable rows. The product carries no marketing weight; it should feel like a dependable internal instrument — calm, high-contrast, unambiguous about a car's state — because a missed status (out-of-service, unsafe damage) has real safety consequences, not just an inconvenience.

        ## Colors

        The palette is deliberately restrained: one primary for the handful of committing actions (reserve, approve, confirm return), a muted secondary for lower-emphasis actions and the pending state, and a small set of semantic colors — success, warning, error — that exist only to carry the fleet's state (in-service, service-due, out-of-service, damage severity) unambiguously across both the Employee's quick phone glance and the coordinator's dense table. Surface and background stay near-white and light gray so semantic color is the only thing that draws the eye. No brand color was supplied by the Prd or Architecture, so `colors.primary` (#1B5E8A) is a neutral placeholder pending Q-1; every background/text pairing used by a component (button, input, badge) has been checked to clear 4.5:1 contrast.

        ## Typography

        A twelve-level type scale carries two different reading conditions: headline and title levels give the coordinator's Fleet record and Garage status views a clear scan hierarchy across many rows, while body and label levels stay large enough (minimum 12px, with generous line-height) to read on a phone screen in a garage's uneven light during pickup and return. Weight, not color, carries most emphasis, so status color stays reserved for state. No company-owned typeface was supplied, so `typography.*.fontFamily` uses a neutral system stack pending Q-2.

        ## Layout

        Spacing runs on a 4px-based scale (`xs` 4px to `xl` 32px) with a 16px gutter and 24px page margin, giving the same rhythm to a single-column card list (Available cars, My reservations on a phone) and a denser multi-column grid (Fleet record, Garage status, Damage reports on a desk). Cards carry generous internal padding (`spacing.lg`) so a car's fitness, service, and damage state never crowd together; forms (reservation request, mileage and damage entry) stack inputs vertically with `spacing.md` between fields so a field is never mis-tapped from a phone.

        ## Elevation & Depth

        Depth is used sparingly and only to separate an actionable unit from the page: cards (a car in Available cars, a pending approval, a damage report) sit on a soft 1px `{colors.outline}` border plus a low, single-level drop shadow (`0 1px 2px rgba(26,28,30,0.08)`) at rest, rising to a slightly stronger shadow (`0 2px 6px rgba(26,28,30,0.12)`) on hover or focus to confirm it's interactive. No second elevation tier or modal-level shadow is needed — the product has no overlapping panels, so one resting and one raised state cover every surface.

        ## Shapes

        Corner rounding separates containers from controls from status: cards and the Fleet record's row containers use the largest radius (`rounded.lg`, 16px) to read as a calm, bounded unit; buttons and inputs use a tighter `rounded.md`/`rounded.sm` so they read as controls, not content; status badges (in-service, out-of-service, pending, service-due, damage severity) are fully rounded (`rounded.full`) pills, a shape used nowhere else, so a glance immediately tells state apart from content.

        ## Components

        `button-primary` carries the one committing action per screen (Reserve, Approve, Confirm return); `button-primary-disabled` appears while a fitness or service-due check is still being evaluated, or once a slot is no longer available. `button-secondary` is an outlined, surface-colored control (a 1px `{colors.outline}` border, since the token set carries no border field) for Cancel, Deny, and other lower-emphasis actions, always paired beside a primary action rather than alone. `input` is used for every form field across Reserve a car, Record mileage, Damage note, and Fleet record edits, with a 1px `{colors.outline}` border at rest; `input-error` swaps that border to `{colors.error}` and adds error-colored helper text beneath the field (e.g., a mileage value lower than the car's last recorded mileage). `card` is the repeating container for a car in Available cars, a reservation in My reservations, a request in Pending approvals, and a report in Damage reports, always at rest or hover elevation per the Elevation & Depth section, never deeper. The `status-badge-*` family carries every piece of car and reservation state: `-active` for in-service and approved, `-inactive` for out-of-service and no-longer-bookable, `-pending` for a reservation awaiting coordinator approval or a garage booking in progress, `-warning` for service-due-soon and damage reviewed as minor, `-error` for unsafe damage and a denied approval. A badge never appears without one of these five states, and never carries its own icon — color and label text are suffient at both reading distances this product is used at.

        ## Do's and Don'ts

        - Do pair every `button-primary` with a visible `button-secondary` escape (Cancel, Deny) rather than leaving a committing action as the only way out of a screen.
        - Do use a `status-badge-*` for every car or reservation state shown in a list or table; don't restate the same state as plain colored text, since the pill shape is what makes state scannable against ordinary content.
        - Do keep interactive `height` at or above 48px everywhere, since the Employee's pickup/return actions happen one-handed on a phone in a garage.
        - Don't introduce a new semantic color for a one-off state (e.g., a second shade of warning); reuse `success`/`warning`/`error` so the five-badge vocabulary stays closed and learnable.
        - Don't place a shadow or border on anything other than a `card` or an `input`'s resting/error state; depth is reserved for those two cases so it keeps meaning depth rather than decoration.
---
