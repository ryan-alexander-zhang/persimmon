        covers:
          - FR-2
          - FR-3
        verifiedBy:
          - AC-3
          - AC-4
        dependsOn:
          - T-1
        elements:
          - design: car-pool-prd-architecture-bb-2-data-schema
            element: EL-1
          - design: car-pool-prd-architecture-bb-2-data-schema
            element: EL-2
