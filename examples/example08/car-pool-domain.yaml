# spec-all, design-all (http-api, data-schema, ui), design-system, plan-all on claude-sonnet-5), nothing by hand but the brief. See README.md. Every artifact is at
# revision 1: the rounds collapsed into the revision that passed.
apiVersion: sdd.persimmon.ai/v1
kind: Prd
metadata:
  name: car-pool-prd.r1
spec:
  identity:
    id: car-pool-prd
    revision: 1
  content:
    businessRules: car-pool-rules
    title: Company Car Pool
    problem: About sixty employees at the Rotterdam office share twelve company cars by booking a shared calendar and taking keys from a cabinet, while the fleet coordinator tracks service dates and damage notes in a spreadsheet. Cars get double-booked, a car goes out for a customer visit on the day its service is due, and damage found on return is noticed only weeks later by the next driver, because no single record ties reservations, service state, and damage together.
    users:
      - name: Employee
        description: Reserves a company car for a customer or site visit, picks it up and returns it, and needs a car that actually fits the trip without a conflict or surprise at pickup.
      - name: Fleet coordinator
        description: Keeps each car's service and damage record current, approves longer trips, and needs to catch a problem car before it goes out, not after.
    goals:
      - id: G-1
        statement: An employee reserves a car that fits their trip without a conflict surfacing at pickup.
      - id: G-2
        statement: An employee knows before arriving whether the offered car fits the trip's seats, equipment, and gearbox needs.
      - id: G-3
        statement: A car due for service is never handed out for a trip that would run past that service.
      - id: G-4
        statement: Damage found on return reaches the fleet coordinator right away, not weeks later with the next driver.
      - id: G-5
        statement: The fleet coordinator keeps one accurate, current record of every car's condition and availability instead of a spreadsheet.
      - id: G-6
        statement: An employee whose car is pulled from service can rebook another car without delay.
    nonGoals:
      - Fuel cards and expense tracking.
      - Private use of company cars.
      - Pool cars located at other offices.
      - Telematics or keyless entry; keys remain in the physical cabinet.
      - Insurance claims handling beyond the damage report.
      - A distinct role or workflow for the office manager; they act as the fleet coordinator when covering absences.
    subdomains:
      - id: reservations
        name: Reservations
        description: "Employees reserve a fitting pool car for a trip, pick it up and return it."
        type: core
      - id: fleet-care
        name: Fleet care
        description: "The fleet coordinator keeps each car's record, service and damage state."
        type: supporting
    capabilities:
      - id: CAP-1
        name: Reserve a car
        description: An employee requests a car for a time slot, stating the trip's purpose, passenger count, and any need for a van or automatic gearbox; the system offers only cars that fit those needs, are free for the slot, are in service, and will not fall service-due before the slot ends, and it keeps an employee within their allowed number of open future reservations.
        priority: P1
        subdomain: reservations
        rules:
          - BR-1
          - BR-2
          - BR-3
          - BR-4
          - BR-5
          - BR-6
          - BR-7
          - BR-9
      - id: CAP-2
        name: Pick up and return a car
        description: An employee picks up the reserved car at the start of the slot and later returns it, recording the mileage read off the dashboard and noting any new damage; a reservation left unclaimed too long is released so another employee can take the car.
        priority: P1
        subdomain: reservations
        rules:
          - BR-8
      - id: CAP-3
        name: Cancel a reservation
        description: An employee cancels a reservation they no longer need; cancelling well ahead of the start carries no consequence, while cancelling close to the start is treated the same as not showing up.
        priority: P2
        subdomain: reservations
        rules:
          - BR-11
          - BR-12
      - id: CAP-4
        name: Track reservation reliability
        description: An employee sees their own reservations and their own count of late cancellations and no-shows, and the fleet coordinator sees the monthly count for every employee, so a pattern of late cancellations or no-shows is visible rather than lost in a shared calendar.
        priority: P2
        subdomain: reservations
        rules:
          - BR-12
      - id: CAP-5
        name: Approve extended reservations
        description: An employee whose trip needs a car for longer than the standard limit asks the fleet coordinator to approve the longer reservation before it is created, so a single long trip does not quietly remove a car from the shared pool.
        priority: P2
        subdomain: reservations
        rules:
          - BR-10
      - id: CAP-6
        name: Cancel reservations when a car leaves service
        description: When fleet care takes a car out of service, car reservations cancels every future reservation held for that car and notifies each affected employee, so they can reserve another car instead of discovering the problem at pickup.
        priority: P1
        subdomain: reservations
        rules:
          - BR-20
      - id: CAP-7
        name: Maintain fleet record
        description: The fleet coordinator keeps each car's plate, seats, gearbox, van flag, current mileage, next service due by date or mileage, and in-service or out-of-service state in one record, updated from the mileage recorded at each return, replacing the spreadsheet.
        priority: P1
        subdomain: fleet-care
        rules:
          - BR-14
      - id: CAP-8
        name: Manage scheduled service
        description: The fleet coordinator is alerted when a car's mileage or date crosses its service threshold, books the car in with the garage and takes it out of service for the garage days, and puts it back in service with the new mileage and next-service threshold once the garage returns it.
        priority: P1
        subdomain: fleet-care
        rules:
          - BR-15
          - BR-16
          - BR-21
      - id: CAP-9
        name: Review damage reports
        description: The fleet coordinator reviews the damage report opened by a return's damage note, leaves the car in service when the damage is minor, and takes the car out of service at once when the damage makes it unsafe.
        priority: P1
        subdomain: fleet-care
        rules:
          - BR-17
          - BR-18
          - BR-19
    successCriteria:
      - id: SC-1
        statement: Double-booked reservations for the same car and overlapping time slot drop to zero.
        capabilities:
          - CAP-1
      - id: SC-2
        statement: No reservation is picked up for a car whose next service falls before the end of the slot.
        capabilities:
          - CAP-1
          - CAP-8
      - id: SC-3
        statement: Damage noted on return reaches the fleet coordinator the same day, down from weeks today.
        capabilities:
          - CAP-2
          - CAP-9
      - id: SC-4
        statement: The fleet coordinator reads plate, mileage, service due, and in/out-of-service status for every car from one system record, replacing the spreadsheet.
        capabilities:
          - CAP-7
      - id: SC-5
        statement: A reservation not picked up within thirty minutes is released and bookable by another employee within the same slot.
        capabilities:
          - CAP-2
      - id: SC-6
        statement: An employee whose reservation is cancelled because a car is taken out of service is notified the same day.
        capabilities:
          - CAP-6
      - id: SC-7
        statement: The fleet coordinator can view each employee's monthly count of late cancellations and no-shows.
        capabilities:
          - CAP-4
      - id: SC-8
        statement: Every reservation longer than the standard limit has a recorded fleet-coordinator approval.
        capabilities:
          - CAP-5
      - id: SC-9
        statement: Cancellations made well before the start carry no count against the employee, while late cancellations do.
        capabilities:
          - CAP-3
    assumptions:
      - The twelve cars and roughly sixty employees are all based at the Rotterdam office, so no multi-site logic is needed.
      - Every employee who may reserve a car is listed in the company directory and signs in through it.
      - The fleet coordinator is a single role at a time; the office manager covering absences uses that same role rather than a distinct one.
      - Mileage and damage notes are entered by the employee at return; there is no vehicle sensor feed.
      - A car's seats, gearbox type, and van flag are attributes the coordinator maintains, not values the system measures.
    openQuestions:
      - id: Q-1
        question: "What distinguishes damage reviewed as minor from damage that makes a car unsafe: coordinator judgment alone, or a checklist?"
      - id: Q-2
        question: What happens to a reservation awaiting the fleet coordinator's approval for a longer trip if it is not approved before the requested start?
      - id: Q-3
        question: Is there a minimum or maximum lead time for how far ahead an employee may reserve a car?
      - id: Q-4
        question: Does a high monthly count of late cancellations or no-shows ever restrict an employee's future bookings, or is it informational for the coordinator only?
      - id: Q-5
        question: When the office manager covers for the fleet coordinator, do they act under their own identity or under the coordinator's?
---
apiVersion: sdd.persimmon.ai/v1
kind: BusinessRules
metadata:
  name: car-pool-rules.r1
spec:
  identity:
    id: car-pool-rules
    revision: 1
  content:
    title: Company Car Pool Business Rules
    owner: Fleet coordinator
    rules:
      - id: BR-1
        type: fact
        statement: A reservation must be for exactly one car.
        rationale: A reservation that named more than one car could not be picked up or returned as one trip.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-2
        type: constraint
        statement: A car must not be offered for a reservation whose passenger count exceeds the car's seats.
        rationale: An employee must not be offered a car that cannot carry their party.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-3
        type: constraint
        statement: A car must not be offered for a trip that needs equipment space unless the car is a van.
        rationale: A trip stating a need for equipment space requires van cargo capacity.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-4
        type: constraint
        statement: A car must not be offered for a reservation asking for an automatic gearbox unless the car has an automatic gearbox.
        rationale: An employee who asks for an automatic gearbox must not be offered a manual car.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-5
        type: constraint
        statement: A car must not be offered for a slot that overlaps another reservation already held for that car.
        rationale: Two reservations for the same car in overlapping slots is the double-booking the pool must stop.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-6
        type: constraint
        statement: A car that is out of service must not be offered for any slot.
        rationale: A car under repair or awaiting the garage cannot be driven.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-7
        type: constraint
        statement: A car whose service is due before the end of a requested slot must not be offered for that slot.
        rationale: A car must not go out on a trip that runs past its due service.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-8
        type: constraint
        statement: A reservation not picked up within thirty minutes of its start must be released.
        rationale: An unclaimed car should return to the pool quickly rather than sit reserved.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-9
        type: constraint
        statement: An employee must not hold more than two future reservations at a time.
        rationale: Limits how much of the shared pool one employee can tie up at once.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-10
        type: constraint
        statement: A reservation longer than three days must be approved by the fleet coordinator before it is created.
        rationale: A long reservation removes a car from the shared pool for an extended time and needs the coordinator's sign-off.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-11
        type: constraint
        statement: A cancellation made at least two hours before the reservation's start must not be counted against the employee.
        rationale: Cancelling with reasonable notice should carry no penalty.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-12
        type: constraint
        statement: A cancellation made less than two hours before the reservation's start, and a no-show, must be counted against the employee.
        rationale: Late cancellations and no-shows tie up a car other employees could have used and must be tracked.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-13
        type: constraint
        statement: The fleet coordinator must be able to see each employee's monthly count of late cancellations and no-shows.
        rationale: "Superseded: this statement describes a capability (CAP-4), not a business rule, so it is withdrawn rather than enforced as a rule."
        source: brief
        status: deprecated
        subdomain: reservations
      - id: BR-14
        type: fact
        statement: Each car's record must include its plate, seats, gearbox, van flag, current mileage, next service due date or mileage, and in-service or out-of-service state.
        rationale: These are the facts the fleet coordinator needs to manage the car safely, replacing the spreadsheet.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-15
        type: derivation
        statement: A car must be considered service-due when its mileage or date crosses its next-service threshold.
        rationale: Service-due status must be derived automatically so it is never missed as it was with the spreadsheet.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-16
        type: constraint
        statement: A car that is service-due must be taken out of service for the days it is booked with the garage.
        rationale: A car due for service must not keep operating until the garage work is done.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-17
        type: fact
        statement: A damage note recorded at return must open a damage report for the fleet coordinator to review.
        rationale: Every damage note needs a reviewable record, not just a note that gets lost.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-18
        type: constraint
        statement: A car whose damage report is reviewed as minor must remain in service.
        rationale: Minor damage does not justify pulling a car from the shared pool.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-19
        type: constraint
        statement: A car whose damage report is reviewed as unsafe must be taken out of service at once.
        rationale: An unsafe car must not be driven until it is repaired.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-20
        type: constraint
        statement: Taking a car out of service must cancel its future reservations and notify the affected employees.
        rationale: An employee must learn their car is unavailable before they arrive to pick it up, not at the cabinet.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-21
        type: constraint
        statement: When the garage returns a car, it must be put back in service with its new mileage and next-service threshold.
        rationale: The fleet record must reflect the car's true state once garage work finishes.
        source: brief
        status: active
        subdomain: fleet-care
---
apiVersion: sdd.persimmon.ai/v1
kind: EventStorming
metadata:
  name: car-pool-prd-storming.r1
spec:
  identity:
    id: car-pool-prd-storming
    revision: 1
  content:
    version: "4.1"
    meta:
      name: Company Car Pool
      level: design
    contexts:
      - id: car-reservations
        name: Car Reservations
        order: 0
        classification: core
        subdomain: reservations
      - id: fleet-care
        name: Fleet Care
        order: 1
        classification: supporting
        subdomain: fleet-care
    contextRelationships:
      - id: cr-01
        source: fleet-care
        target: car-reservations
        type: partnership
    nodes:
      - id: employee
        type: actor
        label: Employee
        properties: {}
      - id: fleet-coordinator
        type: actor
        label: Fleet coordinator
        properties: {}
      - id: car-reservations-e-fitting-cars-offered
        type: domainEvent
        label: Fitting cars offered
        context: car-reservations
        order: 0
        properties:
          description: System offers only cars that fit the trip's seats, equipment and gearbox needs, are free for the slot, in service, and not service-due before the slot ends (BR-2 to BR-7).
      - id: car-reservations-e-long-reservation-approval-requested
        type: domainEvent
        label: Long reservation approval requested
        context: car-reservations
        order: 1
        properties:
          description: A trip longer than three days needs fleet coordinator approval before the reservation is created (BR-10).
      - id: car-reservations-e-long-reservation-approved
        type: domainEvent
        label: Long reservation approved
        context: car-reservations
        order: 2
        properties:
          alternativeSet: long-reservation-approval-outcome
          description: Fleet coordinator approves the reservation exceeding the standard three-day limit (BR-10).
      - id: car-reservations-e-long-reservation-denied
        type: domainEvent
        label: Long reservation denied
        context: car-reservations
        order: 2
        properties:
          alternativeSet: long-reservation-approval-outcome
          description: Fleet coordinator denies the long reservation request (BR-10).
      - id: car-reservations-e-long-reservation-lapsed
        type: domainEvent
        label: Long reservation lapsed
        context: car-reservations
        order: 2
        properties:
          alternativeSet: long-reservation-approval-outcome
          description: A long-reservation approval request not decided by the requested start lapses, and the employee is notified.
      - id: car-reservations-e-reservation-created
        type: domainEvent
        label: Car reservation created
        context: car-reservations
        order: 3
        properties:
          pivotal: true
          alternativeSet: reservation-request-outcome
          description: A car fitting seats, equipment and gearbox is free for the slot, in service, and not service-due before the slot ends (BR-1 to BR-7, BR-9, BR-10).
      - id: car-reservations-e-reservation-declined
        type: domainEvent
        label: Car reservation declined
        context: car-reservations
        order: 3
        properties:
          alternativeSet: reservation-request-outcome
          description: No car fits the requested needs and slot, the employee already holds two open reservations, or approval was withheld (BR-2 to BR-7, BR-9, BR-10).
      - id: car-reservations-e-reservation-cancelled-early
        type: domainEvent
        label: Reservation cancelled well ahead of start
        context: car-reservations
        order: 4
        properties:
          alternativeSet: cancellation-timing
          description: Cancelled at least two hours before start; carries no consequence (BR-11).
      - id: car-reservations-e-reservation-cancelled-late
        type: domainEvent
        label: Reservation cancelled close to start
        context: car-reservations
        order: 4
        properties:
          alternativeSet: cancellation-timing
          description: Cancelled less than two hours before start; counted against the employee like a no-show (BR-12).
      - id: car-reservations-e-late-cancellation-counted
        type: domainEvent
        label: Late cancellation counted
        context: car-reservations
        order: 5
        properties:
          description: A cancellation made less than two hours before start is counted against the employee (BR-12, CAP-4).
      - id: car-reservations-e-car-picked-up
        type: domainEvent
        label: Car picked up
        context: car-reservations
        order: 6
        properties:
          pivotal: true
          alternativeSet: pickup-window-outcome
          description: Employee picks up the reserved car at the start of the slot (CAP-2).
      - id: car-reservations-e-reservation-released-unclaimed
        type: domainEvent
        label: Reservation released unclaimed
        context: car-reservations
        order: 6
        properties:
          alternativeSet: pickup-window-outcome
          description: Not picked up within thirty minutes of start, so it is released and counted against the employee (BR-8, BR-12).
      - id: car-reservations-e-no-show-counted
        type: domainEvent
        label: No-show counted
        context: car-reservations
        order: 7
        properties:
          description: An unclaimed reservation released after thirty minutes is counted against the employee as a no-show (BR-12, CAP-4).
      - id: car-reservations-e-car-returned
        type: domainEvent
        label: Car returned
        context: car-reservations
        order: 8
        properties:
          pivotal: true
          description: Employee returns the car, recording the mileage read off the dashboard (CAP-2).
      - id: fleet-care-e-car-mileage-updated
        type: domainEvent
        label: Car mileage updated
        context: fleet-care
        order: 9
        properties:
          description: Mileage recorded at return updates the car's current mileage in the fleet record (BR-14, CAP-7).
      - id: fleet-care-e-car-record-updated
        type: domainEvent
        label: Car record updated
        context: fleet-care
        order: 10
        properties:
          description: The fleet coordinator's hand-maintained plate, seats, gearbox, van flag and next-service threshold are saved to the car's fleet record, replacing the spreadsheet (CAP-7, SC-4).
      - id: car-reservations-e-damage-noted-on-return
        type: domainEvent
        label: Damage noted on return
        context: car-reservations
        order: 11
        properties:
          description: Employee notes new damage found at return, with location, drivable, and photo fields, opening a damage report in fleet care (CAP-2, BR-17).
      - id: fleet-care-e-car-became-service-due
        type: domainEvent
        label: Car became service-due
        context: fleet-care
        order: 12
        properties:
          temporal: true
          pivotal: true
          description: Car's mileage or date crosses its next-service threshold; evaluated automatically after a mileage update, or raised by the date itself passing (BR-15).
      - id: fleet-care-e-car-taken-out-of-service-for-maintenance
        type: domainEvent
        label: Car taken out of service for scheduled maintenance
        context: fleet-care
        order: 13
        properties:
          pivotal: true
          description: Car booked in with the garage is taken out of service for the garage days (BR-16).
      - id: car-reservations-e-reservations-cancelled-for-service
        type: domainEvent
        label: Future reservations cancelled for out-of-service car
        context: car-reservations
        order: 14
        properties:
          description: Every future reservation held for a car is cancelled once it leaves service, whether for scheduled maintenance or unsafe damage; one cause, one event pair (CAP-6, BR-20).
      - id: car-reservations-e-employees-notified-of-cancellation
        type: domainEvent
        label: Affected employees notified
        context: car-reservations
        order: 14
        properties:
          description: Each employee whose reservation was cancelled is notified so they can rebook another car, whatever the cause of the car leaving service (CAP-6, SC-6).
      - id: fleet-care-e-car-serviced-by-garage
        type: domainEvent
        label: Car serviced by garage
        context: fleet-care
        order: 15
        properties:
          description: Garage completes the scheduled service work.
      - id: fleet-care-e-car-returned-to-service-after-maintenance
        type: domainEvent
        label: Car returned to service after maintenance
        context: fleet-care
        order: 16
        properties:
          pivotal: true
          description: Car put back in service with new mileage and next-service threshold (BR-21).
      - id: fleet-care-e-damage-report-opened
        type: domainEvent
        label: Damage report opened
        context: fleet-care
        order: 17
        properties:
          description: Damage note at return opens a report for the fleet coordinator to review (BR-17).
      - id: fleet-care-e-damage-report-reviewed-minor
        type: domainEvent
        label: Damage report reviewed as minor
        context: fleet-care
        order: 18
        properties:
          alternativeSet: damage-review-outcome
          description: Coordinator judges the damage minor using the damage note's own fields (location, drivable, photos) as the checklist; car remains in service (BR-18).
      - id: fleet-care-e-damage-report-reviewed-unsafe
        type: domainEvent
        label: Damage report reviewed as unsafe
        context: fleet-care
        order: 18
        properties:
          alternativeSet: damage-review-outcome
          description: Coordinator judges the car unsafe to drive using the damage note's own fields (location, drivable, photos) as the checklist (BR-19).
      - id: fleet-care-e-car-taken-out-of-service-for-damage
        type: domainEvent
        label: Car taken out of service for unsafe damage
        context: fleet-care
        order: 19
        properties:
          pivotal: true
          description: Car is pulled from service at once on an unsafe review; this out-of-service event drives the same future-reservations-cancelled and employees-notified pair as scheduled maintenance (BR-19, BR-20).
      - id: fleet-care-e-car-returned-to-service-after-repair
        type: domainEvent
        label: Car returned to service after repair
        context: fleet-care
        order: 20
        properties:
          description: Car put back in service once repaired, with updated mileage and next-service threshold (BR-21).
      - id: car-reservations-c-request-car-reservation
        type: command
        label: Request car reservation
        context: car-reservations
        properties:
          description: Employee states trip purpose, passenger count, van/automatic need and slot (CAP-1).
      - id: car-reservations-c-create-reservation
        type: command
        label: Create reservation
        context: car-reservations
        properties:
          alternativeSet: reservation-duration-decision
          description: Finalizes the reservation when the slot is within the standard length limit, subject to BR-1 to BR-9.
      - id: car-reservations-c-request-long-reservation-approval
        type: command
        label: Request long reservation approval
        context: car-reservations
        properties:
          alternativeSet: reservation-duration-decision
          description: Raised instead of immediate creation when the requested slot exceeds the standard limit (BR-10).
      - id: car-reservations-c-approve-long-reservation
        type: command
        label: Approve long reservation
        context: car-reservations
        properties:
          description: Fleet coordinator approves a trip longer than three days (BR-10).
      - id: car-reservations-c-deny-long-reservation
        type: command
        label: Deny long reservation
        context: car-reservations
        properties:
          description: Fleet coordinator denies a trip longer than three days (BR-10).
      - id: car-reservations-c-lapse-long-reservation-approval
        type: command
        label: Lapse long reservation approval
        context: car-reservations
        properties:
          description: System lapses an undecided approval request once its requested start passes.
      - id: car-reservations-c-decline-reservation
        type: command
        label: Decline reservation
        context: car-reservations
        properties:
          description: Declines the reservation after a denial or a lapsed approval.
      - id: car-reservations-c-cancel-reservation
        type: command
        label: Cancel reservation
        context: car-reservations
        properties:
          description: Employee cancels a reservation they no longer need, or the system cancels it on the Reservation aggregate when its car leaves service (BR-11, BR-12, BR-20).
      - id: car-reservations-c-count-late-cancellation
        type: command
        label: Count late cancellation
        context: car-reservations
        properties:
          description: Records a late cancellation against the employee (BR-12).
      - id: car-reservations-c-pick-up-car
        type: command
        label: Pick up car
        context: car-reservations
        properties:
          description: Employee picks up the reserved car at slot start.
      - id: car-reservations-c-release-unclaimed-reservation
        type: command
        label: Release unclaimed reservation
        context: car-reservations
        properties:
          description: Releases a reservation not picked up within the pickup window (BR-8).
      - id: car-reservations-c-count-no-show
        type: command
        label: Count no-show
        context: car-reservations
        properties:
          description: Records a no-show against the employee (BR-12).
      - id: car-reservations-c-return-car
        type: command
        label: Return car
        context: car-reservations
        properties:
          description: Employee returns the car, recording mileage and any new damage (CAP-2).
      - id: car-reservations-c-notify-affected-employees
        type: command
        label: Notify affected employees
        context: car-reservations
        properties:
          description: Notifies each employee whose reservation was cancelled (BR-20, SC-6).
      - id: fleet-care-c-update-car-mileage
        type: command
        label: Update car mileage
        context: fleet-care
        properties:
          description: Applies the mileage recorded at return to the car's fleet record (BR-14).
      - id: fleet-care-c-update-car-record
        type: command
        label: Update car record
        context: fleet-care
        properties:
          description: Fleet coordinator maintains plate, seats, gearbox, van flag and next-service threshold by hand, replacing the spreadsheet (CAP-7).
      - id: fleet-care-c-mark-car-service-due
        type: command
        label: Mark car service-due
        context: fleet-care
        properties:
          description: Automatically marks the car service-due once an updated mileage is evaluated against its next-service threshold (BR-15).
      - id: fleet-care-c-open-damage-report
        type: command
        label: Open damage report
        context: fleet-care
        properties:
          description: Opens a reviewable damage report from a return's damage note (BR-17).
      - id: fleet-care-c-review-damage-report
        type: command
        label: Review damage report
        context: fleet-care
        properties:
          description: Fleet coordinator judges the damage minor or unsafe using the damage note's own fields as the checklist (BR-18, BR-19).
      - id: fleet-care-c-take-car-out-of-service-for-damage
        type: command
        label: Take car out of service for damage
        context: fleet-care
        properties:
          description: Pulls a car from service at once following an unsafe review (BR-19).
      - id: fleet-care-c-schedule-car-service
        type: command
        label: Schedule car service
        context: fleet-care
        properties:
          description: Fleet coordinator books the car with the garage and takes it out of service for the garage days (BR-16).
      - id: fleet-care-c-complete-scheduled-service
        type: command
        label: Complete scheduled service
        context: fleet-care
        properties:
          description: Garage reports the scheduled service work finished.
      - id: fleet-care-c-return-car-to-service-after-maintenance
        type: command
        label: Return car to service after maintenance
        context: fleet-care
        properties:
          description: Fleet coordinator puts the car back in service with new mileage and next-service threshold (BR-21).
      - id: fleet-care-c-return-car-to-service-after-repair
        type: command
        label: Return car to service after repair
        context: fleet-care
        properties:
          description: Fleet coordinator puts a repaired car back in service with new mileage and next-service threshold (BR-21).
      - id: car-reservations-p-reservation-duration
        type: policy
        label: Reservation duration policy
        context: car-reservations
        properties:
          execution: automatic
          condition: requested reservation length exceeds the standard limit
          parameters:
            - name: standardReservationLimitDays
              value: "3"
          description: Routes to approval instead of immediate creation (BR-10).
      - id: car-reservations-p-approved-long-reservation
        type: policy
        label: Approved long reservation policy
        context: car-reservations
        properties:
          execution: automatic
          condition: long reservation approved by fleet coordinator
          description: Creates the reservation once approved (BR-10).
      - id: car-reservations-p-denied-or-lapsed-reservation
        type: policy
        label: Denied or lapsed reservation policy
        context: car-reservations
        properties:
          execution: automatic
          condition: long reservation denied or its approval request lapsed
          description: Declines the reservation after denial or lapse (BR-10).
      - id: car-reservations-p-long-reservation-approval-timeout
        type: policy
        label: Long reservation approval timeout policy
        context: car-reservations
        properties:
          execution: automatic
          condition: approval request not decided by the reservation's requested start
          description: Lapses an undecided approval request.
      - id: car-reservations-p-late-cancellation-counting
        type: policy
        label: Late cancellation counting policy
        context: car-reservations
        properties:
          execution: automatic
          condition: cancellation made less than two hours before the reservation's start
          parameters:
            - name: lateCancellationWindowHours
              value: "2"
          description: BR-12.
      - id: car-reservations-p-unclaimed-reservation
        type: policy
        label: Unclaimed reservation policy
        context: car-reservations
        properties:
          execution: automatic
          condition: reservation not picked up within the pickup window after slot start
          parameters:
            - name: pickupWindowMinutes
              value: "30"
          description: BR-8.
      - id: car-reservations-p-no-show-counting
        type: policy
        label: No-show counting policy
        context: car-reservations
        properties:
          execution: automatic
          condition: reservation released as unclaimed
          description: BR-12.
      - id: car-reservations-p-cancel-reservations-on-out-of-service
        type: policy
        label: Cancel reservations on out-of-service policy
        context: car-reservations
        properties:
          execution: automatic
          condition: car taken out of service, for maintenance or unsafe damage
          description: Invokes Cancel reservation on each future reservation of the car (BR-20).
      - id: car-reservations-p-notify-affected-employees
        type: policy
        label: Notify affected employees policy
        context: car-reservations
        properties:
          execution: automatic
          condition: future reservations cancelled for a car leaving service
          description: BR-20, SC-6.
      - id: fleet-care-p-fleet-record-update
        type: policy
        label: Fleet record update policy
        context: fleet-care
        properties:
          execution: automatic
          condition: car returned with a mileage reading
          description: BR-14.
      - id: fleet-care-p-service-due-evaluation
        type: policy
        label: Service-due evaluation policy
        context: fleet-care
        properties:
          execution: automatic
          condition: mileage or date crosses the car's next-service threshold
          description: "BR-15: evaluated automatically after each mileage update."
      - id: fleet-care-p-open-damage-report
        type: policy
        label: Open damage report policy
        context: fleet-care
        properties:
          execution: automatic
          condition: damage noted at return
          description: BR-17.
      - id: fleet-care-p-unsafe-damage
        type: policy
        label: Unsafe damage policy
        context: fleet-care
        properties:
          execution: automatic
          condition: damage report reviewed as unsafe
          description: BR-19.
      - id: car-reservations-rm-available-cars-view
        type: readModel
        label: Available cars view
        context: car-reservations
        properties:
          description: Shows the employee the cars that fit their trip's needs and slot (G-2).
      - id: car-reservations-rm-my-reservations-view
        type: readModel
        label: My reservations view
        context: car-reservations
        properties:
          description: Shows the employee their own reservations and their own reliability count (CAP-4).
      - id: car-reservations-rm-employee-reliability-view
        type: readModel
        label: Employee reliability view
        context: car-reservations
        properties:
          description: Shows the fleet coordinator each employee's monthly count of late cancellations and no-shows, informational only (CAP-4, SC-7).
      - id: car-reservations-rm-pending-approvals-view
        type: readModel
        label: Pending approvals view
        context: car-reservations
        properties:
          description: Shows the fleet coordinator reservation requests awaiting a long-reservation decision (CAP-5).
      - id: fleet-care-rm-fleet-record-view
        type: readModel
        label: Fleet record view
        context: fleet-care
        properties:
          description: Shows the fleet coordinator plate, mileage, service due, and in/out-of-service status for every car, replacing the spreadsheet (CAP-7, SC-4).
      - id: fleet-care-rm-service-due-view
        type: readModel
        label: Service-due view
        context: fleet-care
        properties:
          description: Alerts the fleet coordinator to cars that crossed their service threshold (CAP-8).
      - id: fleet-care-rm-garage-status-view
        type: readModel
        label: Garage status view
        context: fleet-care
        properties:
          description: Shows the fleet coordinator which cars the garage has finished servicing (CAP-8).
      - id: fleet-care-rm-damage-reports-view
        type: readModel
        label: Damage reports view
        context: fleet-care
        properties:
          description: Shows the fleet coordinator damage reports awaiting review (CAP-9).
      - id: fleet-care-ex-garage
        type: externalSystem
        label: Garage
        context: fleet-care
        properties:
          description: External workshop that performs scheduled service and repairs.
      - id: car-reservations-ag-reservation
        type: aggregate
        label: Reservation
        context: car-reservations
        properties:
          description: "Owns a reservation's full lifecycle in one consistency boundary: the long-reservation approval workflow, creation and refusal, cancellation (employee-initiated or forced by a car leaving service), and the pickup-to-return cycle including the unclaimed-pickup release (BR-1 to BR-12, BR-20)."
      - id: car-reservations-ag-employee-reliability
        type: aggregate
        label: Employee Reliability
        context: car-reservations
        properties:
          description: Owns the running count of an employee's late cancellations and no-shows (BR-12, CAP-4).
      - id: fleet-care-ag-car
        type: aggregate
        label: Car
        context: fleet-care
        properties:
          description: Owns a car's plate, seats, gearbox, van flag, mileage, service-due derivation, and its out-of-service/back-in-service transitions for both scheduled maintenance and unsafe-damage repair (BR-14, BR-15, BR-16, BR-19, BR-21).
      - id: fleet-care-ag-damage-report
        type: aggregate
        label: Damage Report
        context: fleet-care
        properties:
          description: Owns a damage report from opening through the coordinator's minor/unsafe review (BR-17, BR-18, BR-19).
      - id: car-reservations-cons-one-car-per-reservation
        type: constraint
        label: One car per reservation
        context: car-reservations
        properties:
          rule: a reservation names exactly one car
          description: "BR-1: a reservation naming more than one car could not be picked up or returned as one trip."
      - id: car-reservations-cons-car-seats-fit
        type: constraint
        label: Car seats fit party
        context: car-reservations
        properties:
          rule: passenger count <= car seats
          description: BR-2.
      - id: car-reservations-cons-van-for-equipment
        type: constraint
        label: Van required for equipment
        context: car-reservations
        properties:
          rule: trip needing equipment space is assigned a van
          description: BR-3.
      - id: car-reservations-cons-gearbox-match
        type: constraint
        label: Gearbox matches request
        context: car-reservations
        properties:
          rule: trip requesting automatic gearbox is assigned a car with automatic gearbox
          description: BR-4.
      - id: car-reservations-cons-no-overlapping-booking
        type: constraint
        label: No overlapping booking
        context: car-reservations
        properties:
          rule: requested slot does not overlap another reservation already held for that car
          description: BR-5.
      - id: car-reservations-cons-car-in-service
        type: constraint
        label: Car in service
        context: car-reservations
        properties:
          rule: car is in service
          description: BR-6.
      - id: car-reservations-cons-not-service-due-before-slot-end
        type: constraint
        label: Not service-due before slot end
        context: car-reservations
        properties:
          rule: car's next service is not due before the requested slot ends
          description: BR-7.
      - id: car-reservations-cons-max-two-future-reservations
        type: constraint
        label: Max two future reservations
        context: car-reservations
        properties:
          rule: employee holds at most two future reservations
          description: BR-9.
      - id: car-reservations-cons-long-reservation-approved
        type: constraint
        label: Long reservation needs approval
        context: car-reservations
        properties:
          rule: a reservation longer than three days has the fleet coordinator's approval
          description: BR-10.
      - id: car-reservations-h-reservation-aggregate-size
        type: hotspot
        label: Reservation aggregate spans many commands and events
        context: car-reservations
        properties:
          kind: risk
          priority: low
          state: resolved
          description: The merged Reservation aggregate handles 11 commands and emits 14 events, over the usual five-ish split threshold.
          resolution: Reviewer confirmed Reservation Request, Reservation, Reservation Fulfillment and Car Reservation Sweep are one lifecycle and must stay one aggregate despite the size heuristic.
      - id: fleet-care-h-car-aggregate-size
        type: hotspot
        label: Car aggregate spans many commands and events
        context: fleet-care
        properties:
          kind: risk
          priority: low
          state: resolved
          description: The merged Car aggregate handles 7 commands and emits 7 events, over the usual five-ish split threshold.
          resolution: Reviewer confirmed a car's service state, including its out-of-service/back-in-service cycle, is the Car aggregate's own and must stay merged despite the size heuristic.
