              - The damage location 'rear bumper', drivable flag true, and photo are recorded
              - A Damage noted on return event is recorded for the fleet coordinator to review
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When an employee picks up their reserved car within the pickup window, the system shall record the car as picked up.
        rules: []
      - id: FR-2
        pattern: unwanted-behaviour
        statement: If a reservation breaks BR-8, then the system shall release it so that another employee can reserve the car.
        rules:
          - BR-8
      - id: FR-3
        pattern: unwanted-behaviour
        statement: If an employee attempts to pick up a car whose reservation already breaks BR-8, then the system shall refuse the pickup.
        rules:
          - BR-8
      - id: FR-4
        pattern: event-driven
        statement: When an employee returns a car, the system shall record the mileage reading entered at return.
        rules: []
      - id: FR-5
        pattern: event-driven
        statement: When an employee notes damage while returning a car, the system shall record the damage's location, drivable flag, and photo.
        rules: []
    qualities:
      - scenario: QS-4
    openQuestions:
