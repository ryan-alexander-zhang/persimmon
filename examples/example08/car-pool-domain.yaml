apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: car-pool-prd-cap-6.r1
spec:
  identity:
    id: car-pool-prd-cap-6
    revision: 1
  content:
    title: Service-due tracking and garage scheduling
    prd: car-pool-prd
    capability: CAP-6
    architecture: car-pool-prd-architecture
    domainModel: fleet-care-model
    businessRules: car-pool-rules
    stories:
      - id: US-1
        role: Fleet coordinator
        goal: see a car flagged service-due as soon as its mileage or date crosses its service threshold
        benefit: so that the car can be booked with the garage before it is driven further, in service of G-2's guarantee that no employee is handed a service-overdue car
        requirements:
          - FR-1
        commands:
          - Mark car service due
        events:
          - Car mileage updated
          - Service date reached
          - Car became service due
        readModels:
          - Service-due cars view
        acceptance:
          - id: AC-1
            title: Car becomes service-due by mileage
            given:
              - A car record with mileage 29,950 km, next service due mileage of 30,000 km, and state in service
            when:
              - The car's mileage is updated to 30,000 km
            then:
              - The car is marked service-due
              - The car appears in the Service-due cars view
          - id: AC-2
            title: Car becomes service-due by date
            given:
              - A car record with next service due date of 2026-10-16, mileage well under its service due mileage, and state in service
            when:
              - The current date reaches 2026-10-16, the car's next service due date
            then:
              - The car is marked service-due
              - The car appears in the Service-due cars view
      - id: US-2
        role: Fleet coordinator
        goal: book a service-due car with the garage and have it taken out of service for the garage days
        benefit: so that the car is not driven while awaiting or undergoing service, in service of G-2
        requirements:
          - FR-2
          - FR-3
        commands:
          - Book car with garage
          - Take car out of service
        events:
          - Car booked with garage
          - Car taken out of service
        readModels:
          - Service-due cars view
          - Cars at garage view
        acceptance:
          - id: AC-3
            title: Fleet coordinator books a service-due car with the garage
            given:
              - A car record with plate 'RT-123-A', marked service-due, state in service
            when:
              - The fleet coordinator books the car with the garage
            then:
              - The car is recorded as booked with the garage
              - The car is taken out of service for its garage days
              - The car appears in the Cars at garage view
          - id: AC-4
            title: Refusal to book a car that is not service-due
            given:
              - A car record with plate 'RT-456-B', state in service, not marked service-due
            when:
              - The fleet coordinator attempts to book the car with the garage
            then:
              - "The booking is refused: BR-14, the car is not service-due"
      - id: US-3
        role: Fleet coordinator
        goal: put a serviced car back into service with its refreshed mileage and next service threshold
        benefit: so that the fleet record stays current and trustworthy for future service-due checks, in service of G-4
        requirements:
          - FR-4
          - FR-5
        commands:
          - Put car back into service
        events:
          - Car serviced
          - Car put back into service
        readModels:
          - Cars at garage view
        acceptance:
          - id: AC-5
            title: Fleet coordinator puts a serviced car back into service
            given:
              - A car record with plate 'RT-123-A', state out of service, booked with the garage, mileage 30,000 km, next service due mileage 30,000 km
              - The garage has serviced the car and returned it with mileage 30,150 km
            when:
              - The fleet coordinator puts the car back into service with mileage 30,150 km and a next service due mileage of 40,000 km
            then:
              - The car's mileage is recorded as 30,150 km
              - The car's next service due mileage is recorded as 40,000 km
              - The car's state becomes in service
          - id: AC-6
            title: Refusal to put back into service a car that is not out of service
            given:
              - A car record with plate 'RT-789-C', state in service, not marked service-due
            when:
              - The fleet coordinator attempts to put the car back into service
            then:
              - "The request is refused: BR-18, the car is not currently out of service"
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When a car's current mileage reaches its next service due mileage or the current date reaches its next service due date, the system shall mark the car as service-due (BR-13).
        rules:
          - BR-13
      - id: FR-2
        pattern: event-driven
        statement: When the fleet coordinator books a service-due car with the garage, the system shall take the car out of service for its garage days (BR-14).
        rules:
          - BR-14
      - id: FR-3
        pattern: unwanted-behaviour
        statement: If a car that is not service-due is requested to be booked with the garage, then the system shall refuse the booking, citing BR-14.
        rules:
          - BR-14
      - id: FR-4
        pattern: event-driven
        statement: When the garage returns a serviced car, the system shall put the car back into service with its new mileage and next service threshold (BR-18).
        rules:
          - BR-18
      - id: FR-5
        pattern: unwanted-behaviour
        statement: If a car that is not currently out of service is requested to be put back into service, then the system shall refuse the request, citing BR-18.
        rules:
          - BR-18
    qualities:
      - scenario: QS-2
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: car-pool-prd-cap-7.r1
spec:
  identity:
    id: car-pool-prd-cap-7
    revision: 1
  content:
    title: Damage reporting and review
    prd: car-pool-prd
    capability: CAP-7
    architecture: car-pool-prd-architecture
    businessRules: car-pool-rules
    domainModel: fleet-care-model
    stories:
      - id: US-1
        role: Fleet coordinator
        goal: review a damage report opened from a return note and classify it as minor or unsafe
        benefit: so that the fleet coordinator keeps a trustworthy, current record of each car's condition and an unsafe car is withdrawn immediately (G-4)
        requirements:
          - FR-1
          - FR-2
          - FR-3
        commands:
          - Classify damage as minor
          - Classify damage as unsafe
        events:
          - Damage report opened
          - Damage classified as minor
          - Damage classified as unsafe
          - Car taken out of service
        readModels:
          - Pending damage reports view
        acceptance:
          - id: AC-1
            title: Damage note on return opens a pending damage report
            given:
              - A car is returned with a damage note of 'dented rear door'
            when:
              - The damage note is recorded on the car's return
            then:
              - A damage report is opened for the car
              - The report appears in the fleet coordinator's pending damage reports view
          - id: AC-2
            title: Minor damage is recorded and the car stays in service
            given:
              - A car returned with a damage note of 'small scratch on rear bumper'
              - A damage report was opened from that note and is pending review
              - The car is currently in service
            when:
              - The fleet coordinator classifies the damage report as minor
            then:
              - The damage report is recorded as minor
              - The car's state remains in service
          - id: AC-3
            title: Unsafe damage takes the car out of service at once
            given:
              - A car returned with a damage note of 'cracked windshield obstructing the driver's view'
              - A damage report was opened from that note and is pending review
              - The car is currently in service
            when:
              - The fleet coordinator classifies the damage report as unsafe
            then:
              - The damage report is recorded as unsafe
              - The car's state is set to out of service at once, citing BR-16
      - id: US-2
        role: Employee
        goal: be told when a car they have reserved is taken out of service
        benefit: so that they are never left holding a reservation for a car that is no longer available and can reserve another car for the trip (G-2)
        requirements:
          - FR-4
        commands: []
        events:
          - Car taken out of service
        readModels: []
        acceptance:
          - id: AC-4
            title: Future reservations are cancelled and employees notified when a car is pulled from service
            given:
              - A car with two future reservations, held by two different employees, is classified as unsafe
            when:
              - The car is taken out of service
            then:
              - Both future reservations on the car are cancelled
              - Both affected employees are notified that their reservation was cancelled
      - id: US-3
        role: Employee
        goal: see damage noted by the previous driver before taking a car
        benefit: so that they know the car's condition before relying on it for a trip (G-3)
        requirements:
          - FR-5
        commands: []
        events:
          - Damage classified as minor
        readModels:
          - Car condition view
        acceptance:
          - id: AC-5
            title: Driver sees previously noted damage before taking the car
            given:
              - Car ABC-123 has a damage report with the note 'scuff on front bumper' reviewed as minor
              - An employee has a confirmed reservation for Car ABC-123 starting now
            when:
              - The employee views the car's condition before pickup
            then:
              - The car condition view shows the note 'scuff on front bumper' and its minor severity to the employee
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When a damage note is recorded on a car's return, the system shall open a damage report for that car.
        rules: []
      - id: FR-2
        pattern: event-driven
        statement: When the fleet coordinator classifies a damage report, the system shall record it as minor or unsafe, enforcing BR-15.
        rules:
          - BR-15
      - id: FR-3
        pattern: event-driven
        statement: When a damage report is classified as unsafe, the system shall take the car out of service at once, enforcing BR-16.
        rules:
          - BR-16
      - id: FR-4
        pattern: event-driven
        statement: When a car is taken out of service, the system shall cancel the car's future reservations and notify the affected employees, enforcing BR-17.
        rules:
          - BR-17
      - id: FR-5
        pattern: state-driven
        statement: While a car has a recorded damage note, the system shall display that note to the employee taking the car.
        rules: []
    qualities:
      - scenario: QS-3
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: car-pool-prd-architecture-bb-1-async-api.r1
spec:
  identity:
    id: car-pool-prd-architecture-bb-1-async-api
    revision: 1
  content:
    title: Reservation events (Reservations module)
    type: async-api
    architecture: car-pool-prd-architecture
    block: BB-1
    domainModel: reservations-model
    businessRules: car-pool-rules
    interface: Reservation events
    document:
      mediaType: application/asyncapi+yaml
      content: |
        asyncapi: 3.0.0
        info:
          title: Reservation events
          version: "1.0.0"
          description: >
            Domain events published by the Reservations module (BB-1) as trip requests,
            reservations, pickups, returns, cancellations and out-of-service impacts
            occur. Fleet care consumes Car returned to update mileage (BR-12) and open
            damage reports; other consumers may read the full stream.
        channels:
          car.reserved:
            address: car.reserved
            messages:
              CarReserved:
                $ref: '#/components/messages/CarReserved'
          longTripApproval.requested:
            address: longTripApproval.requested
            messages:
              LongTripApprovalRequested:
                $ref: '#/components/messages/LongTripApprovalRequested'
          longTrip.approved:
            address: longTrip.approved
            messages:
              LongTripApproved:
                $ref: '#/components/messages/LongTripApproved'
          longTripApproval.denied:
            address: longTripApproval.denied
            messages:
              LongTripApprovalDenied:
                $ref: '#/components/messages/LongTripApprovalDenied'
          longTripApproval.lapsed:
            address: longTripApproval.lapsed
            messages:
              LongTripApprovalLapsed:
                $ref: '#/components/messages/LongTripApprovalLapsed'
          reservation.cancelled:
            address: reservation.cancelled
            messages:
              ReservationCancelled:
                $ref: '#/components/messages/ReservationCancelled'
          car.pickedUp:
            address: car.pickedUp
            messages:
              CarPickedUp:
                $ref: '#/components/messages/CarPickedUp'
          reservation.released:
            address: reservation.released
            messages:
              ReservationReleased:
                $ref: '#/components/messages/ReservationReleased'
          car.returned:
            address: car.returned
            messages:
              CarReturned:
                $ref: '#/components/messages/CarReturned'
          futureReservations.cancelled:
            address: futureReservations.cancelled
            messages:
              FutureReservationsCancelled:
                $ref: '#/components/messages/FutureReservationsCancelled'
          affectedEmployees.notified:
            address: affectedEmployees.notified
            messages:
              AffectedEmployeesNotified:
                $ref: '#/components/messages/AffectedEmployeesNotified'
        operations:
          publishCarReserved:
            action: send
            channel:
              $ref: '#/channels/car.reserved'
            messages:
              - $ref: '#/channels/car.reserved/messages/CarReserved'
          publishLongTripApprovalRequested:
            action: send
            channel:
              $ref: '#/channels/longTripApproval.requested'
            messages:
              - $ref: '#/channels/longTripApproval.requested/messages/LongTripApprovalRequested'
          publishLongTripApproved:
            action: send
            channel:
              $ref: '#/channels/longTrip.approved'
            messages:
              - $ref: '#/channels/longTrip.approved/messages/LongTripApproved'
          publishLongTripApprovalDenied:
            action: send
            channel:
              $ref: '#/channels/longTripApproval.denied'
            messages:
              - $ref: '#/channels/longTripApproval.denied/messages/LongTripApprovalDenied'
          publishLongTripApprovalLapsed:
            action: send
            channel:
              $ref: '#/channels/longTripApproval.lapsed'
            messages:
              - $ref: '#/channels/longTripApproval.lapsed/messages/LongTripApprovalLapsed'
          publishReservationCancelled:
            action: send
            channel:
              $ref: '#/channels/reservation.cancelled'
            messages:
              - $ref: '#/channels/reservation.cancelled/messages/ReservationCancelled'
          publishCarPickedUp:
            action: send
            channel:
              $ref: '#/channels/car.pickedUp'
            messages:
              - $ref: '#/channels/car.pickedUp/messages/CarPickedUp'
          publishReservationReleased:
            action: send
            channel:
              $ref: '#/channels/reservation.released'
            messages:
              - $ref: '#/channels/reservation.released/messages/ReservationReleased'
          publishCarReturned:
            action: send
            channel:
              $ref: '#/channels/car.returned'
            messages:
              - $ref: '#/channels/car.returned/messages/CarReturned'
          publishFutureReservationsCancelled:
            action: send
            channel:
              $ref: '#/channels/futureReservations.cancelled'
            messages:
              - $ref: '#/channels/futureReservations.cancelled/messages/FutureReservationsCancelled'
          publishAffectedEmployeesNotified:
            action: send
            channel:
              $ref: '#/channels/affectedEmployees.notified'
            messages:
              - $ref: '#/channels/affectedEmployees.notified/messages/AffectedEmployeesNotified'
        components:
          messages:
            CarReserved:
              name: CarReserved
              title: Car reserved
              payload:
                $ref: '#/components/schemas/CarReserved'
            LongTripApprovalRequested:
              name: LongTripApprovalRequested
              title: Long-trip approval requested
              payload:
                $ref: '#/components/schemas/LongTripApprovalRequested'
            LongTripApproved:
              name: LongTripApproved
              title: Long-trip approved
              payload:
                $ref: '#/components/schemas/LongTripApproved'
            LongTripApprovalDenied:
              name: LongTripApprovalDenied
              title: Long-trip approval denied
              payload:
                $ref: '#/components/schemas/LongTripApprovalDenied'
            LongTripApprovalLapsed:
              name: LongTripApprovalLapsed
              title: Long-trip approval lapsed
              payload:
                $ref: '#/components/schemas/LongTripApprovalLapsed'
            ReservationCancelled:
              name: ReservationCancelled
              title: Reservation cancelled
              payload:
                $ref: '#/components/schemas/ReservationCancelled'
            CarPickedUp:
              name: CarPickedUp
              title: Car picked up
              payload:
                $ref: '#/components/schemas/CarPickedUp'
            ReservationReleased:
              name: ReservationReleased
              title: Reservation released
              payload:
                $ref: '#/components/schemas/ReservationReleased'
            CarReturned:
              name: CarReturned
              title: Car returned
              payload:
                $ref: '#/components/schemas/CarReturned'
            FutureReservationsCancelled:
              name: FutureReservationsCancelled
              title: Future reservations cancelled
              payload:
                $ref: '#/components/schemas/FutureReservationsCancelled'
            AffectedEmployeesNotified:
              name: AffectedEmployeesNotified
              title: Affected employees notified
              payload:
                $ref: '#/components/schemas/AffectedEmployeesNotified'
          schemas:
            CarReserved:
              type: object
              properties:
                reservationId:
                  type: string
                carId:
                  type: string
                employeeId:
                  type: string
                slotStart:
                  type: string
                  format: date-time
                slotEnd:
                  type: string
                  format: date-time
              required: [reservationId, carId, employeeId, slotStart, slotEnd]
            LongTripApprovalRequested:
              type: object
              properties:
                reservationId:
                  type: string
                carId:
                  type: string
                employeeId:
                  type: string
                requestedAt:
                  type: string
                  format: date-time
              required: [reservationId, carId, employeeId, requestedAt]
            LongTripApproved:
              type: object
              properties:
                reservationId:
                  type: string
                decidedAt:
                  type: string
                  format: date-time
                decision:
                  type: string
                  const: approved
              required: [reservationId, decidedAt, decision]
            LongTripApprovalDenied:
              type: object
              properties:
                reservationId:
                  type: string
                decidedAt:
                  type: string
                  format: date-time
                decision:
                  type: string
                  const: denied
              required: [reservationId, decidedAt, decision]
            LongTripApprovalLapsed:
              type: object
              properties:
                reservationId:
                  type: string
                decision:
                  type: string
                  const: lapsed
              required: [reservationId, decision]
            ReservationCancelled:
              type: object
              properties:
                reservationId:
                  type: string
                carId:
                  type: string
                employeeId:
                  type: string
                lateCancellation:
                  type: boolean
              required: [reservationId, carId, employeeId, lateCancellation]
            CarPickedUp:
              type: object
              properties:
                reservationId:
                  type: string
                carId:
                  type: string
                pickupTime:
                  type: string
                  format: date-time
              required: [reservationId, carId, pickupTime]
            ReservationReleased:
              type: object
              properties:
                reservationId:
                  type: string
                carId:
                  type: string
                employeeId:
                  type: string
              required: [reservationId, carId, employeeId]
            CarReturned:
              type: object
              properties:
                reservationId:
                  type: string
                carId:
                  type: string
                returnMileage:
                  type: integer
                  description: return mileage in km
                damageNote:
                  type: string
                  nullable: true
              required: [reservationId, carId, returnMileage]
            FutureReservationsCancelled:
              type: object
              properties:
                carId:
                  type: string
                cancelledReservationIds:
                  type: array
                  items:
                    type: string
              required: [carId, cancelledReservationIds]
            AffectedEmployeesNotified:
              type: object
              properties:
                carId:
                  type: string
                employeeIds:
                  type: array
                  items:
                    type: string
              required: [carId, employeeIds]
    elements:
      - id: EL-1
        name: car.reserved
        realises:
          kind: event
          name: Car reserved
        rules: []
      - id: EL-2
        name: longTripApproval.requested
        realises:
          kind: event
          name: Long-trip approval requested
        rules: []
      - id: EL-3
        name: longTrip.approved
        realises:
          kind: event
          name: Long-trip approved
        rules: []
      - id: EL-4
        name: longTripApproval.denied
        realises:
          kind: event
          name: Long-trip approval denied
        rules: []
      - id: EL-5
        name: longTripApproval.lapsed
        realises:
          kind: event
          name: Long-trip approval lapsed
        rules: []
      - id: EL-6
        name: reservation.cancelled
        realises:
          kind: event
          name: Reservation cancelled
        rules:
          - BR-9
      - id: EL-7
        name: car.pickedUp
        realises:
          kind: event
          name: Car picked up
        rules: []
      - id: EL-8
        name: reservation.released
        realises:
          kind: event
          name: Reservation released
        rules:
          - BR-4
      - id: EL-9
        name: car.returned
        realises:
          kind: event
          name: Car returned
        rules: []
      - id: EL-10
        name: futureReservations.cancelled
        realises:
          kind: event
          name: Future reservations cancelled
        rules:
          - BR-17
      - id: EL-11
        name: affectedEmployees.notified
        realises:
          kind: event
          name: Affected employees notified
        rules:
          - BR-17
      - id: EL-12
        name: CarReserved
        realises:
          kind: event
          name: Car reserved
        rules: []
      - id: EL-13
        name: LongTripApprovalRequested
        realises:
          kind: event
          name: Long-trip approval requested
        rules: []
      - id: EL-14
        name: LongTripApproved
        realises:
          kind: event
          name: Long-trip approved
        rules: []
      - id: EL-15
        name: LongTripApprovalDenied
        realises:
          kind: event
          name: Long-trip approval denied
        rules: []
      - id: EL-16
        name: LongTripApprovalLapsed
        realises:
          kind: event
          name: Long-trip approval lapsed
        rules: []
      - id: EL-17
        name: ReservationCancelled
        realises:
          kind: event
          name: Reservation cancelled
        rules:
          - BR-9
      - id: EL-18
        name: CarPickedUp
        realises:
          kind: event
          name: Car picked up
        rules: []
      - id: EL-19
        name: ReservationReleased
        realises:
          kind: event
          name: Reservation released
        rules:
          - BR-4
      - id: EL-20
        name: CarReturned
        realises:
          kind: event
          name: Car returned
        rules: []
      - id: EL-21
        name: FutureReservationsCancelled
        realises:
          kind: event
          name: Future reservations cancelled
        rules:
          - BR-17
      - id: EL-22
        name: AffectedEmployeesNotified
        realises:
          kind: event
          name: Affected employees notified
        rules:
          - BR-17
    rules:
      - BR-4
      - BR-9
      - BR-17
    decisions: []
    openQuestions:
      - id: Q-1
        question: The Architecture names no concrete message broker or protocol for Reservations' domain events (BB-1 is in-process today; RK-3 anticipates a future message bus). This document specifies channels and payloads in protocol-agnostic AsyncAPI form without binding to a specific transport (e.g. Kafka, AMQP) pending that choice.
