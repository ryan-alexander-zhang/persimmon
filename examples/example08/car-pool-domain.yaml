apiVersion: sdd.persimmon.ai/v1
kind: DomainModel
metadata:
  name: reservations-model.r1
spec:
  identity:
    id: reservations-model
    revision: 1
  content:
    context: reservations
    source: car-pool-prd-storming
    aggregates:
      - id: AG-1
        name: Trip request
        root: Trip request
        entities:
          - name: Trip request
            attributes:
              - Trip request has slot start
              - Trip request has slot end
              - Trip request has requested seats
              - Trip request has van required
              - Trip request has automatic gearbox required
              - Trip request has passenger count
              - Trip request has purpose
          - name: Long-trip approval
            attributes:
              - Long-trip approval has requested at
              - Long-trip approval has decided at
              - Long-trip approval has decision
        valueObjects: []
        commands:
          - Reserve car
          - Approve long trip
          - Deny long trip
          - Lapse long-trip approval
        events:
          - Car reserved
          - Long-trip approval requested
          - Long-trip approved
          - Long-trip approval denied
          - Long-trip approval lapsed
        invariants:
          - statement: the car's seats, van flag and gearbox must match the trip's requested seats, equipment and gearbox
            rules:
              - BR-1
          - statement: the car must not already be reserved for a slot overlapping the requested slot
            rules:
              - BR-3
          - statement: the employee must hold fewer than two future reservations at the time of reserving, counting confirmed reservations and long-trip requests still awaiting a decision; a denied or lapsed request does not count
            rules:
              - BR-5
          - statement: the car must be in service
            rules:
              - BR-7
          - statement: the car's next service threshold (mileage or date) must not be reached before the requested slot ends
            rules:
              - BR-8
          - statement: an approval or denial can only be recorded for a long-trip request that has not yet lapsed, before the reservation's start
      - id: AG-2
        name: Active reservation
        root: Active reservation
        entities:
          - name: Active reservation
            attributes:
              - Active reservation has pickup time
              - Active reservation has return mileage
              - Active reservation has damage note
              - Active reservation has late cancellation
        valueObjects: []
        commands:
          - Cancel reservation
          - Pick up car
          - Release reservation
          - Return car
        events:
          - Reservation cancelled
          - Car picked up
          - Reservation released
          - Car returned
        invariants: []
      - id: AG-3
        name: Out-of-service impact
        root: Out-of-service impact
        entities:
          - name: Out-of-service impact
            attributes: []
        valueObjects: []
        commands:
          - Cancel future reservations
          - Notify affected employees
        events:
          - Future reservations cancelled
          - Affected employees notified
        invariants: []
    events:
      - name: Car reserved
        pivotal: true
        attributes:
          - Trip request has slot start
          - Trip request has slot end
      - name: Long-trip approval requested
        attributes:
          - Long-trip approval has requested at
      - name: Long-trip approved
        attributes:
          - Long-trip approval has decided at
          - Long-trip approval has decision
      - name: Long-trip approval lapsed
        attributes:
          - Long-trip approval has decision
      - name: Long-trip approval denied
        attributes:
          - Long-trip approval has decided at
          - Long-trip approval has decision
      - name: Reservation cancelled
        attributes:
          - Active reservation has late cancellation
      - name: Car picked up
        attributes:
          - Active reservation has pickup time
      - name: Reservation released
      - name: Car returned
        pivotal: true
        attributes:
          - Active reservation has return mileage
          - Active reservation has damage note
      - name: Future reservations cancelled
      - name: Affected employees notified
    policies:
      - id: POL-1
        name: Approval lapse policy
        when:
          - Long-trip approval requested
        then:
          - Lapse long-trip approval
        execution: automatic
        condition: no approval decision recorded for the long-trip request by the reservation's start
      - id: POL-2
        name: Pickup timeout policy
        when:
          - Car reserved
          - Long-trip approved
        then:
          - Release reservation
        execution: automatic
        condition: car not picked up within the pickup window after the reservation's start
        parameters:
          - name: pickup-window-minutes
            value: "30"
      - id: POL-3
        name: Cancel future reservations policy
        when:
          - Car taken out of service
        then:
          - Cancel future reservations
        execution: automatic
      - id: POL-4
        name: Notify affected employees policy
        when:
          - Future reservations cancelled
        then:
          - Notify affected employees
        execution: automatic
    readModels:
      - name: Available cars view
        informs:
          - Employee
        fields: []
        updatedBy:
          - Car reserved
          - Reservation cancelled
          - Reservation released
          - Car returned
          - Car taken out of service
          - Car put back into service
          - Car record registered
      - name: Pending approvals view
        informs:
          - Fleet coordinator
        fields:
          - Long-trip approval has requested at
          - Trip request has slot start
        updatedBy:
          - Long-trip approval requested
      - name: My reservations view
        informs:
          - Employee
        fields:
          - Trip request has slot start
          - Trip request has slot end
          - Long-trip approval has decision
          - Active reservation has pickup time
          - Active reservation has return mileage
        updatedBy:
          - Car reserved
          - Long-trip approval requested
          - Long-trip approved
          - Long-trip approval lapsed
          - Long-trip approval denied
          - Reservation released
          - Affected employees notified
      - name: Cancellation and no-show counts view
        informs:
          - Fleet coordinator
        fields:
          - Employee has late cancellation count
          - Employee has no-show count
        updatedBy:
          - Reservation cancelled
          - Reservation released
    externalSystems: []
