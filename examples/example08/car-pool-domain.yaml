          - My reservations view
        acceptance:
          - id: AC-1
            title: Pickup within the window
            given:
              - A reservation for car plate 12-ABC-3 with slot 2026-10-15 09:00-11:00, status created, not yet picked up
            when:
              - The employee picks up the car at 09:05 on 2026-10-15
            then:
