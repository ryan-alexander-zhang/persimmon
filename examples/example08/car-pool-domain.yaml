apiVersion: sdd.persimmon.ai/v1
kind: BoundedContext
metadata:
  name: fleet-care.r1
spec:
  identity:
    id: fleet-care
    revision: 1
  content:
    name: Fleet care
    purpose: "Fleet care owns the single system of record for each pool car, replacing the fleet coordinator's spreadsheet: a car record holding plate, seats, gearbox, van flag, mileage, next service threshold and in-service/out-of-service state; a car service lifecycle that marks a car service-due, books it with the garage, takes it out of service for garage days and puts it back into service with refreshed mileage and threshold once serviced; and a damage report opened from a return note and reviewed by the fleet coordinator as minor or unsafe, with unsafe damage taking the car out of service at once."
    inScope:
      - Car record
      - Car service lifecycle
      - Damage report
      - Fleet coordinator
      - Employee
      - Car condition view
      - Pending damage reports view
      - Service-due cars view
      - Cars at garage view
    outOfScope:
      - Trip request — belongs to Reservations
      - Active reservation — belongs to Reservations
      - Out-of-service impact — belongs to Reservations
      - Available cars view — belongs to Reservations
    subdomain: fleet-care
    classification: supporting
    capabilities:
      - CAP-5
      - CAP-6
      - CAP-7
    relationships:
      - context: reservations
        role: peer
        pattern: partnership
---
apiVersion: sdd.persimmon.ai/v1
kind: Glossary
metadata:
  name: fleet-care-glossary.r1
spec:
  identity:
    id: fleet-care-glossary
    revision: 1
  content:
    title: Fleet care glossary
    context: fleet-care
    terms:
      - name: Car record
        definition: A car's fleet record holding its plate, seat count, gearbox type, van flag, current mileage, next service due by date or mileage, and a state of in service or out of service, replacing the fleet coordinator's spreadsheet (CAP-5, BR-11); each car return updates its current mileage (BR-12).
        status: active
        related:
          - Car service lifecycle
          - Damage report
      - name: Car service lifecycle
        definition: "A car's service state: becoming service-due, being booked with the garage, taken out of service for garage days or unsafe damage, and put back into service with its new mileage and next service threshold once serviced (CAP-6, BR-13, BR-14, BR-18)."
        status: active
        related:
          - Car record
      - name: Damage report
        definition: "A report opened from a damage note left on return and reviewed by the fleet coordinator: minor damage is recorded and the car stays in service, while damage judged unsafe takes the car out of service at once (CAP-7, BR-15, BR-16)."
        status: active
        related:
          - Car record
          - Car service lifecycle
      - name: Fleet coordinator
        definition: Maintains fleet records, approves long trips, reviews damage and manages garage scheduling; the office manager acts under this same role while covering an absence (Q-4).
        status: active
      - name: Employee
        definition: "as in Reservations: reserves, picks up and returns pool cars for trips to customers and sites; here, informed by the car condition view of damage noted by the previous driver before taking a car (G-3, SC-4)."
        status: active
      - name: Car condition view
        definition: A car's reviewed damage history, shown to the employee before taking the car so they see damage noted by the previous driver (G-3, SC-4).
        status: active
      - name: Pending damage reports view
        definition: Damage reports awaiting the fleet coordinator's severity review (CAP-7, BR-15).
        status: active
      - name: Service-due cars view
        definition: Cars that have become service-due and still need to be booked with the garage (CAP-6, BR-13, BR-14).
        status: active
      - name: Cars at garage view
        definition: Cars currently booked with or returned by the garage, shown to the fleet coordinator to put a serviced or repaired car back into service (CAP-6, BR-18).
        status: active
    factTypes:
      - name: Car record has plate
        subject: Car record
        predicate: has
        object:
          type: string
        status: active
      - name: Car record has seats
        subject: Car record
        predicate: has
        object:
          type: integer
        status: active
      - name: Car record has gearbox
        subject: Car record
        predicate: has
        object:
          type: enum
          values:
            - manual
            - automatic
        status: active
      - name: Car record has van flag
        subject: Car record
        predicate: has
        object:
          type: boolean
        status: active
      - name: Car record has mileage
        subject: Car record
        predicate: has
        object:
          type: integer
          unit: km
        status: active
      - name: Car record has next service due date
        subject: Car record
        predicate: has
        object:
          type: date
        status: active
      - name: Car record has next service due mileage
        subject: Car record
        predicate: has
        object:
          type: integer
          unit: km
        status: active
      - name: Car record has state
        subject: Car record
        predicate: has
        object:
          type: enum
          values:
            - in-service
            - out-of-service
        status: active
      - name: Car service lifecycle has status
        subject: Car service lifecycle
        predicate: has
        object:
          type: enum
          values:
            - service-due
            - booked-with-garage
            - out-of-service
            - in-service
        status: active
      - name: Damage report has note
        subject: Damage report
