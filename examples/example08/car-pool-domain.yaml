apiVersion: sdd.persimmon.ai/v1
kind: BoundedContext
metadata:
  name: reservations.r1
spec:
  identity:
    id: reservations
    revision: 1
  content:
    name: Reservations
    purpose: "Reservations owns the end-to-end lifecycle of an employee's trip request: matching the request against available cars, routing trips longer than three days to the fleet coordinator for approval, confirming a short reservation or an approved long trip, tracking pickup and releasing the slot if the car is not collected in time, recording the car's return, and letting an employee cancel a future reservation while late cancellations and no-shows are counted per employee per month. It also reacts when fleet care takes a car out of service by cancelling that car's future reservations and notifying the affected employees so they can reserve another car."
    inScope:
      - Trip request
      - Long-trip approval
      - Active reservation
      - Out-of-service impact
      - Available cars view
      - Pending approvals view
      - My reservations view
      - Cancellation and no-show counts view
      - Employee
      - Fleet coordinator
    outOfScope:
      - Car record (plate, seats, gearbox, van flag, mileage, service threshold, in-service state) — owned by fleet-care
      - Car service lifecycle (service-due tracking, garage booking, taking out of service, putting back into service) — owned by fleet-care
      - Damage report and its severity review — owned by fleet-care
      - Garage — external system handled through fleet-care
    subdomain: reservations
    classification: core
    capabilities:
      - CAP-1
      - CAP-2
      - CAP-3
      - CAP-4
    relationships:
      - context: fleet-care
        role: peer
        pattern: partnership
        note: "cr-01: Reservations and Fleet care evolve their shared concerns (car going out of service, its reservation impact) together as partners."
---
apiVersion: sdd.persimmon.ai/v1
kind: Glossary
metadata:
  name: reservations-glossary.r1
spec:
  identity:
    id: reservations-glossary
    revision: 1
  content:
    title: Reservations Glossary
    context: reservations
    terms:
      - name: Trip request
        definition: "Owns a trip request from submission through its outcome: an immediate short reservation, or a long-trip approval request that is then approved, denied, or left to lapse (CAP-1, CAP-3, BR-6, Q-3 resolution)."
        status: active
        related:
          - Long-trip approval
          - Active reservation
      - name: Long-trip approval
        definition: "A fleet coordinator's decision, or the lack of one, on a trip request longer than three days: approved or denied before the reservation's start, or left to lapse with the employee notified if no decision is recorded by then (BR-6, Q-3 resolution)."
        status: active
        related:
          - Trip request
      - name: Active reservation
        definition: Owns a confirmed reservation's slot through pickup and return, including cancellation and release when not picked up (CAP-2, CAP-4, BR-4, BR-9).
        status: active
        related:
          - Trip request
          - Out-of-service impact
      - name: Out-of-service impact
        definition: Cancels the future reservations of a car just taken out of service and notifies the affected employees (BR-17).
        status: active
        related:
          - Active reservation
      - name: Available cars view
        definition: Cars that fit the requested seats/van/gearbox, are free for the slot, in service and not service-due before the slot ends (CAP-1, BR-1, BR-3, BR-7, BR-8); shown to the employee before reserving.
        status: active
        related:
          - Employee
          - Trip request
      - name: Pending approvals view
        definition: Long-trip requests awaiting the fleet coordinator's decision before they lapse (Q-3 resolution).
        status: active
        related:
          - Long-trip approval
          - Fleet coordinator
      - name: My reservations view
        definition: An employee's own reservations and their outcomes (pending approval, approved, lapsed, denied, released, cancellations forced by an out-of-service car), used to pick a reservation to cancel or return and to learn of notifications (BR-17).
        status: active
        related:
          - Employee
          - Trip request
          - Active reservation
      - name: Cancellation and no-show counts view
        definition: Each employee's late cancellations and no-shows counted per calendar month, shown to the fleet coordinator (CAP-4, BR-9, BR-10, SC-5).
        status: active
        related:
          - Employee
          - Fleet coordinator
      - name: Employee
        definition: Reserves, picks up and returns pool cars for trips to customers and sites; needs a car that fits the trip and is actually available and roadworthy for the booked slot.
        status: active
        related:
          - Trip request
          - Active reservation
      - name: Fleet coordinator
        definition: Maintains fleet records, approves long trips, reviews damage and manages garage scheduling; the office manager acts under this same role while covering an absence (Q-4).
        status: active
        related:
          - Long-trip approval
    factTypes:
      - name: Trip request has slot start
        subject: Trip request
        predicate: has
        object:
          type: date
        status: active
      - name: Trip request has slot end
        subject: Trip request
        predicate: has
        object:
          type: date
        status: active
      - name: Trip request has requested seats
        subject: Trip request
        predicate: has
        object:
          type: integer
        status: active
      - name: Trip request has van required
        subject: Trip request
        predicate: has
        object:
          type: boolean
        status: active
      - name: Trip request has automatic gearbox required
        subject: Trip request
        predicate: has
        object:
          type: boolean
        status: active
      - name: Trip request has passenger count
        subject: Trip request
        predicate: has
        object:
          type: integer
        status: active
      - name: Trip request has purpose
        subject: Trip request
        predicate: has
        object:
          type: string
        status: active
      - name: Long-trip approval has requested at
        subject: Long-trip approval
        predicate: has
        object:
          type: date
        status: active
      - name: Long-trip approval has decided at
        subject: Long-trip approval
        predicate: has
        object:
          type: date
        status: active
      - name: Long-trip approval has decision
        subject: Long-trip approval
        predicate: has
        object:
          type: enum
          values:
            - approved
            - denied
            - lapsed
        status: active
      - name: Active reservation has pickup time
        subject: Active reservation
        predicate: has
        object:
          type: date
        status: active
      - name: Active reservation has return mileage
        subject: Active reservation
        predicate: has
        object:
          type: integer
          unit: km
        status: active
      - name: Active reservation has damage note
        subject: Active reservation
        predicate: has
        object:
          type: string
        status: active
      - name: Active reservation has late cancellation
        subject: Active reservation
        predicate: has
        object:
          type: boolean
        status: active
      - name: Employee has late cancellation count
        subject: Employee
        predicate: has
        object:
          type: integer
        status: active
      - name: Employee has no-show count
        subject: Employee
        predicate: has
        object:
          type: integer
        status: active
