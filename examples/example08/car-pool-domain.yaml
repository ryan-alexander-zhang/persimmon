apiVersion: sdd.persimmon.ai/v1
kind: Architecture
metadata:
  name: car-pool-prd-architecture.r1
spec:
  identity:
    id: car-pool-prd-architecture
    revision: 1
  content:
    businessRules: car-pool-rules
    title: Company Car Pool
    owner: Fleet coordinator
    status: accepted
    introduction:
      prd: car-pool-prd
      qualityGoals:
        - id: QG-1
          quality: reliability
          motivation: "Serves G-1 and G-3: an employee's reservation never collides with another reservation or with a car's service-due date (SC-1, SC-2)."
        - id: QG-2
          quality: functional-suitability
          motivation: "Serves G-2: an employee knows before arriving that the offered car fits the trip's seats, equipment, and gearbox needs."
        - id: QG-3
          quality: interaction-capability
          motivation: "Serves G-4: damage noted on return reaches the fleet coordinator the same day instead of weeks later (SC-3)."
        - id: QG-4
          quality: maintainability
          motivation: "Serves G-5: the fleet coordinator reads one accurate, current fleet record instead of a spreadsheet (SC-4)."
        - id: QG-5
          quality: performance-efficiency
          motivation: "Serves G-6: an employee whose car is pulled from service can rebook another car without delay (SC-6)."
      stakeholders:
        - role: Employee
          expectations: Reserves a car confident it fits the trip and won't be double-booked or pulled out from under them without same-day notice.
        - role: Fleet coordinator
          expectations: Reads one accurate record of every car's condition, service state, and damage, and catches a problem car before it goes out, not after.
        - role: System operator
          expectations: The one Car Pool Service and the directory and mail-relay integrations it depends on stay available and observable during business hours.
    constraints:
      - id: C-1
        kind: organizational
        statement: "The product serves one site only: the Rotterdam office's roughly sixty employees and twelve cars; no multi-site logic is built."
        rationale: "Prd assumption: all cars and employees are based at the Rotterdam office."
      - id: C-2
        kind: technical
        statement: Every employee who may reserve a car signs in through the existing company directory; the product has no separate account store.
        rationale: "Prd assumption: employees are listed in the company directory and sign in through it."
      - id: C-3
        kind: organizational
        statement: The fleet coordinator is a single role at a time; an office manager covering absences acts under that same role rather than a distinct one.
        rationale: "Prd assumption and non-goal: no distinct office-manager workflow."
      - id: C-4
        kind: technical
        statement: Mileage and damage are entered by the employee at return; there is no vehicle sensor, telematics, or keyless-entry feed, and keys remain in the physical cabinet.
        rationale: "Prd assumption and non-goal: telematics/keyless entry is out of scope."
      - id: C-5
        kind: convention
        statement: A car's seats, gearbox type, and van flag are reference data the fleet coordinator maintains directly, not values the system measures or derives.
        rationale: "Prd assumption: these are coordinator-maintained attributes."
    context:
      business:
        - partner: Employee
          exchanges: trip requests (passenger count, equipment need, gearbox preference, slot), reservation status, pickup and return including mileage and damage notes, cancellations, and same-day out-of-service notifications
          direction: both
        - partner: Fleet coordinator
          exchanges: long-reservation approvals, employee reliability counts, the fleet record (plate, seats, gearbox, van flag, mileage, next-service threshold, service state), garage scheduling, and damage report review outcomes
          direction: both
        - partner: Company directory
          exchanges: sign-in identity and Employee or Fleet coordinator role membership
          direction: in
        - partner: Garage
          exchanges: booking a service-due car in for service and its return with updated mileage and next-service threshold
          direction: both
        - partner: Office mail relay
          exchanges: same-day cancellation notification emails addressed to employees whose reservations were cancelled because their car left service
          direction: out
      technical:
        - channel: Pool web application
          protocol: HTTPS/JSON
          carries: Employee and Fleet coordinator exchanges with the Car Pool Service's Reservation API and Fleet record API
        - channel: Identity provider integration
          protocol: OIDC/SAML SSO
          carries: sign-in identity and role from the company directory
        - channel: Transactional email
          protocol: SMTP/Email API
          carries: same-day cancellation notifications to employees, relayed through the office mail relay
        - channel: Manual coordination
          protocol: phone/email outside the system
          carries: garage service booking and completion recorded by the fleet coordinator
    strategy:
      - id: S-1
        decision: Build the Car Pool Service as one deployable with two modules, Car Reservations and Fleet Care, one per bounded context, each owning its own schema in a shared relational store; cross-module calls stay in-process, not over a network.
        addresses:
          - QG-1
          - QG-4
          - C-1
      - id: S-2
        decision: Authenticate everyone through the existing company directory via SSO; no local account store.
        addresses:
          - C-2
      - id: S-3
        decision: Check car fitness and service-due state synchronously against Fleet Care's current record at the moment a reservation is offered and created.
        addresses:
          - QG-1
          - QG-2
      - id: S-4
        decision: "Carry cross-module side effects as in-process domain events via a transactional outbox table in the Car Pool Service's shared store, no message broker: damage notes opening damage reports, and out-of-service cars cancelling reservations and notifying employees."
        addresses:
          - QG-3
          - QG-5
    buildingBlocks:
      - id: BB-1
        name: Car Pool Service
        responsibility: "One deployable containing two modules, one per bounded context. The Car Reservations module owns the reservation lifecycle: offering fitting cars, the long-reservation approval workflow, creation, cancellation (employee-initiated or forced by a car leaving service), the pickup-to-return cycle including unclaimed release, and employee reliability counts. The Fleet Care module owns each car's fleet record, derives service-due state, manages out-of-service and back-in-service transitions for scheduled maintenance and unsafe damage, and owns damage reports from opening through review. Each module owns its own schema in the service's shared store; cross-module effects travel in-process (CC-8)."
        technology: Backend service (REST API + in-process domain events via an outbox table) with a relational database, one schema per module
        interfaces:
          - name: Reservation API
            kind: provides
            description: Create, cancel, approve/deny, pick up, and return reservations; list available cars, my reservations, pending approvals, and employee reliability counts.
          - name: Fleet record API
            kind: provides
            description: Maintain the car record, schedule and complete garage service, and review damage reports.
          - name: Email delivery
            kind: requires
            description: Requests the office mail relay deliver the same-day cancellation notification to an employee whose reservation was cancelled because their car left service.
          - name: Garage service coordination
            kind: requires
            description: The fleet coordinator manually books a service-due car in with the garage and records the mileage and next-service threshold it returns with.
        contexts:
          - car-reservations
          - fleet-care
      - id: BB-3
        name: Pool Web Application
        responsibility: Presents the Available cars, My reservations, Employee reliability, Pending approvals, Fleet record, Service-due, Garage status, and Damage reports views to the Employee and Fleet coordinator, and routes their actions to the Car Pool Service.
        technology: Single-page web application (browser)
        interfaces:
          - name: Pool web UI
            kind: provides
            description: Lets an Employee reserve, cancel, pick up, and return cars, and a Fleet coordinator approve, maintain the fleet record, schedule service, and review damage.
          - name: Reservation API
            kind: requires
            description: Calls the Car Pool Service to create, cancel, approve, pick up, and return reservations.
          - name: Fleet record API
            kind: requires
            description: Calls the Car Pool Service to read and update the fleet record, garage status, and damage reports.
          - name: SSO sign-in
            kind: requires
            description: Authenticates the signed-in user and reads their role from the company directory.
        contexts: []
    relations:
      - id: REL-1
        from: Employee
        to: BB-3
        interface: Pool web UI
        description: Reserves, cancels, picks up and returns a car, and views available cars, own reservations, and reliability counts.
        technology: HTTPS/JSON
      - id: REL-2
        from: Fleet coordinator
        to: BB-3
        interface: Pool web UI
        description: Approves long reservations, maintains the fleet record, schedules garage service, and reviews damage reports.
        technology: HTTPS/JSON
      - id: REL-3
        from: BB-3
        to: BB-1
        interface: Reservation API
        description: Creates, cancels, approves, picks up, and returns reservations on the employee's or coordinator's behalf.
        technology: HTTPS/JSON
      - id: REL-4
        from: BB-3
        to: BB-1
        interface: Fleet record API
        description: Reads and updates the fleet record, garage status, and damage reports on the coordinator's behalf.
        technology: HTTPS/JSON
      - id: REL-8
        from: BB-1
        to: Office mail relay
        interface: Email delivery
        description: Requests delivery of the same-day cancellation notification email to an employee whose reservation was cancelled because their car left service.
        technology: SMTP/Email API
      - id: REL-10
        from: BB-3
        to: Company directory
        interface: SSO sign-in
        description: Signs the employee or fleet coordinator in and reads their role from directory group membership.
        technology: OIDC/SAML
      - id: REL-11
        from: BB-1
        to: Garage
        interface: Garage service coordination
        description: The fleet coordinator books a service-due car in and records the mileage and next-service threshold the garage returns it with.
        technology: manual, outside the system
    concepts:
      - id: CC-1
        topic: domain
        statement: "The Car Reservations module's Reservation aggregate is the transaction boundary for the full reservation lifecycle: the long-reservation approval workflow, creation, cancellation, and the pickup-to-return cycle. Employee Reliability is a separate aggregate, updated by policy once a cancellation or no-show is decided."
      - id: CC-2
        topic: domain
        statement: The Fleet Care module's Car aggregate is the transaction boundary for a car's attributes, mileage, service-due derivation, and service state. Damage Report is a separate aggregate, opened by a return's damage note and transitioned by the coordinator's minor/unsafe review.
      - id: CC-3
        topic: security
        statement: Every sign-in goes through the company directory (C-2); the product holds no local passwords, and the Employee or Fleet coordinator role is read from directory group membership.
      - id: CC-4
        topic: persistence
        statement: "Within the one Car Pool Service, each module owns its own schema: the Car Reservations module persists Reservation and Employee Reliability, the Fleet Care module persists Car and Damage Report; there are no cross-schema foreign keys or shared tables, so each context's tables remain migratable independently of the other's."
      - id: CC-5
        topic: errors
        statement: A reservation request that fails a fitness, availability, or service-due check (BR-2, BR-3, BR-4, BR-5, BR-6, BR-7) is refused before creation, not created and then cancelled; a long-reservation request denied or its approval lapsed (BR-10) is surfaced to the employee as declined, not silently dropped.
      - id: CC-6
        topic: transactions
        statement: Cross-module effects, a car leaving service cancelling its reservations and notifying employees (BR-20), and a damage note opening a damage report (BR-17), are carried by in-process domain events written to an outbox table in the shared store, in the same database transaction as the triggering write, then dispatched in-process to the other module; there is no message broker. The fitness and service-due check at reservation time (S-3) is an in-process synchronous query from the Car Reservations module into the Fleet Care module's current record, not a network call.
      - id: CC-7
        topic: other
        statement: "Employee Reliability's late-cancellation and no-show counts are informational: the employee sees their own count and the fleet coordinator sees every employee's monthly count, but no rule today restricts future bookings on a high count (open question Q-4, tracked as RK-4)."
      - id: CC-8
        topic: other
        statement: "The Car Pool Service is one deployable with two modules, one per bounded context: Car Reservations and Fleet Care. The boundary between them is enforced in code and schema, not by a network call: each module owns its own schema in the shared store, and the only things crossing the boundary are the in-process domain events of CC-6 and the synchronous fitness/service-due query of S-3; this is what lets the two contexts stay independently evolvable despite sharing one deployable (QG-4, S-1)."
    domainModels:
      - car-reservations-model
      - fleet-care-model
    glossaries:
      - car-reservations-glossary
      - fleet-care-glossary
    decisions:
      - car-pool-prd-adr-1
      - car-pool-prd-adr-2
      - car-pool-prd-adr-3
      - car-pool-prd-adr-4
    qualityScenarios:
      - id: QS-1
        qualityGoal: QG-1
        stimulus: Two employees try to reserve the same car for overlapping time slots at nearly the same moment.
        response: Car Reservations' fitness check (S-3) rejects the second request; only one reservation is created for that car and slot.
        measure: Zero double-booked reservations for the same car and overlapping slot (SC-1).
        source: Employee
      - id: QS-2
        qualityGoal: QG-1
        stimulus: An employee requests a slot that would run past the car's next-service threshold.
        response: The car is excluded from the offered list and from creation for that slot.
        measure: No reservation is picked up for a car whose next service falls before the slot ends (SC-2).
        source: Employee
      - id: QS-3
        qualityGoal: QG-2
        stimulus: An employee requests a van with an automatic gearbox for five passengers.
        response: The Available cars view offers only vans with an automatic gearbox and at least five seats.
        measure: 100% of offered cars meet the stated seats, equipment, and gearbox needs.
        source: Employee
      - id: QS-4
        qualityGoal: QG-3
        stimulus: An employee notes damage at return.
        response: The Damage noted on return event is written to the outbox and dispatched in-process to open a damage report in the Fleet Care module, visible in the Damage reports view.
        measure: Damage report visible to the fleet coordinator the same day, down from weeks (SC-3).
        source: Fleet coordinator
      - id: QS-5
        qualityGoal: QG-4
        stimulus: The fleet coordinator looks up a car by plate.
        response: The Fleet record view returns current plate, mileage, service due, and in/out-of-service state from one record.
        measure: 100% of cars readable from one system record, zero spreadsheet lookups (SC-4).
        source: Fleet coordinator
      - id: QS-6
        qualityGoal: QG-5
        stimulus: The Fleet Care module takes a car out of service for unsafe damage while it holds two future reservations.
        response: The Car Reservations module cancels both reservations in-process and the Car Pool Service sends notification requests to the office mail relay, which emails the two employees the same day.
        measure: Affected employees notified the same day (SC-6), each able to create a new reservation immediately after.
        source: Fleet coordinator
    risks:
      - id: RK-1
        kind: risk
        statement: The in-process fitness and service-due query from the Car Reservations module into the Fleet Care module's schema (S-3) still reads live data at reservation time; a long-running transaction or lock in the Fleet Care schema can delay or block making a reservation.
        impact: medium
        probability: low
        mitigation: Keep the query a simple indexed read against the Fleet Care schema, outside any long-running transaction, with a timeout and a clear 'try again' refusal.
      - id: RK-2
        kind: risk
        statement: The in-process outbox dispatcher (S-4) could lag or fail to deliver an event before the next read, so a car just taken out of service could briefly still appear bookable.
        impact: high
        probability: low
        mitigation: Dispatch the outbox on a short in-process polling interval with retry and idempotent handlers, plus a periodic reconciliation read against the Fleet Care module's current state.
      - id: RK-3
        kind: debt
        statement: Garage interaction stays manual (C-4), so a coordinator could forget to record a completed service and leave a serviced car out of service.
        mitigation: The Garage status view surfaces open bookings prominently; a future integration could automate completion.
      - id: RK-4
        kind: risk
        statement: Whether a high monthly count of late cancellations or no-shows should restrict an employee's future bookings is unresolved (Q-4); the system today only reports it.
        impact: low
        probability: medium
        mitigation: Keep the count read-only until the business confirms whether an enforcement rule is wanted.
      - id: RK-5
        kind: risk
        statement: No minimum or maximum lead time for a reservation is defined (Q-3); an employee could reserve far in advance within only the two-open-reservation limit (BR-9).
        impact: low
        probability: low
        mitigation: Monitor booking patterns and add a lead-time rule if far-ahead bookings prove to crowd out other employees.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: car-pool-prd-adr-1.r1
spec:
  identity:
    id: car-pool-prd-adr-1
    revision: 1
  content:
    title: Package the two bounded contexts as one deployable
    status: accepted
    strategy: S-1
    deciders:
      - Fleet coordinator
      - System operator
    context: "Car Reservations and Fleet Care serve reliability (QG-1) and a maintainable single source of truth for the fleet record (QG-4) for one site of twelve cars and roughly sixty employees (C-1). That volume does not justify the operational cost of two independently deployed services: two deployment pipelines, two runtimes, and a network boundary between them, run and audited by one fleet coordinator and the office IT person. The two contexts are a partnership with a frequent cross-context check at reservation time (fitness and service-due), which is cheaper done in-process than over a service boundary."
    drivers:
      - QG-1
      - QG-4
      - C-1
    decision: Build one deployable, the Car Pool Service, containing two modules, Car Reservations and Fleet Care, one per bounded context, each module owning its own schema in the service's shared relational store. The module boundary is enforced by code structure and schema separation, not by a network call.
    alternatives:
      - option: Two separately deployable services (Car Reservations Service and Fleet Care Service) integrated over HTTP and a message broker
        rejectedBecause: Doubles the deployment, monitoring, and on-call surface for a product run by one fleet coordinator and the office IT person, with no scale or independent-release need to justify it (C-1).
      - option: A single module with no boundary between the two contexts
        rejectedBecause: Blurs Car Reservations' and Fleet Care's distinct aggregates and ownership (Reservation/Employee Reliability versus Car/Damage Report), making it harder to keep each context's invariants local and to evolve one context without risking the other (QG-4).
    consequences:
      - kind: positive
        statement: One deployment pipeline, one runtime to operate and observe, sized for the actual load of twelve cars and sixty employees.
      - kind: positive
        statement: The fitness and service-due check Car Reservations makes against Fleet Care's record (S-3) is an in-process call, removing a network dependency and its failure modes.
      - kind: negative
        statement: The two modules share a process and a deployment; a bug or resource exhaustion in one module can affect the other's availability, unlike fully isolated services.
      - kind: neutral
        statement: Splitting into separate services later remains possible since each module already owns its own schema.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: car-pool-prd-adr-2.r1
spec:
  identity:
    id: car-pool-prd-adr-2
    revision: 1
  content:
    title: Authenticate through the existing company directory
    status: accepted
    strategy: S-2
    deciders:
      - Fleet coordinator
      - System operator
    context: Every employee who may reserve a car is already listed in the company directory and signs in through it (C-2); building and maintaining a separate account store and password-reset flow for sixty employees and one coordinator would duplicate identity the company already manages.
    drivers:
      - C-2
    decision: Authenticate every Employee and Fleet coordinator sign-in through the existing company directory via SSO (OIDC/SAML), reading the Employee or Fleet coordinator role from directory group membership; the product holds no local password store.
    alternatives:
      - option: A local account and password store for the pool application
        rejectedBecause: Duplicates identity the company already manages in its directory (C-2) and adds a password-reset and account-lifecycle burden for no benefit.
      - option: A shared, non-personal pool login
        rejectedBecause: Loses the per-employee identity the Reservation and Employee Reliability aggregates need to attribute a reservation, a cancellation, and a reliability count to one employee.
    consequences:
      - kind: positive
        statement: No local credential store to secure or reset; one less attack surface.
      - kind: positive
        statement: Role membership stays centrally managed by whoever administers the company directory.
      - kind: negative
        statement: The product's availability depends on the company directory's SSO being reachable; an outage there blocks sign-in to the pool.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: car-pool-prd-adr-3.r1
spec:
  identity:
    id: car-pool-prd-adr-3
    revision: 1
  content:
    title: Check car fitness and service-due state synchronously at reservation time
    status: accepted
    strategy: S-3
    deciders:
      - Fleet coordinator
    context: An employee must know before arriving whether the offered car fits their trip (QG-2), and a reservation must never be offered or created for a car that is out of service or would run past its next service (QG-1, BR-6, BR-7). Fleet Care's record can change, a car goes out of service, a service threshold is crossed, between when a list is shown and when a reservation is created.
    drivers:
      - QG-1
      - QG-2
    decision: Car Reservations checks a car's seats, gearbox, van flag, in-service state, and next-service threshold against Fleet Care's current record synchronously, both when offering the available-cars list and again at the moment a reservation is created, rather than relying on a cached or periodically refreshed copy.
    alternatives:
      - option: Cache or periodically replicate Fleet Care's record into Car Reservations
        rejectedBecause: A stale copy could offer or create a reservation for a car that went out of service or became service-due moments earlier, reopening the double-booking and past-service-due failures the product exists to close (BR-6, BR-7).
      - option: Check fitness only when offering the list, not again at creation
        rejectedBecause: A car's state can change in the gap between viewing the list and confirming the reservation, letting an unfit or service-due car through at the moment it matters most.
    consequences:
      - kind: positive
        statement: An employee is never offered or given a car that fails BR-2 through BR-7 at the moment of booking.
      - kind: positive
        statement: Being in-process within the Car Pool Service (S-1), the check carries no network latency or availability risk.
      - kind: negative
        statement: Every offer and every creation pays the cost of a fresh query against the Fleet Care module's data, rather than reading a cache.
---
apiVersion: sdd.persimmon.ai/v1
kind: Adr
metadata:
  name: car-pool-prd-adr-4.r1
spec:
  identity:
    id: car-pool-prd-adr-4
    revision: 1
  content:
    title: Carry cross-module side effects as in-process domain events via a transactional outbox
    status: accepted
    strategy: S-4
    deciders:
      - Fleet coordinator
      - System operator
    context: A damage note at return must open a damage report in Fleet Care (BR-17), and a car taken out of service must cancel its future reservations and notify the affected employees (BR-20, QG-5) — both cross the Car Reservations/Fleet Care module boundary inside the one Car Pool Service (S-1). These effects must not be lost even though the triggering write and the side effect cannot commit as one step across modules.
    drivers:
      - QG-3
      - QG-5
      - BR-17
      - BR-20
    decision: Record each cross-module side effect as a domain event in an outbox table in the Car Pool Service's shared store, written in the same database transaction as the triggering write (the damage note on return, the car's out-of-service transition); an in-process dispatcher then delivers each event to the other module. No message broker is used.
    alternatives:
      - option: A message broker between Car Reservations and Fleet Care
        rejectedBecause: Adds an operational component, a broker cluster, topics, dead-letter handling, to monitor and run, for a single deployable where both modules already share one store (S-1).
      - option: Call the other module's side effect directly, in the same transaction as the triggering write
        rejectedBecause: Couples, for example, recording a return's damage note to Fleet Care's damage-report logic succeeding in the same transaction, so a failure or lock in one module's tables would roll back the other's unrelated write.
    consequences:
      - kind: positive
        statement: "The event is never lost: it is written atomically with the triggering write, in the same transaction, before any dispatch is attempted."
      - kind: positive
        statement: No broker to deploy, secure, or keep available.
      - kind: negative
        statement: "Dispatch is asynchronous: there is a short window between the triggering write and the other module acting on it, during which, for example, a cancelled car could still appear briefly bookable (RK-2)."
---
