apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: car-pool-prd-cap-2.r1
spec:
  identity:
    id: car-pool-prd-cap-2
    revision: 1
  content:
    title: Pickup and Return Recording
    prd: car-pool-prd
    capability: CAP-2
    architecture: car-pool-prd-architecture
    domainModel: reservations-model
    businessRules: car-pool-rules
    stories:
      - id: US-1
        role: Employee
        goal: pick up the car at the start of the reserved slot
        benefit: so that they can begin the trip the car was reserved for
        requirements:
          - FR-1
        commands:
          - Pick up car
        events:
          - Car picked up
        readModels:
          - My reservations view
        acceptance:
          - id: AC-1
            title: Car picked up at slot start
            given:
              - a confirmed reservation for car X with slot start 09:00 on 2026-10-20, not yet picked up
            when:
              - the employee picks up car X at 09:05
            then:
              - the reservation's pickup time is recorded as 09:05
          - id: AC-2
            title: Pickup just before the release window closes
            given:
              - a confirmed reservation for car Z with slot start 09:00, not yet picked up at 09:29
            when:
              - the employee picks up car Z at 09:29
            then:
              - the pickup time is recorded as 09:29
              - the reservation is not released
      - id: US-2
        role: Employee
        goal: have an unclaimed reservation released automatically
        benefit: so that the car becomes free for another employee to reserve (G-1)
        requirements:
          - FR-2
        commands:
          - Release reservation
        events:
          - Reservation released
        acceptance:
          - id: AC-3
            title: Reservation released after the pickup window lapses
            given:
              - a confirmed reservation for car Y with slot start 09:00 on 2026-10-20, no pickup recorded by 09:30
            when:
              - thirty minutes pass after the reservation's start with no pickup recorded
            then:
              - the reservation is released, citing BR-4
              - car Y becomes available for another employee's reservation
      - id: US-3
        role: Employee
        goal: record the car's mileage on return
        benefit: so that the fleet record reflects the car's actual usage
        requirements:
          - FR-3
        commands:
          - Return car
        events:
          - Car returned
        readModels:
          - My reservations view
        acceptance:
          - id: AC-4
            title: Return records the dashboard mileage
            given:
              - an active reservation for car X, picked up earlier, dashboard reads 15230 km at return
            when:
              - the employee returns car X and enters mileage 15230 km
            then:
              - the return mileage is recorded as 15230 km
          - id: AC-5
            title: Return with no new damage
            given:
              - an active reservation for car X being returned, no new damage present, dashboard reads 15300 km
            when:
              - the employee returns car X, entering mileage 15300 km and no damage note
            then:
              - the return mileage is recorded as 15300 km
              - no damage note is recorded
      - id: US-4
        role: Employee
        goal: note any new damage on return
        benefit: so that the next driver sees the damage before taking the car (G-3)
        requirements:
          - FR-4
        commands:
          - Return car
        events:
          - Car returned
        acceptance:
          - id: AC-6
            title: Return with new damage noted
            given:
              - an active reservation for car X being returned, a new scratch on the rear bumper, dashboard reads 15230 km
            when:
              - the employee returns car X, entering mileage 15230 km and the damage note 'scratch on rear bumper'
            then:
              - the damage note 'scratch on rear bumper' is recorded against the return
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When an employee picks up the reserved car, the system shall record the car's pickup time.
      - id: FR-2
        pattern: unwanted-behaviour
        statement: If a reservation's car has not been picked up within thirty minutes of the reservation's start, then the system shall release the reservation, per BR-4.
        rules:
          - BR-4
      - id: FR-3
        pattern: event-driven
        statement: When an employee returns the car, the system shall record the mileage read off the dashboard.
      - id: FR-4
        pattern: optional
        statement: Where the employee notes new damage on return, the system shall record the damage note.
    qualities:
      - scenario: QS-6
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: car-pool-prd-cap-3.r1
spec:
  identity:
    id: car-pool-prd-cap-3
    revision: 1
  content:
    title: Reservation limits and approval
    prd: car-pool-prd
    capability: CAP-3
    architecture: car-pool-prd-architecture
    domainModel: reservations-model
    businessRules: car-pool-rules
    stories:
      - id: US-1
        role: Employee
        goal: reserve a car for a trip within my future-reservation limit
        benefit: so that the shared fleet remains available to other employees
        requirements:
          - FR-1
        commands:
          - Reserve car
        events: []
        readModels: []
        acceptance:
          - id: AC-1
            title: Third future reservation refused
            given:
              - an employee holds two future reservations already
              - a car is free for a requested slot on Tuesday 09:00-11:00
            when:
              - the employee reserves a car for the Tuesday 09:00-11:00 slot
            then:
              - "refused: BR-5, the employee already holds two future reservations"
      - id: US-2
        role: Employee
        goal: request a car for a trip longer than three days
        benefit: so that I can still book a longer trip once the fleet coordinator agrees
        requirements:
          - FR-2
        commands:
          - Reserve car
        events:
          - Long-trip approval requested
        readModels:
          - My reservations view
        acceptance:
          - id: AC-2
            title: Trip over three days routed to approval
            given:
              - a trip request for a slot from Monday 08:00 to Friday 17:00 (4 days 9 hours)
              - the employee holds zero future reservations
            when:
              - the employee reserves a car for the Monday 08:00-Friday 17:00 slot
            then:
              - a long-trip approval request is sent to the fleet coordinator
              - no reservation is confirmed yet
      - id: US-3
        role: Fleet coordinator
        goal: approve or deny a long-trip approval request
        benefit: so that I control which long trips use the shared fleet
        requirements:
          - FR-3
          - FR-4
          - FR-6
        commands:
          - Approve long trip
          - Deny long trip
        events:
          - Long-trip approved
          - Long-trip approval denied
        readModels:
          - Pending approvals view
        acceptance:
          - id: AC-3
            title: Fleet coordinator approves a long trip
            given:
              - a long-trip approval request for the Monday 08:00-Friday 17:00 slot, submitted 2 days before the reservation's start
              - no decision recorded yet
            when:
              - the fleet coordinator approves the long-trip approval request
            then:
              - the car is reserved for the Monday 08:00-Friday 17:00 slot
              - the employee's reservation shows as approved
          - id: AC-4
            title: Fleet coordinator denies a long trip
            given:
              - a long-trip approval request for a 5-day slot, submitted 3 days before the reservation's start
              - no decision recorded yet
            when:
              - the fleet coordinator denies the long-trip approval request
            then:
              - the reservation is refused
              - the employee is notified of the denial
          - id: AC-5
            title: Decision refused after a long-trip approval request has lapsed
            given:
              - a long-trip approval request that lapsed yesterday
            when:
              - the fleet coordinator attempts to approve the lapsed long-trip approval request
            then:
              - "refused: the decision cannot be recorded because the request has already lapsed"
      - id: US-4
        role: Employee
        goal: learn promptly if my long-trip approval request lapses without a decision
        benefit: so that I can look for another way to make the trip instead of waiting indefinitely
        requirements:
          - FR-5
        commands: []
        events:
          - Long-trip approval lapsed
        readModels:
          - My reservations view
        acceptance:
          - id: AC-6
            title: Long-trip approval lapses at reservation start
            given:
              - a long-trip approval request submitted 5 days before the reservation's start
              - no decision recorded as the reservation's start arrives
            when:
              - the reservation's start time is reached
            then:
              - the long-trip approval request lapses
              - the reservation is not confirmed
              - the employee is notified that the request lapsed
    requirements:
      - id: FR-1
        pattern: unwanted-behaviour
        statement: If a trip request breaks BR-5, then the system shall refuse the reservation.
        rules:
          - BR-5
      - id: FR-2
        pattern: event-driven
        statement: When a trip request breaks BR-6, the system shall request long-trip approval from the fleet coordinator instead of confirming the reservation.
        rules:
          - BR-6
      - id: FR-3
        pattern: event-driven
        statement: When the fleet coordinator approves a long-trip approval request, the system shall reserve the car for the requested slot.
        rules:
          - BR-6
      - id: FR-4
        pattern: event-driven
        statement: When the fleet coordinator denies a long-trip approval request, the system shall refuse the reservation.
        rules:
          - BR-6
      - id: FR-5
        pattern: complex
        statement: While a long-trip approval request has no recorded decision, when the reservation's start arrives, the system shall lapse the approval request and notify the employee.
      - id: FR-6
        pattern: unwanted-behaviour
        statement: If the fleet coordinator attempts to record an approval or denial decision for a long-trip approval request after it has lapsed or after the reservation's start, then the system shall refuse the decision.
    qualities: []
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: car-pool-prd-cap-4.r1
spec:
  identity:
    id: car-pool-prd-cap-4
    revision: 1
  content:
    title: Cancellation and No-Show Tracking
    prd: car-pool-prd
    capability: CAP-4
    architecture: car-pool-prd-architecture
    domainModel: reservations-model
    businessRules: car-pool-rules
    stories:
      - id: US-1
        role: Employee
        goal: cancel a reservation they no longer need
        benefit: so that they know where they stand on whether the cancellation counts against them (G-5)
        requirements:
          - FR-1
        commands:
          - Cancel reservation
        events:
          - Reservation cancelled
        acceptance:
          - id: AC-1
            title: Cancellation well before the start is not late
            given:
              - a reservation starting at 14:00 on 10 March
              - the current time is 10:00 on 10 March, 4 hours before the start
            when:
              - the employee cancels the reservation
            then:
              - the reservation is cancelled
              - the cancellation is recorded as not a late cancellation
          - id: AC-2
            title: Cancellation close to the start is late
            given:
              - a reservation starting at 14:00 on 10 March
              - the current time is 12:30 on 10 March, 1 hour 30 minutes before the start
            when:
              - the employee cancels the reservation
            then:
              - the reservation is cancelled
              - the cancellation is recorded as a late cancellation, citing BR-9
              - the late cancellation is counted toward the employee's monthly count
      - id: US-2
        role: Fleet coordinator
        goal: see each employee's monthly late-cancellation and no-show counts
        benefit: so that they have a current, trustworthy view of each employee's late-cancellation and no-show behaviour
        requirements:
          - FR-2
          - FR-3
          - FR-4
        events:
          - Reservation cancelled
          - Reservation released
        readModels:
          - Cancellation and no-show counts view
        acceptance:
          - id: AC-3
            title: Monthly late-cancellation count
            given:
              - an employee's reservation cancellation at 12:30 for a 14:00 start on 3 March was recorded as a late cancellation, citing BR-9
              - the same employee's reservation cancellation at 12:30 for a 14:00 start on 20 March was also recorded as a late cancellation, citing BR-9
              - no no-shows recorded for that employee in March
            when:
              - the fleet coordinator views the cancellation and no-show counts view for March
            then:
              - the view shows 2 late cancellations and 0 no-shows for the employee for March
          - id: AC-4
            title: Monthly no-show count
            given:
              - an employee's reservation starting at 09:00 on 5 March was released automatically after no pickup within 30 minutes of the start
              - no late cancellations recorded for that employee in March
            when:
              - the fleet coordinator views the cancellation and no-show counts view for March
            then:
              - the view shows 1 no-show and 0 late cancellations for the employee for March
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When an employee cancels a reservation, the system shall record whether the cancellation breaks BR-9.
        rules:
          - BR-9
      - id: FR-2
        pattern: event-driven
        statement: When a reservation is released without the car being picked up, the system shall count it as a no-show against the employee, per BR-10.
        rules:
          - BR-10
      - id: FR-3
        pattern: ubiquitous
        statement: The system shall maintain each employee's late-cancellation and no-show counts per calendar month, per BR-10.
        rules:
          - BR-10
      - id: FR-4
        pattern: ubiquitous
        statement: The system shall show the fleet coordinator each employee's late-cancellation and no-show counts for each calendar month.
    qualities: []
    openQuestions: []
