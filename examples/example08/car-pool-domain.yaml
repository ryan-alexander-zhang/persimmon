            element: EL-7
      - id: T-2
        title: Show service-due cars to the fleet coordinator
        block: BB-3
        description: Present the Service-due cars view so the fleet coordinator can see, as soon as a car crosses its service threshold, that it needs a garage booking.
        covers:
          - FR-1
        verifiedBy:
