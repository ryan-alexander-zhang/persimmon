        events:
          - Long reservation approval requested
        readModels:
          - Pending approvals view
        acceptance:
          - id: AC-5
            title: Pending approvals view lists awaiting decisions
            given:
              - a pending long-reservation approval request for employee A's 5-day reservation from 2026-10-20 to 2026-10-25
              - a pending long-reservation approval request for employee B's 4-day reservation from 2026-11-01 to 2026-11-05
            when:
              - the fleet coordinator opens the pending approvals view
            then:
              - both requests are listed, each with its employee and requested slot
    requirements:
      - id: FR-1
        pattern: state-driven
        statement: While a requested reservation breaks BR-10, the system shall request the fleet coordinator's approval before creating the reservation.
        rules:
          - BR-10
      - id: FR-2
        pattern: event-driven
        statement: When the fleet coordinator approves a long reservation, the system shall create the reservation.
      - id: FR-3
        pattern: event-driven
        statement: When the fleet coordinator denies a long reservation, the system shall decline the reservation request.
      - id: FR-4
        pattern: event-driven
        statement: When a long reservation approval request is not decided by the reservation's requested start, the system shall lapse the approval and decline the reservation request.
      - id: FR-5
        pattern: state-driven
        statement: While a reservation awaits a long-reservation decision, the system shall list it in the Pending approvals view.
    qualities: []
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: car-pool-prd-cap-6.r1
spec:
  identity:
    id: car-pool-prd-cap-6
    revision: 1
  content:
    businessRules: car-pool-rules
    title: Cancel Reservations When a Car Leaves Service
    prd: car-pool-prd
    capability: CAP-6
    architecture: car-pool-prd-architecture
    domainModel: car-reservations-model
    stories:
      - id: US-1
        role: Employee
        goal: learn right away that a car I hold a future reservation for has been taken out of service, and have that reservation cancelled rather than discovered as a surprise at pickup
        benefit: so that I can reserve another car without delay (G-6)
        requirements:
          - FR-1
          - FR-2
        commands:
          - Cancel reservation
          - Notify affected employees
        events:
          - Future reservations cancelled for out-of-service car
          - Affected employees notified
        readModels:
          - My reservations view
        acceptance:
          - id: AC-1
            title: Single future reservation cancelled when the car leaves service
            given:
              - A car with plate 11-AB-23 is in service.
              - Employee Maria holds one future reservation for that car for the slot 2026-10-20 09:00 to 2026-10-20 12:00.
            when:
              - Fleet care takes the car out of service for unsafe damage.
            then:
              - Maria's reservation for 2026-10-20 09:00 to 12:00 is cancelled.
              - Maria is notified the same day that her reservation was cancelled because the car left service.
          - id: AC-2
            title: All future reservations for the car are cancelled and every holder notified
            given:
              - A car with plate 11-AB-23 is in service.
              - Employee Maria holds a future reservation for that car for 2026-10-20 09:00 to 12:00.
              - Employee Tom holds a future reservation for that car for 2026-10-22 13:00 to 17:00.
            when:
              - Fleet care takes the car out of service for scheduled maintenance.
            then:
              - Both Maria's and Tom's reservations are cancelled.
              - Maria and Tom are each notified the same day that their reservation was cancelled because the car left service.
          - id: AC-3
            title: No reservation held, no cancellation or notification
            given:
              - A car with plate 44-CD-10 is in service with no future reservations held for it.
            when:
              - Fleet care takes the car out of service for scheduled maintenance.
            then:
              - No reservation is cancelled.
              - No employee is notified.
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When a car is taken out of service, the system shall cancel every future reservation held for that car.
        rules:
          - BR-20
      - id: FR-2
        pattern: event-driven
        statement: When future reservations are cancelled for an out-of-service car, the system shall notify each affected employee.
        rules:
          - BR-20
    qualities:
      - scenario: QS-6
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: car-pool-prd-cap-7.r1
spec:
  identity:
    id: car-pool-prd-cap-7
    revision: 1
  content:
    businessRules: car-pool-rules
    title: Maintain Fleet Record
    prd: car-pool-prd
    capability: CAP-7
    architecture: car-pool-prd-architecture
    domainModel: fleet-care-model
    stories:
      - id: US-1
        role: Fleet coordinator
        goal: update a car's plate, seats, gearbox, van flag, and next-service threshold
        benefit: the fleet coordinator keeps one accurate, current record of every car instead of a spreadsheet (G-5)
        requirements:
          - FR-1
          - FR-2
        commands:
          - Update car record
        events:
          - Car record updated
        acceptance:
          - id: AC-1
            title: Coordinator updates a car's record
            given:
              - a car with plate 59-XYZ-3, 5 seats, manual gearbox, no van flag, and next-service threshold of 30,000 km
            when:
              - the fleet coordinator updates the car's record to set the gearbox to automatic and the next-service threshold to 35,000 km
            then:
              - the car's record shows automatic gearbox and a next-service threshold of 35,000 km
              - a Car record updated event is recorded
      - id: US-2
        role: Fleet coordinator
        goal: keep each car's mileage current from the mileage recorded at return
        benefit: the fleet coordinator keeps one accurate, current record of every car instead of a spreadsheet (G-5)
        requirements:
          - FR-3
        commands:
          - Update car mileage
        events:
          - Car mileage updated
        acceptance:
          - id: AC-2
            title: Mileage updates from a return's mileage reading
            given:
              - a car currently recorded at 42,000 km
              - the car is returned with a mileage reading of 42,180 km
            when:
              - the car's mileage is updated from the return's mileage reading
            then:
              - the car's record shows mileage 42,180 km
              - a Car mileage updated event is recorded
      - id: US-3
        role: Fleet coordinator
        goal: read plate, mileage, service due, and in/out-of-service state for every car from one record
        benefit: the fleet coordinator keeps one accurate, current record of every car instead of a spreadsheet (G-5)
        requirements:
          - FR-4
        readModels:
          - Fleet record view
        acceptance:
          - id: AC-3
            title: Coordinator reads the fleet record
            given:
              - twelve cars in the fleet, each with a plate, mileage, next-service threshold, and service state
            when:
              - the fleet coordinator opens the Fleet record view
            then:
              - the view shows plate, mileage, next-service threshold, and service state for every car
    requirements:
      - id: FR-1
        pattern: ubiquitous
        statement: The system shall maintain each car's record per BR-14.
        rules:
          - BR-14
      - id: FR-2
        pattern: event-driven
        statement: When the fleet coordinator updates a car's plate, seats, gearbox, van flag, or next-service threshold, the system shall record the update.
      - id: FR-3
        pattern: event-driven
        statement: When a car is returned with a mileage reading, the system shall update the car's mileage in the fleet record.
      - id: FR-4
        pattern: ubiquitous
        statement: The system shall provide a Fleet record view showing each car's plate, mileage, next-service threshold, and service state.
    qualities:
      - scenario: QS-5
    openQuestions:
      - id: Q-1
        question: The Fleet Care domain model's Car aggregate has an 'Update car record' command but no command for first registering a new car in the fleet; how is a new car's record initially created?
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: car-pool-prd-cap-8.r1
spec:
  identity:
    id: car-pool-prd-cap-8
    revision: 1
  content:
    businessRules: car-pool-rules
    title: Manage Scheduled Service
    prd: car-pool-prd
    capability: CAP-8
    architecture: car-pool-prd-architecture
    domainModel: fleet-care-model
    stories:
      - id: US-1
        role: Fleet coordinator
        goal: see which cars have crossed their service threshold
        benefit: so that a car due for service is never handed out for a trip that would run past that service (G-3)
        requirements:
          - FR-1
          - FR-2
        commands:
          - Mark car service-due
        events:
          - Car became service-due
        readModels:
          - Service-due view
        acceptance:
          - id: AC-1
            title: Mileage crossing the threshold marks a car service-due
            given:
              - Car NL-12-AB has mileage 89,800 km and a next-service threshold of 90,000 km mileage
              - Car NL-12-AB is in-service and not marked service-due
            when:
              - Car NL-12-AB's mileage is updated to 90,200 km at return
            then:
              - Car NL-12-AB is marked service-due
              - Car NL-12-AB appears on the Service-due view
          - id: AC-2
            title: Reaching the threshold date marks a car service-due
            given:
              - Car NL-34-CD has a next-service threshold date of 1 October 2026
              - Car NL-34-CD is in-service and not marked service-due
            when:
              - the current date reaches 1 October 2026 for Car NL-34-CD
            then:
              - Car NL-34-CD is marked service-due
              - Car NL-34-CD appears on the Service-due view
      - id: US-2
        role: Fleet coordinator
        goal: take a service-due car out of service for the days it is booked with the garage
        benefit: so that a car due for service is never handed out for a trip that would run past that service (G-3)
        requirements:
          - FR-3
        commands:
          - Schedule car service
        events:
          - Car taken out of service for scheduled maintenance
        readModels:
          - Service-due view
        acceptance:
          - id: AC-3
            title: Scheduling garage service takes a service-due car out of service
            given:
              - Car NL-12-AB is marked service-due
              - Car NL-12-AB is in-service
            when:
              - the fleet coordinator schedules Car NL-12-AB's service with the garage for 16-17 October 2026
            then:
              - Car NL-12-AB is taken out of service for scheduled maintenance
              - Car NL-12-AB's service state is out-of-service
      - id: US-3
        role: Fleet coordinator
        goal: put a car back in service with its new mileage and next-service threshold once the garage returns it
        benefit: so that the fleet coordinator keeps one accurate, current record of every car's condition and availability instead of a spreadsheet (G-5)
        requirements:
          - FR-4
          - FR-5
        commands:
          - Return car to service after maintenance
        events:
          - Car serviced by garage
          - Car returned to service after maintenance
        readModels:
          - Garage status view
          - Fleet record view
        acceptance:
          - id: AC-4
            title: Recording the garage's completion shows the car as serviced
            given:
              - Car NL-12-AB is out of service for scheduled maintenance, booked with the garage for 16-17 October 2026
            when:
              - the fleet coordinator records that the garage has completed Car NL-12-AB's service
            then:
              - Car serviced by garage is recorded for Car NL-12-AB
              - Car NL-12-AB appears serviced on the Garage status view
          - id: AC-5
            title: Returning a serviced car restores it to service with the updated record
            given:
              - Car NL-12-AB is out of service for scheduled maintenance
              - the garage has returned Car NL-12-AB with mileage 95,000 km and a next-service threshold of 105,000 km mileage
            when:
              - the fleet coordinator returns Car NL-12-AB to service recording mileage 95,000 km and next-service threshold 105,000 km mileage
            then:
              - Car NL-12-AB's service state becomes in-service
              - Car NL-12-AB's mileage is recorded as 95,000 km
              - Car NL-12-AB's next-service threshold is recorded as 105,000 km mileage
              - Car NL-12-AB's current record is reflected on the Fleet record view
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When a car's mileage or date crosses its next-service threshold, the system shall mark the car service-due.
        rules:
          - BR-15
      - id: FR-2
        pattern: state-driven
        statement: While a car is marked service-due, the system shall list it on the Service-due view for the fleet coordinator.
      - id: FR-3
        pattern: event-driven
        statement: When the fleet coordinator schedules garage service for a service-due car, the system shall take the car out of service for the booked garage days.
        rules:
          - BR-16
      - id: FR-4
        pattern: event-driven
        statement: When the fleet coordinator records that the garage has completed a car's service, the system shall show the car as serviced on the Garage status view.
      - id: FR-5
        pattern: event-driven
        statement: When the fleet coordinator returns a car from scheduled maintenance, the system shall return the car to service with the recorded mileage and next-service threshold.
        rules:
          - BR-21
    qualities:
      - scenario: QS-2
      - scenario: QS-5
    openQuestions: []
---
apiVersion: sdd.persimmon.ai/v1
kind: Spec
metadata:
  name: car-pool-prd-cap-9.r1
spec:
  identity:
    id: car-pool-prd-cap-9
    revision: 1
  content:
    businessRules: car-pool-rules
    title: Review damage reports
    prd: car-pool-prd
    capability: CAP-9
    architecture: car-pool-prd-architecture
    domainModel: fleet-care-model
    stories:
      - id: US-1
        role: Fleet coordinator
        goal: review a damage report opened from a return's damage note
        benefit: damage found on return reaches me right away, not weeks later with the next driver (G-4)
        requirements:
          - FR-1
          - FR-2
          - FR-3
        commands:
          - Review damage report
        events:
          - Damage report opened
          - Damage report reviewed as minor
          - Damage report reviewed as unsafe
          - Car taken out of service for unsafe damage
        readModels:
          - Damage reports view
        acceptance:
          - id: AC-1
            title: Damage note opens a report
            given:
              - A car is returned with a damage note describing a scratch on the rear bumper
            when:
              - Open damage report
            then:
              - A damage report for the scratch on the rear bumper is opened and appears in the Damage reports view
              - The car's service state is unchanged, still in-service
          - id: AC-2
            title: Minor damage review keeps the car in service
            given:
              - An open damage report for a scratch on the rear bumper on car NL-12-AB, car currently in-service
            when:
              - Fleet coordinator reviews the damage report as minor (Review damage report)
            then:
              - The damage report is recorded with review outcome minor
              - The car remains in-service
          - id: AC-3
            title: Unsafe damage review takes the car out of service
            given:
              - An open damage report for a cracked windscreen on car NL-34-CD, car currently in-service
            when:
              - Fleet coordinator reviews the damage report as unsafe (Review damage report)
            then:
              - The damage report is recorded with review outcome unsafe
              - The car is taken out of service at once (Car taken out of service for unsafe damage)
    requirements:
      - id: FR-1
        pattern: event-driven
        statement: When a damage note is recorded at return, the system shall open a damage report.
        rules:
          - BR-17
      - id: FR-2
        pattern: event-driven
        statement: When the fleet coordinator reviews a damage report as minor, the system shall keep the car in service.
        rules:
          - BR-18
      - id: FR-3
        pattern: event-driven
        statement: When the fleet coordinator reviews a damage report as unsafe, the system shall take the car out of service at once.
        rules:
          - BR-19
    qualities:
      - scenario: QS-4
    openQuestions:
      - id: Q-1
        question: "What distinguishes damage reviewed as minor from damage that makes a car unsafe: coordinator judgment alone, or a checklist?"
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: car-pool-prd-architecture-bb-1-reservations-http-api.r1
spec:
  identity:
    id: car-pool-prd-architecture-bb-1-reservations-http-api
    revision: 1
  content:
    businessRules: car-pool-rules
    title: Reservation API
    type: http-api
    architecture: car-pool-prd-architecture
    block: BB-1
    domainModel: car-reservations-model
    interface: Reservation API
    document:
      mediaType: application/openapi+yaml
      content: |
        openapi: 3.1.0
        info:
          title: Reservation API
          version: "1.0.0"
          description: >
            Create, cancel, approve/deny, pick up, and return reservations;
            list available cars, my reservations, pending approvals, and
            employee reliability counts. Served by the Car Reservations module
            of the Car Pool Service (BB-1). The signed-in identity and role
            (Employee or Fleet coordinator) come from the company directory
            (CC-3); endpoints below note which role calls them.
        paths:
          /available-cars:
            get:
              operationId: listAvailableCars
              summary: List cars fitting a trip's needs and slot
              description: >
                Called by an Employee. Returns only cars that fit the stated
                passenger count, equipment need, and gearbox preference, are
                in service, are not already reserved for an overlapping slot,
                and are not service-due before the slot ends (BR-2, BR-3,
                BR-4, BR-5, BR-6, BR-7).
              parameters:
                - name: passengerCount
                  in: query
                  required: true
                  schema:
                    type: integer
                    minimum: 1
                - name: equipmentNeed
                  in: query
                  required: true
                  schema:
                    type: boolean
                - name: gearboxPreference
                  in: query
                  required: true
                  schema:
                    $ref: '#/components/schemas/GearboxPreference'
                - name: slotStart
                  in: query
                  required: true
                  schema:
                    type: string
                    format: date-time
                - name: slotEnd
                  in: query
                  required: true
                  schema:
                    type: string
                    format: date-time
              responses:
                '200':
                  description: Cars fitting the stated trip and slot
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/Car'
          /reservations:
            post:
              operationId: createReservation
              summary: Create a reservation for one chosen car
              description: >
                Called by an Employee, naming exactly one car (BR-1) from the
                Available cars list. Fitness and service-due are re-checked
                synchronously at creation (S-3). A request longer than three
                days is not created directly; it is held pending the fleet
                coordinator's approval (BR-10) and returned with status
                'pending approval'.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ReservationCreateRequest'
              responses:
                '201':
                  description: Reservation created
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Reservation'
                '202':
                  description: >
                    Reservation request longer than three days accepted pending
                    the fleet coordinator's approval (BR-10)
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Reservation'
                '409':
                  description: >
                    Refused: the slot overlaps another reservation already held
                    for the car (BR-5), or the employee already holds two future
                    reservations (BR-9)
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/RuleViolation'
                '422':
                  description: >
                    Refused: the car does not fit the trip (BR-2, BR-3, BR-4),
                    is out of service (BR-6), or is service-due before the slot
                    ends (BR-7)
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/RuleViolation'
          /reservations/{reservationId}/cancel:
            post:
              operationId: cancelReservation
              summary: Cancel a reservation
              description: Called by an Employee to cancel their own reservation.
              parameters:
                - name: reservationId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Reservation cancelled
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Reservation'
          /reservations/{reservationId}/approve:
            post:
              operationId: approveLongReservation
              summary: Approve a long reservation request
              description: >
                Called by the Fleet coordinator on a reservation pending
                approval because it exceeds the three-day standard limit
                (BR-10); the reservation is then created.
              parameters:
                - name: reservationId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Long reservation approved and created
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Reservation'
          /reservations/{reservationId}/deny:
            post:
              operationId: denyLongReservation
              summary: Deny a long reservation request
              description: >
                Called by the Fleet coordinator on a reservation pending
                approval (BR-10); the request is declined, not created.
              parameters:
                - name: reservationId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Long reservation denied
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Reservation'
          /reservations/{reservationId}/pickup:
            post:
              operationId: pickUpCar
              summary: Record pickup of the reserved car
              description: Called by an Employee at pickup.
              parameters:
                - name: reservationId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                '200':
                  description: Car picked up
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Reservation'
          /reservations/{reservationId}/return:
            post:
              operationId: returnCar
              summary: Record return of the car, with any damage note
              description: Called by an Employee at return.
              parameters:
                - name: reservationId
                  in: path
                  required: true
                  schema:
                    type: string
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ReservationReturnRequest'
              responses:
                '200':
                  description: Car returned
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Reservation'
          /my-reservations:
            get:
              operationId: listMyReservations
              summary: List the signed-in employee's own reservations and reliability count
              description: Called by an Employee.
              responses:
                '200':
                  description: The employee's reservations and own reliability count
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/MyReservationsView'
          /pending-approvals:
            get:
              operationId: listPendingApprovals
              summary: List reservation requests awaiting a long-reservation decision
              description: Called by the Fleet coordinator (BR-10).
              responses:
                '200':
                  description: Reservations pending approval
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/PendingApproval'
          /employee-reliability:
            get:
              operationId: listEmployeeReliability
              summary: List every employee's monthly reliability count
              description: >
                Called by the Fleet coordinator; informational only, no rule
                restricts bookings on it today (CC-7).
              responses:
                '200':
                  description: Every employee's late cancellation and no-show counts
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/EmployeeReliability'
        components:
          securitySchemes:
            ssoAuth:
              type: http
              scheme: bearer
              bearerFormat: JWT
              description: >
                Token issued after sign-in through the company directory
                (CC-3); carries the signed-in identity and Employee or Fleet
                coordinator role.
          schemas:
            GearboxPreference:
              type: string
              enum: [manual, automatic]
            ReservationStatus:
              type: string
              enum:
                - pending approval
                - approved
                - declined
                - created
                - cancelled
                - picked up
                - returned
                - released unclaimed
            Car:
              type: object
              required: [carId]
              properties:
                carId:
                  type: string
            ReservationCreateRequest:
              type: object
              required:
                - carId
                - passengerCount
                - equipmentNeed
                - gearboxPreference
                - slotStart
                - slotEnd
              properties:
                carId:
                  type: string
                  description: Names the one car this reservation is for (BR-1)
                passengerCount:
                  type: integer
                  minimum: 1
                equipmentNeed:
                  type: boolean
                gearboxPreference:
                  $ref: '#/components/schemas/GearboxPreference'
                slotStart:
                  type: string
                  format: date-time
                slotEnd:
                  type: string
                  format: date-time
            Reservation:
              type: object
              properties:
                id:
                  type: string
                carId:
                  type: string
                employeeId:
                  type: string
                passengerCount:
                  type: integer
                equipmentNeed:
                  type: boolean
                gearboxPreference:
                  $ref: '#/components/schemas/GearboxPreference'
                slotStart:
                  type: string
                  format: date-time
                slotEnd:
                  type: string
                  format: date-time
                status:
                  $ref: '#/components/schemas/ReservationStatus'
            ReservationReturnRequest:
              type: object
              properties:
                damageNoted:
                  type: boolean
                damageLocation:
                  type: string
                damageDrivableFlag:
                  type: boolean
                damagePhoto:
                  type: string
                  description: Reference to the damage photo (Q-1)
            MyReservationsView:
              type: object
              properties:
                reservations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        $ref: '#/components/schemas/ReservationStatus'
                      slotStart:
                        type: string
                        format: date-time
                      slotEnd:
                        type: string
                        format: date-time
                reliability:
                  type: object
                  properties:
                    lateCancellationCount:
                      type: integer
                    noShowCount:
                      type: integer
            PendingApproval:
              type: object
              properties:
                reservationId:
                  type: string
                employeeId:
                  type: string
                slotStart:
                  type: string
                  format: date-time
                slotEnd:
                  type: string
                  format: date-time
            EmployeeReliability:
              type: object
              properties:
                employeeId:
                  type: string
                lateCancellationCount:
                  type: integer
                noShowCount:
                  type: integer
            RuleViolation:
              type: object
              required: [rule, message]
              properties:
                rule:
                  type: string
                  pattern: '^BR-[0-9]+$'
                message:
                  type: string
        security:
          - ssoAuth: []
    elements:
      - id: EL-1
        name: GET /available-cars
        realises:
          kind: readModel
          name: Available cars view
        rules:
          - BR-2
          - BR-3
          - BR-4
          - BR-5
          - BR-6
          - BR-7
      - id: EL-2
        name: POST /reservations
        realises:
          kind: command
          name: Create reservation
        rules:
          - BR-1
          - BR-2
          - BR-3
          - BR-4
          - BR-5
          - BR-6
          - BR-7
          - BR-9
          - BR-10
      - id: EL-3
        name: POST /reservations/{reservationId}/cancel
        realises:
          kind: command
          name: Cancel reservation
      - id: EL-4
        name: POST /reservations/{reservationId}/approve
        realises:
          kind: command
          name: Approve long reservation
        rules:
          - BR-10
      - id: EL-5
        name: POST /reservations/{reservationId}/deny
        realises:
          kind: command
          name: Deny long reservation
        rules:
          - BR-10
      - id: EL-6
        name: POST /reservations/{reservationId}/pickup
        realises:
          kind: command
          name: Pick up car
      - id: EL-7
        name: POST /reservations/{reservationId}/return
        realises:
          kind: command
          name: Return car
      - id: EL-8
        name: GET /my-reservations
        realises:
          kind: readModel
          name: My reservations view
      - id: EL-9
        name: GET /pending-approvals
        realises:
          kind: readModel
          name: Pending approvals view
      - id: EL-10
        name: GET /employee-reliability
        realises:
          kind: readModel
          name: Employee reliability view
    rules:
      - BR-1
      - BR-2
      - BR-3
      - BR-4
      - BR-5
      - BR-6
      - BR-7
      - BR-9
      - BR-10
    decisions:
      - car-pool-prd-adr-1
      - car-pool-prd-adr-2
      - car-pool-prd-adr-3
      - car-pool-prd-adr-4
    openQuestions:
      - id: Q-1
        question: The Glossary gives 'Reservation has damage photo' only as a string; whether the API accepts a binary upload or a URI reference to an externally stored photo is unspecified.
        resolution: Modelled damagePhoto as an opaque string reference pending a decision on photo storage.
      - id: Q-2
        question: The DomainModel's policy POL-1 has 'Fitting cars offered' automatically trigger 'Create reservation', suggesting the system might auto-assign a car, while the block's responsibility describes a separate 'list available cars' action, suggesting the employee picks one. Which is authoritative is unresolved.
        resolution: Modelled POST /reservations as requiring an explicit carId chosen from the Available cars list, with fitness re-checked synchronously at creation (S-3).
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: car-pool-prd-architecture-bb-1-car-reservations-data-schema.r1
spec:
  identity:
    id: car-pool-prd-architecture-bb-1-car-reservations-data-schema
    revision: 1
  content:
    businessRules: car-pool-rules
    title: Car Reservations Module Data Schema
    type: data-schema
    architecture: car-pool-prd-architecture
    block: BB-1
    domainModel: car-reservations-model
    document:
      mediaType: application/sql
      content: |
        -- Car Reservations module schema (owned exclusively by the car-reservations bounded context within the Car Pool Service's shared store, CC-4, CC-8).
        -- No cross-schema foreign keys: car_id references the Fleet Care module's Car record (S-3's in-process query, not a DB-level FK); employee_id references the company directory (C-2), not a local table.
        -- Dialect: portable ANSI SQL (engine choice open, see Q-1); no engine-specific functions or types used.

        CREATE TABLE reservation (
            id                      CHAR(36)      NOT NULL,
            employee_id             CHAR(36)      NOT NULL,
            car_id                  CHAR(36)      NOT NULL,
            passenger_count         INTEGER       NOT NULL,
            equipment_need          BOOLEAN       NOT NULL,
            gearbox_preference      VARCHAR(10)   NOT NULL,
            slot_start              TIMESTAMP     NOT NULL,
            slot_end                TIMESTAMP     NOT NULL,
            status                  VARCHAR(20)   NOT NULL,
            damage_location         VARCHAR(255)      NULL,
            damage_drivable_flag    BOOLEAN           NULL,
            damage_photo            VARCHAR(2048)     NULL,
            PRIMARY KEY (id),
            CHECK (gearbox_preference IN ('manual', 'automatic')),
            CHECK (status IN ('pending approval', 'approved', 'declined', 'created', 'cancelled', 'picked up', 'returned', 'released unclaimed')),
            CHECK (car_id IS NOT NULL)
        );

        CREATE TABLE employee_reliability (
            employee_id              CHAR(36) NOT NULL,
            late_cancellation_count  INTEGER  NOT NULL DEFAULT 0,
            no_show_count            INTEGER  NOT NULL DEFAULT 0,
            PRIMARY KEY (employee_id),
            CHECK (late_cancellation_count >= 0),
            CHECK (no_show_count >= 0)
        );
    elements:
      - id: EL-1
        name: reservation
        realises:
          kind: aggregate
          name: AG-1
        rules:
          - BR-1
      - id: EL-2
        name: employee_reliability
        realises:
          kind: aggregate
          name: AG-2
        rules: []
    rules:
      - BR-1
    decisions:
      - car-pool-prd-adr-1
      - car-pool-prd-adr-2
      - car-pool-prd-adr-3
      - car-pool-prd-adr-4
    openQuestions:
      - id: Q-1
        question: Which relational database engine backs the Car Pool Service's shared store (the Architecture names only 'relational database' with one schema per module, CC-4, without naming a product, e.g. PostgreSQL, SQLite, MySQL)? This document uses portable ANSI SQL types and avoids engine-specific constructs (no EXCLUDE constraints for BR-5's overlap check, no vendor interval arithmetic for BR-9's two-future-reservations limit or BR-10's three-day approval threshold) until a specific engine is chosen; those three invariants are enforced by the Car Reservations module's application logic at creation time (CC-5) rather than by a table constraint, since a single current-row snapshot cannot express a cross-row or historical check portably.
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: car-pool-prd-architecture-bb-1-fleet-http-api.r1
spec:
  identity:
    id: car-pool-prd-architecture-bb-1-fleet-http-api
    revision: 1
  content:
    businessRules: car-pool-rules
    title: Car Pool Service — Fleet record API
    type: http-api
    architecture: car-pool-prd-architecture
    block: BB-1
    domainModel: fleet-care-model
    interface: Fleet record API
    document:
      mediaType: application/openapi+yaml
      content: |
        openapi: 3.1.0
        info:
          title: Fleet record API
          version: "1.0"
          description: >
            Car Pool Service, Fleet Care module. Lets the Fleet coordinator maintain
            each car's fleet record, schedule and complete garage service, return a
            repaired car to service, and review damage reports.
        servers:
          - url: /api/fleet
        paths:
          /cars/{carId}:
            parameters:
              - name: carId
                in: path
                required: true
                schema:
                  type: string
            put:
              operationId: updateCarRecord
              summary: Update car record
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/CarRecordInput'
              responses:
                '200':
                  description: Car record updated
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Car'
                '400':
                  description: Refused, a required fleet record field is missing (BR-14)
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Refusal'
          /cars:
            get:
              operationId: listFleetRecord
              summary: Fleet record view
              responses:
                '200':
                  description: Current fleet record, one entry per car
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/FleetRecordView'
          /cars/{carId}/schedule-service:
            parameters:
              - name: carId
                in: path
                required: true
                schema:
                  type: string
            post:
              operationId: scheduleCarService
              summary: Schedule car service
              responses:
                '200':
                  description: Car booked in with the garage and taken out of service for the booked days (BR-16)
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Car'
          /cars/{carId}/complete-service:
            parameters:
              - name: carId
                in: path
                required: true
                schema:
                  type: string
            post:
              operationId: completeCarService
              summary: Return car to service after maintenance
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ServiceCompletionInput'
              responses:
                '200':
                  description: Car put back in service with the garage's reported mileage and next-service threshold (BR-21)
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Car'
          /cars/{carId}/return-from-repair:
            parameters:
              - name: carId
                in: path
                required: true
                schema:
                  type: string
            post:
              operationId: returnCarFromRepair
              summary: Return car to service after repair
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/ServiceCompletionInput'
              responses:
                '200':
                  description: Car put back in service after repair
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Car'
          /cars/service-due:
            get:
              operationId: listServiceDue
              summary: Service-due view
              responses:
                '200':
                  description: Cars whose mileage or date crossed their next-service threshold (BR-15)
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceDueView'
          /garage-status:
            get:
              operationId: listGarageStatus
              summary: Garage status view
              responses:
                '200':
                  description: Cars and whether the garage has finished servicing them
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/GarageStatusView'
          /damage-reports:
            get:
              operationId: listDamageReports
              summary: Damage reports view
              responses:
                '200':
                  description: Damage reports opened from a return's damage note, awaiting or holding review (BR-17)
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/DamageReportsView'
          /damage-reports/{damageReportId}/review:
            parameters:
              - name: damageReportId
                in: path
                required: true
                schema:
                  type: string
            post:
              operationId: reviewDamageReport
              summary: Review damage report
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/DamageReviewInput'
              responses:
                '200':
                  description: >
                    Reviewed as minor the car remains in service (BR-18); reviewed as
                    unsafe the car is taken out of service at once (BR-19).
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/DamageReport'
        components:
          schemas:
            Refusal:
              type: object
              required: [rule, message]
              properties:
                rule:
                  type: string
                  description: The BR-n broken
                message:
                  type: string
            CarRecordInput:
              type: object
              required: [plate, seats, gearbox, vanFlag, nextServiceThreshold]
              properties:
                plate:
                  type: string
                seats:
                  type: integer
                gearbox:
                  type: string
                  enum: [automatic, manual]
                vanFlag:
                  type: boolean
                nextServiceThreshold:
                  type: string
            Car:
              type: object
              properties:
                carId:
                  type: string
                plate:
                  type: string
                seats:
                  type: integer
                gearbox:
                  type: string
                  enum: [automatic, manual]
                vanFlag:
                  type: boolean
                mileage:
                  type: integer
                nextServiceThreshold:
                  type: string
                serviceState:
                  type: string
                  enum: [in-service, out-of-service]
            FleetRecordView:
              type: object
              properties:
                carId:
                  type: string
                plate:
                  type: string
                mileage:
                  type: integer
                nextServiceThreshold:
                  type: string
                serviceState:
                  type: string
                  enum: [in-service, out-of-service]
            ServiceDueView:
              type: object
              properties:
                carId:
                  type: string
                plate:
                  type: string
                nextServiceThreshold:
                  type: string
            GarageStatusView:
              type: object
              properties:
                carId:
                  type: string
                plate:
                  type: string
                serviceState:
                  type: string
                  enum: [in-service, out-of-service]
            ServiceCompletionInput:
              type: object
              required: [mileage, nextServiceThreshold]
              properties:
                mileage:
                  type: integer
                nextServiceThreshold:
                  type: string
            DamageReviewInput:
              type: object
              required: [reviewOutcome]
              properties:
                reviewOutcome:
                  type: string
                  enum: [minor, unsafe]
            DamageReport:
              type: object
              properties:
                damageReportId:
                  type: string
                carId:
                  type: string
                location:
                  type: string
                drivableFlag:
                  type: boolean
                photos:
                  type: string
                reviewOutcome:
                  type: string
                  enum: [minor, unsafe]
            DamageReportsView:
              type: object
              properties:
                damageReportId:
                  type: string
                carId:
                  type: string
                location:
                  type: string
                drivableFlag:
                  type: boolean
                photos:
                  type: string
                reviewOutcome:
                  type: string
                  enum: [minor, unsafe]
          securitySchemes:
            ssoBearer:
              type: http
              scheme: bearer
              bearerFormat: OIDC
        security:
          - ssoBearer: []
    elements:
      - id: EL-1
        name: PUT /cars/{carId}
        realises:
          kind: command
          name: Update car record
        rules:
          - BR-14
      - id: EL-2
        name: GET /cars
        realises:
          kind: readModel
          name: Fleet record view
        rules: []
      - id: EL-3
        name: POST /cars/{carId}/schedule-service
        realises:
          kind: command
          name: Schedule car service
        rules:
          - BR-16
      - id: EL-4
        name: POST /cars/{carId}/complete-service
        realises:
          kind: command
          name: Return car to service after maintenance
        rules:
          - BR-21
      - id: EL-5
        name: POST /cars/{carId}/return-from-repair
        realises:
          kind: command
          name: Return car to service after repair
        rules: []
      - id: EL-6
        name: GET /cars/service-due
        realises:
          kind: readModel
          name: Service-due view
        rules:
          - BR-15
      - id: EL-7
        name: GET /garage-status
        realises:
          kind: readModel
          name: Garage status view
        rules: []
      - id: EL-8
        name: GET /damage-reports
        realises:
          kind: readModel
          name: Damage reports view
        rules:
          - BR-17
      - id: EL-9
        name: POST /damage-reports/{damageReportId}/review
        realises:
          kind: command
          name: Review damage report
        rules:
          - BR-18
          - BR-19
    rules:
      - BR-14
      - BR-15
      - BR-16
      - BR-17
      - BR-18
      - BR-19
      - BR-21
    decisions:
      - car-pool-prd-adr-1
      - car-pool-prd-adr-2
      - car-pool-prd-adr-3
      - car-pool-prd-adr-4
    openQuestions:
      - id: Q-1
        question: The DomainModel names only an 'Update car record' command for the Car aggregate's reference fields (plate, seats, gearbox, van flag, next-service threshold); it does not distinguish registering a new car in the fleet from updating an existing one. This API treats PUT /cars/{carId} as an upsert pending clarification.
      - id: Q-2
        question: Unlike scheduled maintenance, which the external Garage system completes and reports back (event 'Car serviced by garage'), the DomainModel ties no policy or external trigger to 'Return car to service after repair'. Whether this is purely a manual Fleet coordinator action, or needs a repair-confirmation step from an external repairer, is unresolved.
---
apiVersion: sdd.persimmon.ai/v1
kind: Design
metadata:
  name: car-pool-prd-architecture-bb-1-fleet-care-data-schema.r1
spec:
  identity:
    id: car-pool-prd-architecture-bb-1-fleet-care-data-schema
    revision: 1
  content:
    businessRules: car-pool-rules
    title: Car Pool Service Fleet Care Data Schema
    type: data-schema
    architecture: car-pool-prd-architecture
    block: BB-1
    domainModel: fleet-care-model
    document:
      mediaType: application/sql
      content: |
        CREATE SCHEMA fleet_care;

        CREATE TABLE fleet_care.car (
            id                      VARCHAR(36)  NOT NULL,
            plate                   VARCHAR(20)  NOT NULL,
            seats                   INTEGER      NOT NULL CHECK (seats > 0),
            gearbox                 VARCHAR(10)  NOT NULL CHECK (gearbox IN ('automatic', 'manual')),
            van_flag                BOOLEAN      NOT NULL,
            mileage                 INTEGER      NOT NULL CHECK (mileage >= 0),
            next_service_threshold  VARCHAR(50)  NOT NULL,
            service_state            VARCHAR(20)  NOT NULL CHECK (service_state IN ('in-service', 'out-of-service')),
            PRIMARY KEY (id),
            UNIQUE (plate)
        );

        CREATE TABLE fleet_care.damage_report (
            id              VARCHAR(36)  NOT NULL,
            car_id          VARCHAR(36)  NOT NULL,
            location        VARCHAR(200) NOT NULL,
            drivable_flag   BOOLEAN      NOT NULL,
            photos          TEXT         NOT NULL,
            review_outcome  VARCHAR(10)  CHECK (review_outcome IN ('minor', 'unsafe')),
            PRIMARY KEY (id),
            FOREIGN KEY (car_id) REFERENCES fleet_care.car (id)
        );
    elements:
      - id: EL-1
        name: car
        realises:
          kind: aggregate
          name: AG-1
        rules:
          - BR-14
      - id: EL-2
        name: damage_report
        realises:
          kind: aggregate
          name: AG-2
        rules:
          - BR-17
    rules:
      - BR-14
      - BR-17
    decisions:
      - car-pool-prd-adr-1
      - car-pool-prd-adr-3
      - car-pool-prd-adr-4
    openQuestions:
      - id: Q-1
        question: BB-1's technology names a relational database without a specific engine. This schema is written in portable ANSI SQL (no engine-specific types or clauses). Which RDBMS engine will host the Car Pool Service's shared store, so engine-specific types (e.g. a native UUID or ENUM type) can be adopted if desired?
---
apiVersion: sdd.persimmon.ai/v1
kind: DesignSystem
