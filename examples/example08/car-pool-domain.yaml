        title: Put a serviced car back into service
        block: BB-2
        description: When the garage returns a serviced car, record its new mileage and next service threshold and put it back into service; refuse the request, citing BR-18, when the car is not currently out of service.
        covers:
          - FR-4
          - FR-5
        verifiedBy:
          - AC-5
          - AC-6
        dependsOn:
