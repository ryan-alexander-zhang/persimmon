            when:
              - Thirty minutes pass after the slot start with no pickup recorded
            then:
              - The reservation is released as unclaimed
              - The car becomes available for another employee to reserve
      - id: US-3
        role: Employee
        goal: return the car, recording the mileage read off the dashboard and noting any new damage
        benefit: so that the fleet coordinator keeps one accurate, current record of the car's mileage and condition (G-5), and any damage reaches them right away, not weeks later (G-4)
        requirements:
