  content:
    title: Fleet Care Glossary
    context: fleet-care
    terms:
      - name: Car
        definition: Owns a car's plate, seats, gearbox, van flag, mileage, service-due derivation, and its out-of-service/back-in-service transitions for both scheduled maintenance and unsafe-damage repair (BR-14, BR-15, BR-16, BR-19, BR-21).
        status: active
      - name: Damage Report
        definition: Owns a damage report from opening through the coordinator's minor/unsafe review (BR-17, BR-18, BR-19).
        status: active
      - name: Fleet record view
        definition: Shows the fleet coordinator plate, mileage, service due, and in/out-of-service status for every car, replacing the spreadsheet (CAP-7, SC-4).
        status: active
      - name: Service-due view
        definition: Alerts the fleet coordinator to cars that crossed their service threshold (CAP-8).
        status: active
      - name: Garage status view
        definition: Shows the fleet coordinator which cars the garage has finished servicing (CAP-8).
        status: active
      - name: Damage reports view
        definition: Shows the fleet coordinator damage reports awaiting review (CAP-9).
        status: active
      - name: Fleet coordinator
        definition: Keeps each car's service and damage record current, approves longer trips, and needs to catch a problem car before it goes out, not after.
        status: active
