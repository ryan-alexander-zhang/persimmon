apiVersion: sdd.persimmon.ai/v1
kind: BoundedContext
metadata:
  name: car-reservations.r1
spec:
  identity:
    id: car-reservations
    revision: 1
  content:
    name: Car Reservations
    purpose: "Car Reservations owns the full lifecycle of a company car reservation: offering fitting cars for a requested trip, routing trips longer than the standard limit through fleet-coordinator approval, creating or declining the reservation, the pickup-to-return cycle including releasing an unclaimed reservation and recording any damage noted on return, employee-initiated cancellation or cancellation forced when a car leaves service with notification of affected employees, and the running count of each employee's late cancellations and no-shows."
    inScope:
      - Employee
      - Fleet coordinator
      - Reservation
      - Employee Reliability
      - Available cars view
      - My reservations view
      - Employee reliability view
      - Pending approvals view
    outOfScope:
      - A car's plate, seats, gearbox, van flag, mileage, and service-due state, owned by Fleet Care
      - Scheduling and completing garage service, owned by Fleet Care
      - Opening and reviewing damage reports and taking a car out or back into service, owned by Fleet Care
    classification: core
    subdomain: reservations
    capabilities: [CAP-1, CAP-2, CAP-3, CAP-4, CAP-5, CAP-6]
    relationships:
      - context: fleet-care
        role: peer
        pattern: partnership
---
apiVersion: sdd.persimmon.ai/v1
kind: Glossary
metadata:
  name: car-reservations-glossary.r1
spec:
  identity:
    id: car-reservations-glossary
    revision: 1
  content:
    title: Car Reservations Glossary
    context: car-reservations
    terms:
      - name: Employee
        definition: Reserves a company car for a customer or site visit, picks it up and returns it, and needs a car that actually fits the trip without a conflict or surprise at pickup.
        status: active
      - name: Fleet coordinator
        definition: Approves reservations longer than the standard limit for Car Reservations, and keeps each car's service and damage record current in Fleet Care.
        status: active
      - name: Reservation
        definition: "Owns a reservation's full lifecycle in one consistency boundary: the long-reservation approval workflow, creation and refusal, cancellation (employee-initiated or forced by a car leaving service), and the pickup-to-return cycle including the unclaimed-pickup release."
        status: active
        related:
          - Employee
          - Employee Reliability
      - name: Employee Reliability
        definition: Owns the running count of an employee's late cancellations and no-shows.
        status: active
        related:
          - Employee
          - Reservation
      - name: Available cars view
        definition: Shows the employee the cars that fit their trip's needs and slot.
        status: active
      - name: My reservations view
        definition: Shows the employee their own reservations and their own reliability count.
        status: active
      - name: Employee reliability view
        definition: Shows the fleet coordinator each employee's monthly count of late cancellations and no-shows, informational only.
        status: active
      - name: Pending approvals view
        definition: Shows the fleet coordinator reservation requests awaiting a long-reservation decision.
        status: active
    factTypes:
      - name: Reservation has employee
        subject: Reservation
        predicate: has
        object: Employee
        status: active
      - name: Reservation has passenger count
        subject: Reservation
        predicate: has
        object:
          type: integer
        status: active
      - name: Reservation has equipment need
        subject: Reservation
        predicate: has
        object:
          type: boolean
        status: active
      - name: Reservation has gearbox preference
        subject: Reservation
        predicate: has
        object:
          type: enum
          values:
            - manual
            - automatic
        status: active
      - name: Reservation has slot start
        subject: Reservation
        predicate: has
        object:
          type: date
        status: active
      - name: Reservation has slot end
        subject: Reservation
        predicate: has
        object:
          type: date
        status: active
      - name: Reservation has status
        subject: Reservation
        predicate: has
        object:
          type: enum
          values:
            - pending approval
            - approved
            - declined
            - created
            - cancelled
            - picked up
            - returned
            - released unclaimed
        status: active
      - name: Reservation has damage location
        subject: Reservation
        predicate: has
        object:
          type: string
        status: active
      - name: Reservation has damage drivable flag
        subject: Reservation
        predicate: has
        object:
          type: boolean
        status: active
      - name: Reservation has damage photo
        subject: Reservation
        predicate: has
        object:
          type: string
        status: active
      - name: Employee Reliability has employee
        subject: Employee Reliability
        predicate: has
        object: Employee
        status: active
      - name: Employee Reliability has late cancellation count
        subject: Employee Reliability
        predicate: has
        object:
          type: integer
        status: active
      - name: Employee Reliability has no-show count
        subject: Employee Reliability
        predicate: has
        object:
          type: integer
        status: active
---
apiVersion: sdd.persimmon.ai/v1
kind: DomainModel
metadata:
  name: car-reservations-model.r1
spec:
  identity:
    id: car-reservations-model
    revision: 1
  content:
    context: car-reservations
    source: car-pool-prd-storming
    aggregates:
      - id: AG-1
        name: Reservation
        root: Reservation
        entities:
          - name: Reservation
            attributes:
              - Reservation has employee
              - Reservation has passenger count
              - Reservation has equipment need
              - Reservation has gearbox preference
              - Reservation has slot start
              - Reservation has slot end
              - Reservation has status
              - Reservation has damage location
              - Reservation has damage drivable flag
              - Reservation has damage photo
        valueObjects: []
        commands:
          - Request long reservation approval
          - Approve long reservation
          - Deny long reservation
          - Lapse long reservation approval
          - Create reservation
          - Decline reservation
          - Cancel reservation
          - Pick up car
          - Release unclaimed reservation
          - Return car
          - Notify affected employees
        events:
          - Long reservation approval requested
          - Long reservation approved
          - Long reservation denied
          - Long reservation lapsed
          - Car reservation created
          - Car reservation declined
          - Reservation cancelled well ahead of start
          - Reservation cancelled close to start
          - Car picked up
          - Reservation released unclaimed
          - Car returned
          - Damage noted on return
          - Future reservations cancelled for out-of-service car
          - Affected employees notified
        invariants:
          - statement: a reservation names exactly one car
            rules:
              - BR-1
          - statement: passenger count <= car seats
            rules:
              - BR-2
          - statement: trip needing equipment space is assigned a van
            rules:
              - BR-3
          - statement: trip requesting automatic gearbox is assigned a car with automatic gearbox
            rules:
              - BR-4
          - statement: requested slot does not overlap another reservation already held for that car
            rules:
              - BR-5
          - statement: car is in service
            rules:
              - BR-6
          - statement: car's next service is not due before the requested slot ends
            rules:
              - BR-7
          - statement: employee holds at most two future reservations
            rules:
              - BR-9
          - statement: a reservation longer than three days has the fleet coordinator's approval
            rules:
              - BR-10
      - id: AG-2
        name: Employee Reliability
        root: Employee Reliability
        entities:
          - name: Employee Reliability
            attributes:
              - Employee Reliability has employee
              - Employee Reliability has late cancellation count
              - Employee Reliability has no-show count
        valueObjects: []
        commands:
          - Count late cancellation
          - Count no-show
        events:
          - Late cancellation counted
          - No-show counted
        invariants: []
    events:
      - name: Fitting cars offered
      - name: Long reservation approval requested
      - name: Long reservation approved
      - name: Long reservation denied
      - name: Long reservation lapsed
      - name: Car reservation created
        pivotal: true
      - name: Car reservation declined
      - name: Reservation cancelled well ahead of start
      - name: Reservation cancelled close to start
      - name: Late cancellation counted
      - name: Car picked up
        pivotal: true
      - name: Reservation released unclaimed
      - name: No-show counted
      - name: Car returned
        pivotal: true
      - name: Damage noted on return
      - name: Future reservations cancelled for out-of-service car
      - name: Affected employees notified
    policies:
      - id: POL-1
        name: Reservation duration policy
        when:
          - Fitting cars offered
        then:
          - Create reservation
          - Request long reservation approval
        execution: automatic
        condition: requested reservation length exceeds the standard limit
        parameters:
          - name: standardReservationLimitDays
            value: "3"
      - id: POL-2
        name: Approved long reservation policy
        when:
          - Long reservation approved
        then:
          - Create reservation
        execution: automatic
        condition: long reservation approved by fleet coordinator
      - id: POL-3
        name: Denied or lapsed reservation policy
        when:
          - Long reservation denied
          - Long reservation lapsed
        then:
          - Decline reservation
        execution: automatic
        condition: long reservation denied or its approval request lapsed
      - id: POL-4
        name: Long reservation approval timeout policy
        when:
          - Long reservation approval requested
        then:
          - Lapse long reservation approval
        execution: automatic
        condition: approval request not decided by the reservation's requested start
      - id: POL-5
        name: Late cancellation counting policy
        when:
          - Reservation cancelled close to start
        then:
          - Count late cancellation
        execution: automatic
        condition: cancellation made less than two hours before the reservation's start
        parameters:
          - name: lateCancellationWindowHours
            value: "2"
      - id: POL-6
        name: Unclaimed reservation policy
        when:
          - Car reservation created
        then:
          - Release unclaimed reservation
        execution: automatic
        condition: reservation not picked up within the pickup window after slot start
        parameters:
          - name: pickupWindowMinutes
            value: "30"
      - id: POL-7
        name: No-show counting policy
        when:
          - Reservation released unclaimed
        then:
          - Count no-show
        execution: automatic
        condition: reservation released as unclaimed
      - id: POL-8
        name: Cancel reservations on out-of-service policy
        when:
          - Car taken out of service for scheduled maintenance
          - Car taken out of service for unsafe damage
        then:
          - Cancel reservation
        execution: automatic
        condition: car taken out of service, for maintenance or unsafe damage
      - id: POL-9
        name: Notify affected employees policy
        when:
          - Future reservations cancelled for out-of-service car
        then:
          - Notify affected employees
        execution: automatic
        condition: future reservations cancelled for a car leaving service
    readModels:
      - name: Available cars view
        informs:
          - Employee
        fields:
          - Reservation has passenger count
          - Reservation has equipment need
          - Reservation has gearbox preference
          - Reservation has slot start
          - Reservation has slot end
        updatedBy:
          - Fitting cars offered
      - name: My reservations view
        informs:
          - Employee
        fields:
          - Reservation has status
          - Reservation has slot start
          - Reservation has slot end
          - Employee Reliability has late cancellation count
          - Employee Reliability has no-show count
        updatedBy:
          - Car reservation created
          - Long reservation approved
          - Long reservation denied
          - Long reservation lapsed
          - Car reservation declined
          - Reservation cancelled well ahead of start
          - Reservation cancelled close to start
          - Car picked up
          - Car returned
          - Affected employees notified
      - name: Employee reliability view
        informs:
          - Fleet coordinator
        fields:
          - Employee Reliability has late cancellation count
          - Employee Reliability has no-show count
        updatedBy:
          - No-show counted
          - Late cancellation counted
      - name: Pending approvals view
        informs:
          - Fleet coordinator
        fields:
          - Reservation has slot start
          - Reservation has slot end
          - Reservation has employee
        updatedBy:
          - Long reservation approval requested
    externalSystems: []
---
apiVersion: sdd.persimmon.ai/v1
kind: BoundedContext
metadata:
  name: fleet-care.r1
spec:
  identity:
    id: fleet-care
    revision: 1
  content:
    name: Fleet Care
    purpose: Fleet Care owns each car's fleet record — plate, seats, gearbox, van flag, mileage and next-service threshold — derives when a car becomes service-due, manages its out-of-service and back-in-service transitions for both scheduled maintenance and unsafe-damage repair, and owns damage reports from opening through the fleet coordinator's minor/unsafe review.
    classification: supporting
    inScope:
      - Car
      - Damage Report
      - Fleet record view
      - Service-due view
      - Garage status view
      - Damage reports view
      - Fleet coordinator
    outOfScope:
      - Reservation, owned by Car Reservations
      - Employee Reliability, owned by Car Reservations
      - Employee, owned by Car Reservations
      - Available cars view, owned by Car Reservations
      - My reservations view, owned by Car Reservations
      - Employee reliability view, owned by Car Reservations
      - Pending approvals view, owned by Car Reservations
    subdomain: fleet-care
    capabilities: [CAP-7, CAP-8, CAP-9]
    relationships:
      - context: car-reservations
        role: peer
        pattern: partnership
---
