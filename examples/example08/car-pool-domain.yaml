              - A Car picked up event is recorded
          - id: AC-2
            title: Pickup refused after unclaimed release
            given:
              - A reservation for car plate 34-XYZ-7 with slot start 09:00 on 2026-10-15, released unclaimed at 09:30 after no pickup
            when:
              - The employee arrives at 09:45 on 2026-10-15 and attempts to pick up the car
            then:
              - "The pickup is refused: BR-8, the reservation was already released after thirty minutes unclaimed"
      - id: US-2
        role: Employee
        goal: have a car they fail to pick up released back to the pool automatically
        benefit: so that the pool is not tied up by a no-show and another employee can book the car without delay
        requirements:
          - FR-2
        commands:
          - Release unclaimed reservation
        events:
          - Reservation released unclaimed
        acceptance:
