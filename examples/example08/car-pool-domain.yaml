# Company car pool: every artifact below was produced by the SDLC pack live (author-prd, domain-discovery, architect,
# spec-all, design-all (http-api, async-api, data-schema, ui), design-system, plan-all on claude-sonnet-5), nothing by hand but the
# brief and the Gate verdicts. See README.md. Every artifact is at revision 1: the rounds collapsed into the revision that passed.
apiVersion: sdd.persimmon.ai/v1
kind: Prd
metadata:
  name: car-pool-prd.r1
spec:
  identity:
    id: car-pool-prd
    revision: 1
  content:
    title: Company Car Pool
    businessRules: car-pool-rules
    problem: At the Rotterdam office, about sixty employees share twelve company cars to visit customers and sites, booking them through a shared calendar and picking up keys from a cabinet. The fleet coordinator tracks each car's service dates and damage notes in a spreadsheet kept apart from the booking calendar. Because the two records don't talk to each other, cars get double-booked, a car can go out on a customer visit the same day its service is due, and damage found when a car is returned is only noticed by the next driver weeks later, after it has already been driven in that condition.
    users:
      - name: Employee
        description: Reserves a car for a trip, picks it up and returns it, and needs a car that fits the trip and is actually available and roadworthy for the booked slot.
      - name: Fleet coordinator
        description: Keeps each car's service and damage record current, approves longer trips, and keeps unsafe or service-due cars out of service.
      - name: Office manager
        description: Covers the fleet coordinator's duties during absences.
    goals:
      - id: G-1
        statement: An employee can reserve a car that fits the trip for a free slot without later discovering a conflict.
      - id: G-2
        statement: An employee is never handed a car that is out of service or overdue for service.
      - id: G-3
        statement: A driver sees any damage noted by the previous driver before taking the car.
      - id: G-4
        statement: The fleet coordinator always has a current, trustworthy record of each car's service status and condition, with no separate spreadsheet.
      - id: G-5
        statement: An employee knows where they stand on late cancellations and no-shows.
    nonGoals:
      - Fuel cards and expense tracking
      - Private use of the pool cars
      - Pool cars at offices other than Rotterdam
      - Telematics or keyless entry; keys stay in the cabinet
      - Insurance claims beyond the damage report
    subdomains:
      - id: reservations
        name: Reservations
        description: Employees reserve, pick up, and return pool cars for trips to customers and sites.
        type: core
      - id: fleet-care
        name: Fleet care
        description: The fleet coordinator keeps each car's service and damage record, manages the garage, and controls which cars are in service.
        type: supporting
    capabilities:
      - id: CAP-1
        name: Car search and reservation
        description: An employee states a trip's time slot, purpose, and number of passengers, and the system offers only cars that fit the request (seats, a van for equipment, an automatic gearbox when asked), are free for the slot, in service, and not due for service before the slot ends. The employee reserves one specific car from the offered list.
        priority: P1
        subdomain: reservations
        rules:
          - BR-1
          - BR-2
          - BR-3
          - BR-7
          - BR-8
      - id: CAP-2
        name: Pickup and return recording
        description: An employee picks up the reserved car at the start of the slot; if it is not picked up within thirty minutes, the reservation is released so another employee can take the car. On return, the employee records the mileage read off the dashboard and notes any new damage.
        priority: P1
        subdomain: reservations
        rules:
          - BR-4
      - id: CAP-3
        name: Reservation limits and approval
        description: The system holds each employee to at most two future reservations at a time, each at most three days long, and routes any longer trip to the fleet coordinator for approval before it can be booked.
        priority: P2
        subdomain: reservations
        rules:
          - BR-5
          - BR-6
      - id: CAP-4
        name: Cancellation and no-show tracking
        description: An employee may cancel a reservation freely up to two hours before its start; cancellations after that point and no-shows are counted against the employee, and the fleet coordinator sees each employee's monthly count.
        priority: P2
        subdomain: reservations
        rules:
          - BR-9
          - BR-10
      - id: CAP-5
        name: Fleet record keeping
        description: The fleet coordinator maintains one record per car holding its plate, seats, gearbox, whether it is a van, current mileage, next service due by date or mileage, and its state (in service or out of service), replacing the spreadsheet; each car return updates the car's current mileage in this record.
        priority: P1
        subdomain: fleet-care
        rules:
          - BR-11
          - BR-12
      - id: CAP-6
        name: Service-due tracking and garage scheduling
        description: When a car's mileage or date crosses its service threshold, the car becomes service-due; the fleet coordinator books it with the garage and takes it out of service for the garage days, then returns it to service with its new mileage and next service threshold once the garage returns it.
        priority: P1
        subdomain: fleet-care
        rules:
          - BR-13
          - BR-14
          - BR-18
      - id: CAP-7
        name: Damage reporting and review
        description: "A damage note left on return opens a damage report that the fleet coordinator reviews: minor damage is recorded and the car stays in service, while damage that makes the car unsafe takes it out of service at once, cancelling its future reservations and notifying the affected employees so they can reserve another car."
        priority: P1
        subdomain: fleet-care
        rules:
          - BR-15
          - BR-16
          - BR-17
    successCriteria:
      - id: SC-1
        statement: No two accepted reservations ever overlap on the same car.
        capabilities:
          - CAP-1
      - id: SC-2
        statement: No reservation is ever fulfilled with a car that is out of service or whose service is due before the slot ends.
        capabilities:
          - CAP-1
          - CAP-6
      - id: SC-3
        statement: A reservation not picked up is released within thirty minutes of its start, every time.
        capabilities:
          - CAP-2
      - id: SC-4
        statement: Every driver sees the damage noted by the previous driver before taking the car, instead of discovering it weeks later.
        capabilities:
          - CAP-7
      - id: SC-5
        statement: The fleet coordinator's monthly late-cancellation and no-show counts match each employee's recorded counts exactly.
        capabilities:
          - CAP-4
      - id: SC-6
        statement: A car found unsafe has zero uncancelled future reservations remaining.
        capabilities:
          - CAP-7
      - id: SC-7
        statement: Every trip longer than three days carries a recorded fleet-coordinator approval.
        capabilities:
          - CAP-3
      - id: SC-8
        statement: Every one of the twelve cars' plate, seats, gearbox, van flag, mileage, service status, and state is recorded in the system, with no spreadsheet in use.
        capabilities:
          - CAP-5
      - id: SC-9
        statement: Every car that crosses its service threshold is booked with the garage and taken out of service before it is driven again.
        capabilities:
          - CAP-6
      - id: SC-10
        statement: Double-booking, service-overdue trips, and late-discovered damage, the three problems named in the brief, no longer occur at the Rotterdam office.
    assumptions:
      - Employees and the fleet coordinator sign in through the existing company directory; no separate account system is needed.
      - The office manager has the same system permissions as the fleet coordinator when covering an absence.
      - Twelve cars and about sixty employees is the scale the system needs to support.
      - Keys stay in the physical cabinet; the system does not control physical access to cars.
    openQuestions:
      - id: Q-1
        question: How far in advance may an employee make a reservation, if there is any booking-window limit at all?
        resolution: No booking-window limit.
      - id: Q-2
        question: Does a high monthly count of late cancellations or no-shows trigger any escalation or restriction, or is it purely informational for the coordinator?
        resolution: The monthly count is informational only; it restricts nothing.
      - id: Q-3
        question: Is there an upper bound on how long a coordinator-approved trip can be, and how is that approval requested and recorded?
        resolution: No upper bound; the employee asks for approval when reserving, and a request not approved by the reservation's start lapses and the employee is notified.
      - id: Q-4
        question: Does the office manager use a distinct login/role, or the fleet coordinator's own account, while covering an absence?
        resolution: The office manager signs in with their own identity, granted the fleet coordinator role.
---
apiVersion: sdd.persimmon.ai/v1
kind: BusinessRules
metadata:
  name: car-pool-rules.r1
spec:
  identity:
    id: car-pool-rules
    revision: 1
  content:
    title: Company Car Pool Business Rules
    owner: Fleet coordinator
    rules:
      - id: BR-1
        type: constraint
        statement: A reservation may offer only cars that fit the requested seats, provide a van when equipment is stated, and have an automatic gearbox when requested.
        rationale: Employees must not be offered a car that cannot carry their passengers, equipment, or that they cannot drive.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-2
        type: fact
        statement: A reservation must be for exactly one specific car.
        rationale: Pickup, return, and mileage tracking are all recorded against one car.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-3
        type: constraint
        statement: A car must not be offered for a slot during which it is already reserved.
        rationale: Prevents the double-booking that currently happens through the shared calendar.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-4
        type: constraint
        statement: A reservation must be released if the car has not been picked up within thirty minutes of the reservation's start.
        rationale: Frees the car for other employees when the original booking is not used.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-5
        type: constraint
        statement: An employee must not hold more than two future reservations at a time.
        rationale: Keeps the limited fleet available across the whole office.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-6
        type: constraint
        statement: A reservation must not exceed three days unless approved by the fleet coordinator.
        rationale: Longer trips tie up a shared car and need coordinator sign-off.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-7
        type: constraint
        statement: A car that is out of service must not be offered.
        rationale: An out-of-service car is not safe or available to drive.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-8
        type: constraint
        statement: A car whose next service is due before the end of the requested slot must not be offered.
        rationale: Prevents a car going out on a trip the day its service is due.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-9
        type: decision
        statement: A cancellation must be considered late if made less than two hours before the reservation's start.
        rationale: Distinguishes free cancellations from ones close to the start that leave the car idle.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-10
        type: fact
        statement: Each employee's late cancellations and no-shows must be counted per calendar month.
        rationale: Gives the fleet coordinator a monthly view of per-employee late cancellations and no-shows.
        source: brief
        status: active
        subdomain: reservations
      - id: BR-11
        type: fact
        statement: A car record must hold a plate, seat count, gearbox type, van flag, current mileage, next service due by date or mileage, and a state of in service or out of service.
        rationale: Replaces the fleet coordinator's spreadsheet with one system of record per car.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-12
        type: constraint
        statement: Each car return must update the car's current mileage.
        rationale: Keeps the mileage used for service-due checks current.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-13
        type: decision
        statement: A car must be considered service-due if its current mileage reaches its next service mileage threshold or the current date reaches its next service due date.
        rationale: Triggers garage scheduling before the car is driven past its service point.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-14
        type: constraint
        statement: A service-due car must be booked with the garage and taken out of service for its garage days.
        rationale: Keeps a service-due car from being driven while awaiting or undergoing service.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-15
        type: decision
        statement: A damage report must be considered minor or unsafe based on the fleet coordinator's review.
        rationale: The coordinator's judgment on severity determines whether the car can keep driving.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-16
        type: constraint
        statement: A car with an unsafe damage report must be taken out of service at once.
        rationale: Prevents an unsafe car from being driven again before repair.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-17
        type: constraint
        statement: Taking a car out of service must cancel the car's future reservations and notify the affected employees.
        rationale: Lets affected employees reserve another car instead of showing up to a car that is no longer available.
        source: brief
        status: active
        subdomain: fleet-care
      - id: BR-18
        type: constraint
        statement: When the garage returns a car, the fleet coordinator must put the car back in service with its new mileage and next service threshold.
        rationale: Keeps the car's record current for future service-due checks after garage work.
        source: brief
        status: active
        subdomain: fleet-care
---
apiVersion: sdd.persimmon.ai/v1
kind: EventStorming
metadata:
  name: car-pool-prd-storming.r1
spec:
  identity:
    id: car-pool-prd-storming
    revision: 1
  content:
    version: "4.1"
    meta:
      name: Company Car Pool
      level: design
    contexts:
      - id: reservations
        name: Reservations
        order: 0
        subdomain: reservations
        classification: core
      - id: fleet-care
        name: Fleet care
        order: 1
        subdomain: fleet-care
        classification: supporting
    contextRelationships:
      - id: cr-01
        source: reservations
        target: fleet-care
        type: partnership
    nodes:
      - id: employee
        type: actor
        label: Employee
        properties:
          description: Reserves, picks up and returns pool cars for trips to customers and sites.
      - id: fleet-coordinator
        type: actor
        label: Fleet coordinator
        properties:
          description: Maintains fleet records, approves long trips, reviews damage and manages garage scheduling; the office manager acts under this same role while covering an absence (Q-4).
      - id: ex-garage
        type: externalSystem
        label: Garage
        properties:
          description: Services cars taken out of service for maintenance or repair; booked and returned outside the system, keys stay in the cabinet.
      - id: fc-e-car-registered
        type: domainEvent
        label: Car record registered
        context: fleet-care
        order: 0
        properties:
          description: Fleet coordinator records a car's plate, seats, gearbox, van flag, mileage and service threshold, replacing the spreadsheet (CAP-5, BR-11).
      - id: res-e-car-reserved-short
        type: domainEvent
        label: Car reserved
        context: reservations
        order: 1
        properties:
          pivotal: true
          alternativeSet: trip-length-outcome
          description: Employee reserves one specific car that fits seats/van/gearbox, is free, in service and not service-due for the slot (BR-1, BR-2, BR-3, BR-7, BR-8); trip is three days or less (BR-6).
      - id: res-e-long-trip-approval-requested
        type: domainEvent
        label: Long-trip approval requested
        context: reservations
        order: 1
        properties:
          alternativeSet: trip-length-outcome
          description: Requested trip exceeds three days, so it is routed to the fleet coordinator for approval instead of reserved immediately (BR-6).
      - id: res-e-long-trip-approved
        type: domainEvent
        label: Long-trip approved
        context: reservations
        order: 2
        properties:
          alternativeSet: approval-outcome
          description: Fleet coordinator approves the long trip before its start; the reservation proceeds (Q-3 resolution).
      - id: res-e-long-trip-approval-lapsed
        type: domainEvent
        label: Long-trip approval lapsed
        context: reservations
        order: 2
        properties:
          alternativeSet: approval-outcome
          description: No approval was given by the reservation's start; the request lapses and the employee is notified. Modelled as an automatic policy reaction rather than a bare temporal event, since the lapse deadline is a system-tracked condition (Q-3 resolution).
      - id: res-e-long-trip-approval-denied
        type: domainEvent
        label: Long-trip approval denied
        context: reservations
        order: 2
        properties:
          alternativeSet: approval-outcome
          description: Fleet coordinator explicitly denies the long-trip request before its start; the employee is notified and the reservation does not proceed (Q-3 resolution).
      - id: res-e-reservation-cancelled
        type: domainEvent
        label: Reservation cancelled
        context: reservations
        order: 3
        properties:
          description: Employee cancels a reservation; cancellations less than two hours before start are late (BR-9) and counted per employee per month (BR-10).
      - id: res-e-car-picked-up
        type: domainEvent
        label: Car picked up
        context: reservations
        order: 4
        properties:
          alternativeSet: pickup-outcome
          description: Employee collects the keys at the start of the reserved slot.
      - id: res-e-reservation-released
        type: domainEvent
        label: Reservation released
        context: reservations
        order: 4
        properties:
          alternativeSet: pickup-outcome
          description: Car not picked up within thirty minutes of the slot's start; the reservation is released for others and counts as a no-show (BR-4, BR-10). Modelled via the pickup timeout policy's parameter rather than a bare temporal flag.
      - id: res-e-car-returned
        type: domainEvent
        label: Car returned
        context: reservations
        order: 5
        properties:
          pivotal: true
          description: Employee records the odometer mileage and any new damage on return (CAP-2, BR-12).
      - id: fc-e-car-mileage-updated
        type: domainEvent
        label: Car mileage updated
        context: fleet-care
        order: 6
        properties:
          description: Car's current mileage in the fleet record is updated from the odometer reading recorded at return (BR-12); this updated mileage feeds the service-due check (BR-13).
      - id: fc-e-service-date-reached
        type: domainEvent
        label: Service date reached
        context: fleet-care
        order: 6
        properties:
          temporal: true
          description: A car's next service due date arrives while the car sits idle, independent of any return; feeds the service-due check alongside the mileage path (BR-13).
      - id: fc-e-damage-report-opened
        type: domainEvent
        label: Damage report opened
        context: fleet-care
        order: 7
        properties:
          description: A damage note left on return opens a report for the fleet coordinator to review (CAP-7).
      - id: fc-e-car-became-service-due
        type: domainEvent
        label: Car became service due
        context: fleet-care
        order: 7
        properties:
          pivotal: true
          description: Car's current mileage, as just updated on return (BR-12), or its next service date, reaches its service threshold (BR-13). Modelled via the service-due policy's condition, triggered by either the mileage-update or the service-date-reached event, rather than a bare temporal flag.
      - id: fc-e-damage-classified-minor
        type: domainEvent
        label: Damage classified as minor
        context: fleet-care
        order: 8
        properties:
          alternativeSet: damage-severity
          description: Fleet coordinator judges the damage minor; it is recorded and the car stays in service (BR-15).
      - id: fc-e-damage-classified-unsafe
        type: domainEvent
        label: Damage classified as unsafe
        context: fleet-care
        order: 8
        properties:
          pivotal: true
          alternativeSet: damage-severity
          description: Fleet coordinator judges the damage makes the car unsafe to drive (BR-15).
      - id: fc-e-car-booked-with-garage
        type: domainEvent
        label: Car booked with garage
        context: fleet-care
        order: 8
        properties:
          description: Fleet coordinator books a car with the garage, either a service-due car ahead of its garage days (BR-14, CAP-6) or a car just taken out of service for unsafe damage, sent for repair under the same flow (BR-16, resolved hotspot).
      - id: fc-e-car-taken-out-of-service
        type: domainEvent
        label: Car taken out of service
        context: fleet-care
        order: 9
        properties:
          description: Car is pulled from service, either at once because of unsafe damage (BR-16) or for its garage days once booked with the garage (BR-14); either path cancels the car's future reservations (BR-17).
      - id: res-e-future-reservations-cancelled
        type: domainEvent
        label: Future reservations cancelled
        context: reservations
        order: 10
        properties:
          description: The out-of-service car's future reservations are cancelled (BR-17, SC-6).
      - id: res-e-affected-employees-notified
        type: domainEvent
        label: Affected employees notified
        context: reservations
        order: 11
        properties:
          description: Employees whose reservations were cancelled are notified so they can reserve another car (BR-17).
      - id: fc-e-car-serviced
        type: domainEvent
        label: Car serviced
        context: fleet-care
        order: 12
        properties:
          description: Garage completes the work and returns the car, whether scheduled maintenance (CAP-6) or repair of unsafe damage booked under the same flow (BR-16, resolved hotspot).
      - id: fc-e-car-put-back-into-service
        type: domainEvent
        label: Car put back into service
        context: fleet-care
        order: 13
        properties:
          pivotal: true
          description: Fleet coordinator puts the car back in service with its new mileage and next service threshold, closing either the scheduled-service path (BR-18) or the unsafe-damage repair path the same way (resolved hotspot).
      - id: res-h-approval-rejection
        type: hotspot
        label: Explicit rejection of long-trip approval undefined
        context: reservations
        properties:
          kind: question
          priority: medium
          state: resolved
          description: Q-3's resolution covers approval and lapse-by-start-time, but not whether the fleet coordinator can explicitly reject a long-trip request before it lapses, or can only decline to act.
          resolution: Fleet coordinator can explicitly deny a long-trip request before its start; modelled as 'Long-trip approval denied', alongside approved and lapsed, in the approval-outcome alternative set, and as the res-c-deny-long-trip command.
      - id: fc-h-damage-repair-return-undefined
        type: hotspot
        label: Return to service after unsafe damage undefined
        context: fleet-care
        properties:
          kind: question
          priority: medium
          state: resolved
          description: "The Prd and business rules describe taking a car out of service at once for unsafe damage (BR-16) but not how it is repaired and returned to service afterwards: whether it follows the same garage-booking and put-back-into-service flow as scheduled maintenance (BR-14, BR-18) or a separate repair process."
          resolution: "An unsafe car goes to the garage for repair through the same flow as scheduled service: the fleet coordinator books it with the garage (Book car with garage / Car booked with garage), and Car serviced then Put car back into service close the damage path exactly as they close the service-due path; no separate repair process is modelled."
      - id: res-h-pending-request-counts-toward-limit
        type: hotspot
        label: Does a pending long-trip request count toward the reservation limit?
        context: reservations
        properties:
          kind: question
          priority: medium
          state: resolved
          description: BR-5 caps an employee at two future reservations, but neither the Prd nor the business rules say whether a long-trip request still awaiting the fleet coordinator's decision (res-e-long-trip-approval-requested) counts as one of the two, or only confirmed reservations count.
          resolution: "Yes: a pending long-trip request counts as one of the employee's two future reservations under BR-5; once it is denied or lapses, it no longer counts."
      - id: fc-h-service-due-reservation-gap
        type: hotspot
        label: Reservations made before a car becomes service-due are not auto-cancelled
        context: fleet-care
        properties:
          kind: risk
          priority: high
          state: resolved
          description: Becoming service-due (fc-e-car-became-service-due) does not itself take a car out of service or cancel its reservations; only fc-c-take-car-out-of-service does, once the fleet coordinator books it with the garage. A reservation made before the car became service-due, for a slot after it became service-due but before the coordinator acts, could still be picked up, risking SC-2.
          resolution: "This is intended, not a gap: a car's existing reservations stand when it becomes service-due; BR-8 only stops new offers from being made for it. When the fleet coordinator books the car with the garage and takes it out of service for its garage days, BR-17 cancels the car's future reservations and notifies the affected employees, already modelled via fc-e-car-taken-out-of-service triggering res-p-cancel-future-reservations-policy and res-p-notify-affected-employees-policy."
      - id: res-rm-available-cars-view
        type: readModel
        label: Available cars view
        context: reservations
        properties:
          description: Cars that fit the requested seats/van/gearbox, are free for the slot, in service and not service-due before the slot ends (CAP-1, BR-1, BR-3, BR-7, BR-8); shown to the employee before reserving.
      - id: res-rm-pending-approvals-view
        type: readModel
        label: Pending approvals view
        context: reservations
        properties:
          description: Long-trip requests awaiting the fleet coordinator's decision before they lapse (Q-3 resolution).
      - id: res-rm-my-reservations-view
        type: readModel
        label: My reservations view
        context: reservations
        properties:
          description: An employee's own reservations and their outcomes (pending approval, approved, lapsed, denied, released, cancellations forced by an out-of-service car), used to pick a reservation to cancel or return and to learn of notifications (BR-17).
      - id: res-rm-cancellation-noshow-counts-view
        type: readModel
        label: Cancellation and no-show counts view
        context: reservations
        properties:
          description: Each employee's late cancellations and no-shows counted per calendar month, shown to the fleet coordinator (CAP-4, BR-9, BR-10, SC-5).
      - id: fc-rm-car-condition-view
        type: readModel
        label: Car condition view
        context: fleet-care
        properties:
          description: A car's reviewed damage history, shown to the employee before taking the car so they see damage noted by the previous driver (G-3, SC-4).
      - id: fc-rm-pending-damage-reports-view
        type: readModel
        label: Pending damage reports view
        context: fleet-care
        properties:
          description: Damage reports awaiting the fleet coordinator's severity review (CAP-7, BR-15).
      - id: fc-rm-service-due-cars-view
        type: readModel
        label: Service-due cars view
        context: fleet-care
        properties:
          description: Cars that have become service-due and still need to be booked with the garage (CAP-6, BR-13, BR-14).
      - id: fc-rm-cars-at-garage-view
        type: readModel
        label: Cars at garage view
        context: fleet-care
        properties:
          description: Cars currently booked with or returned by the garage, shown to the fleet coordinator to put a serviced or repaired car back into service (CAP-6, BR-18).
      - id: res-c-reserve-car
        type: command
        label: Reserve car
        context: reservations
        properties:
          description: Employee submits a trip's slot, purpose and passenger count; routed to a short reservation or a long-trip approval request depending on duration (CAP-1, BR-6).
      - id: res-c-approve-long-trip
        type: command
        label: Approve long trip
        context: reservations
        properties:
          alternativeSet: approval-decision
          description: Fleet coordinator approves a long-trip request before its start (Q-3 resolution).
      - id: res-c-deny-long-trip
        type: command
        label: Deny long trip
        context: reservations
        properties:
          alternativeSet: approval-decision
          description: Fleet coordinator explicitly denies a long-trip request before its start (Q-3 resolution).
      - id: res-c-lapse-long-trip-approval
        type: command
        label: Lapse long-trip approval
        context: reservations
        properties:
          description: System lapses a long-trip request with no decision recorded by the reservation's start (Q-3 resolution).
      - id: res-c-cancel-reservation
        type: command
        label: Cancel reservation
        context: reservations
        properties:
          description: Employee cancels a future reservation (CAP-4, BR-9).
      - id: res-c-pick-up-car
        type: command
        label: Pick up car
        context: reservations
        properties:
          description: Employee collects the car at the start of the reserved slot (CAP-2).
      - id: res-c-release-reservation
        type: command
        label: Release reservation
        context: reservations
        properties:
          description: System releases a reservation not picked up within the pickup window (CAP-2, BR-4).
      - id: res-c-return-car
        type: command
        label: Return car
        context: reservations
        properties:
          description: Employee records odometer mileage and any new damage on return (CAP-2, BR-12).
      - id: res-c-cancel-future-reservations
        type: command
        label: Cancel future reservations
        context: reservations
        properties:
          description: System cancels the future reservations of a car just taken out of service (BR-17, SC-6).
      - id: res-c-notify-affected-employees
        type: command
        label: Notify affected employees
        context: reservations
        properties:
          description: System notifies employees whose reservations were cancelled so they can reserve another car (BR-17).
      - id: fc-c-register-car
        type: command
        label: Register car
        context: fleet-care
        properties:
          description: Fleet coordinator enters a car's plate, seats, gearbox, van flag, mileage and service threshold (CAP-5, BR-11).
      - id: fc-c-update-car-mileage
        type: command
        label: Update car mileage
        context: fleet-care
        properties:
          description: System updates a car's current mileage from the reading recorded at return (BR-12).
      - id: fc-c-open-damage-report
        type: command
        label: Open damage report
        context: fleet-care
        properties:
          description: System opens a damage report from the note recorded at return (CAP-7).
      - id: fc-c-mark-car-service-due
        type: command
        label: Mark car service due
        context: fleet-care
        properties:
          description: System marks a car service-due once its mileage or date crosses its threshold (BR-13).
      - id: fc-c-classify-damage-minor
        type: command
        label: Classify damage as minor
        context: fleet-care
        properties:
          alternativeSet: damage-review-decision
          description: Fleet coordinator judges a damage report minor; the car stays in service (BR-15).
      - id: fc-c-classify-damage-unsafe
        type: command
        label: Classify damage as unsafe
        context: fleet-care
        properties:
          alternativeSet: damage-review-decision
          description: Fleet coordinator judges a damage report makes the car unsafe (BR-15).
      - id: fc-c-book-car-with-garage
        type: command
        label: Book car with garage
        context: fleet-care
        properties:
          description: Fleet coordinator books a car with the garage, either a service-due car ahead of its garage days (CAP-6, BR-14) or a car already taken out of service for unsafe damage, sent for repair under the same flow (BR-16, resolved hotspot).
      - id: fc-c-take-car-out-of-service
        type: command
        label: Take car out of service
        context: fleet-care
        properties:
          description: Car is pulled from service, either at once for unsafe damage (BR-16) or for its garage days once booked (BR-14).
      - id: fc-c-put-car-back-into-service
        type: command
        label: Put car back into service
        context: fleet-care
        properties:
          description: Fleet coordinator restores a car to service with its new mileage and next service threshold, after scheduled service or after repair of unsafe damage (BR-18, resolved hotspot).
      - id: res-p-approval-lapse-policy
        type: policy
        label: Approval lapse policy
        context: reservations
        properties:
          execution: automatic
          condition: no approval decision recorded for the long-trip request by the reservation's start
          description: Implements the lapse behaviour from Q-3's resolution.
      - id: res-p-pickup-timeout-policy
        type: policy
        label: Pickup timeout policy
        context: reservations
        properties:
          execution: automatic
          condition: car not picked up within the pickup window after the reservation's start
          parameters:
            - name: pickup-window-minutes
              value: "30"
          description: Implements BR-4 / SC-3.
      - id: res-p-cancel-future-reservations-policy
        type: policy
        label: Cancel future reservations policy
        context: reservations
        properties:
          execution: automatic
          description: "Implements BR-17: a car taken out of service has its future reservations cancelled."
      - id: res-p-notify-affected-employees-policy
        type: policy
        label: Notify affected employees policy
        context: reservations
        properties:
          execution: automatic
          description: "Implements BR-17: employees whose reservations were cancelled are notified."
      - id: fc-p-mileage-update-policy
        type: policy
        label: Mileage update policy
        context: fleet-care
        properties:
          execution: automatic
          description: "Implements BR-12: every car return updates the car's current mileage."
      - id: fc-p-damage-report-policy
        type: policy
        label: Damage report policy
        context: fleet-care
        properties:
          execution: automatic
          condition: a damage note was recorded on return
          description: "Implements CAP-7: a damage note left on return opens a damage report."
      - id: fc-p-service-due-policy
        type: policy
        label: Service due policy
        context: fleet-care
        properties:
          execution: automatic
          condition: current mileage reaches the next service mileage threshold or the current date reaches the next service due date
          description: Implements BR-13; triggered either by Car mileage updated (mileage threshold, checked on return) or by the temporal Service date reached event (date threshold, checked independently of any return).
      - id: fc-p-unsafe-damage-policy
        type: policy
        label: Unsafe damage policy
        context: fleet-care
        properties:
          execution: automatic
          description: "Implements BR-16: a car with an unsafe damage report is taken out of service at once."
      - id: fc-p-garage-days-policy
        type: policy
        label: Garage days policy
        context: fleet-care
        properties:
          execution: automatic
          description: "Implements BR-14: a car booked with the garage, whether service-due or sent for repair of unsafe damage, is taken out of service for its garage days."
      - id: res-ag-trip-request
        type: aggregate
        label: Trip request
        context: reservations
        properties:
          description: "Owns a trip request from submission through its outcome: an immediate short reservation, or a long-trip approval request that is then approved, denied, or left to lapse (CAP-1, CAP-3, BR-6, Q-3 resolution)."
      - id: res-ag-active-reservation
        type: aggregate
        label: Active reservation
        context: reservations
        properties:
          description: Owns a confirmed reservation's slot through pickup and return, including cancellation and release when not picked up (CAP-2, CAP-4, BR-4, BR-9).
      - id: res-ag-out-of-service-impact
        type: aggregate
        label: Out-of-service impact
        context: reservations
        properties:
          description: Cancels the future reservations of a car just taken out of service and notifies the affected employees (BR-17).
      - id: fc-ag-car-record
        type: aggregate
        label: Car record
        context: fleet-care
        properties:
          description: "Owns a car's fleet record: plate, seats, gearbox, van flag, mileage, service threshold and state, replacing the spreadsheet; updates mileage on every return (CAP-5, BR-11, BR-12)."
      - id: fc-ag-car-service-lifecycle
        type: aggregate
        label: Car service lifecycle
        context: fleet-care
        properties:
          description: "Owns a car's service state: becoming service-due, being booked with the garage, taken out of service for garage days or unsafe damage, and put back into service once serviced (CAP-6, BR-13, BR-14, BR-18, resolved hotspot fc-h-damage-repair-return-undefined)."
      - id: fc-ag-damage-report
        type: aggregate
        label: Damage report
        context: fleet-care
        properties:
          description: Owns a damage report from opening through the fleet coordinator's severity review (CAP-7, BR-15).
      - id: res-cons-car-fits-trip
        type: constraint
        label: Car fits trip
        context: reservations
        properties:
          rule: the car's seats, van flag and gearbox must match the trip's requested seats, equipment and gearbox
          description: BR-1.
      - id: res-cons-no-overlap
        type: constraint
        label: No overlapping reservation
        context: reservations
        properties:
          rule: the car must not already be reserved for a slot overlapping the requested slot
          description: BR-3; prevents the double-booking named in the brief (SC-1).
      - id: res-cons-reservation-limit
        type: constraint
        label: Reservation limit
        context: reservations
        properties:
          rule: the employee must hold fewer than two future reservations at the time of reserving, counting confirmed reservations and long-trip requests still awaiting a decision; a denied or lapsed request does not count
          description: BR-5; a pending long-trip request counts toward the limit, resolving hotspot res-h-pending-request-counts-toward-limit.
      - id: res-cons-car-in-service
        type: constraint
        label: Car in service
        context: reservations
        properties:
          rule: the car must be in service
          description: BR-7.
      - id: res-cons-not-service-due
        type: constraint
        label: Car not service-due for slot
        context: reservations
        properties:
          rule: the car's next service threshold (mileage or date) must not be reached before the requested slot ends
          description: BR-8.
      - id: res-cons-decision-before-start
        type: constraint
        label: Decision before start
        context: reservations
        properties:
          rule: an approval or denial can only be recorded for a long-trip request that has not yet lapsed, before the reservation's start
          description: Implements the approval window from Q-3's resolution; once res-p-approval-lapse-policy fires, the request is closed to further decision.
      - id: fc-cons-car-must-be-out-of-service-for-reinstatement
        type: constraint
        label: Car currently out of service
        context: fleet-care
        properties:
          rule: the car must currently be out of service (service-due at the garage, or pulled for unsafe damage) to be put back into service
          description: Precondition for BR-18, so a car already in service cannot be redundantly reinstated.
      - id: fc-cons-car-eligible-for-garage-booking
        type: constraint
        label: Car eligible for garage booking
        context: fleet-care
        properties:
          rule: the car must be service-due, or already taken out of service for unsafe damage, to be booked with the garage
          description: BR-14; also covers the unsafe-damage repair path (resolved hotspot fc-h-damage-repair-return-undefined).
