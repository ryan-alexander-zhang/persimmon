            attributes:
              - Damage Report has location
              - Damage Report has drivable flag
              - Damage Report has photos
              - Damage Report has review outcome
        valueObjects: []
        commands:
          - Open damage report
          - Review damage report
        events:
          - Damage report opened
          - Damage report reviewed as minor
          - Damage report reviewed as unsafe
        invariants: []
    events:
      - name: Car mileage updated
