kind: Design
metadata:
  name: car-pool-prd-architecture-bb-3-ui.r1
spec:
  identity:
    id: car-pool-prd-architecture-bb-3-ui
    revision: 1
  content:
    businessRules: car-pool-rules
    title: Pool Web Application
    type: ui
    architecture: car-pool-prd-architecture
    block: BB-3
    designSystem: car-pool-prd-design-system
    document:
      mediaType: text/markdown
      content: |
        ## Available cars

        ### Purpose

        Lets an Employee find a car that fits a trip's passenger count, equipment need, and gearbox preference for a chosen slot, and reserve one (QG-2).

        ### Data

        `GET /available-cars`. Each returned item is a `Car`; the schema names only `carId`, so each card renders `carId` as the car's identifying label.

        ### Actions

        - Reserve: submits `POST /reservations` with `carId` (the selected card), and `passengerCount`, `equipmentNeed`, `gearboxPreference`, `slotStart`, `slotEnd` carried over from the search fields used to call `GET /available-cars`.

        ### States

        - Empty: no car fits the stated `passengerCount`, `equipmentNeed`, `gearboxPreference`, and slot — zero cards shown.
        - Loading: while `GET /available-cars` or `POST /reservations` is in flight, the Reserve control shows as `button-primary-disabled`.
        - Refusal: reserving a listed car can still be refused — `BR-2` (seats too few), `BR-3` (no van for equipment need), `BR-4` (no automatic gearbox), `BR-5` (slot overlaps another reservation), `BR-6` (car out of service), `BR-7` (service due before slot ends), `BR-9` (employee already holds two future reservations). A request longer than three days is not a refusal; it is accepted pending `BR-10` and the card's status badge reads pending.

        ### Layout

        A stacked search form (`passengerCount`, `equipmentNeed`, `gearboxPreference`, `slotStart`, `slotEnd`) of `input` fields at `spacing.md` apart, `typography.body-md`, following a phone-first single-column layout per the DesignSystem Overview. Results render as a single-column list of `card`s on phone width, each with a `button-primary` "Reserve" (or `button-primary-disabled` while checking); a refusal surfaces as `input-error` helper text naming the broken rule beneath the card.

        ## My reservations

        ### Purpose

        Lets an Employee track their own reservations through pickup and return, cancel one, and see their own reliability count.

        ### Data

        `GET /my-reservations`: `reservations[]` (`id`, `status`, `slotStart`, `slotEnd`) and `reliability` (`lateCancellationCount`, `noShowCount`).

        ### Actions

        - Cancel: submits `POST /reservations/{reservationId}/cancel`.
        - Pick up: submits `POST /reservations/{reservationId}/pickup`.
        - Return: submits `POST /reservations/{reservationId}/return` with `damageNoted`, `damageLocation`, `damageDrivableFlag`, `damagePhoto`.

        ### States

        - Empty: no reservations.
        - Loading: while any of the four calls is in flight.
        - No refusal rule is returned by these four operations; a reservation forced to `cancelled` by `BR-20` (car taken out of service) is shown via its `status` badge, not a refusal banner.

        ### Layout

        A single-column list of `card`s (phone-first, per Overview), each carrying a `status-badge-*` keyed on `status` (`-active` for created/approved/picked up, `-pending` for pending approval, `-inactive` for cancelled/returned/released unclaimed) and the reliability counts in `typography.body-sm`. `button-secondary` "Cancel" pairs beside `button-primary` "Pick up"/"Return"; the return form's `damageLocation` field uses `input`, switching to `input-error` once `damageNoted` is set, at `spacing.md` between fields, controls at the 48px `height` for one-handed garage use.

        ## Employee reliability

        ### Purpose

        Lets the Fleet coordinator read every employee's monthly late-cancellation and no-show counts (informational only, CC-7).

        ### Data

        `GET /employee-reliability`: `employeeId`, `lateCancellationCount`, `noShowCount`.

        ### Actions

        None — read-only.

        ### States

        - Empty: no employees reported.
        - Loading: while the call is in flight.

        ### Layout

        A dense desk-table of `card` rows, `typography.body-md` for `employeeId` and `typography.label-md` for the two counts, following the Overview's denser multi-column desk layout for the coordinator's moment of use.

        ## Pending approvals

        ### Purpose

        Lets the Fleet coordinator approve or deny a reservation request longer than three days (`BR-10`).

        ### Data

        `GET /pending-approvals`: `reservationId`, `employeeId`, `slotStart`, `slotEnd`.

        ### Actions

        - Approve: submits `POST /reservations/{reservationId}/approve`.
        - Deny: submits `POST /reservations/{reservationId}/deny`.

        ### States

        - Empty: no requests awaiting approval.
        - Loading: while any call is in flight.
        - Both endpoints return only success; the decision itself enforces `BR-10`, so no refusal state applies here.

        ### Layout

        A single-column list of `card`s, each tagged `status-badge-pending`, with `button-primary` "Approve" beside `button-secondary` "Deny", per the Do's and Don'ts pairing of a committing action with a visible escape.

        ## Fleet record

        ### Purpose

        Lets the Fleet coordinator read and maintain one accurate record per car (QG-4), replacing the spreadsheet.

        ### Data

        `GET /cars`: `carId`, `plate`, `mileage`, `nextServiceThreshold`, `serviceState`.

        ### Actions

        - Save: submits `PUT /cars/{carId}` with `plate`, `seats`, `gearbox`, `vanFlag`, `nextServiceThreshold`.

        ### States

        - Empty: no cars in the fleet record.
        - Loading: while `GET /cars` or `PUT /cars/{carId}` is in flight.
        - Refusal: `BR-14` — a required fleet record field is missing.

        ### Layout

        A dense desk grid of `card` rows (per the Overview's coordinator desk reading condition), `serviceState` shown as `status-badge-active`/`status-badge-inactive`; the edit form uses `input` for `plate`, `seats`, `nextServiceThreshold`, switching to `input-error` with helper text naming `BR-14` when a required field is left blank, `button-primary` "Save".

        ## Service-due

        ### Purpose

        Lets the Fleet coordinator see cars that have crossed their next-service threshold (`BR-15`) and book them in with the garage.

        ### Data

        `GET /cars/service-due`: `carId`, `plate`, `nextServiceThreshold`.

        ### Actions

        - Schedule service: submits `POST /cars/{carId}/schedule-service`.

        ### States

        - Empty: no car is currently service-due.
        - Loading: while either call is in flight.

        ### Layout

        A list of `card`s tagged `status-badge-warning` for service-due, `button-primary` "Schedule service"; desk-density list per the Overview.

        ## Garage status

        ### Purpose

        Lets the Fleet coordinator track cars booked with the garage and put a serviced or repaired car back into service (`BR-16`, `BR-21`).

        ### Data

        `GET /garage-status`: `carId`, `plate`, `serviceState`.

        ### Actions

        - Complete service: submits `POST /cars/{carId}/complete-service` with `mileage`, `nextServiceThreshold`.
        - Return from repair: submits `POST /cars/{carId}/return-from-repair` with `mileage`, `nextServiceThreshold`.

        ### States

        - Empty: no car currently out of service.
        - Loading: while any call is in flight.

        ### Layout

        A list of `card`s tagged `status-badge-inactive` while `serviceState` is out-of-service, each with `input` fields for `mileage` and `nextServiceThreshold` and a `button-primary` for "Complete service" or "Return from repair" depending on why the car left service, per the RK-3 note that this view must surface open bookings prominently.

        ## Damage reports

        ### Purpose

        Lets the Fleet coordinator review a damage report opened from a return's damage note and decide whether the car stays in service or is pulled (`BR-18`, `BR-19`).

        ### Data

        `GET /damage-reports`: `damageReportId`, `carId`, `location`, `drivableFlag`, `photos`, `reviewOutcome`.

        ### Actions

        - Mark minor: submits `POST /damage-reports/{damageReportId}/review` with `reviewOutcome: minor`.
        - Mark unsafe: submits `POST /damage-reports/{damageReportId}/review` with `reviewOutcome: unsafe`.

        ### States

        - Empty: no open damage reports.
        - Loading: while either call is in flight.
        - `reviewOutcome` once set shows as `status-badge-warning` (minor, `BR-18`: car stays in service) or `status-badge-error` (unsafe, `BR-19`: car taken out of service at once).

        ### Layout

        A list of `card`s showing `location`, `drivableFlag`, and the `photos` reference as `typography.body-sm` text (the DesignSystem has no dedicated image component, so the photo reference is rendered as plain text, not a thumbnail); `button-secondary` "Mark minor" beside `button-primary` "Mark unsafe" while `reviewOutcome` is unset, replaced by the matching `status-badge-*` once reviewed.
