apiVersion: sdd.persimmon.ai/v1
kind: Glossary
metadata:
  name: expense-claims-completeness-glossary.r1
spec:
  identity:
    id: expense-claims-completeness-glossary
    revision: 1
  content:
    title: Expense Claims Completeness Glossary
    context: expense-claims-completeness
    terms:
      - name: Claim
        definition: The single consistency boundary that owns a claim's drafting (id derivation, BR-4; line reading, BR-6), its completeness verdict (BR-1, BR-2) and its receipt-attachment ownership check (BR-3).
        status: active
        related:
          - Employee
          - Claim Completeness View
      - name: Employee
        definition: Submits an expense claim's lines (amount, category, optional receipt) and wants to know right away whether the claim is complete; wants a receipt they attach recognized only on their own claim.
        status: active
        related:
          - Claim
      - name: Claim Completeness View
        definition: The true/false completeness verdict returned to the employee for their submitted claim, so they learn completeness without working out the receipt rules themselves (G-1, SC-1).
        status: active
        related:
          - Claim
          - Employee
    factTypes:
      - name: claim has id
        subject: Claim
        predicate: has
        object:
          type: string
        status: active
        description: A claim's id, derived deterministically as c-<employee> (BR-4).
      - name: claim has employee
        subject: Claim
        predicate: has
        object: Employee
        status: active
        description: The employee who submitted the claim; a receipt may attach only when submitted by this same employee (BR-3).
      - name: claim has completeness verdict
        subject: Claim
        predicate: has
        object:
          type: boolean
        status: active
        description: Whether every line of the claim satisfies the per-diem/threshold/receipt rule (BR-1, BR-2).
  provenance:
    producerRef:
      apiVersion: persimmon.ai/v1
