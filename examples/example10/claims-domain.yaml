apiVersion: sdd.persimmon.ai/v1
kind: EventStorming
metadata:
  name: claims-prd-storming.r1
spec:
  identity:
    id: claims-prd-storming
    revision: 1
  content:
    version: "4.2"
    meta:
      name: Expense Claims Completeness
      level: design
    contexts:
      - id: expense-claims-completeness
        name: Expense Claims Completeness
        order: 0
        classification: core
        subdomain: expense-claims-completeness
    contextRelationships: []
    nodes:
      - id: employee
        type: actor
        label: Employee
        properties:
          description: Submits an expense claim's lines (amount, category, optional receipt) and wants to know right away whether the claim is complete; wants a receipt they attach recognized only on their own claim.
      - id: expense-claims-completeness-e-claim-submitted
        type: domainEvent
        label: Claim submitted
        context: expense-claims-completeness
        order: 0
        properties:
          description: An employee submits a claim's lines (amount, category, and an optional receipt per line) for a completeness check (CAP-2; EP-2, EP-4, EP-6).
      - id: expense-claims-completeness-e-claim-drafted
        type: domainEvent
        label: Claim drafted
        context: expense-claims-completeness
        order: 1
        properties:
          pivotal: true
          description: The claim's id is derived deterministically as c-<employee> (BR-4) and its lines are structured, each carrying its receipt exactly as the client supplied it (BR-6).
      - id: expense-claims-completeness-e-claim-judged-complete
        type: domainEvent
        label: Claim judged complete
        context: expense-claims-completeness
        order: 2
        properties:
          pivotal: true
          alternativeSet: completeness-verdict
          description: Every line of the drafted claim satisfies the per-diem/threshold/receipt rule (BR-1, BR-2).
      - id: expense-claims-completeness-e-claim-judged-incomplete
        type: domainEvent
        label: Claim judged incomplete
        context: expense-claims-completeness
        order: 2
        properties:
          pivotal: true
          alternativeSet: completeness-verdict
          description: At least one line of the drafted claim fails the per-diem/threshold/receipt rule (BR-1, BR-2).
      - id: expense-claims-completeness-e-receipt-attached
        type: domainEvent
        label: Receipt attached to claim
        context: expense-claims-completeness
        order: 3
        properties:
          pivotal: true
          alternativeSet: receipt-attachment
          description: A receipt is attached to a claim's line when submitted under that claim's own URL and by that claim's own employee (BR-3). Reachable today only through the claim entity's own attach method, not through any live HTTP entry point.
      - id: expense-claims-completeness-e-receipt-attachment-refused
        type: domainEvent
        label: Receipt attachment refused
        context: expense-claims-completeness
        order: 3
        properties:
          pivotal: true
          alternativeSet: receipt-attachment
          description: An attempt to attach a receipt under another claim's URL, or by another employee, is refused and logged (BR-3).
      - id: expense-claims-completeness-op-wire-attach-receipt-endpoint
        type: opportunity
        label: Wire receipt attachment to a live entry point
        properties:
          description: No HTTP entry point calls the attach-receipt method today; a capability routing receipt attachment through BR-3's ownership check is a proposed change a human has not yet approved.
      - id: expense-claims-completeness-op-unify-malformed-response
        type: opportunity
        label: Unify the malformed-submission error response
        properties:
          description: "No implementation defines or rejects a malformed submission as a business outcome: js throws uncaught (AB-1), go silently answers as if the claim were empty (AB-3), and java's parser simply matches nothing. Both are decided keep, so this is not modeled as an event; defining one error response across js, java and go remains an open improvement a human has not approved."
      - id: expense-claims-completeness-c-submit-claim
        type: command
        label: Submit claim
        context: expense-claims-completeness
        properties:
          description: An employee submits a claim's lines (amount, category, optional receipt) for a completeness check (CAP-2; EP-2, EP-4, EP-6).
      - id: expense-claims-completeness-p-draft-claim-policy
        type: policy
        label: Draft claim on submission policy
        context: expense-claims-completeness
        properties:
          description: "Reacts automatically to a claim submission by drafting the claim: no actor decision is involved between submission and drafting."
          execution: automatic
      - id: expense-claims-completeness-c-draft-claim
        type: command
        label: Draft claim
        context: expense-claims-completeness
        properties:
          description: Derives the claim id deterministically as c-<employee> (BR-4) and structures each submitted line, reading every submitted line and each line's receipt exactly as supplied by the client (BR-6), correcting java's prior single-line, receipt-blind parsing recorded as a defect (BR-5).
      - id: expense-claims-completeness-p-judge-completeness-policy
        type: policy
        label: Judge completeness on draft policy
        context: expense-claims-completeness
        properties:
          description: Reacts automatically to a drafted claim by judging its completeness against the per-diem/threshold/receipt rule (BR-1, BR-2); no actor decision is involved.
          execution: automatic
          condition: every line of the drafted claim is per-diem, or its amount is under the receipt threshold, or it carries a receipt
          parameters:
            - name: receiptThreshold
              value: "25"
      - id: expense-claims-completeness-c-judge-claim-complete
        type: command
        label: Judge claim complete
        context: expense-claims-completeness
        properties:
          alternativeSet: judge-claim-completeness
          description: Every line of the drafted claim satisfies the per-diem/threshold/receipt rule (BR-1, BR-2).
      - id: expense-claims-completeness-c-judge-claim-incomplete
        type: command
        label: Judge claim incomplete
        context: expense-claims-completeness
        properties:
          alternativeSet: judge-claim-completeness
          description: At least one line of the drafted claim fails the per-diem/threshold/receipt rule (BR-1, BR-2).
      - id: expense-claims-completeness-rm-claim-completeness-view
        type: readModel
        label: Claim Completeness View
        context: expense-claims-completeness
        properties:
          description: The true/false completeness verdict returned to the employee for their submitted claim, so they learn completeness without working out the receipt rules themselves (G-1, SC-1).
      - id: expense-claims-completeness-c-attach-receipt
        type: command
        label: Attach receipt
        context: expense-claims-completeness
        properties:
          description: Attaches a submitted receipt to a claim's line only when submitted under that claim's own URL and by that claim's own employee, refusing and logging any other attempt (BR-3). Implemented and unit-tested on each repository's claim entity, but reachable today only via that entity's own method, not through any live HTTP entry point (Q-1).
      - id: expense-claims-completeness-ag-claim
        type: aggregate
        label: Claim
        context: expense-claims-completeness
        properties:
          description: The single consistency boundary (EN-1 in all three implementations) that owns a claim's drafting (id derivation BR-4, line reading BR-6), its completeness verdict (BR-1, BR-2) and its receipt-attachment ownership check (BR-3).
      - id: expense-claims-completeness-cons-receipt-ownership
        type: constraint
        label: Receipt ownership
        context: expense-claims-completeness
        properties:
          rule: a receipt may attach to a claim's line only when submitted under that claim's own URL and by that claim's own employee
          description: "BR-3: any other attempt must be refused and logged. Implemented and unit-tested on the Claim aggregate in all three repositories, but reachable today only through the aggregate's own method, not through any live HTTP entry point (Q-1)."
      - id: expense-claims-completeness-h-claim-aggregate-size
        type: hotspot
        label: Claim aggregate handles 5 commands and 6 events
        properties:
          kind: risk
          priority: low
          state: resolved
          description: The Claim aggregate is handledBy for 5 commands (submit, draft, judge-complete, judge-incomplete, attach-receipt) and emits 6 events, above the usual five-event single-aggregate guideline. Kept as one because js, java and go all model drafting, completeness judging and receipt attachment as methods of the one Claim entity (EN-1); worth revisiting into a separate receipt-attachment aggregate if the wire-attach-receipt-endpoint opportunity is ever approved.
          resolution: One aggregate stands. The claim is the only entity; its five commands are one submission's chain (submit, draft, judge complete or incomplete) plus receipt attachment, and the smell counts them past a threshold, not a second consistency boundary.
    edges:
      - id: e-expense-claims-completeness-01
        source: expense-claims-completeness-op-wire-attach-receipt-endpoint
        target: expense-claims-completeness-e-receipt-attached
        relation: highlights
      - id: e-expense-claims-completeness-02
        source: expense-claims-completeness-op-wire-attach-receipt-endpoint
        target: expense-claims-completeness-e-receipt-attachment-refused
        relation: highlights
      - id: e-expense-claims-completeness-03
