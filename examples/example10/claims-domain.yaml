    openQuestions:
      - id: Q-1
        question: "Propose Slice SL-1 = the js implementation (EP-1, EP-2; files js/src/server.js, js/src/claim.js). Smallest and fully self-contained: its in-memory Claim is never shared with the java or go process, so cutting it alone touches no other Slice."
        resolution: "Superseded: the ParityLedger cuts SL-1 as all six entry points (js, java, go) together, since the three implementations are meant to be the same business and are compared as one Slice."
      - id: Q-2
        question: Propose Slice SL-2 = the java implementation (EP-3, EP-4; files java/src/main/java/claims/Server.java, java/src/main/java/claims/Claim.java). Independent of js and go; its request body parsing (a single regex match over the raw body) is its own small, self-contained area to read closely.
        resolution: "Superseded: the ParityLedger cuts SL-1 as all six entry points (js, java, go) together, since the three implementations are meant to be the same business and are compared as one Slice."
      - id: Q-3
        question: Propose Slice SL-3 = the go implementation (EP-5, EP-6; files go/cmd/server/main.go, go/claims/claim.go). Independent of js and java.
        resolution: "Superseded: the ParityLedger cuts SL-1 as all six entry points (js, java, go) together, since the three implementations are meant to be the same business and are compared as one Slice."
      - id: Q-4
        question: The brief states 'a receipt attaches only under the claim's own URL and by the claim's own employee; a refused attachment is logged' — each repo's Claim/claims type has an attachReceipt/AttachReceipt method implementing exactly this, but in none of the three repos does any HTTP route call it (Server.java, server.js and main.go each only ever construct a claim and call its completeness check). It is reached only from each repo's own unit test. Was an attach-receipt HTTP endpoint planned, removed, or never built, and is this absence the same across all three by design or by parallel oversight?
        resolution: Code cannot answer intent; the human should confirm with whoever owns the brief whether an endpoint is expected. Recorded as AB-2/GD-5 (js), AB-4/GD-12 (go) and AB-5/AB-6/GD-17 (java, where the gap is even wider since the route never even captures a receipt field from the request).
      - id: Q-5
        question: js/test/claim.test.js drafts a line carrying a `date` field and asserts draftClaim preserves it verbatim, but no Line type in java (a record of amount/category/receipt) or go (a struct of Amount/Category/Receipt) has a date field at all, and js's own completeness check never reads it. Is `date` a real attribute of a claim line that java and go are missing, or is it incidental to that one js test with no business meaning?
        resolution: Code cannot answer; a Slice should treat this as an open flag rather than assume either answer.
      - id: Q-6
        question: "js/test-int/store.test.js ('a drafted claim is written to a real container and read back') never calls draftClaim or anything in claim.js: it starts a throwaway alpine container, writes the literal string 'c-e1' to a file with `sh -c echo`, reads it back, and asserts the echoed literal equals itself. It does not exercise the DC-2 claim-id format or any persistence of a drafted claim (there is no real store — claims are never persisted in this slice). Is this integration test a stand-in for a store that was never built, or dead/vestigial test scaffolding? The same pattern repeats verbatim in java/src/test/java/claims/StoreIT.java and go/claims/store_integration_test.go (each also just writes/reads the literal 'c-e1' in a throwaway alpine container, exercising no production code)."
        resolution: Code cannot answer; the human should confirm whether a persistent claim store is planned (in which case these three tests are placeholders to replace) or whether they should be removed as misleading.
