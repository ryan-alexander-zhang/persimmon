        revision: 1
      - apiVersion: sdd.persimmon.ai/v1
        kind: Prd
        namespace: default
        id: claims-prd
        revision: 1
      - apiVersion: sdd.persimmon.ai/v1
        kind: BusinessRules
        namespace: default
        id: claims-rules
        revision: 1
      - apiVersion: sdd.persimmon.ai/v1
        kind: BusinessRules
        namespace: default
        id: claims-rules
        revision: 1
