        question: java's HTTP endpoint (Server.java) parses the request body with a single regex match capturing only amount and category, never receipt, and only the first match in the whole body is used (GD-14, AB-5, AB-6) — so every claim submitted via POST /claims is judged by java using at most one line, with receipt always null, while js and go read the full JSON `lines` array including each line's client-supplied receipt (AB-2, AB-4). Is java's regex-based parser a known simplification/placeholder, or a defect against the shared business rule the three repos are meant to implement identically?
