# example10, recorded: what one run of the README's steps produced on claude-sonnet-5 from the three checkouts source.sh
# makes, the brief and the forms under answers/. See README.md. Every artifact is at revision 1: the rounds collapsed into the
# revision that passed; of the storming, the design level.
apiVersion: rewrite.persimmon.ai/v1
kind: SourceInventory
metadata:
  name: claims-inventory.r1
spec:
  identity:
    id: claims-inventory
    revision: 1
  content:
    source:
      repository: "ex10-source (directory of checkouts: js, java, go)"
      repositories:
        - name: js
          repository: ex10-source/js
          commit: 7acfbf0956a66f34c2ed9af51ca401277c411f27
        - name: java
          repository: ex10-source/java
          commit: 850b7de8a9bd701b6b38d6e154dea744c6f40a9e
        - name: go
          repository: ex10-source/go
          commit: 43eb9112332d54a00fae13154dc6772cdfc876b1
    slice: SL-1
    entryPoints:
      - id: EP-1
        kind: http
        name: GET / — serve claims form page (js)
        where:
          - js/src/server.js:8
        reaches:
          files:
            - js/src/server.js
            - js/scripts/api.mjs
      - id: EP-2
        kind: http
        name: POST (any path, non-GET) — check claim completeness (js)
        where:
          - js/src/server.js:9-14
        reaches:
          files:
            - js/src/server.js
            - js/src/claim.js
            - js/scripts/api.mjs
          entities:
            - EN-1
      - id: EP-3
        kind: http
        name: GET / — serve claims form page (java)
        where:
          - java/src/main/java/claims/Server.java:20
        reaches:
          files:
            - java/src/main/java/claims/Server.java
            - java/scripts/api.sh
      - id: EP-4
        kind: http
        name: POST (any path, non-GET) — check claim completeness (java)
        where:
          - java/src/main/java/claims/Server.java:21-26
        reaches:
          files:
            - java/src/main/java/claims/Server.java
            - java/src/main/java/claims/Claim.java
            - java/scripts/api.sh
          entities:
            - EN-1
      - id: EP-5
        kind: http
        name: GET / — serve claims form page (go)
        where:
          - go/cmd/server/main.go:17-19
        reaches:
          files:
            - go/cmd/server/main.go
            - go/scripts/api.sh
      - id: EP-6
        kind: http
        name: POST (any path, non-GET) — check claim completeness (go)
        where:
          - go/cmd/server/main.go:20-27
        reaches:
          files:
            - go/cmd/server/main.go
            - go/claims/claim.go
            - go/scripts/api.sh
          entities:
            - EN-1
    stateChanges: []
    guards:
      - id: GD-1
        condition: req.method === 'GET'
        outcome: "true: respond immediately with the static form page (res.end(page)); false (any other method, any path): fall through to read the request body and answer the completeness check"
        role: plumbing
        where:
          - js/src/server.js:8-15
        in:
          - EP-1
          - EP-2
      - id: GD-2
        condition: process.argv[2] is given (a port argument)
        outcome: "true: server.listen(Number(process.argv[2])) binds a port; false: the module loads without binding a port (e.g. when imported by a test), so the exported `server` never accepts connections on its own"
        role: plumbing
        where:
          - js/src/server.js:16
        in:
          - EP-1
          - EP-2
      - id: GD-3
        condition: line.category === 'per-diem' || line.amount < RECEIPT_THRESHOLD || Boolean(line.receipt)
        outcome: "true: the line counts complete — a per-diem line needs no receipt, nor does one under the 25 threshold, nor does one that already carries a truthy receipt value; false: the line counts incomplete and fails the claim's overall completeness"
        role: rule
        where:
          - js/src/claim.js:7
          - js/src/claim.js:2
        in:
          - EP-2
      - id: GD-4
        condition: claim.lines.every(lineComplete) — every line of the claim must individually satisfy lineComplete
        outcome: "true: claimComplete returns true, answered to the client as {complete:true}; false (any single line fails lineComplete): claimComplete returns false, answered as {complete:false}"
        role: rule
        where:
          - js/src/claim.js:10-11
        in:
          - EP-2
      - id: GD-5
        condition: "!url.includes(`/claims/${claim.id}/`) || employee !== claim.employee"
        outcome: "true (the URL is not under the claim's own path, or the employee is not the claim's own employee): push `refused ${url} by ${employee}` onto claim.log and return false, no receipt attached; false (URL under the claim's own path and the claim's own employee): set claim.lines[0].receipt = url and return true"
        role: rule
        where:
          - js/src/claim.js:15-20
        in:
          - EP-2
        note: attachReceipt is never called from the POST handler (server.js:9-14 builds the claim with draftClaim and passes it straight to claimComplete); in this slice's reached files its only caller is js/test/claim.test.js:18-22. The POST /claims handler accepts whatever value a client puts in a line's `receipt` field directly in the submitted JSON, so this ownership/URL check never runs against a real request (see AB-2).
      - id: GD-6
        condition: r.status is null/undefined (spawnSync's result has no numeric exit status, e.g. the bru process was killed by a signal)
        outcome: "true: process.exit(1); false: process.exit(r.status) — the script's own exit code propagates the Bruno collection run's exit code"
        role: plumbing
        where:
          - js/scripts/api.mjs:7
        in:
          - EP-1
          - EP-2
        note: This script is the only thing that starts js/src/server.js (on port 3997) and drives the Bruno API collection (js/api/refuse-without-receipt.bru) against it; it has no business logic of its own.
      - id: GD-7
        condition: mvn -q compile exits non-zero (line 3), or cd api fails before bru run executes (line 6, within the `(cd api && bru run ...)` chain)
        outcome: "line 3 failure: script exits 1 immediately, server never started, tests never run; line 6's cd failure short-circuits bru run but the script still proceeds to kill the (possibly unset) app pid and exit with bru's/the subshell's status; otherwise: compiles, starts the java Server as a background process on port 3996, waits 1s, runs the Bruno collection against it, kills the server, exits with the Bruno run's exit code"
        role: plumbing
        where:
          - java/scripts/api.sh:3-8
        in:
          - EP-3
          - EP-4
        note: The only thing that starts java/src/main/java/claims/Server.java and drives the Bruno API collection (java/api/refuse-without-receipt.bru) against it; no business logic of its own.
      - id: GD-8
        condition: go build -o bin/server ./cmd/server exits non-zero (line 3), or cd api fails before bru run executes (line 6, within the `(cd api && bru run ...)` chain)
        outcome: "line 3 failure: script exits 1 immediately, server never started, tests never run; line 6's cd failure short-circuits bru run but the script still proceeds to kill the (possibly unset) app pid and exit with the subshell's status; otherwise: builds, starts the compiled server as a background process on port 3994, waits 1s, runs the Bruno collection against it, kills the server, exits with the Bruno run's exit code"
        role: plumbing
        where:
          - go/scripts/api.sh:3-8
        in:
          - EP-5
          - EP-6
        note: The only thing that builds and starts go/cmd/server/main.go and drives the Bruno API collection (go/api/refuse-without-receipt.bru) against it; no business logic of its own.
      - id: GD-9
        condition: r.Method == http.MethodGet
        outcome: 'true: write the static form page to the response and return immediately; false (any other method, any path): decode the request body into {Employee, Lines}, draft a claim and answer {"complete": ...}'
        role: plumbing
        where:
          - go/cmd/server/main.go:17-27
        in:
          - EP-5
          - EP-6
      - id: GD-10
        condition: l.Category == "per-diem" || l.Amount < ReceiptThreshold || l.Receipt != ""
        outcome: "true: the line counts complete — a per-diem line needs no receipt, nor does one under the 25 threshold, nor does one with a non-empty Receipt; false: the line counts incomplete"
        role: rule
        where:
          - go/claims/claim.go:24-26
          - go/claims/claim.go:6
        in:
          - EP-6
      - id: GD-11
        condition: "!LineComplete(l), tested per line while ranging over c.Lines"
        outcome: "true: Complete returns false immediately, remaining lines never checked (short-circuit, order-dependent on c.Lines); false: loop continues; if every line passes, Complete returns true after the loop"
        role: rule
        where:
          - go/claims/claim.go:28-35
        in:
          - EP-6
        volatile:
          - order
      - id: GD-12
        condition: '!strings.Contains(url, "/claims/"+c.ID+"/") || by != c.Employee'
        outcome: "true (URL not under the claim's own path, or the attaching party is not the claim's own employee): append `refused {url} by {by}` to c.Log and return false, no receipt attached; false: set c.Lines[0].Receipt = url and return true"
        role: rule
        where:
          - go/claims/claim.go:37-44
        in:
          - EP-6
        note: AttachReceipt is never called from the POST handler in main.go (main.go:21-27 builds the claim with Draft and calls Complete directly); in this slice's reached files its only caller is go/claims/claim_test.go:33-38. POST / accepts whatever value a client puts in a line's Receipt field directly in the submitted JSON (matched case-insensitively onto the Line struct by encoding/json), so this ownership/URL check never runs against a real request (see AB-4).
      - id: GD-13
        condition: ex.getRequestMethod().equals("GET")
        outcome: 'true: body = PAGE (serve the static form); false (any other method, any path): regex-parse the body into at most one Claim.Line, build a Claim, compute body = {"complete": c.complete()}'
        role: plumbing
        where:
          - java/src/main/java/claims/Server.java:20-26
        in:
          - EP-3
          - EP-4
      - id: GD-14
        condition: m.find() — whether the LINE regex finds a match anywhere in the raw request body
        outcome: "true: the claim gets exactly one line, built from the first regex match's captured amount and category, with receipt always hard-coded null; false (no match found anywhere in the body): the claim gets zero lines, so complete() is vacuously true"
        role: rule
        where:
          - java/src/main/java/claims/Server.java:23
          - java/src/main/java/claims/Server.java:14
        in:
          - EP-4
        note: LINE regex captures only amount and category, never receipt, and Matcher.find() is called once over the whole body (not looped), so only the first line of a multi-line submission is ever read and the resulting Claim.Line's receipt is always null regardless of what the client sends (see AB-5, AB-6). This differs materially from js (server.js/claim.js) and go (main.go/claim.go), which parse the full JSON lines array including each line's client-supplied receipt (see AB-2, AB-4).
      - id: GD-15
        condition: line.category().equals("per-diem") || line.amount() < RECEIPT_THRESHOLD || line.receipt() != null
        outcome: "true: the line counts complete; false: the line counts incomplete and fails the claim's overall completeness"
        role: rule
        where:
          - java/src/main/java/claims/Claim.java:23-25
          - java/src/main/java/claims/Claim.java:8
        in:
          - EP-4
      - id: GD-16
        condition: lines.stream().allMatch(Claim::lineComplete)
        outcome: 'true: complete() returns true, answered as {"complete":true}; false (any single line fails lineComplete): complete() returns false, answered as {"complete":false}'
        role: rule
        where:
          - java/src/main/java/claims/Claim.java:27-29
        in:
          - EP-4
      - id: GD-17
        condition: '!url.contains("/claims/" + id + "/") || !by.equals(employee)'
        outcome: 'true: log.add("refused " + url + " by " + by) and return false, no receipt attached; false: replace lines.get(0) with a copy carrying receipt = url and return true'
        role: rule
        where:
          - java/src/main/java/claims/Claim.java:31-39
        in:
          - EP-4
        note: attachReceipt is never called from the Server.java route (Server.java:18-31 only ever constructs a Claim via regex parsing and calls complete()); in this slice's reached files its only caller is java/src/test/java/claims/ClaimTest.java:21-25. Because the route's regex parser (GD-14) never populates a Line's receipt field from the request at all, there is no path by which the HTTP endpoint could even attempt to set a receipt-bearing line — stricter in practice than js/go's bypass (see AB-5).
    declarations:
      - id: DC-1
        kind: data
        statement: "RECEIPT_THRESHOLD is fixed at 25: a line's amount must be strictly less than 25 to need no receipt under the completeness rule"
        where:
          - js/src/claim.js:2
      - id: DC-2
        kind: key
        statement: draftClaim derives the claim id deterministically as `c-${employee}` with no sequence, timestamp or random component, so every claim drafted for the same employee within the process gets the identical id string
        where:
          - js/src/claim.js:4
      - id: DC-3
        kind: data
        statement: ReceiptThreshold is fixed at 25 in go, same value and role as js's RECEIPT_THRESHOLD and java's RECEIPT_THRESHOLD
        where:
          - go/claims/claim.go:6
      - id: DC-4
        kind: key
        statement: Draft derives the claim ID deterministically as `c-` + employee with no sequence, timestamp or random component
        where:
          - go/claims/claim.go:21
      - id: DC-5
        kind: data
        statement: RECEIPT_THRESHOLD is fixed at 25 in java, same value and role as js's RECEIPT_THRESHOLD and go's ReceiptThreshold
        where:
          - java/src/main/java/claims/Claim.java:8
      - id: DC-6
        kind: key
        statement: The java Claim constructor derives id deterministically as "c-" + employee with no sequence, timestamp or random component
        where:
          - java/src/main/java/claims/Claim.java:18
    absences:
      - id: AB-1
        statement: The POST handler parses the request body with JSON.parse(body) and never catches a parse failure; a malformed body throws inside the 'end' listener uncaught, instead of the handler returning an error response to the client
        where:
          - js/src/server.js:11
      - id: AB-2
        statement: POST /claims accepts line.receipt exactly as supplied by the client in the request JSON; the attachReceipt rule (a receipt attaches only under the claim's own URL and by the claim's own employee, a refusal logged) exists in claim.js but is never invoked by the route, so a client can mark any line as having a receipt by sending any truthy value, bypassing the ownership/URL check entirely
        where:
          - js/src/server.js:9-14
          - js/src/claim.js:15-20
      - id: AB-3
        statement: main.go decodes the request body with json.NewDecoder(r.Body).Decode(&in) and discards the returned error entirely; a malformed or non-JSON body therefore never produces an error response — `in` simply keeps its zero value (Employee empty, Lines nil) and the handler answers {"complete":true} (vacuously true, zero lines), unlike js which throws uncaught on the same input
        where:
          - go/cmd/server/main.go:25
      - id: AB-4
        statement: POST / accepts a line's Receipt exactly as supplied by the client in the request JSON (matched case-insensitively onto the Line struct); AttachReceipt's ownership/URL rule exists in claim.go but is never invoked by the route, so a client can mark any line as having a receipt by sending any non-empty value, bypassing the ownership/URL check entirely, the same gap as js's AB-2
        where:
          - go/cmd/server/main.go:21-27
          - go/claims/claim.go:37-44
      - id: AB-5
        statement: The LINE regex in Server.java captures only amount and category and has no capture group for receipt at all; every Claim.Line built from an HTTP request therefore has receipt == null regardless of what the client sends for a line's receipt field, unlike js and go which pass the client's raw receipt value straight through to the completeness check (see AB-2, AB-4)
        where:
          - java/src/main/java/claims/Server.java:14
          - java/src/main/java/claims/Server.java:22-23
      - id: AB-6
        statement: Server.java calls LINE.matcher(body).find() only once (not in a loop), so only the first line of a multi-line submission in the request body is ever read into the Claim; any further lines the client submitted in the `lines` array are silently dropped and never considered for completeness
        where:
          - java/src/main/java/claims/Server.java:22-23
    plumbingPatterns: []
    entities:
      - id: EN-1
        name: Claim (employee, lines[{amount, category, receipt?}], log)
        where:
