apiVersion: sdd.persimmon.ai/v1
kind: BusinessRules
metadata:
  name: claims-rules.r1
spec:
  identity:
    id: claims-rules
    revision: 1
  content:
    title: Expense Claims Completeness Business Rules
    owner: Unassigned — no owner named in the brief
    rules:
      - id: BR-1
        type: derivation
        statement: A claim's completeness must be computed as true only when every line of the claim is complete, and as false if any line is incomplete.
        rationale: The API answers {complete} as the logical result of checking every line of the claim; one incomplete line makes the whole claim incomplete. This is how js's claimComplete, java's Claim.complete() and go's Claim.Complete() all work.
        source: "inventory: GD-4, GD-11, GD-16"
        status: active
        examples:
          - an employee sees a 30 EUR meals line without a receipt is incomplete (js/e2e/claim.spec.js:3-7)
          - POST claims refuses a meals line without a receipt (js/api/refuse-without-receipt.bru:1-21)
          - an employee sees a 30 EUR meals line without a receipt is incomplete (java) (java/e2e/claim.spec.js:3-7)
          - an employee sees a 30 EUR meals line without a receipt is incomplete (go) (go/e2e/claim.spec.js:3-7)
      - id: BR-2
        type: constraint
        statement: A claim line must have a receipt unless it is a per-diem line or its amount is under the receipt threshold of 25.
        rationale: A per-diem line is a fixed allowance that needs no supporting document, and an expense small enough (under 25) is exempted from proof; any other line must be backed by a receipt to count as complete. This is consistent across js, java and go.
        source: "inventory: GD-3, DC-1, GD-10, DC-3, GD-15, DC-5"
        status: active
        examples:
          - a 30 EUR meals line without a receipt is not complete and names BR-2 (js/test/claim.test.js:5-7)
          - a per diem line needs no receipt (js/test/claim.test.js:8-10)
          - a 25.00 EUR taxi line without a receipt is not complete and names BR-2 (js/test/claim.test.js:15-17)
          - a meals line of 30 without a receipt is not complete (java) (java/src/test/java/claims/ClaimTest.java:9-11)
          - a per diem line needs no receipt (java) (java/src/test/java/claims/ClaimTest.java:12-14)
          - a taxi line of 25 without a receipt is not complete (java) (java/src/test/java/claims/ClaimTest.java:18-20)
          - a meals line of 30 without a receipt is not complete (go) (go/claims/claim_test.go:8-12)
          - a per diem line needs no receipt (go) (go/claims/claim_test.go:14-18)
          - a taxi line of 25 without a receipt is not complete (go) (go/claims/claim_test.go:27-31)
      - id: BR-3
        type: constraint
        statement: A receipt may attach to a claim's line only when submitted under that claim's own URL and by that claim's own employee; any other attempt must be refused and logged.
        rationale: This prevents one employee's submission from attaching a receipt to, or satisfying the receipt requirement of, another employee's claim, whenever attachReceipt/AttachReceipt is actually invoked. js's attachReceipt, java's attachReceipt and go's AttachReceipt all enforce this and log a refusal when it fails. None of the three HTTP entry points (EP-2, EP-4, EP-6) ever calls this method — POST /claims only drafts a claim and checks completeness — so today the check governs no request the system actually receives; it remains the business's intended rule regardless, and its unreachability from any entry point is tracked as Q-1.
        source: "inventory: GD-5, GD-12, GD-17"
        status: active
        examples:
          - attaching a receipt to another employee's claim by URL is refused and logged (js/test/claim.test.js:18-22)
          - attaching a receipt to another employee's claim is refused and logged (java) (java/src/test/java/claims/ClaimTest.java:21-25)
          - attaching a receipt to another employee's claim is refused and logged (go) (go/claims/claim_test.go:33-38)
      - id: BR-4
        type: derivation
        statement: A claim's id must be computed as `c-` followed by the employee, with no sequence, timestamp or random component.
        rationale: js's draftClaim, java's Claim constructor and go's Draft all derive a claim's id this same deterministic way, so the same employee drafting within one run always gets the identical claim id string.
        source: "inventory: DC-2, DC-4, DC-6"
        status: active
      - id: BR-5
        type: fact
        statement: A claim submitted to java's POST /claims endpoint must be given at most one line, taken from the first amount-and-category match found in the request body, with that line's receipt always considered absent; a body with no match must be considered to have no lines.
        rationale: "java's Server.java reads the raw request body with a single regex match (LINE.matcher(body).find()) rather than decoding the full lines array the brief describes ({employee, lines: [{amount, category, receipt?}]}); the regex captures only amount and category and is never looped, so only the first submitted line is ever read and a line's receipt is always null. This is java's actual, observed behavior and diverges from js and go, which read every submitted line including its client-supplied receipt — recorded as a divergence in Q-3; BR-6 states the corrected behavior the three must converge on."
        source: "inventory: GD-14"
        status: active
      - id: BR-6
        type: decision
        statement: A claim submitted to any implementation's POST /claims endpoint must have every submitted line read, with each line's receipt read exactly as supplied by the client, consistent across js, java and go.
        rationale: java's prior regex-based parser read only the first line of a multi-line submission and never captured a line's receipt, judging every claim on at most one line with its receipt always treated as absent (BR-5), while js and go already read the full lines array including each line's client-supplied receipt. The three implementations are meant to be the same business, so this divergence (AB-5, AB-6) is a defect to fix, not an accepted difference.
        source: "decision: AB-5, AB-6 — java reads amount and category only from the first match found in the body, never receipt nor any further line; every submitted line, with its receipt, must be read as js and go read them"
        status: active
  provenance:
    producerRef:
      apiVersion: persimmon.ai/v1
      kind: TaskRun
      namespace: default
      name: recover-prd-852453-rounds-2-produce-recover
      uid: de47d606-ee20-4e16-b53b-8fce4b02cc18
