      - name: a per diem line needs no receipt (java)
        where: java/src/test/java/claims/ClaimTest.java:12-14
        covers:
          - GD-15
          - GD-16
      - name: drafting a claim records each line (java)
        where: java/src/test/java/claims/ClaimTest.java:15-17
        covers: []
      - name: a taxi line of 25 without a receipt is not complete (java)
        where: java/src/test/java/claims/ClaimTest.java:18-20
        covers:
