        name: Claim
        root: Claim
        entities:
          - name: Claim
            attributes:
              - claim has id
              - claim has employee
              - claim has completeness verdict
        valueObjects: []
        commands:
          - Submit claim
          - Draft claim
          - Judge claim complete
          - Judge claim incomplete
          - Attach receipt
        events:
          - Claim submitted
          - Claim drafted
          - Claim judged complete
          - Claim judged incomplete
          - Receipt attached to claim
          - Receipt attachment refused
        invariants:
          - statement: a receipt may attach to a claim's line only when submitted under that claim's own URL and by that claim's own employee
            rules:
              - BR-3
    events:
      - name: Claim submitted
        attributes:
