apiVersion: sdd.persimmon.ai/v1
kind: Prd
metadata:
  name: claims-prd.r1
spec:
  identity:
    id: claims-prd
    revision: 1
  content:
    title: Expense Claims Completeness
    businessRules: claims-rules
    problem: "Expense claims are checked for completeness today by three independent implementations of what is meant to be the same policy, one each in js, java and go, with no Prd or rule set that says what \"complete\" should mean across all three. An employee who submits a claim has no guarantee that the completeness answer they get is the same business decision regardless of which implementation evaluates it: the three already diverge on how a line's receipt is read from the request, on what happens when a submission is malformed, and on whether a receipt's ownership is ever actually checked. Nobody auditing the three codebases today can tell, from the code alone, whether a divergence between them is an intentional difference or a defect, because the business rules the code is supposed to encode have never been written down in one place."
    users:
      - name: Employee
        description: Submits an expense claim (their lines of amount, category and, where needed, a receipt) and wants to know right away whether the claim is complete, and wants a receipt they attach to be recognized only on their own claim.
    goals:
      - id: G-1
        statement: An employee learns whether their submitted claim is complete without having to work out the receipt rules themselves.
      - id: G-2
        statement: A receipt an employee attaches is recognized only for their own claim, so one employee cannot alter another employee's claim.
      - id: G-3
        statement: The completeness decision is the same business decision no matter which of the three implementations answers it.
    nonGoals:
      - 'Persisting submitted claims to a durable store: no implementation has one, and the three "store" integration tests exercise no production code (see Q-5).'
      - "Approving, paying out, or routing a complete claim for reimbursement: the system only answers whether a claim is complete."
      - "Choosing a merged or rebuilt target implementation or stack: this analysis precedes that decision."
    subdomains:
      - id: expense-claims-completeness
        name: Expense Claims Completeness
        description: Checking whether a submitted expense claim's lines are complete — a per-diem line needs no receipt, a line under the receipt threshold needs none, any other line needs one — and governing how a receipt may attach to a claim's line.
        type: core
    capabilities:
      - id: CAP-1
        name: Claims form page
        description: Serves the static page carrying the claim submission form to the employee's browser, reached at EP-1 (js), EP-3 (java) and EP-5 (go). It is the same page in all three implementations and carries no business logic of its own.
        priority: P2
        subdomain: expense-claims-completeness
        rules: []
      - id: CAP-2
        name: Claim completeness check
        description: Accepts a submitted claim (an employee and lines of amount, category and an optional receipt), derives its id (BR-4), and answers whether it is complete, applying the per-diem/threshold/receipt rule (BR-2) to every line (BR-1); reached at EP-2 (js), EP-4 (java) and EP-6 (go). Every submitted line, including its receipt field, must be read the same way in all three implementations (BR-6); java's current regex-based parser, which reads only the first line of a submission and never its receipt, is a defect recorded as BR-5 that BR-6 requires be corrected. The receipt-ownership rule (BR-3) is implemented and unit-tested on each repository's claim entity, but no route at EP-2, EP-4 or EP-6 ever calls it, so at these live entry points a client's claimed receipt is accepted without the ownership check — see Q-1.
        priority: P1
        subdomain: expense-claims-completeness
        rules:
          - BR-1
          - BR-2
          - BR-3
          - BR-4
          - BR-5
          - BR-6
    successCriteria:
      - id: SC-1
        statement: Every claim submitted to the completeness check receives a true/false completeness verdict consistent with the per-diem/threshold/receipt rule, in every one of the three implementations.
        capabilities:
          - CAP-2
      - id: SC-2
        statement: The claim submission form loads for an employee without any setup beyond reaching the page.
        capabilities:
          - CAP-1
      - id: SC-3
        statement: A receipt is accepted onto a claim's line only when submitted under that claim's own URL by that claim's own employee; every other attempt is logged as refused.
        capabilities:
          - CAP-2
    assumptions:
      - The three repositories (js, java, go) are meant to implement one identical business process, so an observed divergence between them is a defect to resolve, not an accepted feature.
      - The receipt threshold of 25 is one monetary amount in one currency, consistent across every line and all three implementations.
      - An employee's identity (the claim's "employee" field) is already trusted by the time it reaches the completeness check; no authentication mechanism is in scope of this product.
      - No persistent store is required for the completeness check itself; a claim is evaluated in memory per request.
    openQuestions:
      - id: Q-1
        question: "The receipt-attachment ownership rule (BR-3) is implemented and unit-tested in all three repositories' claim entities, but no HTTP entry point in js, java or go ever calls it: POST /claims only drafts a claim and checks completeness. In js (AB-2) and go (AB-4) a client can satisfy a line's receipt requirement by sending any truthy/non-empty receipt value directly in the request JSON, bypassing the ownership check entirely; in java the HTTP parser never reads a receipt field from the request at all (AB-5, AB-6). Was an attach-receipt endpoint planned, removed, or never built, and should BR-3 be enforced for real requests?"
        resolution: "Decided: keep (ledger dispositions for AB-2 and AB-4). A receipt supplied in the request is accepted as supplied; BR-3 governs attachment, which no route reaches. A capability/entry point that routes receipt attachment through BR-3's check remains a proposed change a human has not yet approved; BR-3 stays documented as a rule the entities implement but that no capability currently enforces end to end."
      - id: Q-2
        question: js's POST handler parses the request body with JSON.parse and never catches a failure (AB-1), so a malformed body throws uncaught inside the request handler rather than the API returning an error response; go's handler discards the JSON decode error entirely (AB-3) and silently answers {complete:true} for a non-JSON or empty body, since zero lines is vacuously complete. Should a malformed submission produce one defined error response, and should the three implementations agree on it?
        resolution: "Decided: keep (ledger dispositions for AB-1 and AB-3). A malformed body is not a business case; the three disagree and none is specified, so no rule is added. Defining one error-response behavior across all three remains an open improvement, not a rule."
      - id: Q-3
        question: java's HTTP endpoint reads the request body with a single regex match that captures only amount and category and never receipt, and only the first line of a multi-line submission is ever read; every claim submitted to java's POST /claims is judged on at most one line with its receipt always treated as absent, while js and go read the full lines array including each line's client-supplied receipt. Is java's parser a known simplification, or a defect against the shared process the three repositories are meant to implement identically?
        resolution: "Decided: change (ledger dispositions for AB-5 and AB-6). java's single-line, receipt-blind parsing was a defect, not an accepted simplification: every submitted line, and each line's client-supplied receipt, must be read as js and go read them. BR-5 records java's current behavior as observed; BR-6 states the corrected rule the three must converge on."
      - id: Q-4
        question: js's test for drafting a claim asserts that a line's date is preserved verbatim, but java's and go's line types carry no date field at all, and no completeness logic in any of the three reads a line's date. Is date a real attribute of a claim line that java and go are missing, or incidental to that one test with no business meaning?
        resolution: "Decided: keep — no rule in any implementation depends on a line's date; carried as an open flag rather than added as a rule."
      - id: Q-5
        question: 'Each repository has an integration test claiming to show "a drafted claim is written to a real container and read back" (js/test-int/store.test.js, java StoreIT.java, go store_integration_test.go), but none of the three actually calls the claim-drafting code: each only writes and reads back a literal string in a throwaway container, exercising no production behavior. Is a persistent claim store planned, making these placeholders for real persistence, or should the tests be removed as misleading?'
        resolution: "Decided: keep — this Prd specs no persistence capability (see nonGoals); the three tests should be flagged to a human as misleading rather than treated as evidence that a store exists."
  provenance:
    producerRef:
      apiVersion: persimmon.ai/v1
      kind: TaskRun
      namespace: default
      name: recover-prd-852453-rounds-2-produce-recover
      uid: de47d606-ee20-4e16-b53b-8fce4b02cc18
